async function pantallaPlantilla(nombre, soloPendientes) {
  encabezado(nombre, 'Renglones de la plantilla');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'plantillas', plantilla: nombre }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaPlantillas(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaPlantillas(); };
  }

  var ver = soloPendientes ? r.items.filter(function (x) { return !x.resuelto; }) : r.items;
  var porCat = {}, orden = [];
  ver.forEach(function (x) {
    var k = x.categoria || 'OTROS';
    if (!porCat[k]) { porCat[k] = []; orden.push(k); }
    porCat[k].push(x);
  });

  var cuerpo = orden.map(function (k) {
    return '<div class="sub-t">' + esc(k) + '</div>' +
      porCat[k].map(function (x) {
        return '<button class="fila-lote" data-item="' + esc(x.item) + '">' +
          '<span class="t"><span class="n">' + esc(x.item) +
          (x.cantidad ? ' <b>× ' + esc(x.cantidad) + '</b>' : '') + '</span>' +
          '<span class="c">' + (x.es_nota
            ? 'no es material de almacén'
            : (x.resuelto
              ? esc(x.sku) + ' · ' + esc(x.nombre_catalogo)
              : (x.error ? esc(x.error) : 'sin clave del catálogo'))) + '</span></span>' +
          (x.es_nota ? '<span class="pill p-neutral">nota</span>'
            : (x.resuelto ? '<span class="pill p-ok">ok</span>'
                          : '<span class="pill p-warn">amarrar</span>')) +
          '</button>';
      }).join('');
  }).join('');

  pintar(
    '<div class="card"><h3>' + r.items.length + ' renglones · ' + r.pendientes + ' por amarrar</h3>' +
    '<p class="mini">La cantidad es lo que el procedimiento necesita, definido por criterio ' +
    'quirúrgico — no el promedio de lo que se ha consumido.</p>' +
    '<div class="b-fila">' +
    '<button class="' + (soloPendientes ? 'b-ghost' : 'b-dark') + '" id="bTodos">Ver todos</button>' +
    '<button class="' + (soloPendientes ? 'b-dark' : 'b-ghost') + '" id="bPend">Sólo los que faltan</button>' +
    '</div></div>' +
    '<div class="card">' + (cuerpo || '<p class="sub centro">Nada que mostrar aquí.</p>') + '</div>' +
    '<button class="b-dark" id="bEditarPl">Editar esta plantilla</button>' +
    '<button class="b-ghost" id="bV">Volver a plantillas</button>');

  $('bEditarPl').onclick = function () { pantallaPlantillaEditar(nombre); };
  $('bTodos').onclick = function () { pantallaPlantilla(nombre, false); };
  $('bPend').onclick = function () { pantallaPlantilla(nombre, true); };
  $('bV').onclick = function () { pantallaPlantillas(); };
  Array.prototype.forEach.call(document.querySelectorAll('.fila-lote'), function (b) {
    var it = b.getAttribute('data-item');
    b.onclick = function () {
      var x = null;
      r.items.forEach(function (y) { if (y.item === it) x = y; });
      if (x) pantallaPlantillaAmarrar(nombre, x, soloPendientes);
    };
  });
}

/* Amarrar un renglón: se busca en el catálogo igual que en cualquier otra
   pantalla, con las mismas letras, y se propone lo más parecido. La
   propuesta nunca se aplica sola — la escoge quien sabe qué es. */
function pantallaPlantillaAmarrar(plantilla, item, soloPendientes) {
  encabezado(item.item, 'Amarrar al catálogo');
  var lista = ((estado.cat && estado.cat.catalogo) || []).slice();

  function sugerencias(texto) {
    var q = plano(texto || '');
    if (!q) return [];
    var qt = q.split(' ').filter(function (t) { return t.length > 1; });
    return lista.map(function (s) {
      var heno = plano(s.sku + ' ' + s.nombre + ' ' + (s.presentacion || ''));
      var hit = 0;
      qt.forEach(function (t) { if (heno.indexOf(t) >= 0) hit++; });
      return { s: s, p: qt.length ? hit / qt.length : 0 };
    }).filter(function (x) { return x.p > 0.32; })
      .sort(function (a, b) { return b.p - a.p; })
      .slice(0, 12).map(function (x) { return x.s; });
  }

  function pintarLista(texto) {
    var props = sugerencias(texto);
    $('sugs').innerHTML = props.length
      ? props.map(function (s) {
          return '<button class="fila-lote" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + (s.presentacion ? ' · ' + esc(s.presentacion) : '') +
            '</span></span>' +
            (String(s.controlado).toUpperCase() === 'SI' ? '<span class="pill p-warn">llave</span>' : '') +
            '</button>';
        }).join('')
      : '<p class="sub centro">Nada parecido. Prueba con menos letras.</p>';
    Array.prototype.forEach.call($('sugs').querySelectorAll('.fila-lote'), function (b) {
      b.onclick = function () { amarrar(b.getAttribute('data-sku')); };
    });
  }

  async function marcarNota() {
    var todas = $('aTodas') && $('aTodas').checked ? 'SI' : 'NO';
    pintar('<div class="card"><p class="sub">Guardando…</p></div>');
    try {
      var r = await enviar({ accion: 'plantilla_item_sku', plantilla: plantilla,
                             item: item.item, tipo: 'NOTA', todas: todas }, true);
      if (!r.ok) alertar(r.error);
    } catch (e) { alertar('Sin conexión. No se guardó.'); }
    pantallaPlantilla(plantilla, soloPendientes);
  }

  async function amarrar(sku) {
    var todas = $('aTodas') && $('aTodas').checked ? 'SI' : 'NO';
    pintar('<div class="card"><p class="sub">Guardando…</p></div>');
    try {
      var r = await enviar({ accion: 'plantilla_item_sku', plantilla: plantilla,
                             item: item.item, sku: sku, todas: todas }, true);
      if (!r.ok) { alertar(r.error); return pantallaPlantilla(plantilla, soloPendientes); }
      pantallaPlantilla(plantilla, soloPendientes);
    } catch (e) {
      alertar('Sin conexión. No se guardó.');
      pantallaPlantilla(plantilla, soloPendientes);
    }
  }

  pintar(
    '<div class="card">' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Renglón de la plantilla</div>' +
    '<div class="mini">' + esc(plantilla) + ' · ' + esc(item.categoria || '') + '</div></div>' +
    (item.cantidad ? '<span class="pill p-neutral">× ' + esc(item.cantidad) + '</span>' : '') + '</div>' +
    (item.resuelto
      ? '<div class="item"><div class="l"><div>Amarrado hoy a</div>' +
        '<div class="mini">' + esc(item.nombre_catalogo) + '</div></div>' +
        '<span class="pill p-ok">' + esc(item.sku) + '</span></div>'
      : '') +
    '</div></div>' +

    ((item.en_plantillas || 1) > 1
      ? '<div class="card"><label class="check"><input type="checkbox" id="aTodas" checked> ' +
        'Aplicar también a las otras ' + (item.en_plantillas - 1) + ' plantillas que piden ' +
        '“' + esc(item.item) + '”</label>' +
        '<p class="mini">Es la misma decisión: a qué insumo del catálogo corresponde este ' +
        'nombre. Desmárcalo sólo si en algún procedimiento significa otra cosa. ' +
        'La cantidad no se copia — esa sí es de cada plantilla.</p></div>'
      : '') +

    '<div class="card">' +
    '<div class="campo"><label>Buscar en el catálogo</label>' +
    '<input id="qCat" type="search" value="' + esc(item.item) + '"></div>' +
    '<p class="mini">Escoge el insumo del catálogo que corresponde a este renglón. ' +
    'Si no existe todavía, hay que darlo de alta primero.</p>' +
    '<div id="sugs"></div></div>' +

    '<div class="card"><h3>¿No sale del almacén?</h3>' +
    '<p class="sub">Algunos renglones de la lista de papel no son material que el almacén ' +
    'surta — el oxígeno de la toma mural, por ejemplo. Sirven de recordatorio al armar la ' +
    'caja, pero no tienen clave.</p>' +
    '<button class="b-dark" id="bNota">No es material de almacén</button></div>' +

    '<button class="b-ghost" id="bV">Volver sin amarrar</button>');

  $('bNota').onclick = function () {
    if (!confirm('“' + item.item + '” va a dejar de contar como pendiente y se va a quedar ' +
                 'en la lista como recordatorio, sin clave. ¿Es correcto?')) return;
    marcarNota();
  };
  $('qCat').oninput = function () { pintarLista(this.value); };
  $('bV').onclick = function () { pantallaPlantilla(plantilla, soloPendientes); };
  pintarLista(item.item);
}

/* =================================================================
   Homologar los folios del catálogo — sólo el director
   =================================================================
   El catálogo creció con dos numeraciones a la vez: la sembrada usa tres
   dígitos y la capturada después usa dos. MED-46 es diclofenaco y MED-046
   es tramadol. Esta pantalla muestra primero qué pasaría, y hasta que se
   ve el plan completo se puede aplicar.
   ================================================================= */
async function pantallaHomologarFolios() {
  encabezado('Folios del catálogo', 'Homologar a tres dígitos');
  pintar('<div class="card"><p class="sub">Calculando el plan…</p></div>');
  var r;
  try {
    r = await enviar({ accion: 'folios_plan' }, true);
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }

  var reasig = r.mapa.filter(function (m) { return m.motivo === 'OCUPADO'; });

  var tabla = reasig.map(function (m) {
    return '<div class="mapeo">' +
      '<span class="cl">' + esc(m.antes) + ' &rarr; <b>' + esc(m.despues) + '</b></span>' +
      '<span class="nm">' + esc(m.nombre) +
      (m.controlado === 'SI' ? ' <span class="pill p-warn">llave</span>' : '') + '</span>' +
      '<span class="po">su clave con cero, ' + esc(m.ocupaba) + ', ya es de otro insumo</span>' +
      '</div>';
  }).join('');

  pintar(
    (r.conflictos.length
      ? '<div class="aviso a-err"><b>No se puede aplicar todavía.</b><br>' +
        r.conflictos.map(esc).join('<br>') + '</div>'
      : '') +

    '<div class="card"><h3>Qué pasaría</h3>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Insumos en el catálogo</div></div><span class="pill p-neutral">' + r.total_catalogo + '</span></div>' +
    '<div class="item"><div class="l"><div>No cambian</div><div class="mini">ya están de tres dígitos</div></div><span class="pill p-ok">' + r.sin_cambio + '</span></div>' +
    '<div class="item"><div class="l"><div>Sólo ganan un cero</div><div class="mini">mismo número, con cero</div></div><span class="pill p-neutral">' + r.solo_cero + '</span></div>' +
    '<div class="item"><div class="l"><div>Cambian de número</div><div class="mini">su clave con cero está ocupada</div></div><span class="pill p-warn">' + r.reasignados + '</span></div>' +
    '</div>' +
    '<p class="mini">El folio del lote (LOT-…) no cambia, y el código QR de las ' +
    'etiquetas lleva el folio del lote, no la clave del insumo: lo que ya está ' +
    'pegado sigue leyéndose bien. Las existencias no se mueven.</p>' +
    '</div>' +

    (reasig.length
      ? '<div class="card"><h3>Los ' + reasig.length + ' que cambian de número</h3>' +
        '<p class="mini">El que llegó primero se queda con su número. El otro se va al final de su familia.</p>' +
        tabla + '</div>'
      : '') +

    (r.fuera_de_formato.length
      ? '<div class="card"><h3>Se quedan igual</h3>' +
        '<p class="mini">Estas claves no tienen la forma PREFIJO-NÚMERO, así que no se tocan.</p>' +
        '<div class="lista">' + r.fuera_de_formato.map(function (x) {
          return '<div class="item"><div class="l"><div class="mono">' + esc(x.sku) + '</div>' +
                 '<div class="mini">' + esc(x.nombre) + '</div></div></div>';
        }).join('') + '</div></div>'
      : '') +

    (r.mapa.length && !r.conflictos.length
      ? '<div class="card"><h3>Aplicar</h3>' +
        '<p class="sub">Se renombran las claves en el catálogo y en todo el historial ' +
        '—lotes, movimientos y bitácoras— en un solo paso, y queda registro de qué ' +
        'clave tenía antes cada insumo. Al terminar se verifica que ningún lote ' +
        'quedó suelto y que no se movió ninguna pieza.</p>' +
        '<button class="b-primary" id="bAplicar">Homologar los ' + r.mapa.length + ' folios</button></div>'
      : (r.mapa.length ? '' : '<div class="aviso a-ok">Los folios ya están homologados. No hay nada que mover.</div>')) +

    '<button class="b-ghost" id="bV">Volver</button>');

  $('bV').onclick = function () { pantallaInicio(); };

  if ($('bAplicar')) $('bAplicar').onclick = async function () {
    var boton = this;
    boton.disabled = true; boton.textContent = 'Homologando…';
    var res;
    try {
      res = await enviar({ accion: 'folios_homologar', confirmar: 'HOMOLOGAR' }, true);
    } catch (e) {
      boton.disabled = false; boton.textContent = 'Homologar los ' + r.mapa.length + ' folios';
      return alertar('Sin conexión. No se aplicó nada.');
    }
    if (!res.ok) {
      boton.disabled = false; boton.textContent = 'Homologar los ' + r.mapa.length + ' folios';
      return alertar(res.error + (res.conflictos ? '\n' + res.conflictos.join('\n') : ''));
    }
    /* El catálogo en el teléfono quedó con las claves viejas: hay que
       recargarlo antes de pintar cualquier pantalla que lo use. */
    await cargarCat();
    var huerf = Object.keys(res.huerfanos || {});
    encabezado('Folios homologados', 'Listo');
    pintar(
      '<div class="aviso ' + (res.saldo_intacto && !huerf.length ? 'a-ok' : 'a-warn') + '">' +
      '<b>Se homologaron ' + res.cambios + ' folios.</b><br>' +
      res.solo_cero + ' sólo ganaron el cero y ' + res.reasignados + ' cambiaron de número.</div>' +
      '<div class="card"><h3>Verificación</h3><div class="lista">' +
      '<div class="item"><div class="l"><div>Las existencias no se movieron</div></div>' +
      '<span class="pill ' + (res.saldo_intacto ? 'p-ok' : 'p-crit') + '">' +
      (res.saldo_intacto ? 'sí' : 'REVISAR') + '</span></div>' +
      '<div class="item"><div class="l"><div>Lotes apuntando a una clave que no existe</div></div>' +
      '<span class="pill ' + (huerf.length ? 'p-crit' : 'p-ok') + '">' + huerf.length + '</span></div>' +
      '</div>' +
      (huerf.length ? '<p class="mini">' + esc(huerf.join(', ')) + '</p>' : '') +
      (res.diferencias && res.diferencias.length
        ? '<p class="mini">' + esc(res.diferencias.join(' · ')) + '</p>' : '') +
      '</div>' +
      '<button class="b-primary" id="bFin">Volver al inicio</button>');
    $('bFin').onclick = function () { pantallaInicio(); };
  };
}

function pantallaCatalogo(filtro) {
  encabezado('Catálogo', 'Qué es cada cosa');
  var lista = ((estado.cat && estado.cat.catalogo) || []).slice();
  var q = plano(filtro || '');
  var vistos = q
    ? lista.filter(function (s) { return plano(s.sku + ' ' + s.nombre + ' ' + (s.presentacion || '')).indexOf(q) >= 0; })
    : lista;
  vistos.sort(function (a, b) { return String(a.sku).localeCompare(String(b.sku)); });

  var conFoto = lista.filter(function (s) { return s.tiene_foto; }).length;
  var tope = vistos.slice(0, 60);

  var alertados = lista.filter(function (s) { return s.alerta; });

  var filas = tope.map(function (s) {
    return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
      (s.tiene_foto
        ? '<img class="foto-mini" id="mini-' + esc(s.sku) + '" alt="">'
        : '<span class="sin-foto">sin<br>foto</span>') +
      '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
      '<span class="c">' + esc(s.sku) + (s.presentacion ? ' · ' + esc(s.presentacion) : '') + '</span></span>' +
      (s.alerta ? '<span class="pill p-warn">revisar</span>'
        : (String(s.controlado).toUpperCase() === 'SI' ? '<span class="pill p-neutral">llave</span>' : '')) +
      '</button>';
  }).join('');

  pintar(
    '<div class="card">' +
    '<div class="campo"><label>Buscar</label>' +
    '<input id="cBusca" placeholder="Código, nombre o presentación" value="' + esc(filtro || '') + '"></div>' +
    '<p class="mini">' + lista.length + ' insumos en el catálogo · ' +
      (conFoto === 0 ? 'ninguno tiene foto todavía'
                     : conFoto + (conFoto === 1 ? ' ya tiene foto' : ' ya tienen foto')) + '.</p>' +
    '</div>' +

    (alertados.length
      ? '<div class="card"><h3>' + alertados.length + ' por revisar</h3>' +
        '<p class="sub">Su nombre suena a medicamento controlado y están capturados como si no lo fueran. ' +
        'El grupo viene impreso en la caja: hay que verlo antes de decidir.</p>' +
        '<button class="b-dark" id="bAlertas">Ver cuáles son</button></div>'
      : '') +

    '<div class="card">' +
    (tope.length
      ? filas + (vistos.length > tope.length
          ? '<p class="mini" style="margin-top:10px">Se muestran ' + tope.length + ' de ' +
            vistos.length + '. Escribe algo más para acortar la lista.</p>'
          : '')
      : '<p class="sub centro">Nada coincide con esa búsqueda.</p>') +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver al inicio</button>');

  var caja = $('cBusca');
  caja.oninput = function () {
    var v = this.value, pos = this.selectionStart;
    clearTimeout(window.__tBusca);
    window.__tBusca = setTimeout(function () {
      pantallaCatalogo(v);
      var n = $('cBusca'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }, 220);
  };

  Array.prototype.forEach.call(document.querySelectorAll('.fila-sku'), function (b) {
    b.onclick = function () { pantallaSkuFicha(this.getAttribute('data-sku'), function () { pantallaCatalogo(filtro); }); };
  });

  /* Las miniaturas se traen una por una y sin bloquear la lista: si no hay
     señal, la lista sigue sirviendo y sólo faltan las imágenes. */
  tope.forEach(function (s) {
    if (!s.tiene_foto) return;
    traerFoto(s.sku).then(function (img) {
      var el = $('mini-' + s.sku); if (el) el.src = img;
    }).catch(function () {});
  });

  if ($('bAlertas')) $('bAlertas').onclick = function () { pantallaControlados(); };
  $('bV').onclick = function () { pantallaInicio(); };
}

/* Los insumos que suenan a controlado y no están marcados. Es una lista de
   trabajo: se entra a cada uno, se ve la caja y se decide. */
function pantallaControlados() {
  encabezado('Por revisar', 'Posibles controlados');
  var lista = ((estado.cat && estado.cat.catalogo) || []).filter(function (s) { return s.alerta; });
  var marcados = ((estado.cat && estado.cat.catalogo) || [])
    .filter(function (s) { return String(s.controlado).toUpperCase() === 'SI'; });

  pintar(
    (lista.length
      ? '<div class="card"><h3>' + lista.length + ' sin marcar</h3>' +
        lista.map(function (s) {
          return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + '</span>' +
            '<span class="c" style="color:var(--warn);text-transform:none;letter-spacing:0">' +
            esc(s.alerta) + '</span></span>' +
            '<span class="pill p-warn">revisar</span></button>';
        }).join('') + '</div>'
      : '<div class="card"><p class="sub centro">Ninguno pendiente. Todos los que suenan a controlado ya están marcados.</p></div>') +

    '<div class="card"><h3>' + marcados.length + ' marcados como controlados</h3>' +
    (marcados.length
      ? marcados.map(function (s) {
          return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + ' · nivel ' + esc(s.nivel || '—') + '</span></span>' +
            '<span class="pill p-neutral">llave</span></button>';
        }).join('')
      : '<p class="sub centro">Todavía ninguno.</p>') +
    '</div>' +

    '<div class="card"><p class="mini">Esta lista es una red de seguridad sobre la captura, no una clasificación legal. ' +
    'El dato bueno es el grupo impreso en el empaque: I, II o III va como controlado.</p></div>' +

    '<button class="b-ghost" id="bV">Volver al catálogo</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.fila-sku'), function (b) {
    b.onclick = function () {
      pantallaSkuFicha(this.getAttribute('data-sku'), pantallaControlados);
    };
  });
  $('bV').onclick = function () { pantallaCatalogo(''); };
}

function pantallaSkuFicha(sku, volver) {
  var art = null;
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === String(sku).toUpperCase()) art = s;
  });
  if (!art) return alertar('Ese código ya no está en el catálogo.');

  encabezado(art.sku, 'Ficha del insumo');
  var nueva = null;
  var opt = function (lista, sel) {
    return lista.map(function (v) {
      return '<option' + (String(sel).toUpperCase() === v ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  };

  pintar(
    '<div class="card">' +
    '<h3>' + esc(art.nombre) + '</h3>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Código</div></div><span class="pill p-neutral">' + esc(art.sku) + '</span></div>' +
    (art.presentacion ? '<div class="item"><div class="l"><div>Presentación</div></div><span>' + esc(art.presentacion) + '</span></div>' : '') +
    '<div class="item"><div class="l"><div>Se descuenta en</div></div><span>' + esc(art.unidad_base || '—') + '</span></div>' +
    (String(art.controlado).toUpperCase() === 'SI'
      ? '<div class="item"><div class="l"><div>Controlado</div></div><span class="pill p-warn">Bajo llave y libro de control</span></div>' : '') +
    '</div>' +
    '<div class="espacio"></div>' +
    '<button class="b-ghost" id="bSusLotes">Ver sus lotes y caducidades</button>' +
    '</div>' +

    (art.alerta
      ? '<div class="aviso a-warn"><b>Revisa la caja de este producto.</b><br>' + esc(art.alerta) +
        '<br>Está capturado como <b>no controlado</b>.</div>'
      : '') +

    '<div class="card"><h3>Clasificación</h3>' +
    '<p class="mini">El grupo viene impreso en el empaque. Grupo I, II o III va como controlado; del IV para abajo, no.</p>' +
    '<div class="dos">' +
    '<div class="campo"><label>¿Controlado?</label><select id="eCtrl">' + opt(['NO','SI'], art.controlado) + '</select></div>' +
    '<div class="campo"><label>Nivel de conteo</label><select id="eNiv">' + opt(['N1','N2','N3'], art.nivel) + '</select></div>' +
    '</div>' +
    '<div class="dos">' +
    '<div class="campo"><label>¿Multidosis?</label><select id="eMulti">' + opt(['NO','SI'], art.es_multidosis) + '</select></div>' +
    '<div class="campo"><label>Clase ABC</label><select id="eClase">' + opt(['A','B','C'], art.clase_abc) + '</select></div>' +
    '</div>' +
    '<div class="campo"><label>¿Se cobra aparte?</label><select id="eFact">' +
      opt(['PAQUETE','SIEMPRE','NUNCA'], art.facturable) + '</select></div>' +
    '<p class="mini" id="eNota">N1 se cuenta pieza por pieza · N2 por lote · N3 por consumo. Un controlado que no es multidosis va en N1: el libro de control pide una línea por ampolleta.</p>' +
    '<button class="b-primary" id="eGuardar">Guardar clasificación</button>' +
    '</div>' +

    '<div class="card"><h3>Foto</h3>' +
    '<p class="mini" id="fNota">' + (art.tiene_foto ? 'Cargando la foto guardada…' : 'Este insumo todavía no tiene foto.') + '</p>' +
    '<img id="fImg" class="foto-prev oculto" alt="">' +
    '<div class="espacio"></div>' +
    '<label for="fFile">' + (art.tiene_foto ? 'Reemplazar la foto' : 'Tomar o elegir una foto') + '</label>' +
    '<input id="fFile" type="file" accept="image/*" capture="environment">' +
    '<div class="espacio"></div>' +
    '<button class="b-primary oculto" id="bSubir">Guardar esta foto</button>' +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver</button>');

  $('bSusLotes').onclick = function () { pantallaLotes(art.sku); };

  if (art.tiene_foto) {
    traerFoto(art.sku).then(function (img) {
      $('fImg').src = img; $('fImg').classList.remove('oculto');
      $('fNota').textContent = 'Si tomas otra, reemplaza a esta.';
    }).catch(function (e) { $('fNota').textContent = e.message; });
  }

  $('fFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    comprimir(f, function (b64) {
      nueva = b64;
      $('fImg').src = b64; $('fImg').classList.remove('oculto');
      $('fNota').textContent = 'Foto nueva. Todavía no se guarda: dale al botón.';
      $('bSubir').classList.remove('oculto');
    });
  };

  $('bSubir').onclick = async function () {
    if (!nueva) return;
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      /* A propósito NO se encola: una foto pesa demasiado para el
         almacenamiento del teléfono y encolarla desplazaría recepciones
         pendientes, que sí son irrecuperables. */
      var r = await enviar({ accion: 'sku_foto_guardar', sku: art.sku, foto_base64: nueva }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar esta foto'; return alertar(r.error); }
      FOTOS[String(art.sku).toUpperCase()] = nueva;
      marcarConFoto(art.sku);
      this.classList.add('oculto');
      $('fNota').textContent = 'Foto guardada.';
      alertar('Foto guardada en ' + art.sku + '.');
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar esta foto';
      alertar('Sin señal: la foto necesita conexión para guardarse.');
    }
  };

  /* Al marcar controlado se propone el nivel que le toca, pero no se cambia
     solo: el nivel decide cómo se captura en el anaquel y esa es decisión
     de quien surte, no del sistema. */
  function proponerNivel() {
    var ctrl = $('eCtrl').value === 'SI', multi = $('eMulti').value === 'SI';
    var claseA = $('eClase').value === 'A';
    var deberia = (!multi && (ctrl || claseA)) ? 'N1' : (multi ? 'N2' : null);
    var nota = $('eNota');
    if (deberia && $('eNiv').value !== deberia) {
      nota.innerHTML = 'Por como quedó, a este insumo le tocaría <b>' + deberia + '</b>. ' +
        '<a href="#" id="ePonNiv">Ponerlo en ' + deberia + '</a>';
      $('ePonNiv').onclick = function (ev) {
        ev.preventDefault(); $('eNiv').value = deberia; proponerNivel();
      };
    } else {
      nota.textContent = 'N1 se cuenta pieza por pieza · N2 por lote · N3 por consumo.';
    }
  }
  ['eCtrl','eMulti','eClase','eNiv'].forEach(function (id) { $(id).onchange = proponerNivel; });
  proponerNivel();

  $('eGuardar').onclick = async function () {
    var cambios = {
      controlado:    $('eCtrl').value,
      nivel_control: $('eNiv').value,
      es_multidosis: $('eMulti').value,
      clase_abc:     $('eClase').value,
      facturable:    $('eFact').value
    };
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      var r = await enviar({ accion: 'sku_editar', sku: art.sku, cambios: cambios }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar clasificación'; return alertar(r.error); }
      /* El catálogo en memoria se actualiza sin volver a bajarlo completo:
         son 184 renglones y la pantalla ya tiene los valores buenos. */
      for (var k in cambios) if (cambios.hasOwnProperty(k)) {
        if (k === 'nivel_control') art.nivel = cambios[k]; else art[k] = cambios[k];
      }
      if (cambios.controlado === 'SI') art.alerta = '';
      this.disabled = false; this.textContent = 'Guardar clasificación';
      if (r.sin_cambios) return alertar('No había nada que cambiar.');
      alertar(r.cambios + ' dato(s) guardados en ' + art.sku + '.');
      pantallaSkuFicha(art.sku, volver);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar clasificación';
      alertar('Sin señal: cambiar la clasificación necesita conexión.');
    }
  };

  $('bV').onclick = function () { (volver || pantallaCatalogo)(); };
}

/* =================================================================
   Arranque
   ================================================================= */
window.addEventListener('online', function () { pintarEstado(); vaciarCola(); });
window.addEventListener('offline', pintarEstado);

(async function inicio() {
  try { arrancar(); } catch (e) { pantallaFalloDuro(e); }
})();

function pantallaFalloDuro(e) {
  var d = document.getElementById('app');
  if (!d) return;
  d.innerHTML =
    '<div class="aviso a-err">La app no pudo arrancar.</div>' +
    '<div class="card"><p class="mini">' + esc(String((e && e.message) || e)) + '</p></div>' +
    '<button class="b-dark" onclick="reiniciarApp()">Reiniciar la app</button>' +
    '<button class="b-ghost" onclick="location.reload()">Volver a intentar</button>';
}

async function arrancar() {
  pintarEstado();
  if (!estado.sesion || !estado.sesion.sesion) return pantallaLogin();
  pantallaInicio();
  try { await cargarCat(); pantallaInicio(); } catch (e) {}
  vaciarCola();
}

/* Registro del service worker con actualización automática.
   Sin esto, un teléfono se quedaba con la versión vieja de la app hasta que
   alguien la borrara a mano: se subía un arreglo y no llegaba. Ahora la app
   busca versión nueva al abrir y cada vez que vuelves a ella, y se recarga
   sola una sola vez cuando la nueva toma el control. */
if ('serviceWorker' in navigator && navigator.serviceWorker) {
  var habiaControlador = !!navigator.serviceWorker.controller;
  var recargando = false;

  /* Tope duro: como mucho UNA recarga automatica por sesion de pestana.
     Sin este tope, si dos service workers se pelean el control la app se
     recarga sin parar y se ve como una pantalla en blanco que nunca carga. */
  var yaRecargo = false;
  try { yaRecargo = sessionStorage.getItem('msu_sw_recarga') === '1'; } catch (e) {}

  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!habiaControlador || recargando || yaRecargo) return;
    recargando = true;
    try { sessionStorage.setItem('msu_sw_recarga', '1'); } catch (e) {}
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    var buscar = function () { try { reg.update(); } catch (e) {} };
    buscar();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') buscar();
    });
  }).catch(function () {});
}
</script>
