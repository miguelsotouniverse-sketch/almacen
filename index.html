/* =================================================================
   Dotaciones selladas
   =================================================================
   Carros rojos y cajas de urgencia. No se miden por consumo como una caja
   de cirugía: se miden por presencia. La pregunta no es cuánto se gastó,
   es si está completo y si el sello sigue vigente.
   ================================================================= */

async function pantallaDotaciones() {
  encabezado('Carros y cajas selladas', 'Para urgencias');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'dotaciones' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

    function tarjeta(d) {
      var estadoTxt, cls;
      if (d.sin_lista) { estadoTxt = 'Sin lista'; cls = 'p-crit'; }
      else if (d.lista_para_usarse) { estadoTxt = 'Completa'; cls = 'p-ok'; }
      else {
        var partes = [];
        if (d.faltan) partes.push(d.faltan + ' insumo(s)');
        if (d.falta_equipo) partes.push(d.falta_equipo + ' equipo(s)');
        if (d.vencidos) partes.push(d.vencidos + ' vencido(s)');
        if (d.sin_clave) partes.push(d.sin_clave + ' sin clave');
        estadoTxt = 'Falta ' + partes.join(', ');
        cls = 'p-crit';
      }
      var sello = d.sello
        ? (d.sello.vigente ? 'Sellada hace ' + d.sello.dias + ' d'
                           : (d.sello.estado === 'ABIERTA' ? 'Abierta' : 'Sello vencido (' + d.sello.dias + ' d)'))
        : 'Nunca se ha sellado';
      return '<button class="baldosa ancha" data-u="' + esc(d.ubicacion) + '">' +
        esc(d.nombre) +
        '<span class="q"><span class="pill ' + cls + '">' + esc(estadoTxt) + '</span> ' +
        esc(sello) + '</span></button>';
    }

    pintar(
      (r.no_listas
        ? '<div class="aviso a-err"><b>' + r.no_listas + ' de ' + r.dotaciones.length +
          '</b> no están listas para una urgencia.</div>'
        : '<div class="aviso a-ok">Las ' + r.dotaciones.length + ' están completas.</div>') +
      '<div class="rejilla">' + r.dotaciones.map(tarjeta).join('') + '</div>' +
      '<p class="mini">Una dotación se mide por <b>presencia</b>, no por consumo: lo que vive aquí ' +
      'tiene que estar aunque nunca se use, y no cuenta como disponible para armar cirugías.</p>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    [].forEach.call(document.querySelectorAll('[data-u]'), function (b) {
      b.onclick = function () { pantallaDotacion(b.getAttribute('data-u')); };
    });
    $('bV').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div>' +
      '<button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}

async function pantallaDotacion(ubic) {
  encabezado('Revisión', ubic);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'dotacion', ubicacion: ubic }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
      '<button class="b-ghost" id="bV">Volver</button>') || ($('bV').onclick = function () { pantallaDotaciones(); });
    encabezado('Revisión', r.nombre);

    function reng(x) {
      var cls = x.estado === 'COMPLETO' ? 'p-ok' : (x.estado === 'INCOMPLETO' ? 'p-warn' : 'p-crit');
      var dice = x.estado === 'SIN_CLAVE' ? 'sin clave'
               : (x.estado === 'COMPLETO' ? 'completo' : 'hay ' + nFmt(x.hay) + ' de ' + nFmt(x.pide));
      return '<div class="item"><div class="l"><span>' + esc(x.sku || '—') + '</span>' +
        '<div>' + esc(x.item) + '</div></div>' +
        '<span class="pill ' + cls + '">' + esc(dice) + '</span></div>';
    }
    function equipo(x) {
      var cls = x.estado === 'COMPLETO' ? 'p-ok' : (x.estado === 'INCOMPLETO' ? 'p-warn' : 'p-crit');
      var quiza = (x.quiza || []).length
        ? '<div class="mini" style="margin-top:3px">¿Será «' + esc(x.quiza[0].nombre) + '» (' +
          esc(x.quiza[0].activo_id) + ')? Se parece ' + x.quiza[0].parecido + '%, pero no se da por bueno solo.</div>'
        : '';
      var ids = (x.activos || []).map(function (a) { return a.activo_id; }).join(', ');
      return '<div class="item"><div class="l"><span>' + esc(ids || 'sin folio') + '</span>' +
        '<div>' + esc(x.item) + '</div>' + quiza + '</div>' +
        '<span class="pill ' + cls + '">' + (x.estado === 'COMPLETO' ? 'presente' : nFmt(x.hay) + ' de ' + nFmt(x.pide)) +
        '</span></div>';
    }

    var s = r.sello;
    pintar(
      (r.lista_para_usarse
        ? '<div class="aviso a-ok">Completa y lista para usarse.</div>'
        : '<div class="aviso a-err">No está lista: faltan ' + r.faltan + ' insumo(s)' +
          (r.falta_equipo ? ' y ' + r.falta_equipo + ' equipo(s)' : '') +
          (r.vencidos.length ? ', y hay ' + r.vencidos.length + ' lote(s) vencido(s)' : '') + '.</div>') +
      '<div class="card"><h3>Sello</h3><p class="sub">' +
        (s ? esc(s.estado) + (s.folio ? ' · folio ' + esc(s.folio) : '') + ' · hace ' + s.dias + ' días' +
             (s.vigente ? '' : ' (ya no es vigente)')
           : 'Nunca se ha sellado.') + '</p>' +
      '<div class="b-fila"><button class="b-dark" id="bSellar">Sellar</button>' +
      '<button class="b-ghost" id="bAbrir">Registrar apertura</button></div></div>' +
      '<button class="b-ghost" id="bEditarDot">Editar qué debe vivir aquí</button>' +

      (r.equipo.length
        ? '<div class="card"><h3>Equipo (' + r.equipo.length + ')</h3>' +
          '<p class="mini">Esto no se mide contra la existencia del almacén sino contra el registro de activos: ' +
          'lo que importa es que el aparato esté asignado a esta ubicación.</p>' +
          '<div class="lista">' + r.equipo.map(equipo).join('') + '</div></div>'
        : '') +

      '<div class="card"><h3>Insumos (' + r.renglones.length + ')</h3>' +
      '<div class="lista">' + (r.renglones.map(reng).join('') ||
        '<p class="sub centro">Todavía no se captura qué debe vivir aquí.</p>') + '</div></div>' +

      (r.sobra.length
        ? '<div class="card"><h3>Sobra (' + r.sobra.length + ')</h3>' +
          '<p class="mini">Material que está adentro y que nadie decidió poner. En una urgencia, estorba.</p>' +
          '<div class="lista">' + r.sobra.map(function (x) {
            return '<div class="item"><div class="l"><span>' + esc(x.sku) + '</span><div>' +
              esc(x.nombre) + '</div></div><span class="pill p-warn">' + nFmt(x.hay) + '</span></div>';
          }).join('') + '</div></div>'
        : '') +

      (r.por_vencer.length || r.vencidos.length
        ? '<div class="card"><h3>Caducidades</h3>' +
          '<div class="lista">' + r.vencidos.concat(r.por_vencer).map(function (x) {
            return '<div class="item"><div class="l"><span>' + esc(x.lote_id) + '</span><div>' +
              esc(x.nombre) + '</div></div><span class="pill ' + (x.dias < 0 ? 'p-crit">vencido' : 'p-warn">' + x.dias + ' d') +
              '</span></div>';
          }).join('') + '</div>' +
          '<p class="mini">El horizonte aquí es de ' + r.horizonte_caducidad + ' días, más largo que en el ' +
          'anaquel: adentro de un sello nadie lo va a consumir antes.</p></div>'
        : '') +

      '<button class="b-ghost" id="bV">Volver</button>');

    $('bSellar').onclick = async function () {
      var folio = prompt('Folio del sello (opcional):', '');
      if (folio === null) return;
      this.disabled = true;
      var res = await enviar({ accion: 'sello', ubicacion: ubic, que: 'SELLAR', folio: folio || '' }, true);
      if (!res.ok) { alertar(res.error); this.disabled = false; return; }
      pantallaDotacion(ubic);
    };
    $('bAbrir').onclick = async function () {
      var motivo = prompt('¿Por qué se abre? (obligatorio)', '');
      if (!motivo) return;
      this.disabled = true;
      var res = await enviar({ accion: 'sello', ubicacion: ubic, que: 'ABRIR', motivo: motivo }, true);
      if (!res.ok) { alertar(res.error); this.disabled = false; return; }
      pantallaDotacion(ubic);
    };
    $('bEditarDot').onclick = function () { pantallaDotacionEditar(ubic); };
    $('bV').onclick = function () { pantallaDotaciones(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaDotaciones(); };
  }
}

/* =================================================================
   Recepción — paso 1: cabecera
   ================================================================= */
function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

function pantallaCabecera() {
  encabezado('Nueva recepción', 'Datos de la compra');
  var c = estado.cat;
  var cab = estado.cabecera || {};
  var optAlm = c.almacenes.map(function (a) {
    return '<option value="' + esc(a.id) + '"' + (cab.almacen === a.id ? ' selected' : '') + '>' + esc(a.nombre) + '</option>';
  }).join('');
  var optComp = (c.comprobantes || []).map(function (x) {
    return '<option' + (cab.comprobante === x ? ' selected' : '') + '>' + esc(x) + '</option>';
  }).join('');
  var provs = (c.proveedores || []).map(function (p) {
    return '<option value="' + esc(p) + '">'; }).join('');

  pintar(
    '<div class="card">' +
    '<div class="campo"><label>Almacén que recibe</label><select id="kAlm">' + optAlm + '</select></div>' +
    '<div class="campo"><label>Fecha de recepción</label><input id="kFecha" type="date" value="' + esc(cab.fecha || hoyISO()) + '"></div>' +
    '<div class="campo"><label>Proveedor</label><input id="kProv" list="lprov" value="' + esc(cab.proveedor || '') + '">' +
    '<datalist id="lprov">' + provs + '</datalist></div>' +
    '<div class="dos">' +
    '<div class="campo"><label>Comprobante</label><select id="kComp">' + optComp + '</select></div>' +
    '<div class="campo"><label>Folio fiscal</label><input id="kFolio" placeholder="UUID" value="' + esc(cab.folio_fiscal || '') + '"></div>' +
    '</div>' +

    '</div>' +

/* =================================================================
   Recepción — paso 2: renglones (uno por lote)
   ================================================================= */
function pantallaLineas() {
  encabezado('Renglones', 'Uno por lote, no por producto');
  var c = estado.cat;
  var opciones = c.catalogo.map(function (s) {
    return '<option value="' + esc(s.sku) + '">' + esc(s.sku + ' · ' + s.nombre) + '</option>';
  }).join('');

  var listaHTML = estado.lineas.map(function (l, i) {
    return '<div class="linea"><div class="cab"><div>' +
      '<div class="nm">' + esc(l.nombre) + '</div>' +
      '<div class="datos">' + esc(l.sku) + ' · lote ' + esc(l.lote_proveedor || '—') +
      ' · cad ' + esc(l.caducidad || '—') + '<br>' +
      esc(l.cantidad) + ' ' + esc(l.unidad_base || '') +
      (l.costo_unitario === ''
        ? ' · <b>costo pendiente</b>'
        : ' × $' + esc(l.costo_unitario) +
          (String(l.costo_fiscal) !== String(l.costo_unitario)
            ? ' (fiscal $' + esc(l.costo_fiscal) + ')' : '')) +
      '</div></div>' +
      '<button class="quitar" data-i="' + i + '">Quitar</button></div></div>';
  }).join('');

  pintar(
    '<div class="card"><h3>Agregar renglón</h3>' +
    '<p class="mini">Si el mismo producto llega en dos lotes o con dos caducidades, son dos renglones. Es lo único que después permite rastrear qué lote se usó en qué paciente.</p>' +
    '<div class="campo"><label>Producto</label>' +
    '<input id="rSku" list="lsku" placeholder="Escribe o elige el código">' +
    '<datalist id="lsku">' + opciones + '</datalist></div>' +
    '<p class="mini" id="rPista">¿No reconoces lo que tienes en la mano? Escribe el código y aquí aparece su foto.</p>' +
    '<img id="rFoto" class="foto-prev oculto" alt="">' +
    '<div class="dos">' +
    '<div class="campo"><label>Lote del fabricante</label><input id="rLote"></div>' +
    '<div class="campo"><label>Caducidad</label><input id="rCad" type="date"></div>' +
    '</div>' +
    '<div class="dos">' +
    '<div class="campo"><label>Cantidad (unidad base)</label><input id="rCant" type="number" inputmode="decimal" min="0" step="any"></div>' +
    '<div class="campo"><label>Costo unitario real</label><input id="rCosto" type="number" inputmode="decimal" min="0" step="any" placeholder="Déjalo vacío si aún no sabes"></div>' +
    '</div>' +
    '<p class="mini">Si el proveedor todavía no manda precios, deja el costo vacío. El lote entra igual y queda marcado para costearlo después. Vacío no es cero.</p>' +
    '<div class="campo"><label>Costo fiscal (si es distinto)</label><input id="rFiscal" type="number" inputmode="decimal" min="0" step="any" placeholder="Igual al real si lo dejas vacío"></div>' +
    '<button class="b-dark" id="bAdd">Agregar renglón</button>' +
    '<div class="espacio"></div>' +
    '<button class="b-ghost" id="bNuevoSku">El producto no está en el catálogo</button>' +
    '</div>' +

    (estado.lineas.length
      ? '<div class="card"><h3>' + estado.lineas.length + ' renglón' + (estado.lineas.length > 1 ? 'es' : '') + ' capturado' + (estado.lineas.length > 1 ? 's' : '') + '</h3>' + listaHTML + '</div>'
      : '<div class="card"><p class="sub centro">Todavía no hay renglones.</p></div>') +

    '<button class="b-primary" id="bGuardar"' + (estado.lineas.length ? '' : ' disabled') + '>Guardar recepción</button>' +
    '<button class="b-ghost" id="bAtras">Volver a los datos de la compra</button>');

  $('bAtras').onclick = function () { pantallaCabecera(); };
  $('bNuevoSku').onclick = function () { pantallaSkuNuevo(); };

  /* La foto del insumo elegido se muestra sola, sin un botón más que picar:
     quien recibe tiene las manos ocupadas con la caja. */
  $('rSku').onchange = function () {
    var sku = this.value.trim().toUpperCase();
    var art = null;
    c.catalogo.forEach(function (s) { if (String(s.sku).toUpperCase() === sku) art = s; });
    var img = $('rFoto'), nota = $('rPista');
    img.classList.add('oculto');
    if (!art) { nota.textContent = 'Ese código todavía no está en el catálogo.'; return; }
    if (!art.tiene_foto) {
      nota.textContent = art.nombre + ' · sin foto. Puedes agregarla desde el catálogo.';
      return;
    }
    nota.textContent = art.nombre;
    traerFoto(art.sku).then(function (b64) {
      if ($('rSku') && $('rSku').value.trim().toUpperCase() !== sku) return;  /* ya cambió de producto */
      img.src = b64; img.classList.remove('oculto');
    }).catch(function () { nota.textContent = art.nombre + ' · no se pudo traer la foto.'; });
  };

  Array.prototype.forEach.call(document.querySelectorAll('.quitar'), function (b) {
    b.onclick = function () {
      estado.lineas.splice(parseInt(this.getAttribute('data-i'), 10), 1);
      pantallaLineas();
    };
  });

  $('bAdd').onclick = function () {
    var sku = $('rSku').value.trim().toUpperCase();
    var art = null;
    c.catalogo.forEach(function (s) { if (String(s.sku).toUpperCase() === sku) art = s; });
    if (!art) return alertar('Ese código no está en el catálogo. Usa el botón de abajo para darlo de alta.');

    var cant = parseFloat($('rCant').value);
    if (!cant || cant <= 0) return alertar('Falta la cantidad.');
    /* El costo puede faltar: se captura hoy y se cuesta cuando llegue la
       factura. Vacío se manda vacío, no cero, para poder encontrarlo después. */
    var crudoCosto = $('rCosto').value.trim();
    var costo = crudoCosto === '' ? '' : parseFloat(crudoCosto);
    if (costo !== '' && (isNaN(costo) || costo < 0))
      return alertar('El costo unitario no es un número válido.');

    var crudoFiscal = $('rFiscal').value.trim();
    var fiscal = crudoFiscal === '' ? costo : parseFloat(crudoFiscal);
    if (fiscal !== '' && isNaN(fiscal))
      return alertar('El costo fiscal no es un número válido.');

    if (art.nivel !== 'N3' && !$('rCad').value) {
      if (!confirm('Este insumo se controla por lote y no capturaste caducidad. ¿Agregar de todos modos?')) return;
    }

    estado.lineas.push({
      sku: art.sku, nombre: art.nombre, unidad_base: art.unidad_base,
      lote_proveedor: $('rLote').value.trim(), caducidad: $('rCad').value,
      cantidad: cant, costo_unitario: costo, costo_fiscal: fiscal
    });
    pantallaLineas();
  };

  $('bGuardar').onclick = async function () {
    this.disabled = true; this.textContent = 'Guardando…';
    var payload = {
      accion: 'recepcion_guardar', encolable: true,
      client_id: estado.client_id || (estado.client_id = idCliente()),
      cabecera: estado.cabecera, lineas: estado.lineas
    };
    try {
      var r = await enviar(payload);
      /* El backend detectó una recepción que se le parece demasiado. No la
         rechaza: pregunta, porque dos entregas iguales el mismo día sí
         existen. Quien decide es quien tiene la mercancía enfrente. */
      if (r.ok === false && r.confirmar === 'DUPLICADO') {
        this.disabled = false; this.textContent = 'Guardar recepción';
        if (!confirm(r.error)) return;
        this.disabled = true; this.textContent = 'Guardando…';
        payload.confirmar_duplicado = 'SI';
        r = await enviar(payload);
      }
      if (r.ok === false) {
        this.disabled = false; this.textContent = 'Guardar recepción';
        return alertar(r.error);
      }
      if (r.encolado) {
        estado.cabecera = null; estado.lineas = []; estado.client_id = null;
        pantallaInicio();
        return alertar('Guardado en el teléfono. Se enviará al recuperar señal. Los folios de lote se asignan al enviarse.');
      }
      pantallaFolios(r);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar recepción';
      alertar('No se pudo guardar. Revisa la señal.');
    }
  };
}

/* =================================================================
   Recepción — paso 3: folios para etiquetar
   ================================================================= */
/* -----------------------------------------------------------------
   Etiquetas pendientes de imprimir
   -----------------------------------------------------------------
   Los folios se dejan en localStorage y la página de etiquetas los
   recoge; por la URL no caben, una recepción de 30 renglones la trunca
   el teléfono.

   Se ACUMULAN entre recepciones a propósito: sin impresora térmica se
   captura todo el pedido y hasta el final se imprime una sola hoja
   carta. Si cada recepción borrara la anterior, al final solo quedarían
   las etiquetas de la última y las demás cajas se quedarían sin folio.
   La lista se vacía a mano desde la pantalla de etiquetas, ya impresas.
   ----------------------------------------------------------------- */
var ETQ_KEY = 'msu_alm_etiquetas';

function etiquetasPendientes() {
  var v = leer(ETQ_KEY, []);
  return Object.prototype.toString.call(v) === '[object Array]' ? v : [];
}

function acumularEtiquetas(lotes) {
  var cat = (estado.cat && estado.cat.catalogo) || [];
  var nombre = {}, unidad = {};
  cat.forEach(function (s) {
    nombre[String(s.sku).toUpperCase()] = s.nombre;
    unidad[String(s.sku).toUpperCase()] = s.unidad_base;
  });

  var lista = etiquetasPendientes();
  var yaHay = {};
  lista.forEach(function (l) { yaHay[String(l.lote_id).toUpperCase()] = true; });

  (lotes || []).forEach(function (l) {
    var folio = String(l.lote_id).toUpperCase();
    if (yaHay[folio]) return;
    yaHay[folio] = true;
    var k = String(l.sku).toUpperCase();
    lista.push({
      lote_id: l.lote_id,
      sku: l.sku,
      nombre: nombre[k] || '',
      cantidad: l.cantidad,
      unidad: unidad[k] || '',
      caducidad: l.caducidad || '',
      lote_proveedor: l.lote_proveedor || ''
    });
  });

  escribir(ETQ_KEY, lista);
  return lista.length;
}

function pantallaFolios(r) {
  encabezado('Recepción guardada', r.recepcion_id || '');
  estado.cabecera = null; estado.lineas = []; estado.client_id = null;

  /* Se guardan en la cola de etiquetas apenas se pinta la pantalla, no al
     apretar el botón: si se van directo a «Registrar otra recepción» estos
     folios no se pueden perder. */
  var pendientes = 0;
  try { pendientes = acumularEtiquetas(r.lotes); } catch (e) {}

  var folios = (r.lotes || []).map(function (l) {
    return '<div class="folio-lote"><div class="n">' + esc(l.lote_id) + '</div>' +
      '<div class="d">' + esc(l.sku) + ' · ' + esc(l.cantidad) +
      (l.lote_proveedor ? ' · lote ' + esc(l.lote_proveedor) : '') +
      (l.caducidad ? ' · caduca ' + esc(l.caducidad) : '') + '</div></div>';
  }).join('');

  pintar(
    '<div class="aviso a-ok">Recepción ' + esc(r.recepcion_id) + ' registrada con ' +
    (r.lotes || []).length + ' lote(s).</div>' +
    '<div class="card"><h3>Etiqueta estos lotes</h3>' +
    '<p class="mini">Escribe o pega el folio en cada empaque antes de guardarlo en el anaquel. A partir de aquí, ese folio es la identidad del lote.</p>' +
    folios + '</div>' +
    (pendientes > (r.lotes || []).length
      ? '<div class="aviso a-warn">Hay <b>' + pendientes + ' etiquetas</b> guardadas sin imprimir, ' +
        'contando las de las recepciones anteriores. Se imprimen todas juntas.</div>'
      : '') +
    '<button class="b-primary" id="bEtiquetas">Imprimir etiquetas</button>' +
    '<button class="b-dark" id="bOtra">Registrar otra recepción</button>' +
    '<button class="b-ghost" id="bInicio">Volver al inicio</button>');

  $('bEtiquetas').onclick = function () {
    try {
      acumularEtiquetas(r.lotes);
      location.href = 'etiquetas.html';
    } catch (e) {
      alertar('No se pudieron preparar las etiquetas. Los folios están en la hoja LOTES.');
    }
  };

  $('bOtra').onclick = function () { pantallaCabecera(); };
  $('bInicio').onclick = function () { pantallaInicio(); };
}

/* =================================================================
   Consultas
   ================================================================= */
/* =================================================================
   Cajas de cirugía
   =================================================================
   Una caja es una ubicación temporal, no una salida. Mientras está
   abierta, su contenido no está en el anaquel y tampoco está
   consumido: está en un tercer lugar. Al cerrarla, lo que quedó
   dentro es el consumo.

        Salió  −  Regresó  =  Consumido

   Nadie captura el consumo. Se cuenta lo que regresa, que es lo que
   se tiene enfrente, y el resto lo hace la resta.
   ================================================================= */

function esCaja(id) { return /^CAJA-/i.test(String(id || '')); }

/** Etiqueta grande y legible de un renglón de caja. */
function filaCaja(l) {
  var falta = l.en_caja > 0;
  return '<div class="linea"><div class="cab"><div>' +
    '<div class="nm">' + esc(l.nombre) + '</div>' +
    '<div class="datos">' + esc(l.lote_id) +
      (l.lote_proveedor ? ' · lote ' + esc(l.lote_proveedor) : '') +
      (l.caducidad ? ' · cad ' + esc(l.caducidad) : '') + '<br>' +
      'Salió ' + esc(l.salio) + ' · regresó ' + esc(l.regreso) +
      (l.consumido ? ' · consumido ' + esc(l.consumido) : '') +
      ' ' + esc(l.unidad || '') +
    '</div></div>' +
    '<span class="pill ' + (falta ? 'p-warn' : 'p-neutral') + ' mono">' +
      esc(l.en_caja) + '</span>' +
    '</div></div>';
}

async function pantallaCajas() {
  encabezado('Cajas de cirugía', 'Abiertas');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;

    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return void ($('bV').onclick = function () { pantallaInicio(); });
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');

  var lista = (r.cajas || []).map(function (c) {
    var viejo = c.dias !== '' && c.dias >= 4;
    return '<div class="item item-abre" data-caja="' + esc(c.caja_id) + '">' +
      '<div class="l"><span>' + esc(c.caja_id) + '</span>' +

      '<span class="pill ' + (viejo ? 'p-warn' : 'p-neutral') + '">' +
      (c.dias === '' ? '—' : c.dias + (c.dias === 1 ? ' día' : ' días')) + '</span></div>';
  }).join('');

  pintar(
    '<div class="card"><h3>Abrir una caja</h3>' +
    '<p class="sub">Se abre antes de surtir. El folio que salga es la identidad de esa caja hasta que el paciente se va de alta.</p>' +
    '<div class="b-fila">' +
    '<button class="b-primary" id="bArmar">Armar contra plantilla</button>' +
    '<button class="b-ghost" id="bNueva">Caja vacía</button></div></div>' +

    '<div class="card"><h3>' + (r.cajas || []).length + ' caja(s) abierta(s)</h3>' +
    (lista
      ? '<p class="mini">Una caja abierta es material fuera del anaquel. Las de cuatro días o más están marcadas.</p><div class="lista">' + lista + '</div>'
      : '<p class="sub centro">No hay cajas abiertas.</p>') +
    '</div>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.item-abre'), function (el) {
    el.onclick = function () { pantallaCajaDetalle(this.getAttribute('data-caja')); };
  });
  $('bArmar').onclick = function () { pantallaCajaArmar(); };
  $('bNueva').onclick = function () { pantallaCajaNueva(); };
  $('bV').onclick = function () { pantallaInicio(); };
}

async function pantallaCajaDetalle(cajaId) {
  encabezado('Caja', cajaId);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try {
    r = await enviar({ accion: 'caja_detalle', caja_id: cajaId }, true);
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return void ($('bV').onclick = function () { pantallaCajas(); });
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');

  estado.cajaActual = r;
  var k = r.caja;
  var dentro = r.lineas.filter(function (l) { return l.en_caja > 0; });
  var cerrada = String(k.estado).toUpperCase() === 'CERRADA';

  pintar(
    '<div class="card"><h3>' + esc(k.caja_id) + '</h3>' +
    '<p class="sub">' + esc(k.paciente) + ' · ' + esc(k.procedimiento) + '</p>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Estado</div></div><span class="pill ' +
      (cerrada ? 'p-neutral' : 'p-ok') + '">' + esc(k.estado) + '</span></div>' +
    '<div class="item"><div class="l"><div>Abierta hace</div></div><span class="pill ' +
      (k.dias >= 4 ? 'p-warn' : 'p-neutral') + '">' + esc(k.dias) + ' día(s)</span></div>' +
    '<div class="item"><div class="l"><div>Renglones en la caja</div></div>' +
      '<span class="pill p-neutral">' + dentro.length + '</span></div>' +
    '</div></div>' +

    (cerrada
      ? '<div class="aviso a-ok">Cerrada el ' + esc(k.cerrada_en) + '.' +
        (k.notas ? ' ' + esc(k.notas) : '') + '</div>'
      : '<div class="b-fila">' +
        '<button class="b-primary" id="bSacar">Sacar material</button>' +
        '<button class="b-dark" id="bRegresar"' + (dentro.length ? '' : ' disabled') + '>Registrar retorno</button>' +
        '</div>' +
        '<button class="b-dark" id="bCerrar"' + (dentro.length ? '' : ' disabled') + '>Cerrar la caja y hacer el corte</button>') +

    '<div class="card"><h3>Contenido</h3>' +
    (r.lineas.length
      ? '<p class="mini">La cifra de la derecha es lo que la caja trae encima ahora. Al cerrar, eso es el consumo.</p>' +
        r.lineas.map(filaCaja).join('')
      : '<p class="sub centro">La caja está vacía. Empieza por «Sacar material».</p>') +
    '</div>' +

    '<button class="b-ghost" id="bHojas">Imprimir hojas de esta caja</button>' +
    '<button class="b-ghost" id="bEtq">Imprimir etiqueta de la caja</button>' +
    '<button class="b-ghost" id="bV">Volver a las cajas</button>');

  /* Las tres hojas salen con los folios de lote ya impresos. Esa es toda la
     diferencia con el formato en blanco: al cerrar, en vez de transcribir
     veintitantos folios a mano —que es donde se va el tiempo y donde se
     cometen los errores— sólo se escribe lo que regresa. */
  $('bHojas').onclick = function () {
    try {
      escribir(HOJAS_KEY, { caja: k, lineas: r.lineas || [] });
      location.href = 'hojas_caja.html';
    } catch (e) {
      alertar('No se pudieron preparar las hojas. Intenta de nuevo.');
    }
  };

  if ($('bSacar')) $('bSacar').onclick = function () { pantallaCajaMover(cajaId, 'SALIDA'); };
  if ($('bRegresar')) $('bRegresar').onclick = function () { pantallaCajaMover(cajaId, 'RETORNO'); };
  if ($('bCerrar')) $('bCerrar').onclick = function () { pantallaCajaCerrar(cajaId); };

  /* La etiqueta de la caja usa la misma impresora que las de lote: el QR
     lleva el folio en texto plano, sin dominio ni nombre de la marca. */
  $('bEtq').onclick = function () {
    try {
      var lista = etiquetasPendientes();
      var repetida = lista.some(function (x) { return x.lote_id === k.caja_id; });
      if (!repetida) {
        lista.push({ lote_id: k.caja_id, sku: k.procedimiento, nombre: k.paciente,
                     cantidad: '', unidad: '', caducidad: '', lote_proveedor: '' });
        escribir(ETQ_KEY, lista);
      }
      location.href = 'etiquetas.html';
    } catch (e) { alertar('No se pudo preparar la etiqueta.'); }
  };
  $('bV').onclick = function () { pantallaCajas(); };
}

/**
 * Sacar del almacén a la caja, o regresar de la caja al almacén.
 * En los dos casos se elige un LOTE, no un producto: el folio del lote es
 * lo que después permite decir qué lote se usó en qué paciente.
 */
async function pantallaCajaMover(cajaId, sentido) {
  var esSalida = sentido !== 'RETORNO';
  encabezado(esSalida ? 'Sacar material' : 'Registrar retorno', cajaId);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');

  var caja = (estado.cajaActual && estado.cajaActual.caja) || null;
  var disponibles = [];
  try {
    if (esSalida) {
      var e = await enviar({ accion: 'existencias', almacen: caja.almacen }, true);
      if (!e.ok) return pintar('<div class="aviso a-err">' + esc(e.error) + '</div>');
      disponibles = e.existencias.map(function (x) {
        return { sku: x.sku, lote_id: x.lote_id, nombre: x.nombre,
                 caducidad: x.caducidad, disponible: x.cantidad };
      });
    } else {
      disponibles = estado.cajaActual.lineas.filter(function (l) { return l.en_caja > 0; })
        .map(function (l) {
          return { sku: l.sku, lote_id: l.lote_id, nombre: l.nombre,
                   caducidad: l.caducidad, disponible: l.en_caja };
        });
    }
  } catch (err) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return void ($('bV').onclick = function () { pantallaCajaDetalle(cajaId); });
  }

  var lineas = [];

  function opciones(filtro) {
    var f = String(filtro || '').toLowerCase();
    return disponibles.filter(function (d) {
      if (!f) return true;
      return (d.nombre + ' ' + d.sku + ' ' + d.lote_id).toLowerCase().indexOf(f) >= 0;
    }).slice(0, 120).map(function (d) {
      return '<option value="' + esc(d.lote_id) + '">' + esc(d.nombre) +
        ' · ' + esc(d.lote_id) + ' · hay ' + esc(d.disponible) +
        (d.caducidad ? ' · cad ' + esc(d.caducidad) : '') + '</option>';
    }).join('');
  }

  function dibujar() {
    var capturado = lineas.map(function (l, i) {
      return '<div class="linea"><div class="cab"><div>' +
        '<div class="nm">' + esc(l.nombre) + '</div>' +
        '<div class="datos">' + esc(l.lote_id) + ' · ' + esc(l.cantidad) + '</div>' +
        '</div><button class="quitar" data-i="' + i + '">Quitar</button></div></div>';
    }).join('');

    pintar(
      (disponibles.length ? '' :
        '<div class="aviso a-warn">' + (esSalida
          ? 'Ese almacén no tiene existencia. Todo lo que salga tiene que haber entrado antes por una recepción.'
          : 'La caja no trae nada que regresar.') + '</div>') +

      '<div class="card"><h3>' + (esSalida ? 'Del almacén a la caja' : 'De la caja al almacén') + '</h3>' +
      '<p class="mini">' + (esSalida
        ? 'Esto no descuenta nada: el material cambia de lugar, no desaparece. Se descuenta al cerrar la caja.'
        : 'Lo que regresa vuelve a estar disponible en el anaquel. Lo que no regrese cuenta como consumido.') +
      '</p>' +
      '<div class="campo"><label>Buscar</label><input id="mFiltro" placeholder="Nombre, código o folio de lote"></div>' +
      '<div class="campo"><label>Lote</label><select id="mLote">' + opciones('') + '</select></div>' +
      '<div class="campo"><label>Cantidad</label><input id="mCant" type="number" inputmode="decimal" min="0" step="any"></div>' +
      '<button class="b-dark" id="mAdd">Agregar renglón</button></div>' +

      (lineas.length
        ? '<div class="card"><h3>' + lineas.length + ' renglón(es)</h3>' + capturado + '</div>'
        : '<div class="card"><p class="sub centro">Todavía no hay renglones.</p></div>') +

      '<button class="b-primary" id="mGuardar"' + (lineas.length ? '' : ' disabled') + '>' +
      (esSalida ? 'Guardar la salida' : 'Guardar el retorno') + '</button>' +
      '<button class="b-ghost" id="mVolver">Volver a la caja</button>');

    $('mFiltro').oninput = function () {
      $('mLote').innerHTML = opciones(this.value);
    };

    Array.prototype.forEach.call(document.querySelectorAll('.quitar'), function (b) {
      b.onclick = function () {
        lineas.splice(parseInt(this.getAttribute('data-i'), 10), 1);
        dibujar();
      };
    });

    $('mAdd').onclick = function () {
      var folio = $('mLote').value;
      var d = null;
      disponibles.forEach(function (x) { if (x.lote_id === folio) d = x; });
      if (!d) return alertar('Elige un lote de la lista.');

      var cant = parseFloat($('mCant').value);
      if (!cant || cant <= 0) return alertar('Falta la cantidad.');

      /* Lo que ya se capturó en esta misma pantalla también gasta
         existencia: si no se suma, se puede pedir dos veces lo mismo. */
      var yaPedido = 0;
      lineas.forEach(function (l) { if (l.lote_id === folio) yaPedido += l.cantidad; });
      if (cant + yaPedido - d.disponible > 0.0001) {
        return alertar('Solo hay ' + d.disponible + ' de ' + folio +
          (yaPedido ? ' y ya capturaste ' + yaPedido + '.' : '.'));
      }

      lineas.push({ sku: d.sku, lote_id: d.lote_id, nombre: d.nombre, cantidad: cant });
      dibujar();
    };

    $('mGuardar').onclick = async function () {
      this.disabled = true; this.textContent = 'Guardando…';
      try {
        var r = await enviar({
          accion: 'caja_mover',
          caja_id: cajaId,
          sentido: esSalida ? 'SALIDA' : 'RETORNO',
          adicional: !!estado.cajaSurtida,
          lineas: lineas.map(function (l) {
            return { sku: l.sku, lote_id: l.lote_id, cantidad: l.cantidad };
          })
        }, true);
        if (!r.ok) {
          this.disabled = false;
          this.textContent = esSalida ? 'Guardar la salida' : 'Guardar el retorno';
          return alertar(r.error);
        }
        estado.cajaSurtida = true;
        pantallaCajaDetalle(cajaId);
      } catch (e) {
        this.disabled = false;
        this.textContent = esSalida ? 'Guardar la salida' : 'Guardar el retorno';
        alertar('Sin conexión. Este movimiento necesita señal porque valida la existencia contra el servidor.');
      }
    };

    $('mVolver').onclick = function () { pantallaCajaDetalle(cajaId); };
  }

  dibujar();
}

/** El corte. Lo que quedó en la caja es el consumo; aquí solo se clasifica. */
function pantallaCajaCerrar(cajaId) {
  var r = estado.cajaActual;
  if (!r || !r.caja || r.caja.caja_id !== cajaId) return pantallaCajaDetalle(cajaId);

  encabezado('Cerrar la caja', cajaId);
  var dentro = r.lineas.filter(function (l) { return l.en_caja > 0; });
  var destinos = {};
  dentro.forEach(function (l) { destinos[l.sku + '|' + l.lote_id] = l.destino_sugerido; });

  function bloque(l) {
    var k = l.sku + '|' + l.lote_id;
    var opt = ['EXCEDENTE', 'INCLUIDO', 'MERMA'].map(function (d) {
      return '<option value="' + d + '"' + (destinos[k] === d ? ' selected' : '') + '>' +
        (d === 'EXCEDENTE' ? 'Excedente · se cobra'
         : d === 'INCLUIDO' ? 'Incluido en el paquete'
         : 'Merma · no se cobra') + '</option>';
    }).join('');
    return '<div class="linea"><div class="cab"><div>' +
      '<div class="nm">' + esc(l.nombre) + '</div>' +
      '<div class="datos">' + esc(l.lote_id) + ' · consumo <b>' + esc(l.en_caja) + '</b> ' +
      esc(l.unidad || '') + (l.facturable ? ' · catálogo: ' + esc(l.facturable) : '') +
      '</div></div></div>' +
      '<select class="dest" data-k="' + esc(k) + '">' + opt + '</select></div>';
  }

  pintar(
    '<div class="card"><h3>' + dentro.length + ' renglón(es) de consumo</h3>' +
    '<p class="sub">Esto es lo que salió menos lo que regresó. No se captura: ya está calculado.</p>' +
    '<p class="mini">El destino viene propuesto por el catálogo — los implantes, energías, hilos y hialurónicos salen como excedente. Cambia solo lo que sea excepción, y marca merma en lo que se echó a perder.</p>' +
    dentro.map(bloque).join('') + '</div>' +

    '<div class="card"><h3>Nota del cierre</h3>' +
    '<p class="mini">Si algo no cuadró, escríbelo aquí tal cual. El cierre se puede guardar con una diferencia registrada; lo que no se vale es inventar una cifra para poder avanzar.</p>' +
    '<textarea id="cNota" rows="3" placeholder="Opcional"></textarea></div>' +

    '<button class="b-primary" id="bOk">Cerrar la caja</button>' +
    '<button class="b-ghost" id="bV">Volver sin cerrar</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.dest'), function (s) {
    s.onchange = function () { destinos[this.getAttribute('data-k')] = this.value; };
  });

  $('bOk').onclick = async function () {
    if (!confirm('Al cerrar, ' + dentro.length + ' renglón(es) se descuentan contra ' +
                 r.caja.paciente + '. Esto no se deshace desde la app. ¿Cerrar?')) return;
    this.disabled = true; this.textContent = 'Cerrando…';
    try {
      var res = await enviar({
        accion: 'caja_cerrar', caja_id: cajaId,
        destinos: destinos, nota: $('cNota').value.trim()
      }, true);
      if (!res.ok) {
        this.disabled = false; this.textContent = 'Cerrar la caja';
        return alertar(res.error);
      }
      var s = res.resumen || {};
      pintar('<div class="aviso a-ok">Caja ' + esc(cajaId) + ' cerrada. ' +
        esc(res.renglones) + ' renglón(es) descontados.</div>' +
        '<div class="card"><div class="lista">' +
        '<div class="item"><div class="l"><div>Excedente · se cobra</div></div><span class="pill p-warn">' + esc(s.EXCEDENTE || 0) + '</span></div>' +
        '<div class="item"><div class="l"><div>Incluido en el paquete</div></div><span class="pill p-neutral">' + esc(s.INCLUIDO || 0) + '</span></div>' +
        '<div class="item"><div class="l"><div>Merma</div></div><span class="pill p-neutral">' + esc(s.MERMA || 0) + '</span></div>' +
        '</div></div>' +
        ((res.negativos && res.negativos.length)
          ? '<div class="aviso a-err">Hay ' + res.negativos.length +
            ' renglón(es) con saldo negativo: regresó más de lo que salió. No se descontaron. Avísale al Dr. Soto.</div>'
          : '') +
        '<button class="b-dark" id="bCajas">Volver a las cajas</button>');
      $('bCajas').onclick = function () { pantallaCajas(); };
    } catch (e) {
      this.disabled = false; this.textContent = 'Cerrar la caja';
      alertar('Sin conexión. El cierre necesita señal porque recalcula el consumo en el servidor.');
    }
  };
  $('bV').onclick = function () { pantallaCajaDetalle(cajaId); };
}

/* La lista de los últimos 25 alcanza el día de la recepción. No alcanza
   cuando hay que volver semanas después a un folio porque su caducidad se
   capturó mal: el folio existía y no había manera de llegar a él. Con
   búsqueda se llega por folio, clave, nombre o lote del fabricante. */
async function pantallaLotes(q) {
  var busca = String(q || '');
  encabezado(busca ? 'Buscar lote' : 'Últimos lotes',
             busca ? 'Por folio, clave o nombre' : 'Recepciones recientes');

  var cabeza =
    '<div class="card">' +
    '<div class="campo"><label>Buscar un lote</label>' +
    '<input id="qLote" type="search" placeholder="LOT-2026-0200, MED-010, fentanilo, B24G671" value="' +
      esc(busca) + '"></div>' +
    '<p class="mini">Sirve el folio completo o un pedazo, la clave del insumo, ' +
    'su nombre o el lote que viene impreso en la caja.</p>' +
    '<div class="b-fila"><button class="b-primary" id="bBuscar">Buscar</button>' +
    (busca ? '<button class="b-ghost" id="bLimpiar">Ver los últimos</button>' : '') +
    '</div></div>';

  var enganchar = function () {
    var lanzar = function () { pantallaLotes($('qLote').value); };
    $('bBuscar').onclick = lanzar;
    $('qLote').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); lanzar(); } };
    if ($('bLimpiar')) $('bLimpiar').onclick = function () { pantallaLotes(''); };
    Array.prototype.forEach.call(document.querySelectorAll('.fila-lote'), function (b) {
      var quien = b.getAttribute('data-lote');
      b.onclick = function () { pantallaLote(quien, function () { pantallaLotes(busca); }); };
    });
    $('bV').onclick = function () { pantallaInicio(); };
  };

  pintar(cabeza + '<div class="card"><p class="sub">Cargando…</p></div>' +
         '<button class="b-ghost" id="bV">Volver</button>');
  enganchar();

  try {
    var r = busca
      ? await enviar({ accion: 'lote_buscar', q: busca }, true)
      : await enviar({ accion: 'lotes_recientes', limite: 25 }, true);
    if (!r.ok) {
      pintar(cabeza + '<div class="aviso a-err">' + esc(r.error) + '</div>' +
             '<button class="b-ghost" id="bV">Volver</button>');
      return enganchar();
    }

    var filas = (r.lotes || []).map(function (l) {
      /* La existencia sólo la trae la búsqueda; en la lista de recientes no
         se calcula, y un cero inventado ahí sería peor que no mostrarlo. */
      var tieneEx = l.existencia !== undefined;
      var marca = tieneEx && l.existencia <= 0
        ? '<span class="pill p-neutral">agotado</span>'
        : '<span class="pill ' + (l.comprobante === 'FACTURA' ? 'p-ok' : 'p-warn') + '">' +
          esc(l.comprobante || '—') + '</span>';
      return '<button class="fila-lote" data-lote="' + esc(l.lote_id) + '">' +
        '<span class="t"><span class="n mono">' + esc(l.lote_id) + '</span>' +
        '<span class="c">' + esc(l.sku) +
        (l.nombre ? ' · ' + esc(l.nombre) : '') +
        (tieneEx ? ' · ' + esc(l.existencia) + ' en almacén' : '') +
        (l.caducidad ? ' · cad ' + esc(l.caducidad) : ' · SIN CADUCIDAD') + '</span></span>' +
        (String(l.controlado).toUpperCase() === 'SI' ? '<span class="pill p-warn">llave</span>' : '') +
        marca + '</button>';
    }).join('');

    var titulo = busca
      ? (r.total ? r.total + ' lote(s) con “' + esc(busca) + '”' : 'Nada con “' + esc(busca) + '”')
      : 'Últimos ' + (r.lotes || []).length + ' lotes';
    var vacio = busca
      ? '<p class="sub centro">No hay ningún lote con eso. Prueba con menos letras, ' +
        'o con el nombre del insumo.</p>'
      : '<p class="sub centro">Todavía no hay lotes.</p>';

    pintar(cabeza +
      '<div class="card"><h3>' + titulo + '</h3>' +
      '<p class="mini">Toca un folio para corregir su caducidad o darlo de baja.</p>' +
      (filas || vacio) +
      (r.recortado ? '<p class="mini">Se muestran los primeros 40. Afina la búsqueda.</p>' : '') +
      '</div>' +
      '<button class="b-ghost" id="bV">Volver</button>');
    enganchar();
  } catch (e) {
    pintar(cabeza + '<div class="aviso a-err">Sin conexión.</div>' +
           '<button class="b-ghost" id="bV">Volver</button>');
    enganchar();
  }
}


/* =================================================================
   Ficha del lote — corregir caducidad y dar de baja
   =================================================================
   La caducidad y el lote del fabricante describen al lote: se corrigen en
   su lugar. La cantidad no: baja porque el material se movió a residuos,
   nunca porque alguien editó un número.
   ================================================================= */
async function pantallaLote(loteId, volver) {
  encabezado(loteId, 'Ficha del lote');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var art = null, ex = [];
  try {
    var r = await enviar({ accion: 'existencias' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');
    ex = (r.existencias || []).filter(function (x) {
      return String(x.lote_id).toUpperCase() === String(loteId).toUpperCase();
    });
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión. La ficha del lote necesita señal.</div>' +
           '<button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { (volver || pantallaLotes)(); };
    return;
  }

  var uno = ex[0] || {};
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === String(uno.sku).toUpperCase()) art = s;
  });
  var controlado = art && String(art.controlado).toUpperCase() === 'SI';
  var total = ex.reduce(function (a, x) { return a + Number(x.cantidad || 0); }, 0);
  var cad = String(uno.caducidad || '').slice(0, 10);
  var vencido = cad && cad < hoyISO();

  pintar(
    '<div class="card">' +
    '<h3>' + esc(uno.nombre || (art && art.nombre) || uno.sku || 'Lote') + '</h3>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Clave</div></div><span class="pill p-neutral">' + esc(uno.sku || '—') + '</span></div>' +
    '<div class="item"><div class="l"><div>Existencia</div></div><span>' + esc(total) +
      ' ' + esc((art && art.unidad_base) || '') + '</span></div>' +
    ex.map(function (x) {
      return '<div class="item"><div class="l"><div>' + esc(x.ubic_id) + '</div></div><span>' + esc(x.cantidad) + '</span></div>';
    }).join('') +
    '<div class="item"><div class="l"><div>Lote del fabricante</div></div><span>' + esc(uno.lote_proveedor || '—') + '</span></div>' +

    '<div class="card"><h3>Corregir datos del lote</h3>' +
    '<p class="mini">Estos datos describen al lote. Corregirlos no mueve el saldo.</p>' +
    '<div class="dos">' +
    '<div class="campo"><label>Caducidad</label><input id="lCad" type="date" value="' + esc(cad) + '"></div>' +
    '<div class="campo"><label>Lote del fabricante</label><input id="lProv" value="' +
      esc(uno.lote_proveedor || '') + '"></div>' +
    '</div>' +
    '<button class="b-dark" id="lGuardar">Guardar corrección</button>' +
    '</div>' +

    '<div class="card"><h3>Dar de baja</h3>' +
    '<p class="mini">Por caducidad, merma o rotura. No se borra nada: el material se mueve a residuos ' +
    'y el saldo baja porque de verdad salió del almacén.</p>' +
    '<div class="campo"><label>Motivo</label><input id="bMotivo" placeholder="' +
      (vencido ? 'Caducó el ' + esc(cad) : 'Por qué se da de baja') + '"></div>' +

      'inputmode="decimal" min="0" step="any" placeholder="' + esc(total) + '"></div>' +
    (controlado
      ? '<div class="campo"><label>Número de acta de destrucción</label>' +
        '<input id="bActa" placeholder="ACTA-2026-001"></div>' +
        '<p class="mini">Es un medicamento controlado: su destrucción tiene procedimiento propio ' +
        'ante la autoridad. Sin el número de acta, el inventario y el libro de control dejarían de coincidir.</p>'
      : '') +
    (ex.length > 1
      ? '<div class="campo"><label>¿De cuál ubicación?</label><select id="bUbic">' +
        ex.map(function (x) { return '<option value="' + esc(x.ubic_id) + '">' +
          esc(x.ubic_id) + ' · ' + esc(x.cantidad) + '</option>'; }).join('') + '</select></div>'
      : '') +
    '<button class="b-dark" id="bBaja">Dar de baja</button>' +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver</button>');

  $('lGuardar').onclick = async function () {
    var cambios = {};
    if ($('lCad').value !== cad) cambios.caducidad = $('lCad').value;
    if ($('lProv').value.trim() !== String(uno.lote_proveedor || '').trim())
      cambios.lote_proveedor = $('lProv').value.trim();
    if (!Object.keys(cambios).length) return alertar('No cambiaste nada.');
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      var r = await enviar({ accion: 'lote_editar', lote_id: loteId, cambios: cambios,
                             motivo: 'Corrección desde la app' }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar corrección'; return alertar(r.error); }
      alertar(r.aviso || (r.cambios + ' dato(s) corregidos en ' + loteId + '.'));
      pantallaLote(loteId, volver);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar corrección';
      alertar('Sin señal: corregir un lote necesita conexión.');
    }
  };

  $('bBaja').onclick = async function () {
    var motivo = $('bMotivo').value.trim();
    if (!motivo) return alertar('La baja necesita un motivo. Queda escrito en el kardex.');
    /* Sin acta no se manda nada: el backend la exige igual, pero es mejor
       decirlo aquí que hacerle dar el viaje en balde. */
    if (controlado && (!$('bActa') || !$('bActa').value.trim()))
      return alertar('Falta el número de acta de destrucción.');
    var cant = $('bCant').value.trim();
    this.disabled = true; this.textContent = 'Dando de baja…';
    try {
      var r = await enviar({ accion: 'lote_baja', lote_id: loteId, motivo: motivo,
        cantidad: cant === '' ? '' : parseFloat(cant),
        tipo: /caduc|venci/i.test(motivo) ? 'CADUCIDAD' : 'MERMA',
        acta: $('bActa') ? $('bActa').value.trim() : '',
        ubic_origen: $('bUbic') ? $('bUbic').value : '',
        client_id: idCliente() }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Dar de baja'; return alertar(r.error); }
      alertar('Baja registrada: ' + r.cantidad + ' de ' + loteId + ' → ' + r.destino +
              (r.queda ? '. Quedan ' + r.queda + '.' : '. El lote quedó en cero.'));
      pantallaLote(loteId, volver);
    } catch (e) {
      this.disabled = false; this.textContent = 'Dar de baja';
      alertar('Sin señal: dar de baja necesita conexión, porque valida existencia.');
    }
  };

  $('bV').onclick = function () { (volver || pantallaLotes)(); };
}

/* =================================================================
   Catálogo con fotos
   =================================================================
   Se busca sin acentos y sin importar mayúsculas: el catálogo se sembró
   sin acentos y la gente los escribe, así que «guantes esteriles» y
   «Guantes Estériles» tienen que encontrar lo mismo.
   ================================================================= */
function plano(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().trim();
}

/* =================================================================
   Plantillas por procedimiento
   =================================================================
   La plantilla es la medida contra la que se compara el consumo de una
   caja. Mientras un renglón no tenga clave del catálogo, no puede
   compararse con nada: por eso la pantalla empieza por lo que falta
   amarrar, y no por la lista completa.
   ================================================================= */
/* =================================================================
   Lista de compra

   Tres cosas distintas, separadas a propósito: lo que impide operar hoy,
   lo que alcanza para una cirugía pero no para el colchón, y lo que se va
   a vencer. Mezclarlas convierte la lista en ruido y nadie la usa.
   ================================================================= */
var COLCHON_KEY = 'msu_alm_colchon';

function colchonGuardado() {
  var v = parseInt(leer(COLCHON_KEY, 2), 10);
  return (v && v > 0) ? v : 2;
}

async function pantallaCompra(colchon) {
  var n = colchon || colchonGuardado();
  encabezado('Lista de compra', 'Qué pedir y qué se va a vencer');
  pintar('<div class="card"><p class="sub">Calculando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'compra_lista', colchon: n }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  escribir(COLCHON_KEY, n);

  function renglon(x, modo) {
    var der = modo === 'bloquea'
      ? '<span class="pill p-crit">pedir ' + x.comprar + '</span>'
      : '<span class="pill p-warn">pedir ' + x.comprar + '</span>';
    return '<div class="fila-lote">' +
      '<span class="t"><span class="n">' + esc(x.nombre) +
      (x.controlado ? ' <span class="pill p-crit">controlado</span>' : '') + '</span>' +
      '<span class="c">' + esc(x.sku) + ' · hay ' + x.hay + ' · una caja pide ' + x.pide_una_caja +
      ' · ' + esc(x.plantillas.join(', ')) + '</span></span>' + der + '</div>';
  }

  var sel = [1, 2, 3, 4].map(function (v) {
    return '<option value="' + v + '"' + (v === r.colchon ? ' selected' : '') + '>' +
      v + (v === 1 ? ' cirugía' : ' cirugías') + '</option>';
  }).join('');

  var cad = r.por_caducar.map(function (x) {
    return '<div class="fila-lote">' +
      '<span class="t"><span class="n">' + esc(x.nombre) + '</span>' +
      '<span class="c">' + esc(x.sku) + ' · ' + esc(x.lote_id) + ' · ' + x.cantidad + ' pza · ' +
      esc(x.ubic_id) + '</span></span>' +
      '<span class="pill ' + (x.vencido ? 'p-crit' : (x.dias <= 30 ? 'p-crit' : 'p-warn')) + '">' +
      (x.vencido ? 'vencido' : x.dias + ' días') + '</span></div>';
  }).join('');

  pintar(
    '<div class="card"><h3>Para cuántas cirugías quiero tener</h3>' +
    '<p class="mini">El mínimo sale de lo que pide una plantilla, que es el único dato cierto mientras ' +
    'no haya historia de consumo. El colchón se cuenta en cirugías, no en piezas.</p>' +
    '<div class="campo"><select id="cCol">' + sel + '</select></div></div>' +

    (r.bloquean.length
      ? '<div class="card"><div class="sub-t">No alcanza ni para una cirugía</div>' +
        '<p class="mini">Esto impide armar la caja hoy.</p>' +
        r.bloquean.map(function (x) { return renglon(x, 'bloquea'); }).join('') + '</div>'
      : '<div class="aviso a-ok">Todo alcanza al menos para una cirugía.</div>') +

    (r.bajos.length
      ? '<div class="card"><div class="sub-t">Alcanza para una, no para el colchón</div>' +
        '<p class="mini">Se puede operar, pero el anaquel queda en cero después.</p>' +
        r.bajos.map(function (x) { return renglon(x, 'bajo'); }).join('') + '</div>'
      : '') +

    (r.por_caducar.length
      ? '<div class="card"><div class="sub-t">Se vence en los próximos ' + r.horizonte + ' días</div>' +
        '<p class="mini">Esto no falta: sobra, pero con fecha. Úsalo primero o dalo de baja a tiempo.</p>' +
        cad + '</div>'
      : '') +

    '<button class="b-dark" id="bCopiar">Copiar la lista</button>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  $('cCol').onchange = function () { pantallaCompra(parseInt(this.value, 10)); };

  $('bCopiar').onclick = function () {
    var lineas = [];
    lineas.push('Lista de compra · almacén Zorvix · ' + hoyISO());
    lineas.push('Para poder armar ' + r.colchon + (r.colchon === 1 ? ' cirugía' : ' cirugías') + ' sin ir a comprar.');
    if (r.bloquean.length) {
      lineas.push('');
      lineas.push('URGENTE — no alcanza ni para una cirugía:');
      r.bloquean.forEach(function (x) {
        lineas.push('  ' + x.sku + '  ' + x.nombre + '  —  hay ' + x.hay + ', pedir ' + x.comprar);
      });
    }
    if (r.bajos.length) {
      lineas.push('');
      lineas.push('Por reponer:');
      r.bajos.forEach(function (x) {
        lineas.push('  ' + x.sku + '  ' + x.nombre + '  —  hay ' + x.hay + ', pedir ' + x.comprar);
      });
    }
    if (r.por_caducar.length) {
      lineas.push('');
      lineas.push('Se vence pronto (no es compra, es para usarlo primero):');
      r.por_caducar.forEach(function (x) {
        lineas.push('  ' + x.sku + '  ' + x.nombre + '  —  ' + x.cantidad + ' pza, ' + x.caducidad +
                    (x.vencido ? ' (VENCIDO)' : ' (' + x.dias + ' días)'));
      });
    }
    var txt = lineas.join('\n');
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    var listo = false;
    try { listo = document.execCommand('copy'); } catch (e) { listo = false; }
    ta.remove();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {}, function () {});
    }
    alertar(listo ? 'Lista copiada. Pégala en WhatsApp o en el correo del proveedor.'
                  : 'No se pudo copiar sola; selecciona el texto a mano.');
  };

  $('bV').onclick = function () { pantallaInicio(); };
}

/* =================================================================
   Se puede armar — plantilla contra existencia

   Una plantilla "lista" sólo quiere decir que todos sus renglones tienen
   clave. No quiere decir que el material esté. Esta pantalla contesta la
   única pregunta que importa la noche anterior: ¿se puede armar esta caja
   mañana, sí o no, y si no, qué falta exactamente?
   ================================================================= */
var SURTIDO_PILL = {
  COMPLETO:       'p-ok',
  NO_ALCANZA:     'p-warn',
  SIN_EXISTENCIA: 'p-crit',
  CLAVE_MUERTA:   'p-crit',
  SIN_CLAVE:      'p-warn',
  NOTA:           'p-neutral'
};
var SURTIDO_DONDE = {
  CLAVE_MUERTA:   'Se arregla en el catálogo',
  SIN_EXISTENCIA: 'Se arregla en el anaquel',
  NO_ALCANZA:     'Se arregla en el anaquel',
  SIN_CLAVE:      'Se arregla en la plantilla',
  NOTA:           'No sale del almacén'
};

async function pantallaSurtido() {
  encabezado('Se puede armar', 'Plantilla contra existencia de hoy');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'plantilla_surtido' }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }

  var filas = r.plantillas.map(function (x) {
    var motivos = [];
    if (x.clave_muerta)   motivos.push(x.clave_muerta + ' clave muerta');
    if (x.sin_existencia) motivos.push(x.sin_existencia + ' en cero');
    if (x.no_alcanza)     motivos.push(x.no_alcanza + ' no alcanza');
    if (x.sin_clave)      motivos.push(x.sin_clave + ' sin clave');
    return '<button class="fila-lote" data-plant="' + esc(x.plantilla) + '">' +
      '<span class="t"><span class="n">' + esc(x.plantilla) + '</span>' +
      '<span class="c">' + x.items + ' renglones' +
      (motivos.length ? ' · ' + esc(motivos.join(' · ')) : ' · completa') + '</span></span>' +
      (x.bloqueados
        ? '<span class="pill p-crit">faltan ' + x.bloqueados + '</span>'
        : '<span class="pill p-ok">se arma</span>') +
      '</button>';
  }).join('');

  pintar(
    (r.total_bloqueados
      ? '<div class="aviso a-warn"><b>' + r.surtibles + ' de ' + r.plantillas.length +
        ' plantillas se pueden armar hoy.</b><br>' +
        'Hay ' + r.total_bloqueados + ' renglones sin con qué surtirse. Que una plantilla ' +
        'esté amarrada al 100% no quiere decir que el material esté en el anaquel.</div>'
      : '<div class="aviso a-ok">Todas las plantillas se pueden armar con lo que hay hoy.</div>') +
    '<div class="card"><h3>' + r.plantillas.length + ' plantillas · ' + r.total_items + ' renglones</h3>' +
    '<p class="mini">Toca una para ver renglón por renglón qué falta y dónde se arregla.</p>' +
    filas + '</div>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.fila-lote'), function (b) {
    var quien = b.getAttribute('data-plant');
    b.onclick = function () { pantallaSurtidoDetalle(quien); };
  });
  $('bV').onclick = function () { pantallaInicio(); };
}

async function pantallaSurtidoDetalle(nombre) {
  encabezado(nombre, 'Qué falta para armarla');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'plantilla_surtido', plantilla: nombre }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaSurtido(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaSurtido(); };
  }

  /* Agrupados por motivo, no por categoría: aquí no se busca un insumo,
     se reparte trabajo. Cada grupo lo resuelve una persona distinta. */
  var grupos = {}, orden = [];
  r.items.forEach(function (x) {
    if (!grupos[x.estado]) { grupos[x.estado] = []; orden.push(x.estado); }
    grupos[x.estado].push(x);
  });

  var cuerpo = orden.map(function (e) {
    var titulo = { CLAVE_MUERTA: 'Apuntan a una clave que ya no existe',
                   SIN_EXISTENCIA: 'La clave existe, el saldo está en cero',
                   NO_ALCANZA: 'Hay, pero no alcanza',
                   SIN_CLAVE: 'Todavía sin amarrar',
                   NOTA: 'No es material de almacén',
                   COMPLETO: 'Alcanza' }[e] || e;
    var filas = grupos[e].map(function (x) {
      var der = '';
      if (e === 'NO_ALCANZA') der = '<span class="pill p-warn">faltan ' + x.faltan + '</span>';
      else if (e === 'COMPLETO') der = '<span class="pill p-ok">' + x.hay + '</span>';
      else der = '<span class="pill ' + SURTIDO_PILL[e] + '">' + (x.pide || '—') + '</span>';
      return '<div class="fila-lote">' +
        '<span class="t"><span class="n">' + esc(x.item) + '</span>' +
        '<span class="c">' + (x.sku ? esc(x.sku) + ' · ' : '') +
        'pide ' + x.pide + (x.hay === '' ? '' : ' · hay ' + x.hay) + '</span></span>' + der + '</div>';
    }).join('');
    return '<div class="card"><div class="sub-t">' + esc(titulo) + '</div>' +
      (SURTIDO_DONDE[e] ? '<p class="mini">' + SURTIDO_DONDE[e] + '</p>' : '') +
      filas + '</div>';
  }).join('');

  pintar(
    (r.bloqueados
      ? '<div class="aviso a-warn"><b>' + r.bloqueados + ' renglones impiden armar esta caja.</b></div>'
      : '<div class="aviso a-ok">Esta caja se puede armar con lo que hay hoy.</div>') +
    cuerpo +
    '<button class="b-dark" id="bAmarrar">Ver los renglones de la plantilla</button>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  $('bAmarrar').onclick = function () { pantallaPlantilla(nombre); };
  $('bV').onclick = function () { pantallaSurtido(); };
}

/* =================================================================
   Claves gemelas

   Un mismo insumo dado de alta dos veces: el genérico que sembró el
   catálogo y el que de verdad está en el anaquel. El genérico nunca va a
   tener existencia, y las plantillas quedaron amarradas justo a él.
   ================================================================= */
async function pantallaGemelas() {
  encabezado('Claves gemelas', 'Un insumo dado de alta dos veces');
  pintar('<div class="card"><p class="sub">Buscando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'duplicados_plan' }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.pares.length) {
    pintar('<div class="aviso a-ok">No hay claves gemelas por fusionar.</div>' +
           '<button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }

  estado.gemelas = {};
  var tarjetas = r.pares.map(function (p, i) {
    estado.gemelas[p.retirar] = p.confianza === 'seguro' ? p.sugerido : '';
    var ops = p.candidatos.map(function (c) {
      return '<option value="' + esc(c.sku) + '"' +
        (c.sku === p.sugerido && p.confianza === 'seguro' ? ' selected' : '') + '>' +
        esc(c.sku + ' · ' + c.nombre) + '</option>';
    }).join('');
    return '<div class="card">' +
      '<div class="sub-t">' + esc(p.retirar) + '</div>' +
      '<h3>' + esc(p.retirar_nombre) + '</h3>' +
      '<p class="mini">Sin saldo, sin lote y sin un solo movimiento' +
      (p.en_plantillas ? ' · usada en ' + p.en_plantillas + ' renglón(es) de plantilla' : '') + '.</p>' +
      (p.confianza === 'seguro'
        ? '<p class="sub">Se fusiona en:</p>'
        : '<div class="aviso a-warn">Hay más de un candidato y se distinguen por la medida o la talla. ' +
          'Eso lo sabe quien abre la caja, no el sistema. Elige o déjalo en blanco.</div>') +
      '<div class="campo"><select data-gem="' + esc(p.retirar) + '">' +
      (p.confianza === 'seguro' ? '' : '<option value="">— no fusionar por ahora —</option>') +
      ops + '</select></div></div>';
  }).join('');

  pintar(
    '<div class="aviso a-warn"><b>' + r.pares.length + ' claves sin existencia tienen una gemela viva.</b><br>' +
    'Fusionar reapunta los renglones de plantilla a la clave buena y deja la vieja inactiva ' +
    '— no la borra. Sólo aparecen aquí claves a las que nunca les pasó nada: cero lotes, ' +
    'cero movimientos. El kardex no se toca.</div>' +
    tarjetas +
    '<button class="b-primary" id="bFus">Fusionar las seleccionadas</button>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  Array.prototype.forEach.call(document.querySelectorAll('select[data-gem]'), function (s) {
    s.onchange = function () { estado.gemelas[s.getAttribute('data-gem')] = s.value; };
  });

  $('bFus').onclick = async function () {
    var pares = [];
    Object.keys(estado.gemelas).forEach(function (k) {
      if (estado.gemelas[k]) pares.push({ retirar: k, queda: estado.gemelas[k] });
    });
    if (!pares.length) return alertar('No hay ninguna seleccionada.');

    /* Dos toques a propósito, sin diálogo del navegador: retirar una clave
       del catálogo no debería pasar por un resbalón del dedo. */
    if (this.getAttribute('data-listo') !== 'si') {
      this.setAttribute('data-listo', 'si');
      this.className = 'b-dark';
      this.textContent = 'Confirmar: fusionar ' + pares.length + ' clave(s)';
      alertar('Toca otra vez para confirmar. La clave vieja queda inactiva, no se borra.');
      return;
    }
    this.disabled = true; this.textContent = 'Fusionando…';
    var res;
    try { res = await enviar({ accion: 'duplicados_fusionar', confirmar: 'FUSIONAR', pares: pares }, true); }
    catch (e) { this.disabled = false; this.textContent = 'Fusionar las seleccionadas'; return alertar('Sin conexión.'); }
    if (!res.ok) { this.disabled = false; this.textContent = 'Fusionar las seleccionadas'; return alertar(res.error); }
    alertar(res.fusionadas + ' clave(s) fusionadas.');
    pantallaGemelas();
  };
  $('bV').onclick = function () { pantallaInicio(); };
}
