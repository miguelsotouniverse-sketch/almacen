<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0E0D">
<title>Almacén · MS Universe</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* Red de seguridad, antes que cualquier otra cosa.
   Vive aparte y arriba para que sobreviva a un error del script grande.

   Dos reglas aprendidas a golpes:
   1. Solo se adueña de la pantalla si la app NUNCA logro pintar nada. Si la
      app ya esta funcionando, un error suelto no debe borrarle la pantalla al
      usuario: se avisa discreto abajo y ya.
   2. Reiniciar SIEMPRE recarga, aunque borrar el service worker se atore.
      Sin el reloj de abajo, en algunos telefonos "Reiniciar" no hacia nada. */
(function () {
  window.__appViva = false;

  function chico(txt) {
    var v = document.getElementById('msu_avisoErr');
    if (!v) {
      v = document.createElement('div');
      v.id = 'msu_avisoErr';
      v.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;' +
        'background:#A33F30;color:#fff;padding:11px 13px;border-radius:9px;' +
        'font:13px -apple-system,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)';
      (document.body || document.documentElement).appendChild(v);
    }
    v.innerHTML = '<span style="word-break:break-word">' +
      String(txt || '').replace(/[<>&]/g, ' ') + '</span>' +
      '<a href="?reiniciar=1" style="color:#fff;text-decoration:underline;margin-left:10px;' +
      'white-space:nowrap">Reiniciar</a>';
  }

  function grande(txt) {
    var d = document.getElementById('app') || document.body;
    if (!d || d.getAttribute('data-fallo')) return;
    d.setAttribute('data-fallo', '1');
    d.innerHTML =
      '<div style="padding:20px;font:16px -apple-system,system-ui,sans-serif;color:#0C0E0D">' +
      '<p style="font-weight:600;margin:0 0 8px">La app no pudo arrancar.</p>' +
      '<p style="color:#6E736F;font-size:14px;margin:0 0 18px;word-break:break-word">' +
      String(txt || '').replace(/[<>&]/g, ' ') + '</p>' +
      '<p style="margin:0 0 10px"><a href="?reiniciar=1" style="display:block;text-align:center;' +
      'background:#0C0E0D;color:#F4F2F1;padding:14px;border-radius:9px;text-decoration:none">' +
      'Reiniciar la app</a></p>' +
      '<p style="margin:0"><a href="?n=' + Date.now() + '" style="display:block;text-align:center;' +
      'border:1px solid #D8D2CC;color:#3D423F;padding:14px;border-radius:9px;text-decoration:none">' +
      'Volver a intentar</a></p></div>';
  }

  function reportar(txt) {
    if (window.__appViva) chico(txt); else grande(txt);
  }

  window.addEventListener('error', function (e) {
    reportar((e.message || 'Error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    reportar(String((e.reason && e.reason.message) || e.reason || 'Promesa rechazada'));
  });

  /* Borron y cuenta nueva: quita el service worker y los caches y recarga.
     NO toca la sesion: no hay que volver a entrar con Google. */
  window.reiniciarApp = function () {
    var yaFue = false;
    function irse() {
      if (yaFue) return;
      yaFue = true;
      location.replace(location.pathname + '?n=' + Date.now());
    }
    setTimeout(irse, 2500);   // pase lo que pase, recarga

    var pasos = [];
    try {
      if ('serviceWorker' in navigator && navigator.serviceWorker) {
        pasos.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        pasos.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (err) { /* si algo de esto no existe, igual recargamos */ }
    Promise.all(pasos).catch(function () {}).then(irse);
  };

  if (/[?&]reiniciar=1/.test(location.search)) {
    document.addEventListener('DOMContentLoaded', function () {
      var d = document.getElementById('app');
      if (d) d.innerHTML = '<p style="padding:20px;font:16px -apple-system,system-ui,sans-serif;' +
        'color:#6E736F">Reiniciando la app…</p>';
    });
    window.reiniciarApp();
  }
})();
</script>
<style>
:root{
  --ground:#F4F2F1;--surface:#FFFFFF;--surface-2:#EDEAE7;
  --ink:#0C0E0D;--ink-2:#3D423F;--ink-3:#6E736F;
  --rule:#D8D2CC;--rule-soft:#E6E1DC;
  --accent:#A19487;--accent-deep:#6B5D51;
  --ok:#3F6F52;--warn:#B5842B;--crit:#A33F30;--info:#3C5F79;
  --tint-ok:rgba(63,111,82,.10);--tint-warn:rgba(181,132,43,.13);
  --tint-crit:rgba(163,63,48,.10);--tint-info:rgba(60,95,121,.10);
  --tint-accent:rgba(161,148,135,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#F4F2F1;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header .fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
header .marca{display:flex;align-items:center;gap:13px;min-width:0}
header .ms{height:34px;width:auto;flex:none;opacity:.95}
header .t{font-weight:500;font-size:1.02rem;line-height:1.2}
header .s{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:#9AA09C;margin-top:2px}
.estado{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.05em;
  padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.1);white-space:nowrap}
.estado.pend{background:var(--tint-warn);color:#E0B369}
.estado.off{background:var(--tint-crit);color:#E4998A}

main{padding:16px 16px 40px;max-width:680px;margin:0 auto}
h2{font-size:1.15rem;font-weight:500;margin:0 0 12px}
p{margin:0 0 12px}
.sub{color:var(--ink-3);font-size:.9rem}
.mini{font-size:.82rem;color:var(--ink-3)}
.centro{text-align:center}
.oculto{display:none!important}
.espacio{height:10px}
.foto-prev{width:100%;max-height:260px;object-fit:contain;border-radius:8px;
  border:1px solid var(--rule);background:var(--surface-2);margin-top:8px}
.foto-mini{width:44px;height:44px;object-fit:cover;border-radius:6px;
  border:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto}
.sin-foto{width:44px;height:44px;border-radius:6px;border:1px dashed var(--rule);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:.62rem;color:var(--ink-3);text-align:center;line-height:1.1}
.fila-sku{display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--rule);width:100%;background:none;border-left:0;
  border-right:0;border-top:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer}
.fila-sku:last-child{border-bottom:0}
.fila-lote{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--rule);width:100%;background:none;border-left:0;
  border-right:0;border-top:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer}
.fila-lote:last-of-type{border-bottom:0}
.fila-lote .t{flex:1;min-width:0;display:block}
.fila-lote .t .n{display:block;font-size:.88rem}
.fila-lote .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.05em;color:var(--ink-3);margin-top:3px}
.fila-sku .t{flex:1;min-width:0;display:block}
.fila-sku .t .n{display:block;font-size:.93rem;line-height:1.25}
.fila-sku .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;
  letter-spacing:.06em;color:var(--ink-3);margin-top:3px}
.g-caja{display:flex;justify-content:center;margin:16px 0 8px;min-height:44px}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:1rem;font-weight:500}

label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--rule);
  border-radius:8px;background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:16px;font-weight:300}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);
  outline-offset:1px;border-color:var(--accent)}
.campo{margin-bottom:13px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* Captura de mínimos: el número se teclea AL LADO de la existencia contra la
   que hay que calibrarlo. En dos pantallas separadas habría que memorizar un
   número mientras se escribe el otro. */
.min-fila{display:grid;grid-template-columns:1fr 94px;gap:11px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule)}
.min-fila:last-of-type{border-bottom:0}
.min-fila .t{min-width:0;display:block}
.min-fila .t .n{display:block;font-size:.88rem;line-height:1.3}
.min-fila .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.05em;color:var(--ink-3);margin-top:3px}
.min-fila input{padding:10px;text-align:right;
  font-family:'IBM Plex Mono',monospace;font-size:16px}
.min-fila input.tocado{border-color:var(--accent);background:var(--tint-accent)}
.min-u{display:block;text-align:right;margin-top:3px;
  font-family:'IBM Plex Mono',monospace;font-size:.58rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3)}

button{font-family:inherit;font-size:1rem;font-weight:500;border:0;border-radius:9px;
  padding:14px;cursor:pointer;width:100%}
.b-primary{background:var(--accent);color:#15100C}
.b-dark{background:var(--ink);color:#F4F2F1}
.b-ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.b-fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button:disabled{opacity:.5}
button+button{margin-top:9px}
.b-fila button+button{margin-top:0}

.folio-min{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  border:1px solid var(--accent);border-radius:8px;padding:9px 12px;margin:12px 0 8px;
  background:var(--tint-accent);
}
.folio-min .k{
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent-deep);
}
.folio-min .v{font-size:1.05rem;color:var(--ink);font-weight:500}
.masmenos{display:flex;align-items:center;gap:6px;flex-shrink:0}
.masmenos .uno{
  width:30px;height:30px;border-radius:7px;border:1px solid var(--rule);
  background:#fff;color:var(--ink);font-size:17px;line-height:1;padding:0;
  cursor:pointer;flex-shrink:0;
}
.masmenos .uno:disabled{opacity:.3;cursor:default}
.masmenos .uno.mas{border-color:var(--accent);color:var(--accent-deep)}
.grupo-caja{
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin:14px 0 4px;padding-bottom:3px;
  border-bottom:1px solid var(--rule);
}
.grupo-caja:first-child{margin-top:4px}
.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  padding:3px 8px;border-radius:3px;letter-spacing:.05em}
.p-ok{background:var(--tint-ok);color:var(--ok)}
.p-warn{background:var(--tint-warn);color:var(--warn)}
.p-crit{background:var(--tint-crit);color:var(--crit)}
.p-info{background:var(--tint-info);color:var(--info)}
.p-neutral{background:var(--surface-2);color:var(--ink-3)}
.sub-t{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-deep);margin:12px 0 2px;
  border-bottom:1px solid var(--rule-soft);padding-bottom:4px}
.sub-t:first-child{margin-top:0}
/* Los labels de los campos van en versalitas; éste es una frase y tiene que
   leerse como frase, no a gritos. */
label.check{display:flex;align-items:flex-start;gap:9px;font-size:.92rem;line-height:1.4;
  cursor:pointer;color:var(--ink);font-family:'Jost',-apple-system,sans-serif;
  text-transform:none;letter-spacing:normal;font-weight:400}
label.check input{width:19px;height:19px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--ink)}
.mapeo{border-top:1px solid var(--rule-soft);padding:9px 0}
.mapeo:first-of-type{border-top:0}
.mapeo .cl{font-family:'IBM Plex Mono',monospace;font-size:.74rem;display:block;
  color:var(--ink);letter-spacing:.02em}
.mapeo .cl b{font-weight:500;color:var(--accent-deep)}
.mapeo .nm{display:block;font-size:.8rem;margin-top:2px}
.mapeo .po{display:block;font-size:.66rem;color:var(--ink-3);margin-top:1px}

.aviso{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
.a-ok{background:var(--tint-ok);color:var(--ok)}
.a-err{background:var(--tint-crit);color:var(--crit)}
.a-warn{background:var(--tint-warn);color:var(--warn)}
.a-info{background:var(--tint-accent);color:var(--accent-deep)}
/* Neutro: un aviso que informa sin pedir nada. El de "no se abrió ninguno"
   cambia a warn en cuanto sí se abre algo, y ese contraste es el que avisa. */
.a-neutral{background:#F1EEEB;color:var(--ink-2)}
/* Botón que vive dentro de un renglón de lista: no ocupa el ancho. */
.b-chico{
  width:auto;flex-shrink:0;padding:7px 13px;font-size:.85rem;border-radius:7px;
  background:var(--ink);color:#F4F2F1;margin:0;
}

.lista .item{display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.lista .item:last-child{border-bottom:0}
.lista .item .l{min-width:0}
.lista .item .l span{display:block;font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;color:var(--ink-3);letter-spacing:.06em}
.lista .item .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
/* Hay renglones donde el texto de abajo ES el dato —"sin ninguna cirugía
   costeada al 100 %"— y cortarlo con puntos suspensivos esconde justo la
   advertencia. Esos se marcan y se dejan correr en varias líneas. */
.lista .item .l div.suelta{white-space:normal;overflow:visible;text-overflow:clip;max-width:none}

.linea{border:1px solid var(--rule);border-radius:9px;padding:12px 13px;margin-bottom:10px;
  background:var(--surface)}
.linea .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  margin-bottom:6px}
.linea .cab .nm{font-weight:500;font-size:.94rem;line-height:1.25}
.linea .datos{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-3);
  line-height:1.6}
.linea .quitar{width:auto;padding:5px 10px;font-size:.72rem;background:transparent;
  border:1px solid var(--rule);color:var(--ink-3);border-radius:6px;flex:0 0 auto}

/* Un renglón de la lista que se puede abrir. El área de toque es todo el
   renglón, no un botoncito: esto se usa de pie y con guantes. */
.lista .item-abre{cursor:pointer;padding-left:4px;padding-right:4px;
  border-radius:7px;transition:background .12s}
.lista .item-abre:active{background:var(--surface-2)}
.lista .item-abre .l span::after{content:' ›';color:var(--ink-3)}

.linea .dest{margin-top:8px;font-size:.86rem;padding:9px 11px}

.folio-lote{background:var(--ink);color:#F4F2F1;border-radius:9px;padding:13px 15px;
  margin-bottom:9px}
.folio-lote .n{font-family:'IBM Plex Mono',monospace;font-size:1.15rem;font-weight:600}
.folio-lote .d{font-size:.8rem;color:#9AA09C;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- portada: tablero ----------
   La portada anterior era nueve tarjetas con un párrafo cada una. Se leía
   como un manual. Un manual se lee una vez; una portada se abre veinte veces
   al día, de pie y con una mano. Lo que cambia la decisión de quien abre la
   app son números, no explicaciones. */
#video{width:100%;border-radius:10px;background:#000;display:block;
  aspect-ratio:4/3;object-fit:cover}
#lienzo{display:none}
.mira{position:relative}
.mira::after{content:'';position:absolute;inset:18% 14%;border:2px solid #fff;
  border-radius:10px;opacity:.55;pointer-events:none}

.buscador{display:flex;gap:9px;margin-bottom:14px}
/* Un campo de busqueda con su boton de escanear al lado. El boton no lleva
   el ancho completo que tienen los demas botones. */
.campo-escan{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:stretch}
.campo-escan button{width:auto;margin-top:0;padding:14px 16px;white-space:nowrap}
.buscador input{flex:1}
.buscador button{width:auto;padding:12px 18px;flex:0 0 auto}

.tira{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;
  margin-bottom:14px}
.dato{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:11px 12px;text-align:left;cursor:pointer;font-family:inherit;
  color:inherit;width:auto;display:block}
.dato:active{background:var(--surface-2)}
.dato .n{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;line-height:1;
  font-weight:400;display:block}
.dato .e{display:block;font-size:.74rem;color:var(--ink-3);margin-top:5px;line-height:1.25}
.dato.d-ok .n{color:var(--ok)}
.dato.d-warn .n{color:var(--warn)}
.dato.d-crit .n{color:var(--crit)}
.dato.d-crit{border-color:rgba(163,63,48,.35);background:var(--tint-crit)}
.dato.d-warn{border-color:rgba(181,132,43,.35)}

/* Las acciones, sin párrafo. El nombre del botón tiene que bastar; si no
   basta, el nombre está mal, no le falta un párrafo. */
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.baldosa{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:14px 13px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  font-size:.95rem;font-weight:400;width:auto;display:block;line-height:1.3}
.baldosa:active{background:var(--surface-2)}
.baldosa .q{display:block;font-size:.76rem;color:var(--ink-3);margin-top:4px;font-weight:300}
.baldosa.ancha{grid-column:1 / -1}
.baldosa.fuerte{background:var(--ink);color:#F4F2F1;border-color:var(--ink)}
.baldosa.fuerte .q{color:#9AA09C}
/* Una baldosa que pide atención hoy. Se reserva para lo que bloquea algo:
   si la usara cualquier pendiente, dejaría de verse. */
.baldosa.urge{border-color:var(--warn)}
.baldosa.urge .q{color:var(--warn)}

details.mas{margin-bottom:14px}
details.mas>summary{cursor:pointer;list-style:none;font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);
  padding:9px 0;border-bottom:1px solid var(--rule-soft)}
details.mas>summary::-webkit-details-marker{display:none}
details.mas>summary::after{content:' +';}
details.mas[open]>summary::after{content:' −';}
details.mas>div{padding-top:11px}

/* ---------- filtros en fichas ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:3px;
  -webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;width:auto;padding:7px 13px;border-radius:999px;font-size:.82rem;
  font-weight:400;background:var(--surface);border:1px solid var(--rule);color:var(--ink-2)}
.chip.on{background:var(--ink);color:#F4F2F1;border-color:var(--ink)}
.chip .c{font-family:'IBM Plex Mono',monospace;font-size:.7rem;opacity:.7;margin-left:5px}

/* ---------- existencias por producto ---------- */
.prod{border-bottom:1px solid var(--rule-soft)}
.prod:last-child{border-bottom:0}
.prod>button{display:flex;align-items:center;gap:11px;padding:12px 4px;width:100%;
  background:none;border:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer;border-radius:7px}

<script>
/* =================================================================
   Almacén MS Universe — recepción de compras y existencias
   Zorvix arranca en cero: todo lo que exista entra por aquí.
   ================================================================= */

/* La URL del gateway no es secreto: sin una sesión válida no responde nada.
   Vivir aquí es lo que permite que la app abra directo en Google, sin
   pantalla de configuración en cada teléfono. */
var GATEWAY = 'https://script.google.com/macros/s/AKfycbz0VFVwemsK8M2_nqwp-0zMcGuhicVCn5xIwlG1hPAaEnvh7XUdxwvX5AhrhAje3sRggg/exec';

var COLA_KEY = 'msu_alm_cola';
var SES_KEY = 'msu_alm_sesion';
/* La caja que se va a imprimir se deja aquí y la lee hojas_caja.html. No
   viaja por la URL: una caja de treinta renglones no cabe en una. */
var HOJAS_KEY = 'msu_alm_hojas_caja';
var SOLICITUD_KEY = 'msu_alm_solicitud_caja';
var CAT_KEY = 'msu_alm_cat';

var estado = {
  sesion: leer(SES_KEY, null),
  cat: leer(CAT_KEY, null),
  /* La camara del escaner. Vive en estado y no en la pantalla porque hay
     que poder apagarla desde fuera: una camara encendida que nadie ve
     calienta el telefono y se come la pila. */
  stream: null,
  cabecera: null,
  lineas: [],
  /* La huella de ESTA recepción. Se genera una sola vez, al abrir la
     cabecera, y se conserva en todos los reintentos: es lo que permite al
     backend reconocer que el segundo envío es el mismo que el primero y no
     una compra nueva. Generarla en cada clic de Guardar convertía cada
     reintento en una recepción distinta. */
  client_id: null
};

function leer(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function escribir(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function pintar(html) {
  $('app').innerHTML = html;
  /* La app logro pintar: de aqui en adelante un error suelto ya no le borra
     la pantalla al usuario, solo sale el aviso chico de abajo. */
  window.__appViva = true;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
function idCliente() {
  return 'c' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}
function encabezado(t, s) { $('hTitulo').textContent = t; $('hSub').textContent = s || 'MS Universe'; }

function alertar(msg) {
  var d = document.createElement('div');
  d.className = 'aviso a-info';
  d.textContent = msg;
  $('app').prepend(d);
  setTimeout(function () { d.remove(); }, 4000);
}

/* ---------- fotos de insumos ----------
   La foto contesta la única pregunta que el nombre no contesta: «¿esto es
   lo que tengo en la mano?». Quien recibe no siempre conoce el producto, y
   un nombre de catálogo mal leído se convierte en un lote mal capturado.

   Las fotos viven en el Drive privado del dueño del script y se sirven por
   el gateway, que ya validó la sesión. Por eso se piden de una en una y
   sólo cuando alguien las abre: el catálogo manda tiene_foto, no la liga.
   ------------------------------------------------------------------- */
function comprimir(file, cb) {
  var lector = new FileReader();
  lector.onload = function (ev) {
    var img = new Image();
    img.onload = function () {
      var max = 1280;
      var escala = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { alertar('Ese archivo no se pudo leer como imagen.'); };
    img.src = ev.target.result;
  };
  lector.onerror = function () { alertar('No se pudo leer el archivo.'); };
  lector.readAsDataURL(file);
}

/* Memoria de la sesión: abrir el mismo insumo dos veces no vuelve a bajar
   la foto. Se pierde al recargar, que es justo lo que se quiere. */
var FOTOS = {};

async function traerFoto(sku) {
  var k = String(sku).toUpperCase();
  if (FOTOS[k]) return FOTOS[k];
  var r = await enviar({ accion: 'sku_foto', sku: k }, true);
  if (r && r.ok && r.imagen) { FOTOS[k] = r.imagen; return r.imagen; }
  throw new Error((r && r.error) || 'No se pudo traer la foto.');
}

function marcarConFoto(sku) {
  var k = String(sku).toUpperCase();
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === k) s.tiene_foto = true;
  });
}

/* ---------- cola offline ---------- */
function cola() { return leer(COLA_KEY, []); }
function encolar(payload) {
  var c = cola(); c.push(payload);
  try { localStorage.setItem(COLA_KEY, JSON.stringify(c)); pintarEstado(); return true; }
  catch (e) {
    alertar('El teléfono ya no puede guardar más pendientes. Busca señal antes de seguir.');
    return false;
  }
}
function quitarDeCola(id) {
  escribir(COLA_KEY, cola().filter(function (x) { return x.client_id !== id; }));
  pintarEstado();
}
async function vaciarCola() {
  var p = cola();
  if (!p.length || !navigator.onLine) return;
  for (var i = 0; i < p.length; i++) {
    try {
      var r = await enviar(p[i], true);
      if (r && r.ok) quitarDeCola(p[i].client_id); else break;
    } catch (e) { break; }
  }
}
function pintarEstado() {
  var e = $('hEstado'), pend = cola().length;
  if (!navigator.onLine) { e.textContent = '● sin señal'; e.className = 'estado off'; }
  else if (pend) { e.textContent = '● ' + pend + ' por enviar'; e.className = 'estado pend'; }
  else { e.textContent = '● en línea'; e.className = 'estado'; }
}

/* ---------- transporte ---------- */
async function enviar(payload, sinEncolar) {
  if (!payload.client_id) payload.client_id = idCliente();
  if (estado.sesion && estado.sesion.sesion) payload.sesion = estado.sesion.sesion;
  try {
    var res = await fetch(GATEWAY, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    var datos = await res.json();

    /* Apps Script contesta un POST con un redirect, y cuando la ejecución
       tarda más de la cuenta ese redirect cae en doGet, que devuelve la
       ficha del servicio: {ok:true, servicio:'AlmacenGateway'}. Trae ok:true
       y no trae nada de lo que se pidió, así que la pantalla se dibujaba
       VACÍA —cero renglones, cero faltantes— como si la respuesta fuera
       buena. Una caja que se ve sin faltantes porque la petición se perdió
       es peor que un error: se arma y se va al quirófano incompleta.
       Un POST nunca debe recibir esta ficha; si llega, la llamada falló. */
    if (datos && datos.servicio === 'AlmacenGateway' && payload.accion !== 'ping') {
      var perdida = new Error('El servidor tardó demasiado y no contestó. Revisa si quedó guardado antes de repetir.');
      /* No se encola: la ficha sólo dice que la RESPUESTA se perdió, no que
         la escritura no haya corrido. Reenviar una recepción a ciegas la
         duplicaría. Que lo decida quien está capturando. */
      perdida.sinRespuesta = true;
      throw perdida;
    }

    // Si la sesión murió, no tiene caso seguir: se limpia y se pide Google.
    if (datos && datos.ok === false && MOTIVOS_SESION[datos.error]) {
      cerrarSesion(MOTIVOS_SESION[datos.error]);
    }
    return datos;
  } catch (err) {
    if (!sinEncolar && payload.encolable && !err.sinRespuesta) {
      encolar(payload); return { ok: true, encolado: true };
    }
    throw err;
  }
}

/* =================================================================
   Sesión
   ================================================================= */

/** La sesión se acabó o la revocaron: limpiar y volver a la puerta. */
function cerrarSesion(msg) {
  estado.sesion = null;
  escribir(SES_KEY, null);
  pantallaLogin(msg);
}

var MOTIVOS_SESION = {
  SIN_SESION:      'Entra con tu cuenta de Google.',
  SESION_INVALIDA: 'Tu sesión ya no es válida. Vuelve a entrar.',
  SESION_EXPIRADA: 'Tu sesión caducó. Vuelve a entrar con Google.',
  SESION_REVOCADA: 'Tu acceso al almacén fue dado de baja. Habla con el director.'
};

/* ---------- Google Identity ---------- */
var GIS_LISTO = null;

function cargarGIS() {
  if (GIS_LISTO) return GIS_LISTO;
  GIS_LISTO = new Promise(function (ok, falla) {
    if (window.google && google.accounts && google.accounts.id) return ok();
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function () { ok(); };
    s.onerror = function () { GIS_LISTO = null; falla(new Error('No se pudo cargar Google')); };
    document.head.appendChild(s);
  });
  return GIS_LISTO;
}

async function entrarConGoogle(credencial) {
  var r = await enviar({ accion: 'login_google', idToken: credencial,
                         dispositivo: navigator.userAgent }, true);
  if (!r.ok) return pantallaLogin(r.error);
  /* La credencial de Google se queda en memoria: la app de facturas la pide
     para entregar el XML de un CFDI, y pedirsela a Google otra vez a media
     captura es una pantalla de mas. Dura una hora, la que Google le da. */
  guardarIdToken(credencial);
  // La identidad que firma cada movimiento es el correo verificado por Google,
  // no un nombre escrito a mano. La sesión la emite nuestro backend.
  estado.sesion = { sesion: r.sesion, usuario: r.correo || r.usuario,
                    nombre: r.nombre, rol: r.rol, via: r.via };
  escribir(SES_KEY, estado.sesion);
  await cargarCat();
  pantallaInicio();
}

function pantallaLogin(msg) {
  encabezado('Entrar', 'Almacén');
  pintar((msg ? '<div class="aviso a-err">' + esc(msg) + '</div>' : '') +
    '<div class="card">' +
    '<p class="sub">Entra con la cuenta de Google que tengas dada de alta en el almacén. ' +

/* =================================================================
   Portada
   =================================================================
   La portada vieja explicaba la app. Ésta la reporta.

   Regla de la tira de datos: un número sólo aparece si alguien puede hacer
   algo con él. "SKU en catálogo: 296" no cambia ninguna decisión y por eso
   ya no está. "3 vencidos en el anaquel" sí. Y si no hay nada que atender,
   la franja de pendientes no aparece: un tablero que siempre tiene algo en
   rojo deja de leerse a la semana.
   ================================================================= */

function nFmt(v) {
  var n = Number(v);
  if (!isFinite(n)) return String(v == null ? '' : v);
  return (Math.round(n * 1000) / 1000).toString();
}

function diasDeCad(f) {
  var t = String(f || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(t)) return null;
  var hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  return Math.round((new Date(t + 'T12:00:00').getTime() - hoy.getTime()) / 86400000);
}

/** Un renglón de existencia que no está en el anaquel está comprometido. */
function dondeEsta(x) {
  var t = String(x.ubic_tipo || '').toUpperCase();
  if (t === 'CAJA' || esCaja(x.ubic_id)) return 'caja';
  if (t === 'DOTACION') return 'dotacion';
  return 'anaquel';
}

/* =================================================================
   Escanear
   =================================================================
   El folio impreso en la etiqueta es la identidad del lote. Leerlo con la
   camara es la diferencia entre buscar un insumo en treinta segundos y
   buscarlo en tres, y es lo unico que hace que valga la pena pegar las
   etiquetas.

   Tres caminos, en orden de preferencia, igual que en la app de activos:
     1. BarcodeDetector nativo  -> Chrome de Android, sin dependencias.
     2. jsQR.js del propio repo -> iPhone/Safari y cualquier navegador viejo.
     3. Teclear el folio        -> siempre disponible.
   ================================================================= */

/* Lo leido no siempre es un folio nuestro. En el anaquel conviven tres
   codigos: el que imprimimos (LOT-…), el de una caja de cirugia (CAJA-…)
   y el que trae de fabrica el producto. Cada uno va a su pantalla; el de
   fabrica se manda al buscador, que ya sabe buscar por lote del
   proveedor, por clave y por nombre. */
function abrirEscaneado(txt) {
  var v = String(txt || '').trim().toUpperCase();
  if (!v) return pantallaInicio();
  if (/^CAJA-/.test(v)) return pantallaCajaDetalle(v);
  if (/^LOT-/.test(v)) return pantallaLote(v, function () { pantallaInicio(); });
  return pantallaLotes(v);
}

function detenerCamara() {
  if (estado.stream) {
    estado.stream.getTracks().forEach(function (t) { t.stop(); });
    estado.stream = null;
  }
}

/* El motor de la camara, separado de la pantalla que lo usa.
   La portada lo usa para navegar a una ficha; al surtir una caja se usa sin
   salir de la pantalla, para no volver a pedir las existencias entre un
   renglon y el siguiente.

   op.alLeer(texto)  -> que hacer con el codigo leido.
   op.alCancelar()   -> a donde ir si la persona se arrepiente.
   op.alTeclear()    -> si se pasa, aparece el boton de teclear el folio. */
async function leerCodigo(op) {
  op = op || {};
  var alLeer = op.alLeer || abrirEscaneado;
  var alCancelar = op.alCancelar || function () { pantallaInicio(); };
  var alTeclear = op.alTeclear || null;

  encabezado(op.titulo || 'Escanear', op.nota || 'Apunta al c\u00f3digo de la etiqueta');
  pintar(
    '<div class="card mira"><video id="video" playsinline muted autoplay></video>' +
    '<canvas id="lienzo"></canvas>' +
    '<p class="mini centro" id="msgEsc">Abriendo c\u00e1mara\u2026</p></div>' +
    (alTeclear ? '<button class="b-ghost" id="bTeclear">Teclear el folio</button>' : '') +
    '<button class="b-ghost" id="bVolverEsc">' + esc(op.volverTxt || 'Volver') + '</button>');

  if (alTeclear) $('bTeclear').onclick = function () { detenerCamara(); alTeclear(); };
  $('bVolverEsc').onclick = function () { detenerCamara(); alCancelar(); };

  var hayNativo = ('BarcodeDetector' in window);
  var hayJsQR = (typeof window.jsQR === 'function');

  if (!hayNativo && !hayJsQR) {
    $('msgEsc').textContent = 'Este navegador no puede leer c\u00f3digos. ' +
      'Usa \u00abTeclear el folio\u00bb.';
    return;
  }

  var v = $('video');
  try {
    estado.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } }, audio: false
    });
    v.srcObject = estado.stream;
    v.setAttribute('playsinline', 'true');   /* iOS: sin esto abre a pantalla completa */
    await v.play();
  } catch (e) {
    $('msgEsc').textContent = 'No se pudo abrir la c\u00e1mara. Dale permiso al sitio ' +
      'o teclea el folio. En iPhone hace falta iOS 14.3 o posterior.';
    return;
  }

  $('msgEsc').textContent = 'Buscando c\u00f3digo\u2026';

  var detector = hayNativo
    ? new window.BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39'] })
    : null;
  var lienzo = $('lienzo');
  var ctx = lienzo.getContext('2d', { willReadFrequently: true });
  var buscando = true;

  function encontrado(valor) {
    buscando = false;
    detenerCamara();
    if (navigator.vibrate) navigator.vibrate(60);
    alLeer(valor);
  }

  (async function bucle() {
    while (buscando && estado.stream) {
      /* Si la pantalla ya no esta, alguien navego a otra parte sin pasar
         por los botones: se apaga la camara sola. */
      if (!document.getElementById('video')) { detenerCamara(); return; }
      try {
        if (detector) {
          var codigos = await detector.detect(v);
          if (codigos && codigos.length) return encontrado(codigos[0].rawValue);
        } else if (v.videoWidth) {
          /* Se reduce el fotograma: decodificar en tama\u00f1o completo tumba a
             los telefonos modestos. */
          var ancho = 480;
          var alto = Math.round(v.videoHeight * (ancho / v.videoWidth));
          lienzo.width = ancho; lienzo.height = alto;
          ctx.drawImage(v, 0, 0, ancho, alto);
          var img = ctx.getImageData(0, 0, ancho, alto);
          var r = window.jsQR(img.data, ancho, alto, { inversionAttempts: 'dontInvert' });
          if (r && r.data) return encontrado(r.data);
        }
      } catch (e) { /* fotograma ilegible: seguimos */ }
      await new Promise(function (res) { setTimeout(res, detector ? 220 : 120); });
    }
  })();
}

/* =================================================================
   Aplicar a paciente

   Un almacén de inyectables no arma cajas: aplica. Esta pantalla es su
   equivalente del «surtir y cerrar» de quirófano, pero sin caja de por
   medio — se escoge la paciente, se escogen los lotes y se descuenta.

   El lote se elige siempre explícito, nunca «el sistema escoge»: en un
   inyectable el lote es lo que se anota en el expediente y lo que se
   reporta si el fabricante saca una alerta. Lo que sí hace la app es
   ponerle enfrente el que caduca primero.
   ================================================================= */

/* =================================================================
   Cuadre · la cita y la justificación de cobro

   Dos cambios a la pantalla de aplicar y una pantalla nueva.

   LA PACIENTE YA NO SE TECLEA. Se escoge de la agenda del día. Teclear un
   nombre es como la misma persona acaba escrita de tres maneras y el
   historial deja de sumarse; además, amarrar la salida a la cita es lo que
   después permite cruzar agenda contra almacén sin adivinar por nombre.

   Se deja una salida de emergencia —«no está en la agenda»— porque la
   alternativa sería que alguien no pueda registrar lo que ya aplicó. Pero
   es explícita y avisa: esa aplicación va a salir en el cuadre como
   aplicación sin cita, hasta que alguien la explique.

   LA JUSTIFICACIÓN SE DECLARA AL GUARDAR, no después. Si se dejara para
   luego, «luego» es nunca. Y como una de las opciones es «pendiente», nadie
   tiene que inventar una respuesta con tal de poder cerrar la pantalla.
   ================================================================= */

function hoyFront_() {
  var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}

function diaMas_(iso, dias) {
  var p = String(iso).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  d.setDate(d.getDate() + dias);
  var z = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}

function soloHora_(s) { return String(s || '').slice(11, 16); }

/* ---------------- las citas del día ---------------- */

async function cargarCitasAplicar(fecha) {
  APLIC.fechaCitas = fecha || hoyFront_();
  APLIC.citas = [];
  APLIC.citasAviso = '';
  APLIC.citasCargando = true;
  try {
    var r = await enviar({ accion: 'citas_dia', ubic_id: APLIC.ubic_id,
                           fecha: APLIC.fechaCitas }, true);
    if (r.ok) {
      APLIC.citas = r.citas || [];
      APLIC.citasAviso = r.aviso || (r.problemas || []).join(' · ');
    } else {
      APLIC.citasAviso = r.error || 'No se pudo leer la agenda.';
    }
  } catch (e) {
    APLIC.citasAviso = 'Sin señal para leer la agenda.';
  }
  APLIC.citasCargando = false;
}

function tarjetaCita() {
  /* Ya escogida: se enseña lo escogido y un botón para cambiarla. Dejar la
     lista completa abierta después de escoger sólo invita a equivocarse. */
  if (APLIC.cita) {
    var c = APLIC.cita;
    return '<div class="card"><h3>' + esc(c.paciente || '(sin nombre en la agenda)') + '</h3>' +
      '<p class="mini mono">' + esc(APLIC.fechaCitas) + ' ' + esc(soloHora_(c.inicio)) +
        ' · ' + esc(c.agenda) + '</p>' +
      (c.procedimiento ? '<p class="mini">' + esc(c.procedimiento) + '</p>' : '') +
      (c.retoque ? '<span class="pill p-info">retoque</span> ' : '') +
      (c.estructurada ? '' : '<span class="pill p-warn">agenda a mano</span> ') +
      (c.aplicaciones && c.aplicaciones.length
        ? '<div class="aviso a-warn">Esta cita ya tiene ' + c.aplicaciones.length +
          ' aplicación(es) registrada(s): ' +
          c.aplicaciones.map(function (a) { return esc(a.folio); }).join(', ') +
          '. Si lo que vas a registrar es distinto, adelante; si es lo mismo, ya está.</div>'
        : '') +
      '<button class="b-ghost" id="cCambiar" style="margin-top:8px">Cambiar de cita</button></div>';
  }

  /* Modo manual: la paciente no está en la agenda. */
  if (APLIC.sinCita) {
    return '<div class="card"><h3>Paciente fuera de la agenda</h3>' +
      '<div class="campo"><label>Nombre completo</label>' +
      '<input id="aPac" list="aPacLista" autocomplete="off" placeholder="Como está en el expediente" value="' +
        esc(APLIC.paciente || '') + '">' +
      '<datalist id="aPacLista">' +
        (APLIC.pacientes || []).map(function (n) { return '<option value="' + esc(n) + '">'; }).join('') +
      '</datalist></div>' +
      '<div class="aviso a-warn">Esta aplicación va a salir en el cuadre como ' +
      '<b>aplicación sin cita</b> hasta que alguien la explique. Si la paciente sí ' +
      'está en la agenda, mejor escógela de ahí.</div>' +
      '<button class="b-ghost" id="cVolverAgenda">Buscarla en la agenda</button></div>';
  }

  /* Lista del día. */
  var dia = APLIC.fechaCitas || hoyFront_();
  var lista = APLIC.citas || [];
  var cab =
    '<div class="card"><h3>¿A quién se le aplicó?</h3>' +
    '<p class="mini">Escógela de la agenda. De ahí sale su nombre, para que no quede ' +
    'escrito de dos maneras distintas.</p>' +
    '<div class="buscador">' +
    '<button class="b-ghost" id="cAyer" style="width:auto;margin:0">◀</button>' +
    '<input id="cFecha" type="date" value="' + esc(dia) + '">' +
    '<button class="b-ghost" id="cManana" style="width:auto;margin:0">▶</button></div>';

  if (APLIC.citasCargando) return cab + '<p class="sub">Leyendo la agenda…</p></div>';

  var cuerpo;
  if (!lista.length) {
    cuerpo = '<div class="aviso a-info">' +
      (APLIC.citasAviso ? esc(APLIC.citasAviso) : 'No hay citas ese día.') + '</div>';
  } else {
    /* Las de inyectable arriba: son las que casi siempre se buscan. El
       resto se deja a la vista porque la agenda de la Dra. Damián es texto
       libre y muchas veces no dice el tratamiento. */
    var ord = lista.slice().sort(function (a, b) {
      if (!!a.inyectable !== !!b.inyectable) return a.inyectable ? -1 : 1;
      return String(a.inicio).localeCompare(String(b.inicio));
    });
    cuerpo = ord.map(function (c) {
      var ya = c.aplicaciones && c.aplicaciones.length;
      return '<div class="fila-lote"><span class="t">' +
        '<span class="n">' + esc(c.paciente || '(sin nombre)') + '</span>' +
        '<span class="c">' + esc(soloHora_(c.inicio)) + ' · ' + esc(c.agenda) +
          (c.procedimiento ? ' · ' + esc(c.procedimiento) : '') + '</span></span>' +
        (c.retoque ? '<span class="pill p-info">retoque</span>' : '') +
        (ya ? '<span class="pill p-ok">ya aplicada</span>' : '') +
        '<button class="b-dark" data-cita="' + esc(c.id) +
          '" style="width:auto;margin:0">Escoger</button></div>';
    }).join('') +
    (APLIC.citasAviso ? '<p class="mini">' + esc(APLIC.citasAviso) + '</p>' : '');
  }

  return cab + cuerpo +
    '<button class="b-ghost" id="cSinCita" style="margin-top:8px">No está en la agenda</button></div>';
}

function cablearCita(repintar) {
  if ($('cCambiar')) $('cCambiar').onclick = function () {
    APLIC.cita = null; APLIC.cita_id = ''; APLIC.paciente = '';
    APLIC.pac = null; APLIC.pacHits = []; APLIC.pacBuscado = false;
    APLIC.pacQ = undefined; APLIC.entorno = '';
    repintar();
  };
  if ($('cSinCita')) $('cSinCita').onclick = function () {
    APLIC.sinCita = true; repintar();
  };
  if ($('cVolverAgenda')) $('cVolverAgenda').onclick = function () {
    APLIC.sinCita = false; APLIC.paciente = '';
    APLIC.pac = null; APLIC.pacHits = []; APLIC.pacBuscado = false;
    APLIC.pacQ = undefined;
    repintar();
  };
  if ($('cFecha')) $('cFecha').onchange = async function () {
    await cargarCitasAplicar(this.value); repintar();
  };
  if ($('cAyer')) $('cAyer').onclick = async function () {
    await cargarCitasAplicar(diaMas_(APLIC.fechaCitas, -1)); repintar();
  };
  if ($('cManana')) $('cManana').onclick = async function () {
    await cargarCitasAplicar(diaMas_(APLIC.fechaCitas, 1)); repintar();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-cita]'), function (b) {
    b.onclick = function () {
      var id = this.getAttribute('data-cita');
      var hallada = null;
      (APLIC.citas || []).forEach(function (c) { if (c.id === id) hallada = c; });
      if (!hallada) return;
      APLIC.cita = hallada;
      APLIC.cita_id = hallada.id;
      APLIC.paciente = hallada.paciente || '';
      APLIC.sinCita = false;
      /* Se intenta identificarla sola con el nombre de la agenda. Es una
         llamada de lectura y no bloquea: la pantalla ya sirve para poner
         lotes mientras la base contesta. */
      APLIC.pac = null; APLIC.pacHits = []; APLIC.pacBuscado = false;
      APLIC.pacQ = undefined;
      buscarIdentidad(APLIC.paciente, true, repintar);
      /* Un retoque lo marca la agenda sola: no hay por qué pedirle a nadie
         que lo declare, y preseleccionarlo evita que lo deje en pendiente
         por flojera. */
      if (hallada.retoque && !APLIC.just.tipo) APLIC.just.tipo = 'RETOQUE';
      repintar();
    };
  });
}

  PAQUETE:   ['Paquete prepagado', 'Se cobró antes, en otro folio.'],

/* =================================================================
   Quién es la paciente, y dónde se le aplicó

   Dos tarjetas que se agregan a la pantalla de aplicar, y que son el
   mismo arreglo: que el movimiento guarde llaves en vez de texto.

   IDENTIDAD. La agenda da un nombre; cobros y el expediente no buscan
   por nombre, buscan por número. Así que al escoger la cita se busca
   ese nombre en la base de pacientes y, si hay una sola que se llame
   exactamente así, se amarra sola —sin preguntar nada, porque no hay
   nada que decidir—. Si hay varias o ninguna, ahí sí se pregunta, con
   los últimos cuatro del teléfono a la vista para poder distinguirlas.

   Y si la base no se puede leer, se guarda por nombre como siempre y se
   dice por qué. Un permiso pendiente no puede impedir que se registre
   material que ya salió: eso cambiaría un problema de cuadre por un
   hueco en el kardex.

   ENTORNO. Cabina o quirófano, y no viene preseleccionado a propósito.
   Si trajera un valor por omisión, el sistema creería que alguien lo
   dijo cuando nadie lo vio, y el cruce con el expediente declararía
   faltante una nota que sí existe en Renasté. Un tap contra acusar a
   alguien de no documentar: gana el tap.
   ================================================================= */

var ENTORNO_TEXTO = {
  CABINA:    ['Cabina o consultorio', 'La nota va al expediente del consultorio.'],
  QUIROFANO: ['Quirófano', 'Con sedación. La nota va al expediente de la sede.']
};

/* ---------------- identidad de la paciente ---------------- */

function tarjetaIdentidad() {
  var quien = String(APLIC.paciente || '').trim();
  if (!quien && !APLIC.sinCita) return '';          // todavía no hay a quién buscar

  /* Ya identificada. */
  if (APLIC.pac) {
    return '<div class="card"><h3>' + esc(APLIC.pac.nombre) + '</h3>' +
      '<p class="mini mono">Nº ' + esc(APLIC.pac.id) +
        (APLIC.pac.folio ? ' · ' + esc(APLIC.pac.folio) : '') + '</p>' +
      '<p class="mini">Con esto el cobro y la nota clínica de esta aplicación se ' +
      'encuentran solos, sin depender de cómo esté escrito el nombre.</p>' +
      '<button class="b-ghost" id="pCambiar" style="margin-top:8px">No es ella</button></div>';
  }

  if (APLIC.pacBuscando) {
    return '<div class="card"><h3>Identificar a la paciente</h3>' +
      '<p class="sub">Buscándola en la base…</p></div>';
  }

  /* La base no se pudo leer. Se sigue pudiendo guardar. */
  if (APLIC.pacSinBase) {
    return '<div class="card"><h3>Identificar a la paciente</h3>' +
      '<div class="aviso a-warn">No se puede leer la base de pacientes desde aquí, ' +
      'así que esta aplicación se va a guardar con el nombre escrito, como antes. ' +
      'Se registra igual; lo único que cuesta es que el cobro y la nota se van a ' +
      'tener que amarrar a mano.</div>' +
      '<p class="mini">' + esc(APLIC.pacSinBase) + '</p></div>';
  }

  var hits = APLIC.pacHits || [];
  return '<div class="card"><h3>Identificar a la paciente</h3>' +
    '<p class="mini">Escoge a ' + esc(quien || 'la paciente') + ' de la base. De ahí ' +
    'sale su número, que es con lo que se amarra el cobro y la nota.</p>' +
    '<div class="buscador">' +
    '<input id="pBusca" autocomplete="off" placeholder="Nombre o teléfono" value="' +
      esc(APLIC.pacQ !== undefined ? APLIC.pacQ : quien) + '">' +
    '<button class="b-dark" id="pBuscar" style="width:auto;margin:0">Buscar</button></div>' +
    (APLIC.pacBuscado && !hits.length
      ? '<div class="aviso a-warn">Nadie con eso en la base. Si es paciente nueva, hay ' +
        'que darla de alta primero; mientras, se puede registrar con el nombre escrito.</div>'
      : '') +
    hits.map(function (x) {
      return '<div class="fila-lote"><span class="t">' +
        '<span class="n">' + esc(x.nombre) + '</span>' +
        '<span class="c">Nº ' + esc(x.id) +
          (x.tel4 ? ' · tel …' + esc(x.tel4) : '') +
          (x.folio ? '' : ' · sin expediente') + '</span></span>' +
        '<button class="b-dark" data-pac="' + esc(x.id) +
          '" style="width:auto;margin:0">Es ella</button></div>';
    }).join('') +
    (APLIC.pacRecortado
      ? '<p class="mini">Hay más de quince. Escribe más letras o el teléfono.</p>'
      : '') +
    '<p class="mini">Se puede guardar sin esto, pero entonces el cobro y la nota ' +
    'se amarran a mano.</p></div>';
}

/** Busca en la base. `auto` = se amarra sola si hay una sola coincidencia exacta. */
async function buscarIdentidad(q, auto, repintar) {
  var texto = String(q || '').trim();
  APLIC.pacQ = texto;
  if (texto.length < 3) {
    APLIC.pacHits = []; APLIC.pacBuscado = false;
    if (repintar) repintar();
    return;
  }

  APLIC.pacBuscando = true; APLIC.pacSinBase = '';
  if (repintar) repintar();

  var r;
  try {
    r = await enviar({ accion: 'pacientes_buscar', q: texto }, true);
  } catch (e) {
    r = { ok: false, sin_base: true, error: 'Sin señal para leer la base de pacientes.' };
  }
  APLIC.pacBuscando = false;
  APLIC.pacBuscado = true;

  if (!r.ok) {
    /* Sólo es «sin base» si de verdad no se pudo abrir. Un «escribe tres
       letras» no es eso y no debe apagar el buscador. */
    if (r.sin_base) { APLIC.pacSinBase = r.error || 'No se pudo leer la base.'; }
    APLIC.pacHits = [];
    if (repintar) repintar();
    return;
  }

  APLIC.pacHits = r.pacientes || [];
  APLIC.pacRecortado = !!r.recortado;

  /* Amarre automático: una sola, y con el nombre idéntico al de la agenda.
     Si el nombre no es idéntico no se amarra solo aunque haya una sola
     candidata — «Ana Lopez» contra «Ana Lopez Garcia» puede ser otra
     persona, y adivinar aquí es exactamente lo que vinimos a quitar. */
  if (auto && APLIC.pacHits.length === 1 &&
      plano(APLIC.pacHits[0].nombre) === plano(texto)) {
    APLIC.pac = APLIC.pacHits[0];
    APLIC.pacHits = [];
  }
  if (repintar) repintar();
}

function cablearIdentidad(repintar) {
  if ($('pCambiar')) $('pCambiar').onclick = function () {
    APLIC.pac = null; APLIC.pacHits = []; APLIC.pacBuscado = false;
    APLIC.pacQ = String(APLIC.paciente || '');
    repintar();
  };
  if ($('pBuscar')) $('pBuscar').onclick = function () {
    buscarIdentidad($('pBusca').value, false, repintar);
  };
  if ($('pBusca')) $('pBusca').onkeydown = function (e) {
    if (e.key === 'Enter') { e.preventDefault(); buscarIdentidad(this.value, false, repintar); }
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-pac]'), function (b) {
    b.onclick = function () {
      var id = this.getAttribute('data-pac');
      (APLIC.pacHits || []).forEach(function (x) { if (String(x.id) === id) APLIC.pac = x; });
      /* El nombre que se guarda es el de la base, no el de la agenda: es el
         que está en el expediente, y es el que hay que poder leer después. */
      if (APLIC.pac && APLIC.pac.nombre) APLIC.paciente = APLIC.pac.nombre;
      APLIC.pacHits = [];
      repintar();
    };
  });
}

function cablearEntorno(repintar) {

      (j.cobro

  }

  return '<div class="card"><h3>¿Por qué sale del almacén?</h3>' +
    '<p class="mini">' + (j.tipo ? esc(JUST_TEXTO[j.tipo][1])

function cablearJustificacion(repintar) {
  var j = APLIC.just;

  function recordarJ() {
    if ($('jFolio')) j.folio_cobro = $('jFolio').value.trim();
    if ($('jMonto')) j.monto = $('jMonto').value.trim();
    if ($('jOrig')) j.folio_original = $('jOrig').value.trim();
    if ($('jNota')) j.nota = $('jNota').value.trim();
  }
  APLIC.recordarJ = recordarJ;

  Array.prototype.forEach.call(document.querySelectorAll('[data-just]'), function (b) {
    b.onclick = function () {
      recordarJ();
      var k = this.getAttribute('data-just');
      j.tipo = (j.tipo === k) ? '' : k;
      j.cobro = null; j.cobros = null; j.buscado = false;
      repintar();
    };
  });

  function alTeclear() { recordarJ(); actualizarFalta(); }
  if ($('jFolio')) $('jFolio').oninput = alTeclear;
  if ($('jMonto')) $('jMonto').oninput = alTeclear;
  if ($('jOrig')) $('jOrig').oninput = alTeclear;
  if ($('jNota')) $('jNota').oninput = alTeclear;

  if ($('jBuscar')) $('jBuscar').onclick = async function () {
    recordarJ();
    var quien = APLIC.paciente || (APLIC.cita && APLIC.cita.paciente) || '';
    if (!quien) return alertar('Primero escoge la cita, para saber de quién buscar el cobro.');
    j.buscando = true; repintar();
    try {
      var r = await enviar({ accion: 'cobro_buscar', paciente: quien,
                             fecha: APLIC.fechaCitas || hoyFront_() }, true);
      j.cobros = r.ok ? r.cobros : [];
      if (!r.ok) alertar(r.error);
    } catch (e) {
      j.cobros = []; alertar('Sin señal para buscar el cobro.');
    }
    j.buscando = false; j.buscado = true; repintar();
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-cobro]'), function (b) {
    b.onclick = function () {
      recordarJ();
      var folio = this.getAttribute('data-cobro');
      (j.cobros || []).forEach(function (c) { if (c.folio === folio) j.cobro = c; });
      j.folio_cobro = folio;
      repintar();
    };
  });
}

/* El botón de guardar y el aviso de «falta esto» se refrescan sin
   repintar: teclear un folio a mano tiene que habilitar el botón en el
   momento, no hasta que algo más provoque un repintado. */
function actualizarFalta() {
  var falta = faltaParaAplicar();
  var b = $('aGuardar');
  if (b) b.disabled = !!falta;
  var a = $('aFalta');
  if (a) {
    a.textContent = falta;
    a.style.display = falta ? '' : 'none';
  }
}

/** Lo que falta para poder guardar. Cadena vacía si todo está. */
function faltaParaAplicar() {
  var j = APLIC.just || {};
  if (!APLIC.cita_id && !APLIC.sinCita) return 'Falta escoger la cita.';
  if (APLIC.sinCita && !String(APLIC.paciente || '').trim()) return 'Falta el nombre de la paciente.';
  if (!APLIC.entorno) return 'Falta decir si fue en cabina o en quirófano.';
  if (!APLIC.lineas.length) return 'No has puesto nada.';
  if (!j.tipo) return 'Falta decir por qué sale del almacén.';
  if ((j.tipo === 'FOLIO' || j.tipo === 'PAQUETE') && !String(j.folio_cobro || '').trim()) {
    return 'Falta el folio de cobro.';
  }
  if (j.tipo === 'DIRECTO' && !(Number(j.monto) > 0)) return 'Falta cuánto cobró.';
  return '';
}

/* ---------------- el tablero de cuadre ---------------- */

/* Cierra de un golpe las pendientes que traen propuesta inequívoca.
   Nunca manda las de «revisar»: ésas son justo las que necesitan a alguien
   decidiendo, y meterlas aquí convertiría el botón en una forma elegante
   de justificar mal catorce cosas a la vez. */
async function cerrarLoteCuadre(r, dia) {
  var listas = (r.sin_justificar || []).filter(function (a) {
    return a.confianza === 'ALTA' && a.sugerencia;
  });
  if (!listas.length) return alertar('No hay ninguna con propuesta clara.');

  var texto = listas.map(function (a) {
    return '· ' + (a.paciente || '(sin paciente)') + ' → ' + a.sugerencia.folio_cobro;
  }).join('\n');
  if (!confirm('Se van a justificar ' + listas.length + ' aplicación(es):\n\n' + texto +
               '\n\nQueda registrado a su nombre. ¿Seguimos?')) return;

  $('kLote').disabled = true;
  $('kLote').textContent = 'Justificando…';
  try {
    var res = await enviar({ accion: 'justificar_lote',
      filas: listas.map(function (a) {
        return { folio: a.folio, tipo: a.sugerencia.tipo,
                 folio_cobro: a.sugerencia.folio_cobro,
                 nota: 'Propuesta por el sistema y aceptada en lote',
                 client_id: idCliente() + '-' + a.folio };
      }) }, true);
    if (!res.ok) { $('kLote').disabled = false; return alertar(res.error); }
    alertar(res.mensaje);
    if ((res.fallidas || []).length) {
      alertar(res.fallidas.map(function (f) { return f.folio + ': ' + f.error; }).join(' · '));
    }
    pantallaCuadre(dia);
  } catch (e) {
    $('kLote').disabled = false;
    $('kLote').textContent = 'Justificar las que están claras';
    alertar('Sin conexión. No se justificó nada.');
  }
}

    '<button class="b-ghost" id="kManana" style="width:auto;margin:0">▶</button></div>' +

      s.citas_inyectable + ' cita(s) de inyectable</p></div>' +

    (r.cobros_ok ? '' :
      '<div class="aviso a-warn">No se pudo leer el sistema de cobros, así que el ' +
      'cruce contra cobros de este día no es confiable.</div>') +
    (r.agenda_ok ? '' :
      '<div class="aviso a-warn">La agenda no contestó: lo que falte de citas no quiere ' +
      'decir que no las hubo.</div>') +
    (r.avisos || []).map(function (a) {
      return '<div class="aviso a-info">' + esc(a) + '</div>';
    }).join('') +

    (limpio ? '<div class="aviso a-ok">Todo cuadra este día.</div>' : '') +

    (s.sugeridas
      ? '<div class="card"><h3>' + s.sugeridas + ' se pueden cerrar de un clic</h3>' +
        '<p class="mini">De cada una hay <b>un solo cobro</b> de esa paciente ese día, ' +

        '<button class="b-primary" id="kLote">Justificar las ' + s.sugeridas +

      : '') +

    bloque('Salidas sin justificar',
      'Salió material y nadie dijo por qué. Es el hueco que hay que cerrar.',
      r.sin_justificar, function (a) {
        var pr = a.sugerencia;
        return '<div class="fila-lote"><span class="t">' +

          '<span class="c">' + esc(a.folio) + ' · ' + esc(a.hora) + ' · ' + esc(a.ubic_nombre) +
            (a.problema ? ' · ' + esc(a.problema) : '') +
            (pr ? ' · propone <b>' + esc(pr.folio_cobro) + '</b>' : '') +
            (a.sugerencia_nota && !pr ? ' · ' + esc(a.sugerencia_nota) : '') +

          (a.confianza === 'ALTA' ? '<span class="pill p-ok">clara</span>'

          '<span class="c">' + esc(c.folio) + ' · ' + esc(c.condicion) + ' · ' + pesos(c.monto) +
          '</span></span>' +

          '<span class="n">' + esc(a.paciente) + ' · ' + a.piezas + ' pieza(s)</span>' +
          '<span class="c">' + esc(a.folio) + ' · ' + esc(a.hora) + '</span></span></div>';

          '<span class="n">' + esc(a.paciente) + ' · ' + a.piezas + ' pieza(s)</span>' +
          '<span class="c">' + esc(a.folio) + ' · ' + esc(a.folio_cobro) + '</span></span></div>';
      }) +

    bloque('Anticipos sin aplicación',
      'Se cobró por adelantado. No es un faltante: todavía no toca aplicar nada.',
      (r.cobros_sin_aplicacion || []).filter(function (c) { return c.anticipo; }),
      function (c) {
        return '<div class="fila-lote"><span class="t">' +
