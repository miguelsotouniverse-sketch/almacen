<script>
/* Red de seguridad, antes que cualquier otra cosa.
   Vive aparte y arriba para que sobreviva a un error del script grande.

   Dos reglas aprendidas a golpes:
   1. Solo se adueña de la pantalla si la app NUNCA logro pintar nada. Si la
      app ya esta funcionando, un error suelto no debe borrarle la pantalla al
      usuario: se avisa discreto abajo y ya.
   2. Reiniciar SIEMPRE recarga, aunque borrar el service worker se atore.
      Sin el reloj de abajo, en algunos telefonos "Reiniciar" no hacia nada. */
(function () {
  window.__appViva = false;

  function chico(txt) {
    var v = document.getElementById('msu_avisoErr');
    if (!v) {
      v = document.createElement('div');
      v.id = 'msu_avisoErr';
      v.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;' +
        'background:#A33F30;color:#fff;padding:11px 13px;border-radius:9px;' +
        'font:13px -apple-system,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)';
      (document.body || document.documentElement).appendChild(v);
    }
    v.innerHTML = '<span style="word-break:break-word">' +
      String(txt || '').replace(/[<>&]/g, ' ') + '</span>' +
      '<a href="?reiniciar=1" style="color:#fff;text-decoration:underline;margin-left:10px;' +
      'white-space:nowrap">Reiniciar</a>';
  }

  function grande(txt) {
    var d = document.getElementById('app') || document.body;
    if (!d || d.getAttribute('data-fallo')) return;
    d.setAttribute('data-fallo', '1');
    d.innerHTML =
      '<div style="padding:20px;font:16px -apple-system,system-ui,sans-serif;color:#0C0E0D">' +
      '<p style="font-weight:600;margin:0 0 8px">La app no pudo arrancar.</p>' +
      '<p style="color:#6E736F;font-size:14px;margin:0 0 18px;word-break:break-word">' +
      String(txt || '').replace(/[<>&]/g, ' ') + '</p>' +
      '<p style="margin:0 0 10px"><a href="?reiniciar=1" style="display:block;text-align:center;' +
      'background:#0C0E0D;color:#F4F2F1;padding:14px;border-radius:9px;text-decoration:none">' +
      'Reiniciar la app</a></p>' +
      '<p style="margin:0"><a href="?n=' + Date.now() + '" style="display:block;text-align:center;' +
      'border:1px solid #D8D2CC;color:#3D423F;padding:14px;border-radius:9px;text-decoration:none">' +
      'Volver a intentar</a></p></div>';
  }

  function reportar(txt) {
    if (window.__appViva) chico(txt); else grande(txt);
  }

  window.addEventListener('error', function (e) {
    reportar((e.message || 'Error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    reportar(String((e.reason && e.reason.message) || e.reason || 'Promesa rechazada'));
  });

  /* Borron y cuenta nueva: quita el service worker y los caches y recarga.
     NO toca la sesion: no hay que volver a entrar con Google. */
  window.reiniciarApp = function () {
    var yaFue = false;
    function irse() {
      if (yaFue) return;
      yaFue = true;
      location.replace(location.pathname + '?n=' + Date.now());
    }
    setTimeout(irse, 2500);   // pase lo que pase, recarga

    var pasos = [];
    try {
      if ('serviceWorker' in navigator && navigator.serviceWorker) {
        pasos.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        pasos.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (err) { /* si algo de esto no existe, igual recargamos */ }
    Promise.all(pasos).catch(function () {}).then(irse);
  };

  if (/[?&]reiniciar=1/.test(location.search)) {
    document.addEventListener('DOMContentLoaded', function () {
      var d = document.getElementById('app');
      if (d) d.innerHTML = '<p style="padding:20px;font:16px -apple-system,system-ui,sans-serif;' +
        'color:#6E736F">Reiniciando la app…</p>';
    });
    window.reiniciarApp();
  }
})();
</script>
<style>
:root{
  --ground:#F4F2F1;--surface:#FFFFFF;--surface-2:#EDEAE7;
  --ink:#0C0E0D;--ink-2:#3D423F;--ink-3:#6E736F;
  --rule:#D8D2CC;--rule-soft:#E6E1DC;
  --accent:#A19487;--accent-deep:#6B5D51;
  --ok:#3F6F52;--warn:#B5842B;--crit:#A33F30;--info:#3C5F79;
  --tint-ok:rgba(63,111,82,.10);--tint-warn:rgba(181,132,43,.13);
  --tint-crit:rgba(163,63,48,.10);--tint-info:rgba(60,95,121,.10);
  --tint-accent:rgba(161,148,135,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#F4F2F1;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header .fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
header .marca{display:flex;align-items:center;gap:13px;min-width:0}
header .ms{height:34px;width:auto;flex:none;opacity:.95}
header .t{font-weight:500;font-size:1.02rem;line-height:1.2}
header .s{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:#9AA09C;margin-top:2px}
.estado{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.05em;
  padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.1);white-space:nowrap}
.estado.pend{background:var(--tint-warn);color:#E0B369}
.estado.off{background:var(--tint-crit);color:#E4998A}

main{padding:16px 16px 40px;max-width:680px;margin:0 auto}
h2{font-size:1.15rem;font-weight:500;margin:0 0 12px}
p{margin:0 0 12px}
.sub{color:var(--ink-3);font-size:.9rem}
.mini{font-size:.82rem;color:var(--ink-3)}
.centro{text-align:center}
.oculto{display:none!important}
.espacio{height:10px}
.foto-prev{width:100%;max-height:260px;object-fit:contain;border-radius:8px;
  border:1px solid var(--rule);background:var(--surface-2);margin-top:8px}
.foto-mini{width:44px;height:44px;object-fit:cover;border-radius:6px;
  border:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto}
.sin-foto{width:44px;height:44px;border-radius:6px;border:1px dashed var(--rule);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:.62rem;color:var(--ink-3);text-align:center;line-height:1.1}
.fila-sku{display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--rule);width:100%;background:none;border-left:0;
  border-right:0;border-top:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer}
.fila-sku:last-child{border-bottom:0}
.fila-lote{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--rule);width:100%;background:none;border-left:0;
  border-right:0;border-top:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer}
.fila-lote:last-of-type{border-bottom:0}
.fila-lote .t{flex:1;min-width:0;display:block}
.fila-lote .t .n{display:block;font-size:.88rem}
.fila-lote .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.05em;color:var(--ink-3);margin-top:3px}
.fila-sku .t{flex:1;min-width:0;display:block}
.fila-sku .t .n{display:block;font-size:.93rem;line-height:1.25}
.fila-sku .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;
  letter-spacing:.06em;color:var(--ink-3);margin-top:3px}
.g-caja{display:flex;justify-content:center;margin:16px 0 8px;min-height:44px}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:1rem;font-weight:500}

label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--rule);
  border-radius:8px;background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:16px;font-weight:300}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);
  outline-offset:1px;border-color:var(--accent)}
.campo{margin-bottom:13px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}

button{font-family:inherit;font-size:1rem;font-weight:500;border:0;border-radius:9px;
  padding:14px;cursor:pointer;width:100%}
.b-primary{background:var(--accent);color:#15100C}
.b-dark{background:var(--ink);color:#F4F2F1}
.b-ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.b-fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button:disabled{opacity:.5}
button+button{margin-top:9px}
.b-fila button+button{margin-top:0}

.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  padding:3px 8px;border-radius:3px;letter-spacing:.05em}
.p-ok{background:var(--tint-ok);color:var(--ok)}
.p-warn{background:var(--tint-warn);color:var(--warn)}
.p-crit{background:var(--tint-crit);color:var(--crit)}
.p-info{background:var(--tint-info);color:var(--info)}
.p-neutral{background:var(--surface-2);color:var(--ink-3)}

.aviso{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
.a-ok{background:var(--tint-ok);color:var(--ok)}
.a-err{background:var(--tint-crit);color:var(--crit)}
.a-warn{background:var(--tint-warn);color:var(--warn)}
.a-info{background:var(--tint-accent);color:var(--accent-deep)}

.lista .item{display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.lista .item:last-child{border-bottom:0}
.lista .item .l{min-width:0}
.lista .item .l span{display:block;font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;color:var(--ink-3);letter-spacing:.06em}
.lista .item .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}

.linea{border:1px solid var(--rule);border-radius:9px;padding:12px 13px;margin-bottom:10px;
  background:var(--surface)}
.linea .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  margin-bottom:6px}
.linea .cab .nm{font-weight:500;font-size:.94rem;line-height:1.25}
.linea .datos{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-3);
  line-height:1.6}
.linea .quitar{width:auto;padding:5px 10px;font-size:.72rem;background:transparent;
  border:1px solid var(--rule);color:var(--ink-3);border-radius:6px;flex:0 0 auto}

/* Un renglón de la lista que se puede abrir. El área de toque es todo el
   renglón, no un botoncito: esto se usa de pie y con guantes. */
.lista .item-abre{cursor:pointer;padding-left:4px;padding-right:4px;
  border-radius:7px;transition:background .12s}
.lista .item-abre:active{background:var(--surface-2)}
.lista .item-abre .l span::after{content:' ›';color:var(--ink-3)}

.linea .dest{margin-top:8px;font-size:.86rem;padding:9px 11px}

.folio-lote{background:var(--ink);color:#F4F2F1;border-radius:9px;padding:13px 15px;
  margin-bottom:9px}
.folio-lote .n{font-family:'IBM Plex Mono',monospace;font-size:1.15rem;font-weight:600}
.folio-lote .d{font-size:.8rem;color:#9AA09C;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script>
/* =================================================================
   Almacén MS Universe — recepción de compras y existencias
   Zorvix arranca en cero: todo lo que exista entra por aquí.
   ================================================================= */

/* La URL del gateway no es secreto: sin una sesión válida no responde nada.
   Vivir aquí es lo que permite que la app abra directo en Google, sin
   pantalla de configuración en cada teléfono. */
var GATEWAY = 'https://script.google.com/macros/s/AKfycbz0VFVwemsK8M2_nqwp-0zMcGuhicVCn5xIwlG1hPAaEnvh7XUdxwvX5AhrhAje3sRggg/exec';

var COLA_KEY = 'msu_alm_cola';
var SES_KEY = 'msu_alm_sesion';
var CAT_KEY = 'msu_alm_cat';

var estado = {
  sesion: leer(SES_KEY, null),
  cat: leer(CAT_KEY, null),
  cabecera: null,
  lineas: []
};

function leer(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function escribir(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function pintar(html) {
  $('app').innerHTML = html;
  /* La app logro pintar: de aqui en adelante un error suelto ya no le borra
     la pantalla al usuario, solo sale el aviso chico de abajo. */
  window.__appViva = true;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
function idCliente() {
  return 'c' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}
function encabezado(t, s) { $('hTitulo').textContent = t; $('hSub').textContent = s || 'MS Universe'; }

function alertar(msg) {
  var d = document.createElement('div');
  d.className = 'aviso a-info';
  d.textContent = msg;
  $('app').prepend(d);
  setTimeout(function () { d.remove(); }, 4000);
}

/* ---------- fotos de insumos ----------
   La foto contesta la única pregunta que el nombre no contesta: «¿esto es
   lo que tengo en la mano?». Quien recibe no siempre conoce el producto, y
   un nombre de catálogo mal leído se convierte en un lote mal capturado.

   Las fotos viven en el Drive privado del dueño del script y se sirven por
   el gateway, que ya validó la sesión. Por eso se piden de una en una y
   sólo cuando alguien las abre: el catálogo manda tiene_foto, no la liga.
   ------------------------------------------------------------------- */
function comprimir(file, cb) {
  var lector = new FileReader();
  lector.onload = function (ev) {
    var img = new Image();
    img.onload = function () {
      var max = 1280;
      var escala = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { alertar('Ese archivo no se pudo leer como imagen.'); };
    img.src = ev.target.result;
  };
  lector.onerror = function () { alertar('No se pudo leer el archivo.'); };
  lector.readAsDataURL(file);
}

/* Memoria de la sesión: abrir el mismo insumo dos veces no vuelve a bajar
   la foto. Se pierde al recargar, que es justo lo que se quiere. */
var FOTOS = {};

async function traerFoto(sku) {
  var k = String(sku).toUpperCase();
  if (FOTOS[k]) return FOTOS[k];
  var r = await enviar({ accion: 'sku_foto', sku: k }, true);
  if (r && r.ok && r.imagen) { FOTOS[k] = r.imagen; return r.imagen; }
  throw new Error((r && r.error) || 'No se pudo traer la foto.');
}

function marcarConFoto(sku) {
  var k = String(sku).toUpperCase();
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === k) s.tiene_foto = true;
  });
}

/* ---------- cola offline ---------- */
function cola() { return leer(COLA_KEY, []); }
function encolar(payload) {
  var c = cola(); c.push(payload);
  try { localStorage.setItem(COLA_KEY, JSON.stringify(c)); pintarEstado(); return true; }
  catch (e) {
    alertar('El teléfono ya no puede guardar más pendientes. Busca señal antes de seguir.');
    return false;
  }
}
function quitarDeCola(id) {
  escribir(COLA_KEY, cola().filter(function (x) { return x.client_id !== id; }));
  pintarEstado();
}
async function vaciarCola() {
  var p = cola();
  if (!p.length || !navigator.onLine) return;
  for (var i = 0; i < p.length; i++) {
    try {
      var r = await enviar(p[i], true);
      if (r && r.ok) quitarDeCola(p[i].client_id); else break;
    } catch (e) { break; }
  }
}
function pintarEstado() {
  var e = $('hEstado'), pend = cola().length;
  if (!navigator.onLine) { e.textContent = '● sin señal'; e.className = 'estado off'; }
  else if (pend) { e.textContent = '● ' + pend + ' por enviar'; e.className = 'estado pend'; }
  else { e.textContent = '● en línea'; e.className = 'estado'; }
}

/* ---------- transporte ---------- */
async function enviar(payload, sinEncolar) {
  if (!payload.client_id) payload.client_id = idCliente();
  if (estado.sesion && estado.sesion.sesion) payload.sesion = estado.sesion.sesion;
  try {
    var res = await fetch(GATEWAY, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    var datos = await res.json();
    // Si la sesión murió, no tiene caso seguir: se limpia y se pide Google.
    if (datos && datos.ok === false && MOTIVOS_SESION[datos.error]) {
      cerrarSesion(MOTIVOS_SESION[datos.error]);
    }
    return datos;
  } catch (err) {
    if (!sinEncolar && payload.encolable) { encolar(payload); return { ok: true, encolado: true }; }
    throw err;
  }
}

/* =================================================================
   Sesión
   ================================================================= */

/** La sesión se acabó o la revocaron: limpiar y volver a la puerta. */
function cerrarSesion(msg) {
  estado.sesion = null;
  escribir(SES_KEY, null);
  pantallaLogin(msg);
}

var MOTIVOS_SESION = {
  SIN_SESION:      'Entra con tu cuenta de Google.',
  SESION_INVALIDA: 'Tu sesión ya no es válida. Vuelve a entrar.',
  SESION_EXPIRADA: 'Tu sesión caducó. Vuelve a entrar con Google.',
  SESION_REVOCADA: 'Tu acceso al almacén fue dado de baja. Habla con el director.'
};

/* ---------- Google Identity ---------- */
var GIS_LISTO = null;

function cargarGIS() {
  if (GIS_LISTO) return GIS_LISTO;
  GIS_LISTO = new Promise(function (ok, falla) {
    if (window.google && google.accounts && google.accounts.id) return ok();
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function () { ok(); };
    s.onerror = function () { GIS_LISTO = null; falla(new Error('No se pudo cargar Google')); };
    document.head.appendChild(s);
  });
  return GIS_LISTO;
}

async function entrarConGoogle(credencial) {
  var r = await enviar({ accion: 'login_google', idToken: credencial,
                         dispositivo: navigator.userAgent }, true);
  if (!r.ok) return pantallaLogin(r.error);
  // La identidad que firma cada movimiento es el correo verificado por Google,
  // no un nombre escrito a mano. La sesión la emite nuestro backend.
  estado.sesion = { sesion: r.sesion, usuario: r.correo || r.usuario,
                    nombre: r.nombre, rol: r.rol, via: r.via };
  escribir(SES_KEY, estado.sesion);
  await cargarCat();
  pantallaInicio();
}

function pantallaLogin(msg) {
  encabezado('Entrar', 'Almacén');
  pintar((msg ? '<div class="aviso a-err">' + esc(msg) + '</div>' : '') +
    '<div class="card">' +
    '<p class="sub">Entra con la cuenta de Google que tengas dada de alta en el almacén. ' +
    'Cada movimiento queda firmado con ese correo.</p>' +
    '<div id="gBtn" class="g-caja"></div>' +
    '<div id="gMsg" class="mini"></div></div>');
  prepararBotonGoogle();
}

async function prepararBotonGoogle() {
  var msg = $('gMsg');
  try {
    if (!window.isSecureContext) {
      msg.innerHTML = 'Esta página tiene que abrirse con <b>https://</b> para poder entrar con Google.';
      return;
    }
    var cfg = await enviar({ accion: 'config_publica' }, true);
    if (!cfg.ok || !cfg.google_activo) {
      msg.textContent = 'Falta configurar GOOGLE_CLIENT_ID en el gateway.';
      return;
    }
    await cargarGIS();
    google.accounts.id.initialize({
      client_id: cfg.google_client_id,
      callback: function (resp) {
        $('gMsg').textContent = 'Verificando…';
        entrarConGoogle(resp.credential).catch(function () {
          pantallaLogin('Sin conexión. Intenta de nuevo.');
        });
      }
    });
    google.accounts.id.renderButton($('gBtn'), {
      theme: 'outline', size: 'large', shape: 'pill',
      text: 'signin_with', locale: 'es', width: 260
    });
    msg.textContent = '';
  } catch (e) {
    msg.textContent = 'No se pudo contactar a Google. Revisa tu conexión.';
  }
}

async function cargarCat() {
  try {
    var r = await enviar({ accion: 'cat_insumos' }, true);
    if (r && r.ok) { estado.cat = r; escribir(CAT_KEY, r); }
  } catch (e) { estado.cat = leer(CAT_KEY, null); }
}

/* =================================================================
   Inicio
   ================================================================= */
function pantallaInicio() {
  encabezado('Almacén', estado.sesion ? estado.sesion.nombre : '');
  var c = estado.cat || { catalogo: [], almacenes: [] };
  pintar(
    '<div class="card"><h3>Recepción de compra</h3>' +
    '<p class="sub">Todo lo que entra al almacén pasa por aquí. Cada renglón crea un lote con su folio, su caducidad y su costo.</p>' +
    '<button class="b-primary" id="bNueva">Nueva recepción</button></div>' +

    (etiquetasPendientes().length
      ? '<div class="card"><h3>Etiquetas sin imprimir</h3>' +
        '<p class="sub">Hay <b>' + etiquetasPendientes().length + '</b> folio(s) capturados que ' +
        'todavía no se imprimen. Se imprimen todos juntos en una hoja.</p>' +
        '<button class="b-dark" id="bEtqPend">Imprimir etiquetas pendientes</button></div>'
      : '') +

    '<div class="card"><h3>Cajas de cirugía</h3>' +
    '<p class="sub">El material sale del almacén a una caja, va a quirófano y a hospitalización, y regresa. Se descuenta al alta, no antes.</p>' +
    '<button class="b-dark" id="bCajas">Abrir o ver cajas</button></div>' +

    '<div class="card"><h3>Catálogo</h3>' +
    '<p class="sub">Qué es cada insumo, con foto. Si no reconoces algo que tienes en la mano, búscalo aquí antes de capturarlo.</p>' +
    '<button class="b-dark" id="bCatalogo">Ver catálogo y fotos</button></div>' +

    '<div class="card"><h3>Consulta</h3>' +
    '<div class="b-fila">' +
    '<button class="b-dark" id="bExist">Existencias</button>' +
    '<button class="b-ghost" id="bLotes">Lotes y bajas</button></div>' +
    '<div class="espacio"></div>' +
    '<button class="b-ghost" id="bSinFecha">Folios sin caducidad</button></div>' +

    '<div class="card"><div class="lista">' +

/* =================================================================
   Recepción — paso 1: cabecera

function hoyISO() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' +
         String(d.getDate()).padStart(2, '0');
}

function pantallaCabecera() {
  encabezado('Nueva recepción', 'Datos de la compra');
  var c = estado.cat;

  var optAlm = c.almacenes.map(function (a) {
    return '<option value="' + esc(a.id) + '"' + (cab.almacen === a.id ? ' selected' : '') + '>' + esc(a.nombre) + '</option>';
  }).join('');
  var optComp = (c.comprobantes || []).map(function (x) {
    return '<option' + (cab.comprobante === x ? ' selected' : '') + '>' + esc(x) + '</option>';
  }).join('');
  var provs = (c.proveedores || []).map(function (p) {
    return '<option value="' + esc(p) + '">'; }).join('');

    '<div class="campo"><label>Fecha de recepción</label><input id="kFecha" type="date" value="' + esc(cab.fecha || hoyISO()) + '"></div>' +
    '<div class="campo"><label>Proveedor</label><input id="kProv" list="lprov" value="' + esc(cab.proveedor || '') + '">' +
    '<datalist id="lprov">' + provs + '</datalist></div>' +
    '<div class="dos">' +
    '<div class="campo"><label>Comprobante</label><select id="kComp">' + optComp + '</select></div>' +
    '<div class="campo"><label>Folio fiscal</label><input id="kFolio" placeholder="UUID" value="' + esc(cab.folio_fiscal || '') + '"></div>' +
    '</div>' +
    '<p class="mini">Si la factura llega después, elige PENDIENTE y captura el folio cuando la tengas. El material entra igual: lo que existe físicamente siempre está en el sistema.</p>' +
    '</div>' +
    '<button class="b-primary" id="bSig">Continuar a los renglones</button>' +
    '<button class="b-ghost" id="bCanc">Cancelar</button>');

  $('bCanc').onclick = function () { estado.cabecera = null; estado.lineas = []; pantallaInicio(); };

function pantallaLineas() {
  encabezado('Renglones', 'Uno por lote, no por producto');
  var c = estado.cat;
  var opciones = c.catalogo.map(function (s) {
    return '<option value="' + esc(s.sku) + '">' + esc(s.sku + ' · ' + s.nombre) + '</option>';
  }).join('');

  var listaHTML = estado.lineas.map(function (l, i) {
    return '<div class="linea"><div class="cab"><div>' +
      '<div class="nm">' + esc(l.nombre) + '</div>' +
      '<div class="datos">' + esc(l.sku) + ' · lote ' + esc(l.lote_proveedor || '—') +
      ' · cad ' + esc(l.caducidad || '—') + '<br>' +
      esc(l.cantidad) + ' ' + esc(l.unidad_base || '') +

  pintar(

    '<p class="mini">Si el mismo producto llega en dos lotes o con dos caducidades, son dos renglones. Es lo único que después permite rastrear qué lote se usó en qué paciente.</p>' +
    '<div class="campo"><label>Producto</label>' +
    '<input id="rSku" list="lsku" placeholder="Escribe o elige el código">' +
    '<datalist id="lsku">' + opciones + '</datalist></div>' +
    '<p class="mini" id="rPista">¿No reconoces lo que tienes en la mano? Escribe el código y aquí aparece su foto.</p>' +
    '<img id="rFoto" class="foto-prev oculto" alt="">' +
    '<div class="dos">' +
    '<div class="campo"><label>Lote del fabricante</label><input id="rLote"></div>' +
    '<div class="campo"><label>Caducidad</label><input id="rCad" type="date"></div>' +
    '</div>' +
    '<div class="dos">' +
    '<div class="campo"><label>Cantidad (unidad base)</label><input id="rCant" type="number" inputmode="decimal" min="0" step="any"></div>' +
    '<div class="campo"><label>Costo unitario real</label><input id="rCosto" type="number" inputmode="decimal" min="0" step="any" placeholder="Déjalo vacío si aún no sabes"></div>' +
    '</div>' +
    '<p class="mini">Si el proveedor todavía no manda precios, deja el costo vacío. El lote entra igual y queda marcado para costearlo después. Vacío no es cero.</p>' +
    '<div class="campo"><label>Costo fiscal (si es distinto)</label><input id="rFiscal" type="number" inputmode="decimal" min="0" step="any" placeholder="Igual al real si lo dejas vacío"></div>' +
    '<button class="b-dark" id="bAdd">Agregar renglón</button>' +
    '<div class="espacio"></div>' +
    '<button class="b-ghost" id="bNuevoSku">El producto no está en el catálogo</button>' +
    '</div>' +

    (estado.lineas.length
      ? '<div class="card"><h3>' + estado.lineas.length + ' renglón' + (estado.lineas.length > 1 ? 'es' : '') + ' capturado' + (estado.lineas.length > 1 ? 's' : '') + '</h3>' + listaHTML + '</div>'
      : '<div class="card"><p class="sub centro">Todavía no hay renglones.</p></div>') +

    '<button class="b-primary" id="bGuardar"' + (estado.lineas.length ? '' : ' disabled') + '>Guardar recepción</button>' +
    '<button class="b-ghost" id="bAtras">Volver a los datos de la compra</button>');

  $('bAtras').onclick = function () { pantallaCabecera(); };
  $('bNuevoSku').onclick = function () { pantallaSkuNuevo(); };

  /* La foto del insumo elegido se muestra sola, sin un botón más que picar:
     quien recibe tiene las manos ocupadas con la caja. */
  $('rSku').onchange = function () {
    var sku = this.value.trim().toUpperCase();
    var art = null;
    c.catalogo.forEach(function (s) { if (String(s.sku).toUpperCase() === sku) art = s; });
    var img = $('rFoto'), nota = $('rPista');
    img.classList.add('oculto');
    if (!art) { nota.textContent = 'Ese código todavía no está en el catálogo.'; return; }
    if (!art.tiene_foto) {
      nota.textContent = art.nombre + ' · sin foto. Puedes agregarla desde el catálogo.';
      return;
    }
    nota.textContent = art.nombre;
    traerFoto(art.sku).then(function (b64) {
      if ($('rSku') && $('rSku').value.trim().toUpperCase() !== sku) return;  /* ya cambió de producto */
      img.src = b64; img.classList.remove('oculto');
    }).catch(function () { nota.textContent = art.nombre + ' · no se pudo traer la foto.'; });
  };

  Array.prototype.forEach.call(document.querySelectorAll('.quitar'), function (b) {
    b.onclick = function () {
      estado.lineas.splice(parseInt(this.getAttribute('data-i'), 10), 1);
      pantallaLineas();
    };
  });

  $('bAdd').onclick = function () {
    var sku = $('rSku').value.trim().toUpperCase();
    var art = null;
    c.catalogo.forEach(function (s) { if (String(s.sku).toUpperCase() === sku) art = s; });
    if (!art) return alertar('Ese código no está en el catálogo. Usa el botón de abajo para darlo de alta.');

    var cant = parseFloat($('rCant').value);
    if (!cant || cant <= 0) return alertar('Falta la cantidad.');
    /* El costo puede faltar: se captura hoy y se cuesta cuando llegue la
       factura. Vacío se manda vacío, no cero, para poder encontrarlo después. */
    var crudoCosto = $('rCosto').value.trim();
    var costo = crudoCosto === '' ? '' : parseFloat(crudoCosto);
    if (costo !== '' && (isNaN(costo) || costo < 0))
      return alertar('El costo unitario no es un número válido.');

    var crudoFiscal = $('rFiscal').value.trim();
    var fiscal = crudoFiscal === '' ? costo : parseFloat(crudoFiscal);
    if (fiscal !== '' && isNaN(fiscal))
      return alertar('El costo fiscal no es un número válido.');

    if (art.nivel !== 'N3' && !$('rCad').value) {
      if (!confirm('Este insumo se controla por lote y no capturaste caducidad. ¿Agregar de todos modos?')) return;
    }

    estado.lineas.push({
      sku: art.sku, nombre: art.nombre, unidad_base: art.unidad_base,
      lote_proveedor: $('rLote').value.trim(), caducidad: $('rCad').value,
      cantidad: cant, costo_unitario: costo, costo_fiscal: fiscal
    });
    pantallaLineas();
  };

  $('bGuardar').onclick = async function () {
    this.disabled = true; this.textContent = 'Guardando…';
    var payload = {
      accion: 'recepcion_guardar', encolable: true, client_id: idCliente(),
      cabecera: estado.cabecera, lineas: estado.lineas
    };
    try {
      var r = await enviar(payload);
      if (r.ok === false) {
        this.disabled = false; this.textContent = 'Guardar recepción';
        return alertar(r.error);
      }
      if (r.encolado) {
        estado.cabecera = null; estado.lineas = [];
        pantallaInicio();
        return alertar('Guardado en el teléfono. Se enviará al recuperar señal. Los folios de lote se asignan al enviarse.');
      }
      pantallaFolios(r);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar recepción';
      alertar('No se pudo guardar. Revisa la señal.');
    }
  };
}

/* =================================================================
   Recepción — paso 3: folios para etiquetar
   ================================================================= */
/* -----------------------------------------------------------------
   Etiquetas pendientes de imprimir
   -----------------------------------------------------------------
   Los folios se dejan en localStorage y la página de etiquetas los
   recoge; por la URL no caben, una recepción de 30 renglones la trunca
   el teléfono.

   Se ACUMULAN entre recepciones a propósito: sin impresora térmica se
   captura todo el pedido y hasta el final se imprime una sola hoja
   carta. Si cada recepción borrara la anterior, al final solo quedarían
   las etiquetas de la última y las demás cajas se quedarían sin folio.
   La lista se vacía a mano desde la pantalla de etiquetas, ya impresas.
   ----------------------------------------------------------------- */
var ETQ_KEY = 'msu_alm_etiquetas';

function etiquetasPendientes() {
  var v = leer(ETQ_KEY, []);
  return Object.prototype.toString.call(v) === '[object Array]' ? v : [];
}

function acumularEtiquetas(lotes) {
  var cat = (estado.cat && estado.cat.catalogo) || [];
  var nombre = {}, unidad = {};
  cat.forEach(function (s) {
    nombre[String(s.sku).toUpperCase()] = s.nombre;
    unidad[String(s.sku).toUpperCase()] = s.unidad_base;
  });

  var lista = etiquetasPendientes();
  var yaHay = {};
  lista.forEach(function (l) { yaHay[String(l.lote_id).toUpperCase()] = true; });

  (lotes || []).forEach(function (l) {
    var folio = String(l.lote_id).toUpperCase();
    if (yaHay[folio]) return;
    yaHay[folio] = true;
    var k = String(l.sku).toUpperCase();
    lista.push({
      lote_id: l.lote_id,
      sku: l.sku,
      nombre: nombre[k] || '',
      cantidad: l.cantidad,
      unidad: unidad[k] || '',
      caducidad: l.caducidad || '',
      lote_proveedor: l.lote_proveedor || ''
    });
  });

  escribir(ETQ_KEY, lista);
  return lista.length;
}

function pantallaFolios(r) {
  encabezado('Recepción guardada', r.recepcion_id || '');
  estado.cabecera = null; estado.lineas = [];

  /* Se guardan en la cola de etiquetas apenas se pinta la pantalla, no al
     apretar el botón: si se van directo a «Registrar otra recepción» estos
     folios no se pueden perder. */
  var pendientes = 0;
  try { pendientes = acumularEtiquetas(r.lotes); } catch (e) {}

  var folios = (r.lotes || []).map(function (l) {
    return '<div class="folio-lote"><div class="n">' + esc(l.lote_id) + '</div>' +
      '<div class="d">' + esc(l.sku) + ' · ' + esc(l.cantidad) +
      (l.lote_proveedor ? ' · lote ' + esc(l.lote_proveedor) : '') +
      (l.caducidad ? ' · caduca ' + esc(l.caducidad) : '') + '</div></div>';
  }).join('');

  pintar(
    '<div class="aviso a-ok">Recepción ' + esc(r.recepcion_id) + ' registrada con ' +
    (r.lotes || []).length + ' lote(s).</div>' +
    '<div class="card"><h3>Etiqueta estos lotes</h3>' +
    '<p class="mini">Escribe o pega el folio en cada empaque antes de guardarlo en el anaquel. A partir de aquí, ese folio es la identidad del lote.</p>' +
    folios + '</div>' +
    (pendientes > (r.lotes || []).length
      ? '<div class="aviso a-warn">Hay <b>' + pendientes + ' etiquetas</b> guardadas sin imprimir, ' +
        'contando las de las recepciones anteriores. Se imprimen todas juntas.</div>'
      : '') +
    '<button class="b-primary" id="bEtiquetas">Imprimir etiquetas</button>' +
    '<button class="b-dark" id="bOtra">Registrar otra recepción</button>' +
    '<button class="b-ghost" id="bInicio">Volver al inicio</button>');

  $('bEtiquetas').onclick = function () {
    try {
      acumularEtiquetas(r.lotes);
      location.href = 'etiquetas.html';
    } catch (e) {
      alertar('No se pudieron preparar las etiquetas. Los folios están en la hoja LOTES.');
    }
  };

  $('bOtra').onclick = function () { pantallaCabecera(); };
  $('bInicio').onclick = function () { pantallaInicio(); };
}

/* =================================================================
   Consultas
   ================================================================= */
/* =================================================================
   Cajas de cirugía
   =================================================================
   Una caja es una ubicación temporal, no una salida. Mientras está
   abierta, su contenido no está en el anaquel y tampoco está
   consumido: está en un tercer lugar. Al cerrarla, lo que quedó
   dentro es el consumo.

        Salió  −  Regresó  =  Consumido

   Nadie captura el consumo. Se cuenta lo que regresa, que es lo que
   se tiene enfrente, y el resto lo hace la resta.
   ================================================================= */

function esCaja(id) { return /^CAJA-/i.test(String(id || '')); }

/** Etiqueta grande y legible de un renglón de caja. */
function filaCaja(l) {
  var falta = l.en_caja > 0;
  return '<div class="linea"><div class="cab"><div>' +
    '<div class="nm">' + esc(l.nombre) + '</div>' +
    '<div class="datos">' + esc(l.lote_id) +
      (l.lote_proveedor ? ' · lote ' + esc(l.lote_proveedor) : '') +
      (l.caducidad ? ' · cad ' + esc(l.caducidad) : '') + '<br>' +
      'Salió ' + esc(l.salio) + ' · regresó ' + esc(l.regreso) +
      (l.consumido ? ' · consumido ' + esc(l.consumido) : '') +
      ' ' + esc(l.unidad || '') +
    '</div></div>' +
    '<span class="pill ' + (falta ? 'p-warn' : 'p-neutral') + ' mono">' +
      esc(l.en_caja) + '</span>' +
    '</div></div>';
}

async function pantallaCajas() {
  encabezado('Cajas de cirugía', 'Abiertas');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try {
    r = await enviar({ accion: 'caja_lista', estado: 'ABIERTA' }, true);
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return void ($('bV').onclick = function () { pantallaInicio(); });
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');

  var lista = (r.cajas || []).map(function (c) {
    var viejo = c.dias !== '' && c.dias >= 4;
    return '<div class="item item-abre" data-caja="' + esc(c.caja_id) + '">' +
      '<div class="l"><span>' + esc(c.caja_id) + '</span>' +
      '<div>' + esc(c.paciente) + ' · ' + esc(c.procedimiento) + '</div></div>' +
      '<span class="pill ' + (viejo ? 'p-warn' : 'p-neutral') + '">' +
      (c.dias === '' ? '—' : c.dias + (c.dias === 1 ? ' día' : ' días')) + '</span></div>';
  }).join('');

  pintar(
    '<div class="card"><h3>Abrir una caja</h3>' +
    '<p class="sub">Se abre antes de surtir. El folio que salga es la identidad de esa caja hasta que el paciente se va de alta.</p>' +
    '<button class="b-primary" id="bNueva">Nueva caja</button></div>' +

    '<div class="card"><h3>' + (r.cajas || []).length + ' caja(s) abierta(s)</h3>' +
    (lista
      ? '<p class="mini">Una caja abierta es material fuera del anaquel. Las de cuatro días o más están marcadas.</p><div class="lista">' + lista + '</div>'

/**
 * Sacar del almacén a la caja, o regresar de la caja al almacén.
 * En los dos casos se elige un LOTE, no un producto: el folio del lote es
 * lo que después permite decir qué lote se usó en qué paciente.
 */
async function pantallaCajaMover(cajaId, sentido) {
  var esSalida = sentido !== 'RETORNO';
  encabezado(esSalida ? 'Sacar material' : 'Registrar retorno', cajaId);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');

  var caja = (estado.cajaActual && estado.cajaActual.caja) || null;
  var disponibles = [];
  try {
    if (esSalida) {
      var e = await enviar({ accion: 'existencias', almacen: caja.almacen }, true);
      if (!e.ok) return pintar('<div class="aviso a-err">' + esc(e.error) + '</div>');
      disponibles = e.existencias.map(function (x) {
        return { sku: x.sku, lote_id: x.lote_id, nombre: x.nombre,
                 caducidad: x.caducidad, disponible: x.cantidad };
      });
    } else {
      disponibles = estado.cajaActual.lineas.filter(function (l) { return l.en_caja > 0; })
        .map(function (l) {
          return { sku: l.sku, lote_id: l.lote_id, nombre: l.nombre,
                   caducidad: l.caducidad, disponible: l.en_caja };
        });
    }
  } catch (err) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return void ($('bV').onclick = function () { pantallaCajaDetalle(cajaId); });
  }

  var lineas = [];

  function opciones(filtro) {
    var f = String(filtro || '').toLowerCase();
    return disponibles.filter(function (d) {
      if (!f) return true;
      return (d.nombre + ' ' + d.sku + ' ' + d.lote_id).toLowerCase().indexOf(f) >= 0;
    }).slice(0, 120).map(function (d) {
      return '<option value="' + esc(d.lote_id) + '">' + esc(d.nombre) +
        ' · ' + esc(d.lote_id) + ' · hay ' + esc(d.disponible) +
        (d.caducidad ? ' · cad ' + esc(d.caducidad) : '') + '</option>';
    }).join('');
  }

  function dibujar() {
    var capturado = lineas.map(function (l, i) {
      return '<div class="linea"><div class="cab"><div>' +
        '<div class="nm">' + esc(l.nombre) + '</div>' +
        '<div class="datos">' + esc(l.lote_id) + ' · ' + esc(l.cantidad) + '</div>' +
        '</div><button class="quitar" data-i="' + i + '">Quitar</button></div></div>';
    }).join('');

    pintar(
      (disponibles.length ? '' :
        '<div class="aviso a-warn">' + (esSalida
          ? 'Ese almacén no tiene existencia. Todo lo que salga tiene que haber entrado antes por una recepción.'
          : 'La caja no trae nada que regresar.') + '</div>') +

      '<div class="card"><h3>' + (esSalida ? 'Del almacén a la caja' : 'De la caja al almacén') + '</h3>' +
      '<p class="mini">' + (esSalida
        ? 'Esto no descuenta nada: el material cambia de lugar, no desaparece. Se descuenta al cerrar la caja.'
        : 'Lo que regresa vuelve a estar disponible en el anaquel. Lo que no regrese cuenta como consumido.') +
      '</p>' +
      '<div class="campo"><label>Buscar</label><input id="mFiltro" placeholder="Nombre, código o folio de lote"></div>' +
      '<div class="campo"><label>Lote</label><select id="mLote">' + opciones('') + '</select></div>' +
      '<div class="campo"><label>Cantidad</label><input id="mCant" type="number" inputmode="decimal" min="0" step="any"></div>' +
      '<button class="b-dark" id="mAdd">Agregar renglón</button></div>' +

      (lineas.length
        ? '<div class="card"><h3>' + lineas.length + ' renglón(es)</h3>' + capturado + '</div>'
        : '<div class="card"><p class="sub centro">Todavía no hay renglones.</p></div>') +

      '<button class="b-primary" id="mGuardar"' + (lineas.length ? '' : ' disabled') + '>' +
      (esSalida ? 'Guardar la salida' : 'Guardar el retorno') + '</button>' +
      '<button class="b-ghost" id="mVolver">Volver a la caja</button>');

    $('mFiltro').oninput = function () {
      $('mLote').innerHTML = opciones(this.value);
    };

    Array.prototype.forEach.call(document.querySelectorAll('.quitar'), function (b) {
      b.onclick = function () {
        lineas.splice(parseInt(this.getAttribute('data-i'), 10), 1);
        dibujar();
      };
    });

    $('mAdd').onclick = function () {
      var folio = $('mLote').value;
      var d = null;
      disponibles.forEach(function (x) { if (x.lote_id === folio) d = x; });
      if (!d) return alertar('Elige un lote de la lista.');

      var cant = parseFloat($('mCant').value);
      if (!cant || cant <= 0) return alertar('Falta la cantidad.');

      /* Lo que ya se capturó en esta misma pantalla también gasta
         existencia: si no se suma, se puede pedir dos veces lo mismo. */
      var yaPedido = 0;
      lineas.forEach(function (l) { if (l.lote_id === folio) yaPedido += l.cantidad; });
      if (cant + yaPedido - d.disponible > 0.0001) {
        return alertar('Solo hay ' + d.disponible + ' de ' + folio +
          (yaPedido ? ' y ya capturaste ' + yaPedido + '.' : '.'));
      }

      lineas.push({ sku: d.sku, lote_id: d.lote_id, nombre: d.nombre, cantidad: cant });
      dibujar();
    };

    $('mGuardar').onclick = async function () {
      this.disabled = true; this.textContent = 'Guardando…';
      try {
        var r = await enviar({
          accion: 'caja_mover',
          caja_id: cajaId,
          sentido: esSalida ? 'SALIDA' : 'RETORNO',
          adicional: !!estado.cajaSurtida,
          lineas: lineas.map(function (l) {
            return { sku: l.sku, lote_id: l.lote_id, cantidad: l.cantidad };
          })
        }, true);
        if (!r.ok) {
          this.disabled = false;
          this.textContent = esSalida ? 'Guardar la salida' : 'Guardar el retorno';
          return alertar(r.error);
        }
        estado.cajaSurtida = true;
        pantallaCajaDetalle(cajaId);
      } catch (e) {
        this.disabled = false;
        this.textContent = esSalida ? 'Guardar la salida' : 'Guardar el retorno';
        alertar('Sin conexión. Este movimiento necesita señal porque valida la existencia contra el servidor.');
      }
    };

    $('mVolver').onclick = function () { pantallaCajaDetalle(cajaId); };
  }

  dibujar();
}

/** El corte. Lo que quedó en la caja es el consumo; aquí solo se clasifica. */
function pantallaCajaCerrar(cajaId) {
  var r = estado.cajaActual;
  if (!r || !r.caja || r.caja.caja_id !== cajaId) return pantallaCajaDetalle(cajaId);

  encabezado('Cerrar la caja', cajaId);
  var dentro = r.lineas.filter(function (l) { return l.en_caja > 0; });
  var destinos = {};
  dentro.forEach(function (l) { destinos[l.sku + '|' + l.lote_id] = l.destino_sugerido; });

  function bloque(l) {
    var k = l.sku + '|' + l.lote_id;
    var opt = ['EXCEDENTE', 'INCLUIDO', 'MERMA'].map(function (d) {
      return '<option value="' + d + '"' + (destinos[k] === d ? ' selected' : '') + '>' +
        (d === 'EXCEDENTE' ? 'Excedente · se cobra'
         : d === 'INCLUIDO' ? 'Incluido en el paquete'
         : 'Merma · no se cobra') + '</option>';
    }).join('');
    return '<div class="linea"><div class="cab"><div>' +
      '<div class="nm">' + esc(l.nombre) + '</div>' +
      '<div class="datos">' + esc(l.lote_id) + ' · consumo <b>' + esc(l.en_caja) + '</b> ' +
      esc(l.unidad || '') + (l.facturable ? ' · catálogo: ' + esc(l.facturable) : '') +
      '</div></div></div>' +
      '<select class="dest" data-k="' + esc(k) + '">' + opt + '</select></div>';
  }

  pintar(
    '<div class="card"><h3>' + dentro.length + ' renglón(es) de consumo</h3>' +
    '<p class="sub">Esto es lo que salió menos lo que regresó. No se captura: ya está calculado.</p>' +
    '<p class="mini">El destino viene propuesto por el catálogo — los implantes, energías, hilos y hialurónicos salen como excedente. Cambia solo lo que sea excepción, y marca merma en lo que se echó a perder.</p>' +
    dentro.map(bloque).join('') + '</div>' +

    '<div class="card"><h3>Nota del cierre</h3>' +
    '<p class="mini">Si algo no cuadró, escríbelo aquí tal cual. El cierre se puede guardar con una diferencia registrada; lo que no se vale es inventar una cifra para poder avanzar.</p>' +
    '<textarea id="cNota" rows="3" placeholder="Opcional"></textarea></div>' +

    '<button class="b-primary" id="bOk">Cerrar la caja</button>' +
    '<button class="b-ghost" id="bV">Volver sin cerrar</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.dest'), function (s) {
    s.onchange = function () { destinos[this.getAttribute('data-k')] = this.value; };
  });

  $('bOk').onclick = async function () {
    if (!confirm('Al cerrar, ' + dentro.length + ' renglón(es) se descuentan contra ' +
                 r.caja.paciente + '. Esto no se deshace desde la app. ¿Cerrar?')) return;
    this.disabled = true; this.textContent = 'Cerrando…';
    try {
      var res = await enviar({
        accion: 'caja_cerrar', caja_id: cajaId,
        destinos: destinos, nota: $('cNota').value.trim()
      }, true);
      if (!res.ok) {
        this.disabled = false; this.textContent = 'Cerrar la caja';
        return alertar(res.error);
      }
      var s = res.resumen || {};
      pintar('<div class="aviso a-ok">Caja ' + esc(cajaId) + ' cerrada. ' +
        esc(res.renglones) + ' renglón(es) descontados.</div>' +
        '<div class="card"><div class="lista">' +
        '<div class="item"><div class="l"><div>Excedente · se cobra</div></div><span class="pill p-warn">' + esc(s.EXCEDENTE || 0) + '</span></div>' +
        '<div class="item"><div class="l"><div>Incluido en el paquete</div></div><span class="pill p-neutral">' + esc(s.INCLUIDO || 0) + '</span></div>' +
        '<div class="item"><div class="l"><div>Merma</div></div><span class="pill p-neutral">' + esc(s.MERMA || 0) + '</span></div>' +
        '</div></div>' +
        ((res.negativos && res.negativos.length)
          ? '<div class="aviso a-err">Hay ' + res.negativos.length +
            ' renglón(es) con saldo negativo: regresó más de lo que salió. No se descontaron. Avísale al Dr. Soto.</div>'
          : '') +
        '<button class="b-dark" id="bCajas">Volver a las cajas</button>');
      $('bCajas').onclick = function () { pantallaCajas(); };
    } catch (e) {
      this.disabled = false; this.textContent = 'Cerrar la caja';
      alertar('Sin conexión. El cierre necesita señal porque recalcula el consumo en el servidor.');
    }
  };
  $('bV').onclick = function () { pantallaCajaDetalle(cajaId); };
}

/* =================================================================
   Ficha del lote — corregir caducidad y dar de baja
   =================================================================
   La caducidad y el lote del fabricante describen al lote: se corrigen en
   su lugar. La cantidad no: baja porque el material se movió a residuos,
   nunca porque alguien editó un número.
   ================================================================= */
async function pantallaLote(loteId, volver) {
  encabezado(loteId, 'Ficha del lote');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var art = null, ex = [];
  try {
    var r = await enviar({ accion: 'existencias' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');
    ex = (r.existencias || []).filter(function (x) {
      return String(x.lote_id).toUpperCase() === String(loteId).toUpperCase();
    });
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión. La ficha del lote necesita señal.</div>' +
           '<button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { (volver || pantallaLotes)(); };
    return;
  }

  var uno = ex[0] || {};
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === String(uno.sku).toUpperCase()) art = s;
  });
  var controlado = art && String(art.controlado).toUpperCase() === 'SI';
  var total = ex.reduce(function (a, x) { return a + Number(x.cantidad || 0); }, 0);
  var cad = String(uno.caducidad || '').slice(0, 10);
  var vencido = cad && cad < hoyISO();

  pintar(
    '<div class="card">' +
    '<h3>' + esc(uno.nombre || (art && art.nombre) || uno.sku || 'Lote') + '</h3>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Clave</div></div><span class="pill p-neutral">' + esc(uno.sku || '—') + '</span></div>' +
    '<div class="item"><div class="l"><div>Existencia</div></div><span>' + esc(total) +
      ' ' + esc((art && art.unidad_base) || '') + '</span></div>' +
    ex.map(function (x) {
      return '<div class="item"><div class="l"><div>' + esc(x.ubic_id) + '</div></div><span>' + esc(x.cantidad) + '</span></div>';
    }).join('') +
    '<div class="item"><div class="l"><div>Lote del fabricante</div></div><span>' + esc(uno.lote_proveedor || '—') + '</span></div>' +
    '<div class="item"><div class="l"><div>Caducidad</div></div><span class="pill ' +
      (vencido ? 'p-crit' : (cad ? 'p-neutral' : 'p-warn')) + '">' +
      esc(cad || 'sin fecha') + '</span></div>' +
    (controlado ? '<div class="item"><div class="l"><div>Controlado</div></div>' +
      '<span class="pill p-warn">Bajo llave y libro de control</span></div>' : '') +
    '</div></div>' +

    (vencido ? '<div class="aviso a-err"><b>Este lote está caducado.</b> Hay que sacarlo del anaquel ' +
       'y darlo de baja para que deje de contar como existencia.</div>' : '') +

    '<div class="card"><h3>Corregir datos del lote</h3>' +
    '<p class="mini">Estos datos describen al lote. Corregirlos no mueve el saldo.</p>' +
    '<div class="dos">' +
    '<div class="campo"><label>Caducidad</label><input id="lCad" type="date" value="' + esc(cad) + '"></div>' +
    '<div class="campo"><label>Lote del fabricante</label><input id="lProv" value="' +
      esc(uno.lote_proveedor || '') + '"></div>' +
    '</div>' +
    '<button class="b-dark" id="lGuardar">Guardar corrección</button>' +
    '</div>' +

    '<div class="card"><h3>Dar de baja</h3>' +
    '<p class="mini">Por caducidad, merma o rotura. No se borra nada: el material se mueve a residuos ' +
    'y el saldo baja porque de verdad salió del almacén.</p>' +
    '<div class="campo"><label>Motivo</label><input id="bMotivo" placeholder="' +
      (vencido ? 'Caducó el ' + esc(cad) : 'Por qué se da de baja') + '"></div>' +
    '<div class="campo"><label>Cantidad (vacío = todo)</label><input id="bCant" type="number" ' +
      'inputmode="decimal" min="0" step="any" placeholder="' + esc(total) + '"></div>' +
    (controlado
      ? '<div class="campo"><label>Número de acta de destrucción</label>' +
        '<input id="bActa" placeholder="ACTA-2026-001"></div>' +
        '<p class="mini">Es un medicamento controlado: su destrucción tiene procedimiento propio ' +
        'ante la autoridad. Sin el número de acta, el inventario y el libro de control dejarían de coincidir.</p>'
      : '') +
    (ex.length > 1
      ? '<div class="campo"><label>¿De cuál ubicación?</label><select id="bUbic">' +
        ex.map(function (x) { return '<option value="' + esc(x.ubic_id) + '">' +
          esc(x.ubic_id) + ' · ' + esc(x.cantidad) + '</option>'; }).join('') + '</select></div>'
      : '') +
    '<button class="b-dark" id="bBaja">Dar de baja</button>' +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver</button>');

  $('lGuardar').onclick = async function () {
    var cambios = {};
    if ($('lCad').value !== cad) cambios.caducidad = $('lCad').value;
    if ($('lProv').value.trim() !== String(uno.lote_proveedor || '').trim())
      cambios.lote_proveedor = $('lProv').value.trim();
    if (!Object.keys(cambios).length) return alertar('No cambiaste nada.');
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      var r = await enviar({ accion: 'lote_editar', lote_id: loteId, cambios: cambios,
                             motivo: 'Corrección desde la app' }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar corrección'; return alertar(r.error); }
      alertar(r.aviso || (r.cambios + ' dato(s) corregidos en ' + loteId + '.'));
      pantallaLote(loteId, volver);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar corrección';
      alertar('Sin señal: corregir un lote necesita conexión.');
    }
  };

  $('bBaja').onclick = async function () {
    var motivo = $('bMotivo').value.trim();
    if (!motivo) return alertar('La baja necesita un motivo. Queda escrito en el kardex.');
    /* Sin acta no se manda nada: el backend la exige igual, pero es mejor
       decirlo aquí que hacerle dar el viaje en balde. */
    if (controlado && (!$('bActa') || !$('bActa').value.trim()))
      return alertar('Falta el número de acta de destrucción.');
    var cant = $('bCant').value.trim();
    this.disabled = true; this.textContent = 'Dando de baja…';
    try {
      var r = await enviar({ accion: 'lote_baja', lote_id: loteId, motivo: motivo,
        cantidad: cant === '' ? '' : parseFloat(cant),
        tipo: /caduc|venci/i.test(motivo) ? 'CADUCIDAD' : 'MERMA',
        acta: $('bActa') ? $('bActa').value.trim() : '',
        ubic_origen: $('bUbic') ? $('bUbic').value : '',
        client_id: idCliente() }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Dar de baja'; return alertar(r.error); }
      alertar('Baja registrada: ' + r.cantidad + ' de ' + loteId + ' → ' + r.destino +
              (r.queda ? '. Quedan ' + r.queda + '.' : '. El lote quedó en cero.'));
      pantallaLote(loteId, volver);
    } catch (e) {
      this.disabled = false; this.textContent = 'Dar de baja';
      alertar('Sin señal: dar de baja necesita conexión, porque valida existencia.');
    }
  };

  $('bV').onclick = function () { (volver || pantallaLotes)(); };
}

/* Los folios con existencia y sin caducidad, ya separados en los dos grupos
   que llevan a acciones distintas: ir a leer el empaque, o bajar a N3. */
async function pantallaSinFecha() {
  encabezado('Sin caducidad', 'Lista de trabajo');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'lotes_sin_fecha' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');
    var fila = function (x) {
      return '<button class="fila-lote" data-lote="' + esc(x.lote_id) + '">' +
        '<span class="t"><span class="n">' + esc(x.nombre || x.sku) + '</span>' +
        '<span class="c">' + esc(x.lote_id) + ' · ' + esc(x.sku) +
        (x.lote_proveedor ? ' · lote ' + esc(x.lote_proveedor) : '') + '</span></span>' +
        '<span class="pill p-warn">' + esc(x.nivel) + '</span></button>';
    };
    pintar(
      (r.revisar.length
        ? '<div class="card"><h3>' + r.revisar.length + ' traen la fecha en el empaque</h3>' +
          '<p class="sub">Hay que ir a leerla de la caja y capturarla. Sin caducidad no hay PEPS ' +
          'ni alerta de vencimiento.</p>' + r.revisar.map(fila).join('') + '</div>'
        : '<div class="card"><p class="sub centro">Ningún folio pendiente de fecha.</p></div>') +
      (r.reclasificar.length
        ? '<div class="card"><h3>' + r.reclasificar.length + ' no caducan</h3>' +
          '<p class="sub">Estos no llevan fecha porque no la tienen. Lo que les toca es pasar a ' +
          'nivel <b>N3</b> — se controlan por consumo, no por lote — y así dejan de aparecer aquí ' +
          'cada mes. El nivel se cambia en la ficha del insumo, en el catálogo.</p>' +
          r.reclasificar.map(fila).join('') + '</div>'
        : '') +
      '<button class="b-ghost" id="bV">Volver</button>');
    Array.prototype.forEach.call(document.querySelectorAll('.fila-lote'), function (b) {
      b.onclick = function () { pantallaLote(this.getAttribute('data-lote'), pantallaSinFecha); };
    });
    $('bV').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}

/* =================================================================
   Catálogo con fotos
   =================================================================
   Se busca sin acentos y sin importar mayúsculas: el catálogo se sembró
   sin acentos y la gente los escribe, así que «guantes esteriles» y
   «Guantes Estériles» tienen que encontrar lo mismo.
   ================================================================= */
function plano(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().trim();
}

function pantallaCatalogo(filtro) {
  encabezado('Catálogo', 'Qué es cada cosa');
  var lista = ((estado.cat && estado.cat.catalogo) || []).slice();
  var q = plano(filtro || '');
  var vistos = q
    ? lista.filter(function (s) { return plano(s.sku + ' ' + s.nombre + ' ' + (s.presentacion || '')).indexOf(q) >= 0; })
    : lista;
  vistos.sort(function (a, b) { return String(a.sku).localeCompare(String(b.sku)); });

  var conFoto = lista.filter(function (s) { return s.tiene_foto; }).length;
  var tope = vistos.slice(0, 60);

  var alertados = lista.filter(function (s) { return s.alerta; });

  var filas = tope.map(function (s) {
    return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
      (s.tiene_foto
        ? '<img class="foto-mini" id="mini-' + esc(s.sku) + '" alt="">'
        : '<span class="sin-foto">sin<br>foto</span>') +
      '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
      '<span class="c">' + esc(s.sku) + (s.presentacion ? ' · ' + esc(s.presentacion) : '') + '</span></span>' +
      (s.alerta ? '<span class="pill p-warn">revisar</span>'
        : (String(s.controlado).toUpperCase() === 'SI' ? '<span class="pill p-neutral">llave</span>' : '')) +
      '</button>';
  }).join('');

  pintar(
    '<div class="card">' +
    '<div class="campo"><label>Buscar</label>' +
    '<input id="cBusca" placeholder="Código, nombre o presentación" value="' + esc(filtro || '') + '"></div>' +
    '<p class="mini">' + lista.length + ' insumos en el catálogo · ' +
      (conFoto === 0 ? 'ninguno tiene foto todavía'
                     : conFoto + (conFoto === 1 ? ' ya tiene foto' : ' ya tienen foto')) + '.</p>' +
    '</div>' +

    (alertados.length
      ? '<div class="card"><h3>' + alertados.length + ' por revisar</h3>' +
        '<p class="sub">Su nombre suena a medicamento controlado y están capturados como si no lo fueran. ' +
        'El grupo viene impreso en la caja: hay que verlo antes de decidir.</p>' +
        '<button class="b-dark" id="bAlertas">Ver cuáles son</button></div>'
      : '') +

    '<div class="card">' +
    (tope.length
      ? filas + (vistos.length > tope.length
          ? '<p class="mini" style="margin-top:10px">Se muestran ' + tope.length + ' de ' +
            vistos.length + '. Escribe algo más para acortar la lista.</p>'
          : '')
      : '<p class="sub centro">Nada coincide con esa búsqueda.</p>') +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver al inicio</button>');

  var caja = $('cBusca');
  caja.oninput = function () {
    var v = this.value, pos = this.selectionStart;
    clearTimeout(window.__tBusca);
    window.__tBusca = setTimeout(function () {
      pantallaCatalogo(v);
      var n = $('cBusca'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }, 220);
  };

  Array.prototype.forEach.call(document.querySelectorAll('.fila-sku'), function (b) {
    b.onclick = function () { pantallaSkuFicha(this.getAttribute('data-sku'), function () { pantallaCatalogo(filtro); }); };
  });

  /* Las miniaturas se traen una por una y sin bloquear la lista: si no hay
     señal, la lista sigue sirviendo y sólo faltan las imágenes. */
  tope.forEach(function (s) {
    if (!s.tiene_foto) return;
    traerFoto(s.sku).then(function (img) {
      var el = $('mini-' + s.sku); if (el) el.src = img;
    }).catch(function () {});
  });

  if ($('bAlertas')) $('bAlertas').onclick = function () { pantallaControlados(); };
  $('bV').onclick = function () { pantallaInicio(); };
}

/* Los insumos que suenan a controlado y no están marcados. Es una lista de
   trabajo: se entra a cada uno, se ve la caja y se decide. */
function pantallaControlados() {
  encabezado('Por revisar', 'Posibles controlados');
  var lista = ((estado.cat && estado.cat.catalogo) || []).filter(function (s) { return s.alerta; });
  var marcados = ((estado.cat && estado.cat.catalogo) || [])
    .filter(function (s) { return String(s.controlado).toUpperCase() === 'SI'; });

  pintar(
    (lista.length
      ? '<div class="card"><h3>' + lista.length + ' sin marcar</h3>' +
        lista.map(function (s) {
          return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + '</span>' +
            '<span class="c" style="color:var(--warn);text-transform:none;letter-spacing:0">' +
            esc(s.alerta) + '</span></span>' +
            '<span class="pill p-warn">revisar</span></button>';
        }).join('') + '</div>'
      : '<div class="card"><p class="sub centro">Ninguno pendiente. Todos los que suenan a controlado ya están marcados.</p></div>') +

    '<div class="card"><h3>' + marcados.length + ' marcados como controlados</h3>' +
    (marcados.length
      ? marcados.map(function (s) {
          return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + ' · nivel ' + esc(s.nivel || '—') + '</span></span>' +
            '<span class="pill p-neutral">llave</span></button>';
        }).join('')
      : '<p class="sub centro">Todavía ninguno.</p>') +
    '</div>' +

    '<div class="card"><p class="mini">Esta lista es una red de seguridad sobre la captura, no una clasificación legal. ' +
    'El dato bueno es el grupo impreso en el empaque: I, II o III va como controlado.</p></div>' +

    '<button class="b-ghost" id="bV">Volver al catálogo</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.fila-sku'), function (b) {
    b.onclick = function () {
      pantallaSkuFicha(this.getAttribute('data-sku'), pantallaControlados);
    };
  });
  $('bV').onclick = function () { pantallaCatalogo(''); };
}

function pantallaSkuFicha(sku, volver) {
  var art = null;
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === String(sku).toUpperCase()) art = s;
  });
  if (!art) return alertar('Ese código ya no está en el catálogo.');

  encabezado(art.sku, 'Ficha del insumo');
  var nueva = null;
  var opt = function (lista, sel) {
    return lista.map(function (v) {
      return '<option' + (String(sel).toUpperCase() === v ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  };

  pintar(
    '<div class="card">' +
    '<h3>' + esc(art.nombre) + '</h3>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Código</div></div><span class="pill p-neutral">' + esc(art.sku) + '</span></div>' +
    (art.presentacion ? '<div class="item"><div class="l"><div>Presentación</div></div><span>' + esc(art.presentacion) + '</span></div>' : '') +
    '<div class="item"><div class="l"><div>Se descuenta en</div></div><span>' + esc(art.unidad_base || '—') + '</span></div>' +
    (String(art.controlado).toUpperCase() === 'SI'
      ? '<div class="item"><div class="l"><div>Controlado</div></div><span class="pill p-warn">Bajo llave y libro de control</span></div>' : '') +
    '</div></div>' +

    (art.alerta
      ? '<div class="aviso a-warn"><b>Revisa la caja de este producto.</b><br>' + esc(art.alerta) +
        '<br>Está capturado como <b>no controlado</b>.</div>'
      : '') +

    '<div class="card"><h3>Clasificación</h3>' +
    '<p class="mini">El grupo viene impreso en el empaque. Grupo I, II o III va como controlado; del IV para abajo, no.</p>' +
    '<div class="dos">' +
    '<div class="campo"><label>¿Controlado?</label><select id="eCtrl">' + opt(['NO','SI'], art.controlado) + '</select></div>' +
    '<div class="campo"><label>Nivel de conteo</label><select id="eNiv">' + opt(['N1','N2','N3'], art.nivel) + '</select></div>' +
    '</div>' +
    '<div class="dos">' +
    '<div class="campo"><label>¿Multidosis?</label><select id="eMulti">' + opt(['NO','SI'], art.es_multidosis) + '</select></div>' +
    '<div class="campo"><label>Clase ABC</label><select id="eClase">' + opt(['A','B','C'], art.clase_abc) + '</select></div>' +
    '</div>' +
    '<div class="campo"><label>¿Se cobra aparte?</label><select id="eFact">' +
      opt(['PAQUETE','SIEMPRE','NUNCA'], art.facturable) + '</select></div>' +
    '<p class="mini" id="eNota">N1 se cuenta pieza por pieza · N2 por lote · N3 por consumo. Un controlado que no es multidosis va en N1: el libro de control pide una línea por ampolleta.</p>' +
    '<button class="b-primary" id="eGuardar">Guardar clasificación</button>' +
    '</div>' +

    '<div class="card"><h3>Foto</h3>' +
    '<p class="mini" id="fNota">' + (art.tiene_foto ? 'Cargando la foto guardada…' : 'Este insumo todavía no tiene foto.') + '</p>' +
    '<img id="fImg" class="foto-prev oculto" alt="">' +
    '<div class="espacio"></div>' +
    '<label for="fFile">' + (art.tiene_foto ? 'Reemplazar la foto' : 'Tomar o elegir una foto') + '</label>' +
    '<input id="fFile" type="file" accept="image/*" capture="environment">' +
    '<div class="espacio"></div>' +
    '<button class="b-primary oculto" id="bSubir">Guardar esta foto</button>' +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver</button>');

  if (art.tiene_foto) {
    traerFoto(art.sku).then(function (img) {
      $('fImg').src = img; $('fImg').classList.remove('oculto');
      $('fNota').textContent = 'Si tomas otra, reemplaza a esta.';
    }).catch(function (e) { $('fNota').textContent = e.message; });
  }

  $('fFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    comprimir(f, function (b64) {
      nueva = b64;
      $('fImg').src = b64; $('fImg').classList.remove('oculto');
      $('fNota').textContent = 'Foto nueva. Todavía no se guarda: dale al botón.';
      $('bSubir').classList.remove('oculto');
    });
  };

  $('bSubir').onclick = async function () {
    if (!nueva) return;
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      /* A propósito NO se encola: una foto pesa demasiado para el
         almacenamiento del teléfono y encolarla desplazaría recepciones
         pendientes, que sí son irrecuperables. */
      var r = await enviar({ accion: 'sku_foto_guardar', sku: art.sku, foto_base64: nueva }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar esta foto'; return alertar(r.error); }
      FOTOS[String(art.sku).toUpperCase()] = nueva;
      marcarConFoto(art.sku);
      this.classList.add('oculto');
      $('fNota').textContent = 'Foto guardada.';
      alertar('Foto guardada en ' + art.sku + '.');
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar esta foto';
      alertar('Sin señal: la foto necesita conexión para guardarse.');
    }
  };

  /* Al marcar controlado se propone el nivel que le toca, pero no se cambia
     solo: el nivel decide cómo se captura en el anaquel y esa es decisión
     de quien surte, no del sistema. */
  function proponerNivel() {
    var ctrl = $('eCtrl').value === 'SI', multi = $('eMulti').value === 'SI';
    var claseA = $('eClase').value === 'A';
    var deberia = (!multi && (ctrl || claseA)) ? 'N1' : (multi ? 'N2' : null);
    var nota = $('eNota');
    if (deberia && $('eNiv').value !== deberia) {
      nota.innerHTML = 'Por como quedó, a este insumo le tocaría <b>' + deberia + '</b>. ' +
        '<a href="#" id="ePonNiv">Ponerlo en ' + deberia + '</a>';
      $('ePonNiv').onclick = function (ev) {
        ev.preventDefault(); $('eNiv').value = deberia; proponerNivel();
      };
    } else {
      nota.textContent = 'N1 se cuenta pieza por pieza · N2 por lote · N3 por consumo.';
    }
  }
  ['eCtrl','eMulti','eClase','eNiv'].forEach(function (id) { $(id).onchange = proponerNivel; });
  proponerNivel();

  $('eGuardar').onclick = async function () {
    var cambios = {
      controlado:    $('eCtrl').value,
      nivel_control: $('eNiv').value,
      es_multidosis: $('eMulti').value,
      clase_abc:     $('eClase').value,
      facturable:    $('eFact').value
    };
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      var r = await enviar({ accion: 'sku_editar', sku: art.sku, cambios: cambios }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar clasificación'; return alertar(r.error); }
      /* El catálogo en memoria se actualiza sin volver a bajarlo completo:
         son 184 renglones y la pantalla ya tiene los valores buenos. */
      for (var k in cambios) if (cambios.hasOwnProperty(k)) {
        if (k === 'nivel_control') art.nivel = cambios[k]; else art[k] = cambios[k];
      }
      if (cambios.controlado === 'SI') art.alerta = '';
      this.disabled = false; this.textContent = 'Guardar clasificación';
      if (r.sin_cambios) return alertar('No había nada que cambiar.');
      alertar(r.cambios + ' dato(s) guardados en ' + art.sku + '.');
      pantallaSkuFicha(art.sku, volver);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar clasificación';
      alertar('Sin señal: cambiar la clasificación necesita conexión.');
    }
  };

  $('bV').onclick = function () { (volver || pantallaCatalogo)(); };
}

/* =================================================================
   Arranque
   ================================================================= */
window.addEventListener('online', function () { pintarEstado(); vaciarCola(); });
window.addEventListener('offline', pintarEstado);

(async function inicio() {
  try { arrancar(); } catch (e) { pantallaFalloDuro(e); }
})();

function pantallaFalloDuro(e) {
  var d = document.getElementById('app');
  if (!d) return;
  d.innerHTML =
    '<div class="aviso a-err">La app no pudo arrancar.</div>' +
    '<div class="card"><p class="mini">' + esc(String((e && e.message) || e)) + '</p></div>' +
    '<button class="b-dark" onclick="reiniciarApp()">Reiniciar la app</button>' +
    '<button class="b-ghost" onclick="location.reload()">Volver a intentar</button>';
}

async function arrancar() {
  pintarEstado();
  if (!estado.sesion || !estado.sesion.sesion) return pantallaLogin();
  pantallaInicio();
  try { await cargarCat(); pantallaInicio(); } catch (e) {}
  vaciarCola();
}

/* Registro del service worker con actualización automática.
   Sin esto, un teléfono se quedaba con la versión vieja de la app hasta que
   alguien la borrara a mano: se subía un arreglo y no llegaba. Ahora la app
   busca versión nueva al abrir y cada vez que vuelves a ella, y se recarga
   sola una sola vez cuando la nueva toma el control. */
if ('serviceWorker' in navigator && navigator.serviceWorker) {
  var habiaControlador = !!navigator.serviceWorker.controller;
  var recargando = false;

  /* Tope duro: como mucho UNA recarga automatica por sesion de pestana.
     Sin este tope, si dos service workers se pelean el control la app se
     recarga sin parar y se ve como una pantalla en blanco que nunca carga. */
  var yaRecargo = false;
  try { yaRecargo = sessionStorage.getItem('msu_sw_recarga') === '1'; } catch (e) {}

  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!habiaControlador || recargando || yaRecargo) return;
    recargando = true;
    try { sessionStorage.setItem('msu_sw_recarga', '1'); } catch (e) {}
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    var buscar = function () { try { reg.update(); } catch (e) {} };
    buscar();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') buscar();
    });
  }).catch(function () {});
}
</script>
