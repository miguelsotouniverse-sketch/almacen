    b.onclick = function () {
      var f = this.getAttribute('data-just-folio'), fila = null;
      (r.sin_justificar || []).forEach(function (x) { if (x.folio === f) fila = x; });
      pantallaJustificar(f, dia, fila);
    };
  });
}

/* ---------------- justificar una salida que quedó pendiente ---------------- */

var JUSTIF = null;

function pantallaJustificar(folio, volverA, datos) {
  JUSTIF = { folio: folio, volverA: volverA, datos: datos || null, just: {} };
  pintarJustificar();
}

function pintarJustificar() {
  encabezado('Justificar la salida', JUSTIF.folio);
  /* Quien justifica tiene que ver QUÉ está justificando. Un folio solo no
     le dice nada a nadie tres días después. */
  var d = JUSTIF.datos || {};
  var ficha = '<div class="card"><h3>' + esc(d.paciente || '(sin paciente)') + '</h3>' +
    '<p class="mini mono">' + esc(JUSTIF.folio) +
      (d.hora ? ' · ' + esc(d.hora) : '') +
      (d.piezas ? ' · ' + d.piezas + ' pieza(s)' : '') +
      (d.ubic_nombre ? ' · ' + esc(d.ubic_nombre) : '') + '</p>' +
    (d.problema ? '<div class="aviso a-warn">' + esc(d.problema) + '</div>' : '') +
    '</div>';
  /* Se reusa la misma tarjeta de la pantalla de aplicar, con el mismo
     vocabulario: quien justifica aquí ya la vio allá. */
  var guardado = APLIC;
  APLIC = { just: JUSTIF.just, paciente: JUSTIF.paciente || '',
            fechaCitas: JUSTIF.volverA, cita: null };
  var html = tarjetaJustificacion();
  var recordar;
  pintar(ficha + html +
    '<button class="b-dark" id="jGuardar">Guardar la justificación</button>' +
    '<button class="b-ghost" id="jVolver">Volver sin guardar</button>');
  cablearJustificacion(pintarJustificar);
  recordar = APLIC.recordarJ;
  APLIC = guardado;

  $('jGuardar').onclick = async function () {
    if (recordar) recordar();
    var j = JUSTIF.just;
    if (!j.tipo) return alertar('Falta decir por qué salió.');
    if ((j.tipo === 'FOLIO' || j.tipo === 'PAQUETE') && !String(j.folio_cobro || '').trim()) {
      return alertar('Falta el folio de cobro.');
    }
    if (j.tipo === 'DIRECTO' && !(Number(j.monto) > 0)) return alertar('Falta cuánto cobró.');

    this.disabled = true; this.textContent = 'Guardando…';
    var r;
    try {
      r = await enviar({ accion: 'justificar', folio: JUSTIF.folio, tipo: j.tipo,
        folio_cobro: j.folio_cobro || '', folio_original: j.folio_original || '',
        monto: j.monto || '', nota: j.nota || '', client_id: idCliente() }, true);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar la justificación';
      return alertar('No se guardó: ' + e.message);
    }
    if (!r.ok) {
      this.disabled = false; this.textContent = 'Guardar la justificación';
      return alertar(r.error);
    }
    pantallaCuadre(JUSTIF.volverA);
  };
  $('jVolver').onclick = function () { pantallaCuadre(JUSTIF.volverA); };
}

/* =================================================================
   Conteo físico

   El motor de conteos lleva meses en el backend y nunca tuvo pantalla:
   abrir un folio, congelar el saldo, comparar contra lo contado y escribir
   los ajustes sólo se podía hacer desde el editor de Apps Script. Es decir,
   la herramienta principal para cuadrar un almacén existía y nadie la podía
   usar.

   TRES REGLAS QUE LA PANTALLA TIENE QUE RESPETAR, PORQUE EL MOTOR LAS SUPONE

   1. Un renglón en blanco NO es cero. «No lo conté» y «conté cero» son
      cosas distintas: la primera deja el saldo como está, la segunda lo
      pone en cero. Por eso sólo se mandan las claves donde alguien escribió
      un número, y hay que teclear el cero a propósito.

   2. El saldo se congela al abrir. Lo que el motor compara es contra el
      número que había cuando se abrió el folio, no contra el de ahora. Si
      entre el conteo y la autorización alguien aplicó algo, el plan cambia
      y la pantalla se detiene en vez de escribir.

   3. Nada se escribe hasta que alguien autoriza. Abrir un conteo no mueve
      inventario; deja un documento. Se revisa el plan —qué movimientos
      exactos va a escribir— y hasta entonces se aplica.
   ================================================================= */

var CONTEO = null;

var CONTEO_CLASES_UI = {
  AJUSTE:   ['Ajuste', 'No se sabe a dónde se fue. Sale del almacén a la cuenta de ajustes.'],
  SALIDA:   ['Se consumió', 'Se usó y nadie lo descontó. Sale como consumo.'],
  TRASPASO: ['Se movió', 'Está en otro lado. Se traspasa a esa ubicación.'],
  LIBRO:    ['Al libro', 'Es un controlado: no se ajusta aquí, se resuelve en el libro.']
};

/* ---------------- la lista de conteos ---------------- */

async function pantallaConteos() {
  encabezado('Conteo físico', 'Lo del anaquel contra lo del sistema');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try {
    r = await enviar({ accion: 'conteo_lista' }, true);
  } catch (e) {
    return pintar('<div class="aviso a-err">Sin conexión.</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
    '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  pintar(
    '<div class="card"><h3>Qué es esto</h3>' +
    '<p class="mini">Contar el anaquel y comparar contra lo que dice el sistema. Abrir un ' +
    'conteo <b>no mueve nada</b>: deja un documento con lo que se contó. Los ajustes se ' +
    'escriben hasta que alguien revisa el plan y lo autoriza.</p></div>' +
    '<button class="b-dark" id="nConteo">Abrir un conteo</button>' +
    (r.conteos.length
      ? r.conteos.map(function (c) {
          var abierto = String(c.estado).toUpperCase() === 'ABIERTO';
          var anulado = String(c.estado).toUpperCase() === 'ANULADO';
          return '<div class="card"><h3>' + esc(c.conteo_id) + '</h3>' +
            '<p class="mini mono">' + esc(c.fecha) + ' · ' + esc(c.almacen || '') +
              ' · contó ' + esc(c.contado_por || '—') + '</p>' +
            '<p class="mini">' + c.lineas + ' renglón(es) · ' + c.difieren + ' con diferencia · ' +
              c.aplicadas + ' aplicada(s)</p>' +
            (anulado ? '<span class="pill p-crit">anulado</span>'
                     : (abierto ? '<span class="pill p-warn">abierto</span>'
                                : '<span class="pill p-ok">cerrado</span>')) +
            '<button class="b-ghost" data-ver="' + esc(c.conteo_id) + '">' +
              (abierto ? 'Revisar y aplicar' : 'Ver qué dejó') + '</button></div>';
        }).join('')
      : '<div class="aviso a-info">Todavía no se ha hecho ningún conteo.</div>') +
    '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  $('nConteo').onclick = function () { pantallaConteoNuevo(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-ver]'), function (b) {
    b.onclick = function () { pantallaConteoPlan(this.getAttribute('data-ver')); };
  });
}

/* ---------------- capturar lo contado ---------------- */

async function pantallaConteoNuevo(ubicId) {
  encabezado('Conteo físico', 'Qué hay de verdad en el anaquel');
  pintar('<div class="card"><p class="sub">Cargando existencias…</p></div>');

  var almacenes = ((estado.cat || {}).almacenes || []).filter(function (u) {
    return alcanceCubreFront_(u.ubic_id || u.id);
  });
  var ubic = ubicId || (almacenes[0] || {}).ubic_id || (almacenes[0] || {}).id || '';
  if (!ubic) return pintar('<div class="aviso a-err">No hay almacén al que llegues.</div>' +
    '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');

  var r;
  try {
    r = await enviar({ accion: 'existencias', almacen: ubic }, true);
  } catch (e) {
    return pintar('<div class="aviso a-err">Sin conexión. Un conteo necesita señal: ' +
      'compara contra la existencia real.</div>' +
      '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
    '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');

  /* El conteo es por CLAVE, no por lote: quien cuenta ve frascos en el
     anaquel, no folios. El reparto entre lotes lo hace el motor por
     caducidad, que es lo que haría una persona bien. */
  /* La unidad y si es controlado no vienen con la existencia: vienen del
     catálogo, que la app ya trae cargado. */
  var ficha = {};
  ((estado.cat || {}).catalogo || []).forEach(function (c) {
    ficha[String(c.sku).toUpperCase()] = c;
  });

  var porSku = {};
  (r.existencias || []).forEach(function (x) {
    if (String(x.ubic_id).toUpperCase() !== String(ubic).toUpperCase()) return;
    var k = String(x.sku).toUpperCase();
    var f = ficha[k] || {};
    if (!porSku[k]) porSku[k] = { sku: k, nombre: x.nombre || f.nombre || k,
                                  unidad: f.unidad_base || 'pieza',
                                  controlado: String(f.controlado || '').toUpperCase() === 'SI',
                                  sistema: 0, lotes: 0 };
    porSku[k].sistema = Math.round((porSku[k].sistema + Number(x.cantidad || 0)) * 1000) / 1000;
    porSku[k].lotes++;
  });

  var elegido = null;
  almacenes.forEach(function (u) { if ((u.ubic_id || u.id) === ubic) elegido = u; });
  CONTEO = { ubic_id: ubic, nombre: (elegido || almacenes[0] || {}).nombre || ubic,
             almacenes: almacenes, filas: Object.keys(porSku).map(function (k) { return porSku[k]; }),
             contado: {}, clase: {}, nota: {}, destino: {},
             contado_por: '', notaFolio: '', client_id: idCliente() };
  CONTEO.filas.sort(function (a, b) { return String(a.nombre).localeCompare(String(b.nombre)); });
  pintarConteoNuevo('');
}

function alcanceCubreFront_(u) {
  var a = (estado.cat || {}).alcance;
  if (!a || !a.length) return true;
  return a.indexOf(String(u || '').toUpperCase()) >= 0;
}

function pintarConteoNuevo(busca) {
  var q = plano(busca || '');
  var hay = CONTEO.filas.filter(function (x) {
    if (!q) return true;
    return plano(x.sku + ' ' + x.nombre).indexOf(q) >= 0;
  });
  var capturadas = Object.keys(CONTEO.contado).filter(function (k) {
    return CONTEO.contado[k] !== '' && CONTEO.contado[k] !== undefined;
  });
  var difieren = capturadas.filter(function (k) {
    var f = null;
    CONTEO.filas.forEach(function (x) { if (x.sku === k) f = x; });
    return f && Math.abs(Number(CONTEO.contado[k]) - f.sistema) > 0.0001;
  });

  pintar(
    '<div class="card"><h3>' + esc(CONTEO.nombre) + '</h3>' +
    (CONTEO.almacenes.length > 1
      ? '<div class="campo"><label>Almacén</label><select id="kUbic">' +
        CONTEO.almacenes.map(function (u) {
          var id = u.ubic_id || u.id;
          return '<option value="' + esc(id) + '"' +
            (id === CONTEO.ubic_id ? ' selected' : '') + '>' + esc(u.nombre || id) + '</option>';
        }).join('') + '</select></div>'
      : '') +
    '<p class="mini">Escriba lo que <b>contó</b> de cada clave. Lo que deje en blanco se ' +
    'entiende como <b>«no lo conté»</b> y no se toca: para dejar algo en cero hay que ' +
    'teclear el cero.</p>' +
    '<div class="campo"><label>Quién contó</label>' +
    '<input id="kQuien" autocomplete="off" placeholder="Nombre de quien contó el anaquel" value="' +
      esc(CONTEO.contado_por || '') + '"></div></div>' +

    '<div class="card"><h3>' + capturadas.length + ' de ' + CONTEO.filas.length +
      ' claves capturadas' + (difieren.length ? ' · ' + difieren.length + ' con diferencia' : '') +
      '</h3>' +
    '<div class="buscador"><input id="kBusca" placeholder="Filtrar por nombre o clave" ' +
      'autocomplete="off" value="' + esc(busca || '') + '"></div>' +
    (hay.length
      ? hay.map(function (x) {
          var val = CONTEO.contado[x.sku];
          var puesto = val !== '' && val !== undefined;
          var dif = puesto ? Math.round((Number(val) - x.sistema) * 1000) / 1000 : null;
          var cl = CONTEO.clase[x.sku] || (x.controlado ? 'LIBRO' : 'AJUSTE');
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(x.nombre) + '</span>' +
            '<span class="c">' + esc(x.sku) + ' · el sistema dice ' + x.sistema + ' ' +
              esc(plural(x.unidad)) + ' en ' + x.lotes + ' lote(s)' +
              (dif !== null && dif !== 0
                ? ' · <b>' + (dif > 0 ? 'sobran ' + dif : 'faltan ' + (-dif)) + '</b>'
                : (puesto ? ' · cuadra' : '')) + '</span></span>' +
            (x.controlado ? '<span class="pill p-crit">libro</span>' : '') +
            '<input class="kC" data-sku="' + esc(x.sku) + '" type="number" inputmode="decimal" ' +
              'min="0" step="any" placeholder="—" style="width:5.5em;margin:0" value="' +
              esc(puesto ? String(val) : '') + '">' +
            '</div>' +
            (dif !== null && dif !== 0 && !x.controlado
              ? '<div class="campo" style="margin:0 0 10px 0"><label>¿Qué pasó con ' +
                esc(x.nombre) + '?</label><select class="kK" data-sku="' + esc(x.sku) + '">' +
                Object.keys(CONTEO_CLASES_UI).filter(function (k) { return k !== 'LIBRO'; })
                  .map(function (k) {
                    return '<option value="' + k + '"' + (cl === k ? ' selected' : '') + '>' +
                      esc(CONTEO_CLASES_UI[k][0]) + '</option>';
                  }).join('') + '</select>' +
                '<p class="mini">' + esc((CONTEO_CLASES_UI[cl] || ['', ''])[1]) + '</p>' +
                (cl === 'TRASPASO'
                  ? '<input class="kD" data-sku="' + esc(x.sku) + '" autocomplete="off" ' +
                    'placeholder="Clave de la ubicación a donde se movió" value="' +
                    esc(CONTEO.destino[x.sku] || '') + '">'
                  : '') +
                '<input class="kN" data-sku="' + esc(x.sku) + '" autocomplete="off" ' +
                  'placeholder="Nota (opcional)" value="' + esc(CONTEO.nota[x.sku] || '') + '">' +
                '</div>'
              : '');
        }).join('')
      : '<p class="mini">' + (busca ? 'Nada con eso.' : 'Este almacén no tiene existencia.') +
        '</p>') +
    '</div>' +

    '<div class="card"><h3>Nota del conteo</h3>' +
    '<textarea id="kNota" rows="2" placeholder="Opcional">' + esc(CONTEO.notaFolio || '') +
    '</textarea></div>' +

    (capturadas.length
      ? '<div class="aviso a-info">Se van a mandar <b>' + capturadas.length + '</b> clave(s), ' +
        'las que tienen número. Las otras ' + (CONTEO.filas.length - capturadas.length) +
        ' se quedan como están.</div>'
      : '<div class="aviso a-warn">Todavía no has capturado ninguna clave.</div>') +
    '<button class="b-dark" id="kAbrir"' + (capturadas.length ? '' : ' disabled') +
      '>Abrir el conteo</button>' +
    '<button class="b-ghost" id="kV">Volver sin guardar</button>');

  function recordar() {
    if ($('kQuien')) CONTEO.contado_por = $('kQuien').value;
    if ($('kNota')) CONTEO.notaFolio = $('kNota').value;
    Array.prototype.forEach.call(document.querySelectorAll('.kC'), function (i) {
      CONTEO.contado[i.getAttribute('data-sku')] = i.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('.kK'), function (i) {
      CONTEO.clase[i.getAttribute('data-sku')] = i.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('.kD'), function (i) {
      CONTEO.destino[i.getAttribute('data-sku')] = i.value;
    });
    Array.prototype.forEach.call(document.querySelectorAll('.kN'), function (i) {
      CONTEO.nota[i.getAttribute('data-sku')] = i.value;
    });
  }
  CONTEO.recordar = recordar;

  if ($('kQuien')) $('kQuien').oninput = recordar;
  if ($('kNota')) $('kNota').oninput = recordar;
  Array.prototype.forEach.call(document.querySelectorAll('.kC'), function (i) {
    i.onchange = function () { recordar(); pintarConteoNuevo($('kBusca') ? $('kBusca').value : ''); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.kK'), function (i) {
    i.onchange = function () { recordar(); pintarConteoNuevo($('kBusca') ? $('kBusca').value : ''); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.kD'), function (i) { i.oninput = recordar; });
  Array.prototype.forEach.call(document.querySelectorAll('.kN'), function (i) { i.oninput = recordar; });

  if ($('kUbic')) $('kUbic').onchange = function () {
    if (Object.keys(CONTEO.contado).length &&
        !confirm('Cambiar de almacén borra lo que llevas capturado. ¿Seguir?')) {
      this.value = CONTEO.ubic_id; return;
    }
    pantallaConteoNuevo(this.value);
  };
  $('kBusca').onkeydown = function (e) {
    if (e.key === 'Enter') { recordar(); pintarConteoNuevo(this.value); }
  };
  $('kBusca').onchange = function () { recordar(); pintarConteoNuevo(this.value); };
  $('kAbrir').onclick = abrirConteo;
  $('kV').onclick = function () { pantallaConteos(); };
}

async function abrirConteo() {
  CONTEO.recordar();
  if (!String(CONTEO.contado_por || '').trim()) {
    return alertar('Falta quién contó. Un ajuste de inventario no va sin nombre.');
  }

  var lineas = [];
  CONTEO.filas.forEach(function (x) {
    var v = CONTEO.contado[x.sku];
    if (v === '' || v === undefined || v === null) return;   // no contada: no se toca
    var n = Number(v);
    if (!(n >= 0)) return;
    lineas.push({ ubic_id: CONTEO.ubic_id, sku: x.sku, contado: n,
                  clase: x.controlado ? 'LIBRO' : (CONTEO.clase[x.sku] || 'AJUSTE'),
                  destino: CONTEO.destino[x.sku] || '',
                  nota: CONTEO.nota[x.sku] || '' });
  });
  if (!lineas.length) return alertar('No capturaste ninguna clave.');

  if (!confirm('Se va a abrir un conteo con ' + lineas.length + ' clave(s). Todavía no se ' +
               'mueve nada: el ajuste se escribe hasta que lo revises y lo autorices. ¿Seguir?')) return;

  var b = $('kAbrir');
  b.disabled = true; b.textContent = 'Abriendo…';
  var r;
  try {
    /* `almacen` es el campo que el motor guarda en la cabecera del folio;
       cada línea lleva además su propia ubicación. */
    r = await enviar({ accion: 'conteo_abrir', almacen: CONTEO.ubic_id,
      contado_por: CONTEO.contado_por.trim(), nota: CONTEO.notaFolio || '',
      lineas: lineas, client_id: CONTEO.client_id }, true);
  } catch (e) {
    b.disabled = false; b.textContent = 'Abrir el conteo';
    return alertar('No se abrió: ' + e.message);
  }
  if (!r.ok) {
    b.disabled = false; b.textContent = 'Abrir el conteo';
    if (r.problemas && r.problemas.length) {
      return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
        '<div class="card">' + r.problemas.map(function (x) {
          return '<p class="mini">· ' + esc(x) + '</p>';
        }).join('') + (r.mas ? '<p class="mini">y ' + r.mas + ' más</p>' : '') + '</div>' +
        '<button class="b-ghost" onclick="pintarConteoNuevo(\'\')">Corregir</button>');
    }
    return alertar(r.error);
  }
  pantallaConteoPlan(r.conteo_id);
}

/* ---------------- el plan, y aplicarlo ---------------- */

var ESTADO_UI = {
  LISTA:       ['p-warn', 'va a ajustar'],
  CUADRA:      ['p-ok', 'cuadra'],
  BLOQUEADA:   ['p-crit', 'no se puede'],
  AL_LIBRO:    ['p-info', 'al libro'],
  YA_APLICADA: ['p-ok', 'ya aplicada']
};

async function pantallaConteoPlan(id) {
  encabezado('Conteo ' + id, 'Qué va a escribir, antes de escribirlo');
  pintar('<div class="card"><p class="sub">Armando el plan…</p></div>');
  var r;
  try {
    r = await enviar({ accion: 'conteo_previo', conteo_id: id }, true);
  } catch (e) {
    return pintar('<div class="aviso a-err">Sin conexión.</div>' +
      '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
    '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');

  var s = r.resumen || {};
  var cerrado = String(r.estado || '').toUpperCase() !== 'ABIERTO';

  pintar(
    '<div class="card"><h3>' + esc(r.conteo_id) + '</h3>' +
    '<p class="mini mono">' + esc(r.fecha || '') + ' · contó ' + esc(r.contado_por || '—') + '</p>' +
    '<p class="mini">' + (s.CUADRA || 0) + ' cuadran · ' + (s.LISTA || 0) + ' por ajustar · ' +
      (s.BLOQUEADA || 0) + ' bloqueadas · ' + (s.AL_LIBRO || 0) + ' al libro · ' +
      (s.YA_APLICADA || 0) + ' ya aplicadas</p>' +
    (r.nota ? '<p class="mini">' + esc(r.nota) + '</p>' : '') + '</div>' +

    (r.avisos && r.avisos.length
      ? '<div class="aviso a-warn">' + r.avisos.map(esc).join('<br>') + '</div>' : '') +

    (r.movimientos
      ? '<div class="aviso a-info">Autorizar esto escribe <b>' + r.movimientos +
        ' movimiento(s)</b> de inventario. No se deshacen desde la app: se corrigen con otro ' +
        'conteo o anulando el folio.</div>'
      : '') +

    r.plan.map(function (x) {
      var ui = ESTADO_UI[x.estado] || ['p-neutral', x.estado];
      return '<div class="card"><h3>' + esc(x.nombre || x.sku) + '</h3>' +
        '<p class="mini mono">' + esc(x.sku) + ' · sistema ' + x.sistema + ' · contado ' +
          x.contado + ' · ' + (x.diferencia > 0 ? 'sobran ' + x.diferencia
            : (x.diferencia < 0 ? 'faltan ' + (-x.diferencia) : 'cuadra')) + '</p>' +
        '<span class="pill ' + ui[0] + '">' + esc(ui[1]) + '</span>' +
        (x.porque ? '<p class="mini">' + esc(x.porque) + '</p>' : '') +
        (x.nota ? '<p class="mini">' + esc(x.nota) + '</p>' : '') +
        (x.movs && x.movs.length
          ? x.movs.map(function (m) {
              return '<div class="fila-lote"><span class="t">' +
                '<span class="n">' + esc(m.tipo) + ' · ' + m.cantidad + '</span>' +
                '<span class="c">' + esc(m.lote_id) +
                  (m.caducidad ? ' · cad ' + esc(m.caducidad) : '') +
                  ' · ' + esc(m.ubic_origen) + (m.ubic_destino ? ' → ' + esc(m.ubic_destino) : '') +
                  '</span></span></div>';
            }).join('')
          : '') + '</div>';
    }).join('') +

    ((s.LISTA || 0) && !cerrado
      ? '<button class="b-dark" id="kAplicar">Autorizar y aplicar ' + (s.LISTA || 0) + ' ajuste(s)</button>'
      : '') +
    ((s.YA_APLICADA || 0)
      ? '<button class="b-ghost" id="kMovs">Ver los movimientos que dejó</button>' : '') +
    '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');

  if ($('kAplicar')) $('kAplicar').onclick = async function () {
    if (!confirm('Se van a escribir ' + r.movimientos + ' movimiento(s) de inventario a su ' +
                 'nombre. ¿Autorizar?')) return;
    this.disabled = true; this.textContent = 'Aplicando…';
    var a;
    try {
      a = await enviar({ accion: 'conteo_aplicar', conteo_id: r.conteo_id,
                         movimientos_esperados: r.movimientos }, true);
    } catch (e) {
      return alertar('No se aplicó: ' + e.message);
    }
    if (!a.ok) return alertar(a.error);
    alertar(a.mensaje || 'Aplicado.');
    pantallaConteoPlan(r.conteo_id);
  };
  if ($('kMovs')) $('kMovs').onclick = function () { pantallaConteoMovs(r.conteo_id); };
}

async function pantallaConteoMovs(id) {
  encabezado('Conteo ' + id, 'Qué quedó escrito');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try {
    r = await enviar({ accion: 'conteo_movimientos', conteo_id: id }, true);
  } catch (e) {
    return pintar('<div class="aviso a-err">Sin conexión.</div>' +
      '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
    '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');

  pintar(
    (r.movimientos.length
      ? '<div class="card"><h3>' + r.movimientos.length + ' movimiento(s)</h3>' +
        r.movimientos.map(function (m) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(m.nombre || m.sku) + ' · ' + m.cantidad + '</span>' +
            '<span class="c">' + esc(m.tipo) + ' · ' + esc(m.lote_id) + ' · ' +
              esc(selloCortoFront_(m.timestamp)) + ' · ' + esc(m.usuario || '') + '</span></span>' +
            (m.reversa ? '<span class="pill p-crit">reversa</span>' : '') + '</div>';
        }).join('') + '</div>'
      : '<div class="aviso a-info">Ese conteo no dejó movimientos.</div>') +
    '<button class="b-ghost" onclick="pantallaConteos()">Volver</button>');
}

function selloCortoFront_(v) { return String(v || '').slice(0, 16); }

/* =================================================================
   Reporte de aplicaciones

   Un solo reporte con varios cortes, no una pantalla por pregunta: la
   operación quiere saber qué se aplicó esta semana y quien pone precios
   quiere saber cuánto material cuesta en promedio un tratamiento. Es la
   misma materia prima cortada distinto, y separarla en dos pantallas es
   como terminan contradiciéndose a los seis meses.

   El importe sólo aparece para quien puede ver costos. Para los demás el
   reporte sigue sirviendo: cantidades, tratamientos y quién aplicó.
   ================================================================= */

var REPORTE = { periodo: 'dia', fecha: '' };

async function pantallaReporte(periodo, fecha) {
  REPORTE.periodo = periodo || REPORTE.periodo || 'dia';
  REPORTE.fecha = fecha || REPORTE.fecha || hoyFront_();

  encabezado('Reporte de aplicaciones', 'Qué se aplicó y qué costó en material');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');

  var r;
  try {
    r = await enviar({ accion: 'aplicaciones_reporte',
                       periodo: REPORTE.periodo, fecha: REPORTE.fecha }, true);
  } catch (e) {
    return pintar('<div class="aviso a-err">Sin conexión.</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
    '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  var s = r.resumen;
  var dinero = function (v) { return r.ve_costo && v !== null && v !== undefined ? pesos(v) : ''; };

  pintar(
    '<div class="card">' +
    '<div class="rejilla">' +
    ['dia', 'semana', 'mes'].map(function (k) {
      var txt = k === 'dia' ? 'Día' : (k === 'semana' ? 'Semana' : 'Mes');
      return '<button class="' + (REPORTE.periodo === k ? 'b-dark' : 'b-ghost') +
        '" data-per="' + k + '">' + txt + '</button>';
    }).join('') + '</div>' +
    '<div class="campo"><label>Fecha de referencia</label>' +
    '<input id="rFecha" type="date" value="' + esc(REPORTE.fecha) + '"></div>' +
    '<p class="mini mono">' + esc(r.periodo.etiqueta) + ' · ' +
      esc(r.periodo.desde) + ' al ' + esc(r.periodo.hasta) + '</p></div>' +

    '<div class="card"><h3>' + s.aplicaciones + ' aplicación(es)</h3>' +
    '<p class="mini">' + s.pacientes + ' paciente(s) · ' + s.piezas + ' pieza(s)' +
      (r.ve_costo && s.importe !== null ? ' · <b>' + pesos(s.importe) + '</b> de material' : '') +
      '</p>' +
    (s.sin_justificar
      ? '<p class="mini"><span class="pill p-crit">' + s.sin_justificar +
        ' sin justificar</span></p>' : '') +
    (s.retoques ? '<p class="mini">' + s.retoques + ' retoque(s)</p>' : '') +
    '</div>' +

    (r.aviso ? '<div class="aviso a-warn">' + esc(r.aviso) + '</div>' : '') +

    (r.por_tratamiento.length
      ? '<div class="card"><h3>Por tratamiento</h3>' +
        (r.ve_costo
          ? '<p class="mini">El promedio sale sólo de las aplicaciones costeadas al 100 %. ' +
            'Es el número que sirve para sustentar un precio.</p>'
          : '') +
        r.por_tratamiento.map(function (t) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(t.tratamiento) + '</span>' +
            '<span class="c">' + t.aplicaciones + ' aplicación(es) · ' + t.piezas +
              ' pieza(s) · ' + t.piezas_promedio + ' por aplicación' +
              (r.ve_costo
                ? (t.costo_promedio !== null
                    ? ' · <b>' + pesos(t.costo_promedio) + '</b> en promedio'
                    : ' · sin costo: ningún folio costeado')
                : '') +
              (t.sin_precio ? ' · ' + t.sin_precio + ' sin precio' : '') +
              '</span></span></div>';
        }).join('') + '</div>'
      : '') +

    (r.por_producto.length
      ? '<div class="card"><h3>Por producto</h3>' +
        (r.ve_costo
          ? '<p class="mini">Aqu\u00ed se suma todo rengl\u00f3n con precio de lote, aunque su ' +
            'aplicaci\u00f3n haya quedado incompleta. Por eso este total es mayor que el de ' +
            'arriba, que s\u00f3lo cuenta aplicaciones costeadas al 100 %.</p>'
          : '') +
        r.por_producto.map(function (x) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(x.nombre) + '</span>' +
            '<span class="c">' + x.piezas + ' ' + esc(plural(x.unidad)) +
              (r.ve_costo && x.importe !== null ? ' · ' + pesos(x.importe) : '') +
              (x.completo ? '' : ' · falta precio de algún lote') +
              '</span></span></div>';
        }).join('') + '</div>'
      : '') +

    (r.por_quien.length > 1
      ? '<div class="card"><h3>Quién registró</h3>' +
        r.por_quien.map(function (x) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(x.quien) + '</span>' +
            '<span class="c">' + x.aplicaciones + ' aplicación(es) · ' + x.piezas +
              ' pieza(s)</span></span></div>';
        }).join('') + '</div>'
      : '') +

    (Object.keys(r.por_justificacion || {}).length
      ? '<div class="card"><h3>Por razón de cobro</h3>' +
        Object.keys(r.por_justificacion).map(function (k) {
          var nom = (typeof JUST_TEXTO !== 'undefined' && JUST_TEXTO[k]) ? JUST_TEXTO[k][0] : k;
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(nom) + '</span>' +
            '<span class="c">' + r.por_justificacion[k] + ' aplicación(es)</span></span>' +
            (k === 'PENDIENTE' ? '<span class="pill p-crit">sin resolver</span>' : '') +
            '</div>';
        }).join('') + '</div>'
      : '') +

    (r.detalle.length
      ? '<details class="mas"><summary>Ver las ' + r.detalle.length +
        ' aplicación(es) una por una</summary><div>' +
        r.detalle.map(function (d) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(d.paciente || '(sin paciente)') + '</span>' +
            '<span class="c">' + esc(d.fecha) + ' · ' + esc(d.folio) +
              (d.tratamiento ? ' · ' + esc(d.tratamiento) : '') +
              ' · ' + d.piezas + ' pieza(s)' +
              (r.ve_costo && d.importe !== null ? ' · ' + pesos(d.importe) : '') +
              '</span></span>' +
            (d.justificacion === 'PENDIENTE'
              ? '<span class="pill p-crit">sin justificar</span>' : '') +
            '</div>';
        }).join('') + '</div></details>'
      : '<div class="aviso a-info">No hubo aplicaciones en ese periodo.</div>') +

    '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  Array.prototype.forEach.call(document.querySelectorAll('[data-per]'), function (b) {
    b.onclick = function () { pantallaReporte(this.getAttribute('data-per'), REPORTE.fecha); };
  });
  $('rFecha').onchange = function () { pantallaReporte(REPORTE.periodo, this.value); };
}

function ctxAplicacion() {
  return (estado.cat && estado.cat.aplicacion) || { activa: false, exclusiva: false, ubicaciones: [] };
}
function aplicaActiva() { return !!ctxAplicacion().activa; }
/* Exclusiva: todo su alcance aplica a paciente. Es la señal para esconder
   las fichas de quirófano, no sólo para enseñar la suya. */
function soloAplicacion() { return !!ctxAplicacion().exclusiva; }

var APLIC = null;   // lo que se está capturando

/* Con más de un almacén que aplica, primero se escoge. Con uno solo no se
   pregunta nada: una pantalla intermedia que siempre tiene una sola
   respuesta es una pantalla de más. */
function pantallaAplicar(ubicId) {
  var opciones = ctxAplicacion().ubicaciones || [];
  if (!ubicId && opciones.length > 1) return pantallaAplicarElegir();
  return abrirAplicar(ubicId || (opciones[0] || {}).ubic_id || '');
}

function pantallaAplicarElegir(aviso) {
  var opciones = ctxAplicacion().ubicaciones || [];
  encabezado('Aplicar a paciente', '¿De cuál almacén?');
  pintar(
    (aviso ? '<div class="aviso a-err">' + esc(aviso) + '</div>' : '') +
    '<div class="card"><h3>¿De cuál almacén sale?</h3>' +
    '<p class="mini">Cada sede tiene su propio inventario. Lo que escojas aquí es de donde ' +
    'se va a descontar, así que el material de una clínica no se puede cargar a la otra ' +
    'por descuido.</p></div>' +
    opciones.map(function (u) {
      return '<button class="baldosa fuerte ancha" data-ubic="' + esc(u.ubic_id) + '">' +
        esc(u.nombre) +
        (u.sede ? '<span class="q">' + esc(u.sede) + '</span>' : '') + '</button>';
    }).join('') +
    '<button class="b-ghost" id="eV">Volver</button>');

  Array.prototype.forEach.call(document.querySelectorAll('[data-ubic]'), function (b) {
    b.onclick = function () { abrirAplicar(this.getAttribute('data-ubic')); };
  });
  $('eV').onclick = function () { pantallaInicio(); };
}

async function abrirAplicar(ubicId) {
  encabezado('Aplicar a paciente', 'Descontar del almacén');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');

  var ubic = ubicId || (ctxAplicacion().ubicaciones[0] || {}).ubic_id || '';
  var r;
  try {
    r = await enviar({ accion: 'aplicacion_disponible', ubic_id: ubic }, true);
  } catch (e) {
    return pintar('<div class="aviso a-err">Sin conexión. Aplicar necesita señal, ' +
      'porque valida contra la existencia real.</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');
  }
  /* Si el servidor contesta que falta escoger, se escoge: es el caso de
     quien llega con varios almacenes y ninguno seleccionado. */
  if (!r.ok && r.elegir) return pantallaAplicarElegir(r.error);
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
    '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  APLIC = { ubic_id: r.ubic_id, nombre: r.nombre, sede: r.sede || '', lotes: r.lotes,
            pacientes: r.pacientes || [], lineas: [], client_id: idCliente(),
            /* La paciente sale de la cita, no del teclado. */
            cita: null, cita_id: '', sinCita: false, just: {} };
  pintarAplicar('');
  /* La agenda se pide después de pintar: la pantalla ya sirve para poner
     lotes mientras el calendario contesta, y si no contesta nunca, el
     almacén no se queda bloqueado. */
  await cargarCitasAplicar(hoyFront_());
  pintarAplicar('');
}

/** Lo que queda de un lote después de lo ya puesto en esta misma captura. */
function restanteDe(loteId) {
  var l = null;
  APLIC.lotes.forEach(function (x) { if (x.lote_id === loteId) l = x; });
  if (!l) return 0;
  var usado = 0;
  APLIC.lineas.forEach(function (x) { if (x.lote_id === loteId) usado += Number(x.cantidad); });
  return Math.round((l.cantidad - usado) * 1000) / 1000;
}

function pintarAplicar(busca) {
  var q = plano(busca || '');
  var hay = APLIC.lotes.filter(function (x) {
    if (restanteDe(x.lote_id) <= 0) return false;
    if (!q) return true;
    return plano(x.sku + ' ' + x.nombre + ' ' + x.lote_id + ' ' + (x.lote_proveedor || '')).indexOf(q) >= 0;
  });

  /* El que caduca primero de cada clave va marcado. No se impone: hay
     razones legítimas para sacar otro, pero quien captura tiene que verlo.
     Con un solo lote la marca sobra: no hay contra qué compararlo, y una
     etiqueta que siempre aparece deja de leerse. */
  var primero = {}, cuantos = {};
  hay.forEach(function (x) {
    cuantos[x.sku] = (cuantos[x.sku] || 0) + 1;
    if (!x.caducidad) return;
    if (!primero[x.sku] || x.caducidad < primero[x.sku]) primero[x.sku] = x.caducidad;
  });

  var puesto = APLIC.lineas.reduce(function (a, x) { return a + Number(x.cantidad); }, 0);

  pintar(
    '<div class="card"><h3>' + esc(APLIC.nombre) + '</h3>' +
    (APLIC.sede ? '<p class="mini mono">' + esc(APLIC.sede) + '</p>' : '') +
    '<p class="mini">Lo que se aplique aquí se descuenta de este almacén y queda a nombre de ' +
    'la paciente, con su lote. No abre caja de cirugía ni genera cobro.' +
    ((ctxAplicacion().ubicaciones || []).length > 1
      ? ' <a href="#" id="aCambiar">Cambiar de almacén</a>.'
      : '') + '</p>' +
    '</p></div>' +

    tarjetaCita() +
    tarjetaIdentidad() +
    tarjetaEntorno() +

    (APLIC.lineas.length
      ? '<div class="card"><h3>' + APLIC.lineas.length + ' renglón(es) · ' +
        puesto + ' pieza(s)</h3>' +
        APLIC.lineas.map(function (x, i) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(x.nombre) + ' · ' + x.cantidad + ' ' +
              esc(x.cantidad === 1 ? x.unidad : plural(x.unidad)) + '</span>' +
            '<span class="c">' + esc(x.lote_id) +
              (x.caducidad ? ' · cad ' + esc(x.caducidad) : '') + '</span></span>' +
            '<button class="b-ghost" data-quitar="' + i + '" style="width:auto;margin:0">Quitar</button>' +
            '</div>';
        }).join('') + '</div>'
      : '') +

    '<div class="card"><h3>Agregar</h3>' +
    '<div class="buscador">' +
    '<input id="aBusca" placeholder="Busca el insumo o escanea…" autocomplete="off" value="' +
      esc(busca || '') + '">' +
    '<button class="b-dark" id="aEscan">Escanear</button></div>' +
    (hay.length
      ? hay.slice(0, 40).map(function (x) {
          var urge = x.caducidad && x.caducidad === primero[x.sku] && cuantos[x.sku] > 1;
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(x.nombre) + '</span>' +
            '<span class="c">' + esc(x.lote_id) + ' · quedan ' + restanteDe(x.lote_id) +
              ' ' + esc(plural(x.unidad)) +
              (x.caducidad ? ' · cad ' + esc(x.caducidad) : ' · sin caducidad') + '</span></span>' +
            (x.controlado
              ? '<span class="pill p-crit">libro</span>'
              : (urge ? '<span class="pill p-warn">sale primero</span>' : '')) +
            (x.controlado ? ''
              : '<button class="b-dark" data-poner="' + esc(x.lote_id) +
                '" style="width:auto;margin:0">Poner</button>') +
            '</div>';
        }).join('')
      : '<p class="mini">' + (busca
          ? 'Nada con eso en este almacén.'
          : 'Este almacén no tiene existencia.') + '</p>') +
    '</div>' +

    '<div class="card"><h3>Nota</h3>' +
    '<p class="mini">Opcional: el procedimiento, la zona, lo que haga falta para entender ' +
    'después por qué salió esto.</p>' +
    '<textarea id="aNota" rows="2" placeholder="Opcional">' + esc(APLIC.nota || '') + '</textarea></div>' +

    tarjetaJustificacion() +

    '<div class="aviso a-info" id="aFalta" style="display:none"></div>' +
    '<button class="b-dark" id="aGuardar" disabled' +
      '>Registrar la aplicación</button>' +
    '<button class="b-ghost" id="aV">Volver sin guardar</button>');

  var repintar = function () { pintarAplicar($('aBusca') ? $('aBusca').value : ''); };
  cablearCita(repintar);
  cablearIdentidad(repintar);
  cablearEntorno(repintar);
  cablearJustificacion(repintar);
  actualizarFalta();

  function recordar() {
    /* `aPac` sólo existe cuando la paciente no está en la agenda. */
    if ($('aPac')) APLIC.paciente = $('aPac').value;
    if ($('aNota')) APLIC.nota = $('aNota').value;
    if (APLIC.recordarJ) APLIC.recordarJ();
  }
  /* El nombre tecleado se refleja en el buscador de la base SIN repintar.
     Repintar al salir del campo -que es lo que hacía esto antes- le tiraba
     el renglón puesto a quien estaba capturando: el arreglo no puede
     costarle trabajo a quien aplica. */
  if ($('aPac')) $('aPac').oninput = function () {
    recordar(); actualizarFalta();
    if ($('pBusca') && APLIC.pacQ === undefined) $('pBusca').value = this.value;
  };
  if ($('aNota')) $('aNota').oninput = recordar;

  /* Cambiar de almacén tira los renglones puestos: son lotes del otro
     inventario y no se pueden arrastrar. Se avisa antes en vez de
     descubrirlo al guardar. */
  if ($('aCambiar')) $('aCambiar').onclick = function (e) {
    e.preventDefault();
    if (APLIC.lineas.length &&
        !confirm('Tienes ' + APLIC.lineas.length + ' renglón(es) puestos de ' +
                 APLIC.nombre + '. Al cambiar de almacén se quitan, porque son lotes ' +
                 'de ese inventario. ¿Cambiar?')) return;
    pantallaAplicarElegir();
  };

  var lanzar = function () { recordar(); pintarAplicar($('aBusca').value); };
  $('aBusca').onkeydown = function (e) { if (e.key === 'Enter') lanzar(); };
  $('aBusca').onchange = lanzar;
  $('aEscan').onclick = function () {
    recordar();
    leerCodigo({
      alLeer: function (txt) {
        var folio = String(txt || '').trim().toUpperCase();
        var existe = APLIC.lotes.some(function (x) { return x.lote_id === folio; });
        pintarAplicar(existe ? folio : folio);
        if (!existe) alertar('Ese folio no tiene existencia en este almacén.');
      },
      alTeclear: function () { pintarAplicar(''); },
      alCancelar: function () { pintarAplicar($('aBusca') ? $('aBusca').value : ''); }
    });
  };

  Array.prototype.forEach.call(document.querySelectorAll('[data-poner]'), function (b) {
    b.onclick = function () {
      recordar();
      var loteId = this.getAttribute('data-poner');
      var queda = restanteDe(loteId);
      var txt = prompt('¿Cuántas piezas? Quedan ' + queda + '.', '1');
      if (txt === null) return;
      var cant = parseFloat(String(txt).trim());
      if (!(cant > 0)) return alertar('La cantidad tiene que ser mayor que cero.');
      if (cant - queda > 0.0001) return alertar('No alcanza: quedan ' + queda + '.');
      var l = null;
      APLIC.lotes.forEach(function (x) { if (x.lote_id === loteId) l = x; });
      APLIC.lineas.push({ sku: l.sku, lote_id: l.lote_id, cantidad: cant,
                          nombre: l.nombre, unidad: l.unidad, caducidad: l.caducidad });
      pintarAplicar('');
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-quitar]'), function (b) {
    b.onclick = function () {
      recordar();
      APLIC.lineas.splice(Number(this.getAttribute('data-quitar')), 1);
      pintarAplicar($('aBusca') ? $('aBusca').value : '');
    };
  });

  $('aGuardar').onclick = guardarAplicacion;
  $('aV').onclick = function () { pantallaInicio(); };
}

async function guardarAplicacion() {
  if ($('aPac')) APLIC.paciente = $('aPac').value.trim();
  if ($('aNota')) APLIC.nota = $('aNota').value.trim();
  if (APLIC.recordarJ) APLIC.recordarJ();

  var falta = faltaParaAplicar();
  if (falta) return alertar(falta);

  var j = APLIC.just || {};
  var piezas = APLIC.lineas.reduce(function (a, x) { return a + Number(x.cantidad); }, 0);
  if (!confirm('Se van a descontar ' + piezas + ' pieza(s) de ' + APLIC.nombre +
               ' a nombre de ' + APLIC.paciente + ', como ' +
               (JUST_TEXTO[j.tipo] ? JUST_TEXTO[j.tipo][0].toLowerCase() : j.tipo) +
               '. Esto no se deshace desde la app. ¿Registrar?')) return;

  var b = $('aGuardar');
  b.disabled = true; b.textContent = 'Registrando…';
  var r;
  try {
    r = await enviar({ accion: 'aplicacion_guardar', ubic_id: APLIC.ubic_id,
      paciente: APLIC.paciente, nota: APLIC.nota,
      /* Las dos llaves de la paciente y dónde se aplicó. Si no se pudo
         identificar van vacías y el backend guarda por nombre, como antes. */
      paciente_id: (APLIC.pac && APLIC.pac.id) || '',
      paciente_folio: (APLIC.pac && APLIC.pac.folio) || '',
      entorno: APLIC.entorno || '',
      cita_id: APLIC.cita_id || '',
      /* El tratamiento se copia de la cita y se guarda con el movimiento:
         es lo que después permite saber cuánto material cuesta un Botox sin
         volver a preguntarle a la agenda. */
      procedimiento: (APLIC.cita && APLIC.cita.procedimiento) || '',
      justificacion: j.tipo || '', folio_cobro: j.folio_cobro || '',
      folio_original: j.folio_original || '', monto_directo: j.monto || '',
      nota_cobro: j.nota || '',
      lineas: APLIC.lineas.map(function (x) {
        return { sku: x.sku, lote_id: x.lote_id, cantidad: x.cantidad };
      }), client_id: APLIC.client_id }, true);
  } catch (e) {
    b.disabled = false; b.textContent = 'Registrar la aplicación';
    return alertar('No se registró: ' + e.message);
  }
  if (!r.ok) {
    b.disabled = false; b.textContent = 'Registrar la aplicación';
    return alertar(r.error);
  }

  encabezado('Aplicación registrada', esc(r.folio || ''));
  pintar(
    '<div class="aviso a-ok">' + (r.duplicado
      ? 'Esa aplicación ya estaba registrada. No se descontó dos veces.'
      : r.renglones + ' renglón(es) descontados de ' + esc(r.nombre_ubic) + '.') + '</div>' +
    /* Si la justificación no pasó, el material igual salió: se dice cuál de
       las dos cosas ocurrió en vez de dar un «listo» que tapa la mitad. */
    (r.justificacion && r.justificacion.error
      ? '<div class="aviso a-warn">La salida quedó registrada, pero sin justificar: ' +
        esc(r.justificacion.error) + ' Sale en el cuadre hasta que se resuelva.</div>'
      : (r.justificacion && r.justificacion.tipo && r.justificacion.tipo !== 'PENDIENTE'
          ? '<div class="aviso a-info">Justificada como ' +
            esc((JUST_TEXTO[r.justificacion.tipo] || [r.justificacion.tipo])[0].toLowerCase()) +
            '.</div>'
          : '')) +
    (r.duplicado || r.paciente_id ? '' :
      '<div class="aviso a-warn">Quedó guardada con el nombre escrito, sin número de ' +
      'paciente. El cobro y la nota clínica de esta aplicación se van a tener que ' +
      'amarrar a mano.</div>') +
    (r.duplicado ? '' :
      '<div class="card"><h3>' + esc(r.paciente) + '</h3>' +
      '<p class="mini mono">' + esc(r.folio) + ' · ' + esc(r.fecha) +
        (r.paciente_id ? ' · Nº ' + esc(r.paciente_id) : '') +
        (r.entorno_nombre ? ' · ' + esc(r.entorno_nombre) : '') + '</p>' +
      r.detalle.map(function (d) {
        return '<div class="fila-lote"><span class="t">' +
          '<span class="n">' + esc(d.nombre) + ' · ' + d.cantidad + ' ' +
            esc(d.cantidad === 1 ? d.unidad : plural(d.unidad)) + '</span>' +
          '<span class="c">' + esc(d.lote_id) +
            (d.caducidad ? ' · cad ' + esc(d.caducidad) : '') + '</span></span></div>';
      }).join('') + '</div>') +
    '<button class="b-dark" onclick="pantallaAplicar()">Registrar otra</button>' +
    '<button class="b-ghost" onclick="pantallaAplicaciones()">Ver las últimas</button>' +
    '<button class="b-ghost" onclick="pantallaInicio()">Inicio</button>');
}

      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  pintar(
    '<div class="card"><div class="campo"><label>Buscar paciente</label>' +

    (r.aplicaciones.length
      ? r.aplicaciones.map(function (g) {
          return '<div class="card"><h3>' + esc(g.paciente) + '</h3>' +

              ' · ' + esc(g.ubic_nombre) + '</p>' +
            g.lineas.map(function (l) {
              return '<div class="fila-lote"><span class="t">' +
                '<span class="n">' + esc(l.nombre) + ' · ' + l.cantidad + ' ' +
                  esc(l.cantidad === 1 ? l.unidad : plural(l.unidad)) + '</span>' +
                '<span class="c">' + esc(l.lote_id) +
                  (l.importe !== null && l.importe !== undefined ? ' · ' + pesos(l.importe) : '') +
                  '</span></span></div>';
            }).join('') +
            (g.nota ? '<p class="mini">' + esc(g.nota) + '</p>' : '') +
            (g.importe !== undefined
              ? '<p class="mini"><b>' + pesos(g.importe) + '</b>' +
                (g.completo ? '' : ' · falta el precio de algún lote') + '</p>'

  $('apQ').onkeydown = function (e) { if (e.key === 'Enter') pantallaAplicaciones(this.value); };
  $('apQ').onchange = function () { pantallaAplicaciones(this.value); };

/* =================================================================
   Cotizar material

   Armar una lista desde cero y preguntar cuánto cuesta el material. Para
   los casos que no tienen plantilla: alguien de recepción manda la lista
   de una resección de pólipo y hay que contestarle con un número.

   Dos cosas que la pantalla repite a propósito, porque son las que se
   malinterpretan:

     · Esto NO mueve inventario. No abre caja, no aparta nada.
     · El total es un PISO cuando hay renglones sin precio. La pantalla
       dice cuántos quedaron fuera en vez de completarlos con ceros.
   ================================================================= */

var COTIZA = { nombre: '', filas: [], r: null, busca: '' };

function pantallaCotizar() {
  encabezado('Cotizar material', 'Qué cuesta una lista de insumos');
  COTIZA.r = null;
  pintarCotizar();
}

function catalogoCotizable_() {
  return ((estado.cat || {}).catalogo || []).filter(function (c) {
    return String(c.activo || 'SI').toUpperCase() !== 'NO';
  });
}

function pintarCotizar() {
  var q = plano(COTIZA.busca || '');
  var puestos = {};
  COTIZA.filas.forEach(function (f) { puestos[f.sku] = true; });

  var hallados = !q ? [] : catalogoCotizable_().filter(function (c) {
    if (puestos[String(c.sku).toUpperCase()]) return false;
    return plano(c.sku + ' ' + (c.nombre || '') + ' ' + (c.presentacion || '')).indexOf(q) >= 0;
  }).slice(0, 12);

  pintar(
    '<div class="card">' +
    '<div class="campo"><label>De qué es la cotización</label>' +
    '<input id="cNombre" autocomplete="off" placeholder="Ej. Resección de pólipo" value="' +
      esc(COTIZA.nombre || '') + '"></div>' +
    '<p class="mini">Esto <b>no mueve inventario</b>: no abre caja ni aparta material. ' +
    'Es una pregunta sobre precios, no una salida.</p></div>' +

    '<div class="card"><h3>Agregar insumos</h3>' +
    '<div class="buscador">' +
    '<input id="cBusca" placeholder="Busca por nombre o clave…" autocomplete="off" value="' +
      esc(COTIZA.busca || '') + '">' +
    '<button class="b-dark" id="cEscan">Escanear</button></div>' +
    (q && !hallados.length
      ? '<p class="mini">Nada con eso' + (Object.keys(puestos).length ? ' que no esté ya en la lista' : '') + '.</p>'
      : hallados.map(function (c) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(c.nombre || c.sku) + '</span>' +
            '<span class="c">' + esc(c.sku) +
              (c.presentacion ? ' · ' + esc(c.presentacion) : '') +
              ' · ' + esc(plural(c.unidad_base || 'pieza')) + '</span></span>' +
            (String(c.controlado || '').toUpperCase() === 'SI'
              ? '<span class="pill p-crit">controlado</span>' : '') +
            '<button class="b-dark cAdd" data-sku="' + esc(c.sku) + '" ' +
              'style="width:auto;padding:8px 14px;margin:0">Agregar</button></div>';
        }).join('')) +
    '</div>' +

    (COTIZA.filas.length
      ? '<div class="card"><h3>' + COTIZA.filas.length + ' renglón(es)</h3>' +
        COTIZA.filas.map(function (f, i) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(f.nombre) + '</span>' +
            '<span class="c">' + esc(f.sku) + ' · ' + esc(plural(f.unidad)) + '</span></span>' +
            '<input class="cQ" data-i="' + i + '" type="number" inputmode="decimal" min="0" ' +
              'step="any" style="width:5.5em;margin:0" value="' + esc(String(f.cantidad)) + '">' +
            '<button class="b-ghost cDel" data-i="' + i + '" ' +
              'style="width:auto;padding:8px 12px;margin:0">Quitar</button></div>';
        }).join('') +
        '<button class="b-primary" id="cCalc">Calcular el costo</button>' +
        '<button class="b-ghost" id="cLimpiar">Vaciar la lista</button></div>'
      : '<div class="aviso a-info">Busque arriba y vaya agregando lo que lleva el caso.</div>') +

    (COTIZA.r ? bloqueCotizacion(COTIZA.r) : '') +

    '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  $('cNombre').oninput = function () { COTIZA.nombre = this.value; };
  /* El QR de la etiqueta trae el folio del LOTE, no la clave. Se resuelve
     contra el lote y se agrega la clave de ese lote, que es lo que la
     persona tiene en la mano frente al anaquel. */
  $('cEscan').onclick = function () {
    leerCodigo({
      titulo: 'Escanear para cotizar',
      nota: 'Apunta al código de la etiqueta',
      alLeer: agregarEscaneadoACotizacion,
      alTeclear: function () { pantallaCotizar(); },
      alCancelar: function () { pantallaCotizar(); }
    });
  };
  var b = $('cBusca');
  b.oninput = function () {
    COTIZA.busca = this.value;
    var pos = this.selectionStart;
    pintarCotizar();
    var n = $('cBusca'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
  };

  Array.prototype.forEach.call(document.querySelectorAll('.cAdd'), function (el) {
    el.onclick = function () {
      var sku = String(this.getAttribute('data-sku')).toUpperCase();
      var c = null;
      catalogoCotizable_().forEach(function (x) {
        if (String(x.sku).toUpperCase() === sku) c = x;
      });
      if (!c) return;
      COTIZA.filas.push({ sku: sku, nombre: c.nombre || sku,
                          unidad: c.unidad_base || 'pieza', cantidad: 1 });
      COTIZA.busca = '';
      COTIZA.r = null;
      pintarCotizar();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.cQ'), function (el) {
    el.onchange = function () {
      var i = Number(this.getAttribute('data-i'));
      COTIZA.filas[i].cantidad = Number(this.value || 0);
      COTIZA.r = null;
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('.cDel'), function (el) {
    el.onclick = function () {
      COTIZA.filas.splice(Number(this.getAttribute('data-i')), 1);
      COTIZA.r = null;
      pintarCotizar();
    };
  });
  if ($('cLimpiar')) $('cLimpiar').onclick = function () {
    COTIZA.filas = []; COTIZA.r = null; pintarCotizar();
  };
  if ($('cCalc')) $('cCalc').onclick = calcularCotizacion;
  if ($('cPlantilla')) $('cPlantilla').onclick = guardarComoPlantilla;
  if ($('cCopiar')) $('cCopiar').onclick = copiarCotizacion;
}

/* El código escaneado puede ser un folio de lote (LOT-…) o la clave misma.
   En los dos casos lo que entra a la cotización es la CLAVE: se cotiza
   material, no el frasco que se tenga en la mano. */
async function agregarEscaneadoACotizacion(txt) {
  var v = String(txt || '').trim().toUpperCase();
  pantallaCotizar();
  if (!v) return;

  var sku = v;
  if (/^LOT-/.test(v)) {
    try {
      var r = await enviar({ accion: 'lote_buscar', q: v }, true);
      var l = (r.ok && (r.lotes || [])[0]) || null;
      if (!l) return alertar('No encontré ese folio: ' + v);
      sku = String(l.sku || '').toUpperCase();
    } catch (e) {
      return alertar('Sin conexión: no pude resolver el folio ' + v + '.');
    }
  }

  var c = null;
  catalogoCotizable_().forEach(function (x) {
    if (String(x.sku).toUpperCase() === sku) c = x;
  });
  if (!c) return alertar('Esa clave no está en el catálogo: ' + sku);

  var ya = false;
  COTIZA.filas.forEach(function (f) {
    if (f.sku === sku) { f.cantidad = Number(f.cantidad || 0) + 1; ya = true; }
  });
  if (!ya) {
    COTIZA.filas.push({ sku: sku, nombre: c.nombre || sku,
                        unidad: c.unidad_base || 'pieza', cantidad: 1 });
  }
  COTIZA.r = null;
  pintarCotizar();
}

async function calcularCotizacion() {
  var malas = COTIZA.filas.filter(function (f) { return !(Number(f.cantidad) > 0); });
  if (malas.length) return alertar('Hay renglones sin cantidad. Ponga cuánto lleva de cada uno.');

  $('cCalc').disabled = true;
  $('cCalc').textContent = 'Calculando…';
  var r;
  try {
    r = await enviar({ accion: 'cotizar_material',
                       renglones: COTIZA.filas.map(function (f) {
                         return { sku: f.sku, cantidad: Number(f.cantidad) };
                       }) }, true);
  } catch (e) {
    $('cCalc').disabled = false; $('cCalc').textContent = 'Calcular el costo';
    return alertar('Sin conexión. Una cotización necesita señal: lee los precios de los lotes.');
  }
  if (!r.ok) {
    $('cCalc').disabled = false; $('cCalc').textContent = 'Calcular el costo';
    return alertar(r.error);
  }
  COTIZA.r = r;
  pintarCotizar();
}

function bloqueCotizacion(r) {
  var t = r.total;
  return '<div class="card"><h3>' +
    (r.ve_costo && t.costo !== null ? pesos(t.costo) : t.piezas + ' pieza(s)') +
    (COTIZA.nombre ? ' · ' + esc(COTIZA.nombre) : '') + '</h3>' +

    (r.ve_costo && t.costo !== null
      ? '<p class="mini">' + t.renglones + ' renglón(es) · ' + t.piezas + ' pieza(s) · ' +
        'costeado al ' + t.cobertura + ' %</p>' +
        (t.costo_estimado > 0
          ? '<p class="mini"><b>' + pesos(t.costo_existencia) + '</b> de lo que ya está en el ' +
            'anaquel · <b>' + pesos(t.costo_estimado) + '</b> estimado de lo que habría que ' +
            'comprar, al último precio conocido.</p>'
          : '')
      : '<p class="mini">' + t.renglones + ' renglón(es) · ' + t.piezas + ' pieza(s). ' +
        'Su cuenta no ve costos: esto le dice qué lleva el caso y si hay existencia.</p>') +

    (t.sin_precio ? '<p class="mini"><span class="pill p-crit">' + t.sin_precio +
      ' sin precio</span></p>' : '') +
    (t.sin_existencia ? '<p class="mini"><span class="pill p-warn">' + t.sin_existencia +
      ' sin existencia suficiente</span></p>' : '') +
    (t.controlados ? '<p class="mini"><span class="pill p-info">' + t.controlados +
      ' controlado(s)</span></p>' : '') +
    '</div>' +

    (r.aviso ? '<div class="aviso a-warn">' + esc(r.aviso) + '</div>' : '') +

    '<div class="card"><h3>Renglón por renglón</h3>' +
    r.renglones.map(function (x) {
      return '<div class="fila-lote"><span class="t">' +
        '<span class="n">' + esc(x.nombre) + '</span>' +
        '<span class="c">' + x.cantidad + ' ' + esc(plural(x.unidad)) +
          (r.ve_costo && x.importe !== null ? ' · <b>' + pesos(x.importe) + '</b>' : '') +
          ' · hay ' + x.hay +
          (x.aviso ? ' · ' + esc(x.aviso) : '') +
          '</span></span>' +
        (x.controlado ? '<span class="pill p-crit">controlado</span>' : '') +
        (!x.costeado ? '<span class="pill p-crit">sin precio</span>'
         : x.faltan > 0 ? '<span class="pill p-warn">estimado</span>' : '') +
        '</div>';
    }).join('') + '</div>' +

    '<div class="card">' +
    '<button class="b-dark" id="cCopiar">Copiar el resumen</button>' +
    '<button class="b-ghost" id="cPlantilla">Guardar esta lista como plantilla</button>' +
    '<p class="mini">La plantilla sirve para el siguiente caso igual: queda en «Ver ' +
    'plantillas» y se puede armar desde ahí sin volver a capturarla.</p></div>';
}

/* El resumen se copia en texto plano a propósito: de aquí se pega a un
   WhatsApp o a un correo, que es como recepción pide y contesta esto. */
function copiarCotizacion() {
  var r = COTIZA.r; if (!r) return;
  var t = r.total;
  var l = [];
  l.push('Material · ' + (COTIZA.nombre || 'cotización'));
  l.push('');
  r.renglones.forEach(function (x) {
    l.push('· ' + x.nombre + ' — ' + x.cantidad + ' ' + plural(x.unidad) +
      (r.ve_costo && x.importe !== null ? '  ' + pesos(x.importe) : '') +
      (!x.costeado ? '  (sin precio)' : (x.faltan > 0 ? '  (estimado)' : '')));
  });
  l.push('');
  if (r.ve_costo && t.costo !== null) {
    l.push('Costo del material: ' + pesos(t.costo));
    if (t.costo_estimado > 0) {
      l.push('  ' + pesos(t.costo_existencia) + ' en existencia · ' +
             pesos(t.costo_estimado) + ' estimado por comprar');
    }
    if (t.sin_precio) {
      l.push('  Ojo: ' + t.sin_precio + ' renglón(es) sin precio capturado quedaron fuera; ' +
             'el total es un piso.');
    }
    l.push('  Es costo de material, no precio al paciente.');
  }
  var txt = l.join('\n');
  try {
    navigator.clipboard.writeText(txt);
    alertar('Resumen copiado.');
  } catch (e) {
    alertar('No pude copiarlo. Aquí está:\n\n' + txt);
  }
}

async function guardarComoPlantilla() {
  var nombre = String(COTIZA.nombre || '').trim();
  if (!nombre) return alertar('Póngale nombre a la cotización: ese es el nombre de la plantilla.');
  if (!confirm('Se va a guardar «' + nombre.toUpperCase() + '» como plantilla con ' +
               COTIZA.filas.length + ' renglón(es). ¿Seguimos?')) return;

  var filas = COTIZA.filas.map(function (f) {
    return { plantilla: nombre, item: f.nombre, sku: f.sku,
             cantidad: Number(f.cantidad), activo: 'SI' };
  });
  try {
    var res = await enviar({ accion: 'plantilla_guardar', filas: filas }, true);
    if (!res.ok) return alertar(res.error);
    alertar('Plantilla guardada: ' + res.agregadas + ' renglón(es) nuevos, ' +
            res.actualizadas + ' actualizado(s).');
  } catch (e) {
    alertar('Sin conexión. La plantilla no se guardó.');
  }
}

/* =================================================================
   Expediente de cada aplicación

   Contesta la pregunta de la NOM antes de que la haga nadie más:
   ¿cada salida de material tiene su nota clínica, y esa nota dice que
   se aplicó?

   La pantalla ordena por lo que falta, no por la hora: lo primero que
   se ve es lo que hay que resolver. Los cinco estados se ven distintos
   a propósito, sobre todo «nota sin mención», que es el que un ojo
   rápido daría por bueno.
   ================================================================= */

var CRUCE = { periodo: 'dia', fecha: '' };

async function pantallaCruce(periodo, fecha) {
  CRUCE.periodo = periodo || CRUCE.periodo || 'dia';
  CRUCE.fecha = fecha || CRUCE.fecha || hoyFront_();

  encabezado('Expediente de cada aplicación', 'Que lo aplicado esté en la nota');
  pintar('<div class="card"><p class="sub">Cruzando contra el expediente…</p></div>');

  var r;
  try {
    r = await enviar({ accion: 'cruce_expediente',
                       periodo: CRUCE.periodo, fecha: CRUCE.fecha }, true);
  } catch (e) {
    return pintar('<div class="aviso a-err">Sin conexión. El cruce lee el expediente ' +
      'en vivo.</div><button class="b-ghost" onclick="pantallaInicio()">Volver</button>');
  }
  if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
    '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

  var s = r.resumen;
  var ETIQ = {
    DOCUMENTADA:             ['documentada', 'p-ok'],
    NOTA_SIN_MENCION:        ['nota sin mención', 'p-warn'],
    SIN_NOTA_EN_CONSULTORIO: ['sin nota en consultorio', 'p-warn'],
    NO_ESTA_EN_CONSULTORIO:  ['no está en consultorio', 'p-warn'],
