/* =================================================================
   Catálogo con fotos
   =================================================================
   Se busca sin acentos y sin importar mayúsculas: el catálogo se sembró
   sin acentos y la gente los escribe, así que «guantes esteriles» y
   «Guantes Estériles» tienen que encontrar lo mismo.
   ================================================================= */
function plano(s) {
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().trim();
}

/* =================================================================
   Plantillas por procedimiento
   =================================================================
   La plantilla es la medida contra la que se compara el consumo de una
   caja. Mientras un renglón no tenga clave del catálogo, no puede
   compararse con nada: por eso la pantalla empieza por lo que falta
   amarrar, y no por la lista completa.
   ================================================================= */
/* =================================================================
   Lista de compra

   Tres cosas distintas, separadas a propósito: lo que impide operar hoy,
   lo que alcanza para una cirugía pero no para el colchón, y lo que se va
   a vencer. Mezclarlas convierte la lista en ruido y nadie la usa.
   ================================================================= */
/* ---------- mínimos por almacén ----------

   Se captura el mínimo AL LADO de la existencia de hoy, de su unidad y de lo
   que ya se ha consumido. Separado en dos pantallas obligaba a memorizar un
   número mientras se escribía el otro, que es exactamente cómo se pone un
   mínimo sin sentido.

   El número que se teclea aquí es el CAPTURADO. Cuando el sistema calcule el
   histórico con el consumo real, podrá subir el mínimo pero nunca bajarlo de
   lo que una persona escribió: la hialuronidasa es antídoto y su consumo va
   a ser cero, así que una fórmula por consumo pediría cero. Por eso el
   renglón enseña los dos números cuando existen los dos.

   No hay máximo a propósito: la lista de compra dice cuánto falta para el
   mínimo y no propone cuánto comprar. Esa cantidad se decide con el
   proveedor, que es donde está el precio por volumen. */

/* Mismo criterio que «Lotes por costear»: regulatorio pone los mínimos
   porque es quien sabe cuánto se mueve cada clave. El gateway aplica la
   misma regla, así que esconder el mosaico no es el candado — es que el
   candado también se vea. */
function puedePonerMinimos() {
  var r = String(estado.sesion && estado.sesion.rol).toUpperCase();
  return r === 'DIRECTOR' || r === 'GERENCIA' || r === 'REGULATORIO';
}

/* El borrador vive por almacén|clave, no por clave: así cambiar de almacén o
   filtrar la lista no le borra a nadie lo que ya tecleó y no guardó. */
var minEstado = { ubic: '', r: null, soloFaltan: false, borrador: {} };

function minClave(sku) { return minEstado.ubic + '|' + String(sku).toUpperCase(); }

function minCorreo(c) {
  var s = String(c || '');
  return s.indexOf('@') > 0 ? s.slice(0, s.indexOf('@')) : s;
}

/** Lo que el renglón debe mostrar: el borrador si hay, si no lo guardado. */
function minValor(x) {
  var k = minClave(x.sku);
  if (Object.prototype.hasOwnProperty.call(minEstado.borrador, k)) return minEstado.borrador[k];
  return x.minimo_capturado === null || x.minimo_capturado === undefined
         ? '' : String(x.minimo_capturado);
}

function minGuardado(x) {
  return x.minimo_capturado === null || x.minimo_capturado === undefined
         ? '' : String(x.minimo_capturado);
}

function minTocados() {
  if (!minEstado.r) return [];
  return minEstado.r.renglones.filter(function (x) {
    return minValor(x) !== minGuardado(x);
  });
}

async function pantallaMinimos(ubicId) {
  encabezado('Mínimos', 'Cuánto hay que tener siempre');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'minimos_lista', ubic_id: ubicId || '' }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div>' +
           '<button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
    return;
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
           '<button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
    return;
  }
  minEstado.ubic = r.ubic_id;
  minEstado.r = r;
  pintarMinimos();
}

function renglonMinimo(x) {
  var u = x.unidad || 'pieza';
  var marcas = [];
  if (x.bajo) marcas.push('<span class="pill p-crit">faltan ' + nFmt(x.falta) + '</span>');
  if (x.fuente === 'HISTORICO') {
    marcas.push('<span class="pill p-warn">histórico ' + nFmt(x.minimo_historico) + '</span>');
  }
  if (x.controlado) marcas.push('<span class="pill p-crit">controlado</span>');
  if (x.inactivo) marcas.push('<span class="pill p-warn">clave desactivada</span>');
  if (x.dias_caducidad !== null && x.dias_caducidad !== undefined && x.dias_caducidad <= 90) {
    marcas.push('<span class="pill ' + (x.dias_caducidad < 0 ? 'p-crit' : 'p-warn') + '">' +
      (x.dias_caducidad < 0 ? 'vencido' : 'vence en ' + x.dias_caducidad + 'd') + '</span>');
  }

  /* La historia de consumo va en el renglón porque es contra lo que se
     calibra el número: diez salidas en una semana y diez en seis meses no
     dicen lo mismo, y los días son la mitad que casi siempre falta. */
  var hist = x.consumido > 0
    ? 'ya salieron ' + nFmt(x.consumido) + ' ' + u + ' en ' + x.eventos + ' salida(s)' +
      (x.dias_historia !== null && x.dias_historia !== undefined
        ? ' en ' + x.dias_historia + ' día(s)' : '')
    : 'sin salidas registradas';

  var val = minValor(x);
  var tocado = val !== minGuardado(x);

  return '<div class="min-fila">' +
    '<span class="t"><span class="n">' + esc(x.nombre) +
      (marcas.length ? ' ' + marcas.join(' ') : '') + '</span>' +
    '<span class="c">' + esc(x.sku) + ' · hay ' + nFmt(x.existencia) + ' ' + esc(u) +
      (x.lotes > 1 ? ' en ' + x.lotes + ' lotes' : '') +
      ' · ' + esc(hist) +
      (x.puesto_en
        ? ' · mín. de ' + esc(minCorreo(x.puesto_por)) + ', ' + esc(String(x.puesto_en).slice(0, 10))
        : '') +
    '</span></span>' +
    '<span><input type="number" step="any" min="0" inputmode="decimal"' +
      ' class="mIn' + (tocado ? ' tocado' : '') + '"' +
      ' data-sku="' + esc(x.sku) + '" value="' + esc(val) + '"' +
      (minEstado.r.puede_editar ? '' : ' disabled') + '>' +
      '<span class="min-u">' + esc(u) + '</span></span>' +
    '</div>';
}

function pintarMinimos() {
  var r = minEstado.r;
  var editable = r.puede_editar;

  var visibles = r.renglones.filter(function (x) {
    if (!minEstado.soloFaltan) return true;
    return x.minimo === null || x.bajo;
  });

  var sel = r.almacenes.length > 1
    ? '<div class="campo"><label>Almacén</label><select id="mUbic">' +
      r.almacenes.map(function (a) {
        return '<option value="' + esc(a.ubic_id) + '"' +
          (a.ubic_id === r.ubic_id ? ' selected' : '') + '>' +
          esc(a.nombre) + (a.sede ? ' · ' + esc(a.sede) : '') + '</option>';
      }).join('') + '</select></div>'
    : '';

  var tocados = minTocados().length;

  pintar(
    '<div class="card"><h3>' + esc(r.ubic_nombre) + '</h3>' + sel +
    '<p class="mini"><b>' + r.total + '</b> clave(s) de este almacén · <b>' +
      r.con_minimo + '</b> con mínimo · <b>' + r.sin_minimo + '</b> sin poner' +
      (r.bajos ? ' · <b>' + r.bajos + '</b> abajo del mínimo' : '') + '</p>' +
    '<p class="mini">El mínimo es cuánto quieres tener SIEMPRE en este anaquel. ' +
      'No hay máximo: la lista de compra te va a decir cuánto falta para el mínimo, ' +
      'no cuánto comprar — eso se decide con el proveedor. Déjalo vacío si de esa ' +
      'clave no quieres que el sistema te avise, y en <b>0</b> si quieres decir ' +
      'expresamente que no hay que tener ninguna.</p>' +
    (editable ? '' :
      '<p class="mini">Puedes verlos y avisar lo que está abajo del mínimo. ' +
      'Ponerlos le toca a dirección o a regulatorio.</p>') +
    '</div>' +

    '<div class="card">' +
    '<label style="display:flex;align-items:center;gap:9px;text-transform:none;' +
      'letter-spacing:0;font-family:inherit;font-size:.85rem;margin:0">' +
      '<input type="checkbox" id="mSolo" style="width:auto"' +
      (minEstado.soloFaltan ? ' checked' : '') + '> Sólo los que faltan' +
    '</label></div>' +

    (visibles.length
      ? '<div class="card">' +
        (minEstado.soloFaltan
          ? '<div class="sub-t">Sin mínimo o abajo del mínimo</div>'
          : '<div class="sub-t">Lo que maneja este almacén</div>') +
        visibles.map(renglonMinimo).join('') + '</div>'
      : '<div class="aviso a-ok">Nada pendiente en este almacén.</div>') +

    (editable
      ? '<button class="b-primary" id="mGuardar"' + (tocados ? '' : ' disabled') + '>' +
        (tocados ? 'Guardar ' + tocados + ' cambio(s)' : 'Guardar') + '</button>'
      : '') +
    '<button class="b-ghost" id="bV">Volver</button>');

  if ($('mUbic')) {
    $('mUbic').onchange = function () { pantallaMinimos(this.value); };
  }
  $('mSolo').onchange = function () {
    minEstado.soloFaltan = this.checked;
    pintarMinimos();
  };

  Array.prototype.forEach.call(document.querySelectorAll('.mIn'), function (i) {
    i.oninput = function () {
      minEstado.borrador[minClave(this.getAttribute('data-sku'))] = String(this.value).trim();
      /* Sólo se refresca el botón y el realce: repintar la lista en cada
         tecla le quitaría el foco a quien está escribiendo. */
      var x = minEstado.r.renglones.filter(function (y) {
        return y.sku === i.getAttribute('data-sku');
      })[0];
      if (x) i.classList.toggle('tocado', minValor(x) !== minGuardado(x));
      var n = minTocados().length;
      var b = $('mGuardar');
      if (b) {
        b.disabled = !n;
        b.textContent = n ? 'Guardar ' + n + ' cambio(s)' : 'Guardar';
      }
    };
  });

  if ($('mGuardar')) $('mGuardar').onclick = function () { guardarMinimos(this); };
  $('bV').onclick = function () {
    var n = minTocados().length;
    if (n && !confirm('Tienes ' + n + ' cambio(s) sin guardar. ¿Salir de todos modos?')) return;
    minEstado.borrador = {};
    pantallaInicio();
  };
}

async function guardarMinimos(boton) {
  var tocados = minTocados();
  if (!tocados.length) return;

  var filas = [], malos = [];
  tocados.forEach(function (x) {
    var v = minValor(x);
    if (v !== '' && (isNaN(parseFloat(v)) || parseFloat(v) < 0)) {
      malos.push(x.sku);
      return;
    }
    filas.push({ sku: x.sku, minimo: v });
  });
  if (malos.length) {
    return alertar('Revisa ' + malos.join(', ') + ': un mínimo es un número y no puede ser negativo.');
  }

  boton.disabled = true;
  boton.textContent = 'Guardando…';
  var res;
  try {
    res = await enviar({ accion: 'minimo_guardar', ubic_id: minEstado.ubic, filas: filas }, true);
  } catch (e) {
    boton.disabled = false;
    boton.textContent = 'Guardar ' + tocados.length + ' cambio(s)';
    return alertar('No se pudo guardar: ' + (e && e.message ? e.message : 'sin conexión'));
  }
  if (!res.ok) {
    boton.disabled = false;
    boton.textContent = 'Guardar ' + tocados.length + ' cambio(s)';
    return alertar(res.error);
  }

  /* El borrador se limpia SÓLO de este almacén: lo que haya tecleado en otro
     y no haya guardado sigue ahí esperándolo. */
  var prefijo = minEstado.ubic + '|';
  Object.keys(minEstado.borrador).forEach(function (k) {
    if (k.indexOf(prefijo) === 0) delete minEstado.borrador[k];
  });

  var dicho = [];
  if (res.agregados) dicho.push(res.agregados + ' puesto(s)');
  if (res.actualizados) dicho.push(res.actualizados + ' cambiado(s)');
  if (res.quitados) dicho.push(res.quitados + ' quitado(s)');
  if (res.claves_malas && res.claves_malas.length) {
    dicho.push('no se pudo con ' + res.claves_malas.join(', '));
  }
  await pantallaMinimos(minEstado.ubic);
  if (dicho.length) alertar('Guardado: ' + dicho.join(' · '));
}

/** Un renglón de la lista de compra que viene del mínimo, no de una plantilla. */
function renglonBajoMinimo(x) {
  var u = x.unidad || 'pieza';
  return '<div class="fila-lote">' +
    '<span class="t"><span class="n">' + esc(x.nombre) +
      (x.controlado ? ' <span class="pill p-crit">controlado</span>' : '') +
      (x.fuente === 'HISTORICO' ? ' <span class="pill p-warn">mínimo por consumo</span>' : '') +
    '</span>' +
    '<span class="c">' + esc(x.sku) + ' · ' + esc(x.ubic_nombre) + ' · hay ' +
      nFmt(x.hay) + ' ' + esc(u) + ' · mínimo ' + nFmt(x.minimo) + '</span></span>' +
    '<span class="pill ' + (x.en_cero ? 'p-crit' : 'p-warn') + '">faltan ' +
      nFmt(x.falta) + '</span></div>';
}

var COLCHON_KEY = 'msu_alm_colchon';

function colchonGuardado() {
  var v = parseInt(leer(COLCHON_KEY, 2), 10);
  return (v && v > 0) ? v : 2;
}

async function pantallaCompra(colchon) {
  var n = colchon || colchonGuardado();
  encabezado('Lista de compra', 'Qué pedir y qué se va a vencer');
  pintar('<div class="card"><p class="sub">Calculando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'compra_lista', colchon: n }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  escribir(COLCHON_KEY, n);

  function renglon(x, modo) {
    var der = modo === 'bloquea'
      ? '<span class="pill p-crit">pedir ' + x.comprar + '</span>'
      : '<span class="pill p-warn">pedir ' + x.comprar + '</span>';
    return '<div class="fila-lote">' +
      '<span class="t"><span class="n">' + esc(x.nombre) +
      (x.controlado ? ' <span class="pill p-crit">controlado</span>' : '') + '</span>' +
      '<span class="c">' + esc(x.sku) + ' · hay ' + x.hay + ' · una caja pide ' + x.pide_una_caja +
      ' · ' + esc(x.plantillas.join(', ')) + '</span></span>' + der + '</div>';
  }

  var sel = [1, 2, 3, 4].map(function (v) {
    return '<option value="' + v + '"' + (v === r.colchon ? ' selected' : '') + '>' +
      v + (v === 1 ? ' cirugía' : ' cirugías') + '</option>';
  }).join('');

  var cad = r.por_caducar.map(function (x) {
    return '<div class="fila-lote">' +
      '<span class="t"><span class="n">' + esc(x.nombre) + '</span>' +
      '<span class="c">' + esc(x.sku) + ' · ' + esc(x.lote_id) + ' · ' + x.cantidad + ' pza · ' +
      esc(x.ubic_id) + '</span></span>' +
      '<span class="pill ' + (x.vencido ? 'p-crit' : (x.dias <= 30 ? 'p-crit' : 'p-warn')) + '">' +
      (x.vencido ? 'vencido' : x.dias + ' días') + '</span></div>';
  }).join('');

  pintar(
    /* El motor por mínimo capturado va PRIMERO cuando es el único que corre:
       para quien tiene un solo almacén, el de cirugía está vacío y abrir la
       pantalla con un selector de colchón que no hace nada sería ofrecerle
       una palanca desconectada. */
    (r.sin_cirugias ? '<div class="aviso a-info">' + esc(r.sin_cirugias) + '</div>' : '') +

    ((r.bajo_minimo || []).length
      ? '<div class="card"><div class="sub-t">Abajo del mínimo</div>' +
        '<p class="mini">Mínimos puestos a mano, por almacén. Dice cuánto falta para llegar ' +
        'al mínimo, no cuánto comprar: esa cantidad se decide con el proveedor.</p>' +
        r.bajo_minimo.map(renglonBajoMinimo).join('') + '</div>'
      : (r.solo_minimos
          ? '<div class="aviso a-ok">Nada abajo del mínimo en su almacén.</div>'
          : '')) +

    (r.solo_minimos ? '' :
      '<div class="card"><h3>Para cuántas cirugías quiero tener</h3>' +
      '<p class="mini">Éste es el otro mínimo: el que sale de lo que pide una plantilla de ' +
      'cirugía. El colchón se cuenta en cirugías, no en piezas.</p>' +
      '<div class="campo"><select id="cCol">' + sel + '</select></div></div>') +

    (r.solo_minimos ? '' : r.bloquean.length
      ? '<div class="card"><div class="sub-t">No alcanza ni para una cirugía</div>' +
        '<p class="mini">Esto impide armar la caja hoy.</p>' +
        r.bloquean.map(function (x) { return renglon(x, 'bloquea'); }).join('') + '</div>'
      : '<div class="aviso a-ok">Todo alcanza al menos para una cirugía.</div>') +

    (r.solo_minimos ? '' : r.bajos.length
      ? '<div class="card"><div class="sub-t">Alcanza para una, no para el colchón</div>' +
        '<p class="mini">Se puede operar, pero el anaquel queda en cero después.</p>' +
        r.bajos.map(function (x) { return renglon(x, 'bajo'); }).join('') + '</div>'
      : '') +

    (r.por_caducar.length
      ? '<div class="card"><div class="sub-t">Se vence en los próximos ' + r.horizonte + ' días</div>' +
        '<p class="mini">Esto no falta: sobra, pero con fecha. Úsalo primero o dalo de baja a tiempo.</p>' +
        cad + '</div>'
      : '') +

    '<button class="b-dark" id="bCopiar">Copiar la lista</button>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  /* El selector no existe cuando el motor de cirugía no corre. */
  if ($('cCol')) $('cCol').onchange = function () { pantallaCompra(parseInt(this.value, 10)); };

  $('bCopiar').onclick = function () {
    var lineas = [];
    /* Decía «almacén Zorvix» siempre, de cuando no había más. Esta lista ya
       se la puede llevar quien cuida el anaquel de Renasté, y una lista que
       miente en su encabezado se manda al proveedor equivocado. */
    var ambito = r.solo_minimos
      ? nombreAlmacen((((estado.cat || {}).alcance) || []).join(','))
      : 'todos los almacenes';
    lineas.push('Lista de compra · ' + (ambito || 'MS Universe') + ' · ' + hoyISO());
    if (!r.solo_minimos) {
      lineas.push('Para poder armar ' + r.colchon + (r.colchon === 1 ? ' cirugía' : ' cirugías') + ' sin ir a comprar.');
    }
    if ((r.bajo_minimo || []).length) {
      lineas.push('');
      lineas.push('Abajo del mínimo:');
      r.bajo_minimo.forEach(function (x) {
        lineas.push('  ' + x.sku + '  ' + x.nombre + '  —  ' + x.ubic_nombre +
                    ': hay ' + nFmt(x.hay) + ', mínimo ' + nFmt(x.minimo) +
                    ', faltan ' + nFmt(x.falta) + ' ' + (x.unidad || 'pieza'));
      });
    }
    if (r.bloquean.length) {
      lineas.push('');
      lineas.push('URGENTE — no alcanza ni para una cirugía:');
      r.bloquean.forEach(function (x) {
        lineas.push('  ' + x.sku + '  ' + x.nombre + '  —  hay ' + x.hay + ', pedir ' + x.comprar);
      });
    }
    if (r.bajos.length) {
      lineas.push('');
      lineas.push('Por reponer:');
      r.bajos.forEach(function (x) {
        lineas.push('  ' + x.sku + '  ' + x.nombre + '  —  hay ' + x.hay + ', pedir ' + x.comprar);
      });
    }
    if (r.por_caducar.length) {
      lineas.push('');
      lineas.push('Se vence pronto (no es compra, es para usarlo primero):');
      r.por_caducar.forEach(function (x) {
        lineas.push('  ' + x.sku + '  ' + x.nombre + '  —  ' + x.cantidad + ' pza, ' + x.caducidad +
                    (x.vencido ? ' (VENCIDO)' : ' (' + x.dias + ' días)'));
      });
    }
    var txt = lineas.join('\n');
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    var listo = false;
    try { listo = document.execCommand('copy'); } catch (e) { listo = false; }
    ta.remove();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {}, function () {});
    }
    alertar(listo ? 'Lista copiada. Pégala en WhatsApp o en el correo del proveedor.'
                  : 'No se pudo copiar sola; selecciona el texto a mano.');
  };

  $('bV').onclick = function () { pantallaInicio(); };
}

/* =================================================================
   Se puede armar — plantilla contra existencia

   Una plantilla "lista" sólo quiere decir que todos sus renglones tienen
   clave. No quiere decir que el material esté. Esta pantalla contesta la
   única pregunta que importa la noche anterior: ¿se puede armar esta caja
   mañana, sí o no, y si no, qué falta exactamente?
   ================================================================= */
var SURTIDO_PILL = {
  COMPLETO:       'p-ok',
  NO_ALCANZA:     'p-warn',
  SIN_EXISTENCIA: 'p-crit',
  CLAVE_MUERTA:   'p-crit',
  SIN_CLAVE:      'p-warn',
  NOTA:           'p-neutral'
};
var SURTIDO_DONDE = {
  CLAVE_MUERTA:   'Se arregla en el catálogo',
  SIN_EXISTENCIA: 'Se arregla en el anaquel',
  NO_ALCANZA:     'Se arregla en el anaquel',
  SIN_CLAVE:      'Se arregla en la plantilla',
  NOTA:           'No sale del almacén'
};

async function pantallaSurtidoDetalle(nombre) {
  encabezado(nombre, 'Qué falta para armarla');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'plantilla_surtido', plantilla: nombre }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaSurtido(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaSurtido(); };
  }

  /* Agrupados por motivo, no por categoría: aquí no se busca un insumo,
     se reparte trabajo. Cada grupo lo resuelve una persona distinta. */
  var grupos = {}, orden = [];
  r.items.forEach(function (x) {
    if (!grupos[x.estado]) { grupos[x.estado] = []; orden.push(x.estado); }
    grupos[x.estado].push(x);
  });

  var cuerpo = orden.map(function (e) {
    var titulo = { CLAVE_MUERTA: 'Apuntan a una clave que ya no existe',
                   SIN_EXISTENCIA: 'La clave existe, el saldo está en cero',
                   NO_ALCANZA: 'Hay, pero no alcanza',
                   SIN_CLAVE: 'Todavía sin amarrar',
                   NOTA: 'No es material de almacén',
                   COMPLETO: 'Alcanza' }[e] || e;
    var filas = grupos[e].map(function (x) {
      var der = '';
      if (e === 'NO_ALCANZA') der = '<span class="pill p-warn">faltan ' + x.faltan + '</span>';
      else if (e === 'COMPLETO') der = '<span class="pill p-ok">' + x.hay + '</span>';
      else der = '<span class="pill ' + SURTIDO_PILL[e] + '">' + (x.pide || '—') + '</span>';
      return '<div class="fila-lote">' +
        '<span class="t"><span class="n">' + esc(x.item) + '</span>' +
        '<span class="c">' + (x.sku ? esc(x.sku) + ' · ' : '') +
        'pide ' + x.pide + (x.hay === '' ? '' : ' · hay ' + x.hay) + '</span></span>' + der + '</div>';
    }).join('');
    return '<div class="card"><div class="sub-t">' + esc(titulo) + '</div>' +
      (SURTIDO_DONDE[e] ? '<p class="mini">' + SURTIDO_DONDE[e] + '</p>' : '') +
      filas + '</div>';
  }).join('');

  pintar(
    (r.bloqueados
      ? '<div class="aviso a-warn"><b>' + r.bloqueados + ' renglones impiden armar esta caja.</b></div>'
      : '<div class="aviso a-ok">Esta caja se puede armar con lo que hay hoy.</div>') +
    cuerpo +
    '<button class="b-dark" id="bAmarrar">Ver los renglones de la plantilla</button>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  $('bAmarrar').onclick = function () { pantallaPlantilla(nombre); };
  $('bV').onclick = function () { pantallaSurtido(); };
}

/* =================================================================
   Claves gemelas

   Un mismo insumo dado de alta dos veces: el genérico que sembró el
   catálogo y el que de verdad está en el anaquel. El genérico nunca va a
   tener existencia, y las plantillas quedaron amarradas justo a él.
   ================================================================= */
async function pantallaGemelas() {
  encabezado('Claves gemelas', 'Un insumo dado de alta dos veces');
  pintar('<div class="card"><p class="sub">Buscando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'duplicados_plan' }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.pares.length) {
    pintar('<div class="aviso a-ok">No hay claves gemelas por fusionar.</div>' +
           '<button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }

  estado.gemelas = {};
  var tarjetas = r.pares.map(function (p, i) {
    estado.gemelas[p.retirar] = p.confianza === 'seguro' ? p.sugerido : '';
    var ops = p.candidatos.map(function (c) {
      return '<option value="' + esc(c.sku) + '"' +
        (c.sku === p.sugerido && p.confianza === 'seguro' ? ' selected' : '') + '>' +
        esc(c.sku + ' · ' + c.nombre) + '</option>';
    }).join('');
    return '<div class="card">' +
      '<div class="sub-t">' + esc(p.retirar) + '</div>' +
      '<h3>' + esc(p.retirar_nombre) + '</h3>' +
      '<p class="mini">Sin saldo, sin lote y sin un solo movimiento' +
      (p.en_plantillas ? ' · usada en ' + p.en_plantillas + ' renglón(es) de plantilla' : '') + '.</p>' +
      (p.confianza === 'seguro'
        ? '<p class="sub">Se fusiona en:</p>'
        : '<div class="aviso a-warn">Hay más de un candidato y se distinguen por la medida o la talla. ' +
          'Eso lo sabe quien abre la caja, no el sistema. Elige o déjalo en blanco.</div>') +
      '<div class="campo"><select data-gem="' + esc(p.retirar) + '">' +
      (p.confianza === 'seguro' ? '' : '<option value="">— no fusionar por ahora —</option>') +
      ops + '</select></div></div>';
  }).join('');

  pintar(
    '<div class="aviso a-warn"><b>' + r.pares.length + ' claves sin existencia tienen una gemela viva.</b><br>' +
    'Fusionar reapunta los renglones de plantilla a la clave buena y deja la vieja inactiva ' +
    '— no la borra. Sólo aparecen aquí claves a las que nunca les pasó nada: cero lotes, ' +
    'cero movimientos. El kardex no se toca.</div>' +
    tarjetas +
    '<button class="b-primary" id="bFus">Fusionar las seleccionadas</button>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  Array.prototype.forEach.call(document.querySelectorAll('select[data-gem]'), function (s) {
    s.onchange = function () { estado.gemelas[s.getAttribute('data-gem')] = s.value; };
  });

  $('bFus').onclick = async function () {
    var pares = [];
    Object.keys(estado.gemelas).forEach(function (k) {
      if (estado.gemelas[k]) pares.push({ retirar: k, queda: estado.gemelas[k] });
    });
    if (!pares.length) return alertar('No hay ninguna seleccionada.');

    /* Dos toques a propósito, sin diálogo del navegador: retirar una clave
       del catálogo no debería pasar por un resbalón del dedo. */
    if (this.getAttribute('data-listo') !== 'si') {
      this.setAttribute('data-listo', 'si');
      this.className = 'b-dark';
      this.textContent = 'Confirmar: fusionar ' + pares.length + ' clave(s)';
      alertar('Toca otra vez para confirmar. La clave vieja queda inactiva, no se borra.');
      return;
    }
    this.disabled = true; this.textContent = 'Fusionando…';
    var res;
    try { res = await enviar({ accion: 'duplicados_fusionar', confirmar: 'FUSIONAR', pares: pares }, true); }
    catch (e) { this.disabled = false; this.textContent = 'Fusionar las seleccionadas'; return alertar('Sin conexión.'); }
    if (!res.ok) { this.disabled = false; this.textContent = 'Fusionar las seleccionadas'; return alertar(res.error); }
    alertar(res.fusionadas + ' clave(s) fusionadas.');
    pantallaGemelas();
  };
  $('bV').onclick = function () { pantallaInicio(); };
}

/* Los renglones que necesita la hoja de solicitud.

   La plantilla no sabe si algo es controlado -esa bandera vive en el
   cat\u00e1logo-, y la hoja lo necesita para separarlos: un controlado no
   viaja dentro de la caja, se surte contra receta y lo registra quien
   lleva regulatorio. Si salieran mezclados, alguien los dar\u00eda por
   surtidos al firmar. */
function paraSolicitud(items) {
  var ctr = {};
  (((estado.cat || {}).catalogo) || []).forEach(function (c) {
    if (String(c.controlado).toUpperCase() === 'SI') ctr[String(c.sku).toUpperCase()] = true;
  });
  return (items || []).map(function (x) {
    return {
      item: x.item, sku: x.sku || '', cantidad: x.cantidad,
      categoria: x.categoria || '', es_nota: !!x.es_nota,
      controlado: !!ctr[String(x.sku || '').toUpperCase()]
    };
  });
}

async function pantallaPlantilla(nombre, soloPendientes) {
  encabezado(nombre, 'Renglones de la plantilla');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  var r;
  try { r = await enviar({ accion: 'plantillas', plantilla: nombre }, true); }
  catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaPlantillas(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaPlantillas(); };
  }

  var ver = soloPendientes ? r.items.filter(function (x) { return !x.resuelto; }) : r.items;
  var porCat = {}, orden = [];
  ver.forEach(function (x) {
    var k = x.categoria || 'OTROS';
    if (!porCat[k]) { porCat[k] = []; orden.push(k); }
    porCat[k].push(x);
  });

  var cuerpo = orden.map(function (k) {
    return '<div class="sub-t">' + esc(k) + '</div>' +
      porCat[k].map(function (x) {
        return '<button class="fila-lote" data-item="' + esc(x.item) + '">' +
          '<span class="t"><span class="n">' + esc(x.item) +
          (x.cantidad ? ' <b>× ' + esc(x.cantidad) + '</b>' : '') + '</span>' +
          '<span class="c">' + (x.es_nota
            ? 'no es material de almacén'
            : (x.resuelto
              ? esc(x.sku) + ' · ' + esc(x.nombre_catalogo)
              : (x.error ? esc(x.error) : 'sin clave del catálogo'))) + '</span></span>' +
          (x.es_nota ? '<span class="pill p-neutral">nota</span>'
            : (x.resuelto ? '<span class="pill p-ok">ok</span>'
                          : '<span class="pill p-warn">amarrar</span>')) +
          '</button>';
      }).join('');
  }).join('');

  pintar(
    '<div class="card"><h3>' + r.items.length + ' renglones · ' + r.pendientes + ' por amarrar</h3>' +
    '<p class="mini">La cantidad es lo que el procedimiento necesita, definido por criterio ' +
    'quirúrgico — no el promedio de lo que se ha consumido.</p>' +
    '<div class="b-fila">' +
    '<button class="' + (soloPendientes ? 'b-ghost' : 'b-dark') + '" id="bTodos">Ver todos</button>' +
    '<button class="' + (soloPendientes ? 'b-dark' : 'b-ghost') + '" id="bPend">Sólo los que faltan</button>' +
    '</div></div>' +
    '<div class="card">' + (cuerpo || '<p class="sub centro">Nada que mostrar aquí.</p>') + '</div>' +
    '<button class="b-dark" id="bSolicitud">Imprimir solicitud de caja</button>' +
    '<button class="b-dark" id="bEditarPl">Editar esta plantilla</button>' +
    '<button class="b-ghost" id="bV">Volver a plantillas</button>');

  /* La hoja se imprime en el almac\u00e9n, donde la se\u00f1al es peor: la lista
     viaja por localStorage y la p\u00e1gina no vuelve a preguntarle al gateway.
     Se mandan TODOS los renglones, no el filtro de pendientes: quien surte
     necesita la caja completa, no lo que falta por amarrar. */
  $('bSolicitud').onclick = function () {
    try {
      escribir(SOLICITUD_KEY, { plantilla: nombre, items: paraSolicitud(r.items) });
      location.href = 'solicitud_caja.html';
    } catch (e) {
      alertar('No se pudo preparar la solicitud. Intenta de nuevo.');
    }
  };

  $('bEditarPl').onclick = function () { pantallaPlantillaEditar(nombre); };
  $('bTodos').onclick = function () { pantallaPlantilla(nombre, false); };
  $('bPend').onclick = function () { pantallaPlantilla(nombre, true); };
  $('bV').onclick = function () { pantallaPlantillas(); };
  Array.prototype.forEach.call(document.querySelectorAll('.fila-lote'), function (b) {
    var it = b.getAttribute('data-item');
    b.onclick = function () {
      var x = null;
      r.items.forEach(function (y) { if (y.item === it) x = y; });
      if (x) pantallaPlantillaAmarrar(nombre, x, soloPendientes);
    };
  });
}

/* Amarrar un renglón: se busca en el catálogo igual que en cualquier otra
   pantalla, con las mismas letras, y se propone lo más parecido. La
   propuesta nunca se aplica sola — la escoge quien sabe qué es. */
function pantallaPlantillaAmarrar(plantilla, item, soloPendientes) {
  encabezado(item.item, 'Amarrar al catálogo');
  var lista = ((estado.cat && estado.cat.catalogo) || []).slice();

  function sugerencias(texto) {
    var q = plano(texto || '');
    if (!q) return [];
    var qt = q.split(' ').filter(function (t) { return t.length > 1; });
    return lista.map(function (s) {
      var heno = plano(s.sku + ' ' + s.nombre + ' ' + (s.presentacion || ''));
      var hit = 0;
      qt.forEach(function (t) { if (heno.indexOf(t) >= 0) hit++; });
      return { s: s, p: qt.length ? hit / qt.length : 0 };
    }).filter(function (x) { return x.p > 0.32; })
      .sort(function (a, b) { return b.p - a.p; })
      .slice(0, 12).map(function (x) { return x.s; });
  }

  function pintarLista(texto) {
    var props = sugerencias(texto);
    $('sugs').innerHTML = props.length
      ? props.map(function (s) {
          return '<button class="fila-lote" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + (s.presentacion ? ' · ' + esc(s.presentacion) : '') +
            '</span></span>' +
            (String(s.controlado).toUpperCase() === 'SI' ? '<span class="pill p-warn">llave</span>' : '') +
            '</button>';
        }).join('')
      : '<p class="sub centro">Nada parecido. Prueba con menos letras.</p>';
    Array.prototype.forEach.call($('sugs').querySelectorAll('.fila-lote'), function (b) {
      b.onclick = function () { amarrar(b.getAttribute('data-sku')); };
    });
  }

  async function marcarNota() {
    var todas = $('aTodas') && $('aTodas').checked ? 'SI' : 'NO';
    pintar('<div class="card"><p class="sub">Guardando…</p></div>');
    try {
      var r = await enviar({ accion: 'plantilla_item_sku', plantilla: plantilla,
                             item: item.item, tipo: 'NOTA', todas: todas }, true);
      if (!r.ok) alertar(r.error);
    } catch (e) { alertar('Sin conexión. No se guardó.'); }
    pantallaPlantilla(plantilla, soloPendientes);
  }

  async function amarrar(sku) {
    var todas = $('aTodas') && $('aTodas').checked ? 'SI' : 'NO';
    pintar('<div class="card"><p class="sub">Guardando…</p></div>');
    try {
      var r = await enviar({ accion: 'plantilla_item_sku', plantilla: plantilla,
                             item: item.item, sku: sku, todas: todas }, true);
      if (!r.ok) { alertar(r.error); return pantallaPlantilla(plantilla, soloPendientes); }
      pantallaPlantilla(plantilla, soloPendientes);
    } catch (e) {
      alertar('Sin conexión. No se guardó.');
      pantallaPlantilla(plantilla, soloPendientes);
    }
  }

  pintar(
    '<div class="card">' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Renglón de la plantilla</div>' +
    '<div class="mini">' + esc(plantilla) + ' · ' + esc(item.categoria || '') + '</div></div>' +
    (item.cantidad ? '<span class="pill p-neutral">× ' + esc(item.cantidad) + '</span>' : '') + '</div>' +
    (item.resuelto
      ? '<div class="item"><div class="l"><div>Amarrado hoy a</div>' +
        '<div class="mini">' + esc(item.nombre_catalogo) + '</div></div>' +
        '<span class="pill p-ok">' + esc(item.sku) + '</span></div>'
      : '') +
    '</div></div>' +

    ((item.en_plantillas || 1) > 1
      ? '<div class="card"><label class="check"><input type="checkbox" id="aTodas" checked> ' +
        'Aplicar también a las otras ' + (item.en_plantillas - 1) + ' plantillas que piden ' +
        '“' + esc(item.item) + '”</label>' +
        '<p class="mini">Es la misma decisión: a qué insumo del catálogo corresponde este ' +
        'nombre. Desmárcalo sólo si en algún procedimiento significa otra cosa. ' +
        'La cantidad no se copia — esa sí es de cada plantilla.</p></div>'
      : '') +

    '<div class="card">' +
    '<div class="campo"><label>Buscar en el catálogo</label>' +
    '<input id="qCat" type="search" value="' + esc(item.item) + '"></div>' +
    '<p class="mini">Escoge el insumo del catálogo que corresponde a este renglón. ' +
    'Si no existe todavía, hay que darlo de alta primero.</p>' +
    '<div id="sugs"></div></div>' +

    '<div class="card"><h3>¿No sale del almacén?</h3>' +
    '<p class="sub">Algunos renglones de la lista de papel no son material que el almacén ' +
    'surta — el oxígeno de la toma mural, por ejemplo. Sirven de recordatorio al armar la ' +
    'caja, pero no tienen clave.</p>' +
    '<button class="b-dark" id="bNota">No es material de almacén</button></div>' +

    '<button class="b-ghost" id="bV">Volver sin amarrar</button>');

  $('bNota').onclick = function () {
    if (!confirm('“' + item.item + '” va a dejar de contar como pendiente y se va a quedar ' +
                 'en la lista como recordatorio, sin clave. ¿Es correcto?')) return;
    marcarNota();
  };
  $('qCat').oninput = function () { pintarLista(this.value); };
  $('bV').onclick = function () { pantallaPlantilla(plantilla, soloPendientes); };
  pintarLista(item.item);
}

/* =================================================================
   Homologar los folios del catálogo — sólo el director
   =================================================================
   El catálogo creció con dos numeraciones a la vez: la sembrada usa tres
   dígitos y la capturada después usa dos. MED-46 es diclofenaco y MED-046
   es tramadol. Esta pantalla muestra primero qué pasaría, y hasta que se
   ve el plan completo se puede aplicar.
   ================================================================= */
async function pantallaHomologarFolios() {
  encabezado('Folios del catálogo', 'Homologar a tres dígitos');
  pintar('<div class="card"><p class="sub">Calculando el plan…</p></div>');
  var r;
  try {
    r = await enviar({ accion: 'folios_plan' }, true);
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }
  if (!r.ok) {
    pintar('<div class="aviso a-err">' + esc(r.error) + '</div><button class="b-ghost" id="bV">Volver</button>');
    return $('bV').onclick = function () { pantallaInicio(); };
  }

  var reasig = r.mapa.filter(function (m) { return m.motivo === 'OCUPADO'; });

  var tabla = reasig.map(function (m) {
    return '<div class="mapeo">' +
      '<span class="cl">' + esc(m.antes) + ' &rarr; <b>' + esc(m.despues) + '</b></span>' +
      '<span class="nm">' + esc(m.nombre) +
      (m.controlado === 'SI' ? ' <span class="pill p-warn">llave</span>' : '') + '</span>' +
      '<span class="po">su clave con cero, ' + esc(m.ocupaba) + ', ya es de otro insumo</span>' +
      '</div>';
  }).join('');

  pintar(
    (r.conflictos.length
      ? '<div class="aviso a-err"><b>No se puede aplicar todavía.</b><br>' +
        r.conflictos.map(esc).join('<br>') + '</div>'
      : '') +

    '<div class="card"><h3>Qué pasaría</h3>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Insumos en el catálogo</div></div><span class="pill p-neutral">' + r.total_catalogo + '</span></div>' +
    '<div class="item"><div class="l"><div>No cambian</div><div class="mini">ya están de tres dígitos</div></div><span class="pill p-ok">' + r.sin_cambio + '</span></div>' +
    '<div class="item"><div class="l"><div>Sólo ganan un cero</div><div class="mini">mismo número, con cero</div></div><span class="pill p-neutral">' + r.solo_cero + '</span></div>' +
    '<div class="item"><div class="l"><div>Cambian de número</div><div class="mini">su clave con cero está ocupada</div></div><span class="pill p-warn">' + r.reasignados + '</span></div>' +
    '</div>' +
    '<p class="mini">El folio del lote (LOT-…) no cambia, y el código QR de las ' +
    'etiquetas lleva el folio del lote, no la clave del insumo: lo que ya está ' +
    'pegado sigue leyéndose bien. Las existencias no se mueven.</p>' +
    '</div>' +

    (reasig.length
      ? '<div class="card"><h3>Los ' + reasig.length + ' que cambian de número</h3>' +
        '<p class="mini">El que llegó primero se queda con su número. El otro se va al final de su familia.</p>' +
        tabla + '</div>'
      : '') +

    (r.fuera_de_formato.length
      ? '<div class="card"><h3>Se quedan igual</h3>' +
        '<p class="mini">Estas claves no tienen la forma PREFIJO-NÚMERO, así que no se tocan.</p>' +
        '<div class="lista">' + r.fuera_de_formato.map(function (x) {
          return '<div class="item"><div class="l"><div class="mono">' + esc(x.sku) + '</div>' +
                 '<div class="mini">' + esc(x.nombre) + '</div></div></div>';
        }).join('') + '</div></div>'
      : '') +

    (r.mapa.length && !r.conflictos.length
      ? '<div class="card"><h3>Aplicar</h3>' +
        '<p class="sub">Se renombran las claves en el catálogo y en todo el historial ' +
        '—lotes, movimientos y bitácoras— en un solo paso, y queda registro de qué ' +
        'clave tenía antes cada insumo. Al terminar se verifica que ningún lote ' +
        'quedó suelto y que no se movió ninguna pieza.</p>' +
        '<button class="b-primary" id="bAplicar">Homologar los ' + r.mapa.length + ' folios</button></div>'
      : (r.mapa.length ? '' : '<div class="aviso a-ok">Los folios ya están homologados. No hay nada que mover.</div>')) +

    '<button class="b-ghost" id="bV">Volver</button>');

  $('bV').onclick = function () { pantallaInicio(); };

  if ($('bAplicar')) $('bAplicar').onclick = async function () {
    var boton = this;
    boton.disabled = true; boton.textContent = 'Homologando…';
    var res;
    try {
      res = await enviar({ accion: 'folios_homologar', confirmar: 'HOMOLOGAR' }, true);
    } catch (e) {
      boton.disabled = false; boton.textContent = 'Homologar los ' + r.mapa.length + ' folios';
      return alertar('Sin conexión. No se aplicó nada.');
    }
    if (!res.ok) {
      boton.disabled = false; boton.textContent = 'Homologar los ' + r.mapa.length + ' folios';
      return alertar(res.error + (res.conflictos ? '\n' + res.conflictos.join('\n') : ''));
    }
    /* El catálogo en el teléfono quedó con las claves viejas: hay que
       recargarlo antes de pintar cualquier pantalla que lo use. */
    await cargarCat();
    var huerf = Object.keys(res.huerfanos || {});
    encabezado('Folios homologados', 'Listo');
    pintar(
      '<div class="aviso ' + (res.saldo_intacto && !huerf.length ? 'a-ok' : 'a-warn') + '">' +
      '<b>Se homologaron ' + res.cambios + ' folios.</b><br>' +
      res.solo_cero + ' sólo ganaron el cero y ' + res.reasignados + ' cambiaron de número.</div>' +
      '<div class="card"><h3>Verificación</h3><div class="lista">' +
      '<div class="item"><div class="l"><div>Las existencias no se movieron</div></div>' +
      '<span class="pill ' + (res.saldo_intacto ? 'p-ok' : 'p-crit') + '">' +
      (res.saldo_intacto ? 'sí' : 'REVISAR') + '</span></div>' +
      '<div class="item"><div class="l"><div>Lotes apuntando a una clave que no existe</div></div>' +
      '<span class="pill ' + (huerf.length ? 'p-crit' : 'p-ok') + '">' + huerf.length + '</span></div>' +
      '</div>' +
      (huerf.length ? '<p class="mini">' + esc(huerf.join(', ')) + '</p>' : '') +
      (res.diferencias && res.diferencias.length
        ? '<p class="mini">' + esc(res.diferencias.join(' · ')) + '</p>' : '') +
      '</div>' +
      '<button class="b-primary" id="bFin">Volver al inicio</button>');
    $('bFin').onclick = function () { pantallaInicio(); };
  };
}

/* Quien está limitado a un almacén ve el catálogo de ese almacén. No es
   un filtro cosmético: el catálogo sirve para reconocer lo que se tiene en
   la mano, y 300 claves de otra clínica entre las suyas convierten una
   búsqueda de dos segundos en una de treinta. */
function catalogoRecortado() {
  var s = (estado.cat && estado.cat.skus_alcance) || null;
  return !!(s && s.length);
}

function pantallaCatalogo(filtro, todo) {
  encabezado('Catálogo', 'Qué es cada cosa');
  var lista = ((estado.cat && estado.cat.catalogo) || []).slice();
  var recorte = (!todo && catalogoRecortado()) ? estado.cat.skus_alcance : null;
  if (recorte) {
    var mios = {};
    recorte.forEach(function (s) { mios[String(s).toUpperCase()] = true; });
    lista = lista.filter(function (s) { return mios[String(s.sku).toUpperCase()]; });
  }
  var q = plano(filtro || '');
  var vistos = q
    ? lista.filter(function (s) { return plano(s.sku + ' ' + s.nombre + ' ' + (s.presentacion || '')).indexOf(q) >= 0; })
    : lista;
  vistos.sort(function (a, b) { return String(a.sku).localeCompare(String(b.sku)); });

  var conFoto = lista.filter(function (s) { return s.tiene_foto; }).length;
  var tope = vistos.slice(0, 60);

  var alertados = lista.filter(function (s) { return s.alerta; });

  var filas = tope.map(function (s) {
    return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
      (s.tiene_foto
        ? '<img class="foto-mini" id="mini-' + esc(s.sku) + '" alt="">'
        : '<span class="sin-foto">sin<br>foto</span>') +
      '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
      '<span class="c">' + esc(s.sku) + (s.presentacion ? ' · ' + esc(s.presentacion) : '') + '</span></span>' +
      (s.alerta ? '<span class="pill p-warn">revisar</span>'
        : (String(s.controlado).toUpperCase() === 'SI' ? '<span class="pill p-neutral">llave</span>' : '')) +
      '</button>';
  }).join('');

  pintar(
    (recorte
      ? '<div class="card"><p class="mini">Las ' + lista.length + ' claves que maneja este ' +
        'almacén. <a href="#" id="cTodo">Ver el catálogo completo</a> si vas a recibir algo nuevo.</p></div>'
      : '') +
    '<div class="card">' +
    '<div class="campo"><label>Buscar</label>' +
    '<input id="cBusca" placeholder="Código, nombre o presentación" value="' + esc(filtro || '') + '"></div>' +
    '<p class="mini">' + lista.length + ' insumos en el catálogo · ' +
      (conFoto === 0 ? 'ninguno tiene foto todavía'
                     : conFoto + (conFoto === 1 ? ' ya tiene foto' : ' ya tienen foto')) + '.</p>' +
    '</div>' +

    (alertados.length
      ? '<div class="card"><h3>' + alertados.length + ' por revisar</h3>' +
        '<p class="sub">Su nombre suena a medicamento controlado y están capturados como si no lo fueran. ' +
        'El grupo viene impreso en la caja: hay que verlo antes de decidir.</p>' +
        '<button class="b-dark" id="bAlertas">Ver cuáles son</button></div>'
      : '') +

    '<div class="card">' +
    (tope.length
      ? filas + (vistos.length > tope.length
          ? '<p class="mini" style="margin-top:10px">Se muestran ' + tope.length + ' de ' +
            vistos.length + '. Escribe algo más para acortar la lista.</p>'
          : '')
      : '<p class="sub centro">Nada coincide con esa búsqueda.</p>') +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver al inicio</button>');

  /* 'todo' viaja en cada vuelta: si alguien abrió el catálogo completo para
     buscar una clave nueva, teclear no debe regresarlo al recorte. */
  if ($('cTodo')) $('cTodo').onclick = function (e) {
    e.preventDefault(); pantallaCatalogo(filtro, true);
  };

  var caja = $('cBusca');
  caja.oninput = function () {
    var v = this.value, pos = this.selectionStart;
    clearTimeout(window.__tBusca);
    window.__tBusca = setTimeout(function () {
      pantallaCatalogo(v, todo);
      var n = $('cBusca'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    }, 220);
  };

  Array.prototype.forEach.call(document.querySelectorAll('.fila-sku'), function (b) {
    b.onclick = function () { pantallaSkuFicha(this.getAttribute('data-sku'), function () { pantallaCatalogo(filtro, todo); }); };
  });

  /* Las miniaturas se traen una por una y sin bloquear la lista: si no hay
     señal, la lista sigue sirviendo y sólo faltan las imágenes. */
  tope.forEach(function (s) {
    if (!s.tiene_foto) return;
    traerFoto(s.sku).then(function (img) {
      var el = $('mini-' + s.sku); if (el) el.src = img;
    }).catch(function () {});
  });

  if ($('bAlertas')) $('bAlertas').onclick = function () { pantallaControlados(); };
  $('bV').onclick = function () { pantallaInicio(); };
}

/* Los insumos que suenan a controlado y no están marcados. Es una lista de
   trabajo: se entra a cada uno, se ve la caja y se decide. */
function pantallaControlados() {
  encabezado('Por revisar', 'Posibles controlados');
  var lista = ((estado.cat && estado.cat.catalogo) || []).filter(function (s) { return s.alerta; });
  var marcados = ((estado.cat && estado.cat.catalogo) || [])
    .filter(function (s) { return String(s.controlado).toUpperCase() === 'SI'; });

  pintar(
    (lista.length
      ? '<div class="card"><h3>' + lista.length + ' sin marcar</h3>' +
        lista.map(function (s) {
          return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + '</span>' +
            '<span class="c" style="color:var(--warn);text-transform:none;letter-spacing:0">' +
            esc(s.alerta) + '</span></span>' +
            '<span class="pill p-warn">revisar</span></button>';
        }).join('') + '</div>'
      : '<div class="card"><p class="sub centro">Ninguno pendiente. Todos los que suenan a controlado ya están marcados.</p></div>') +

    '<div class="card"><h3>' + marcados.length + ' marcados como controlados</h3>' +
    (marcados.length
      ? marcados.map(function (s) {
          return '<button class="fila-sku" data-sku="' + esc(s.sku) + '">' +
            '<span class="t"><span class="n">' + esc(s.nombre) + '</span>' +
            '<span class="c">' + esc(s.sku) + ' · nivel ' + esc(s.nivel || '—') + '</span></span>' +
            '<span class="pill p-neutral">llave</span></button>';
        }).join('')
      : '<p class="sub centro">Todavía ninguno.</p>') +
    '</div>' +

    '<div class="card"><p class="mini">Esta lista es una red de seguridad sobre la captura, no una clasificación legal. ' +
    'El dato bueno es el grupo impreso en el empaque: I, II o III va como controlado.</p></div>' +

    '<button class="b-ghost" id="bV">Volver al catálogo</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.fila-sku'), function (b) {
    b.onclick = function () {
      pantallaSkuFicha(this.getAttribute('data-sku'), pantallaControlados);
    };
  });
  $('bV').onclick = function () { pantallaCatalogo(''); };
}

function pantallaSkuFicha(sku, volver) {
  var art = null;
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === String(sku).toUpperCase()) art = s;
  });
  if (!art) return alertar('Ese código ya no está en el catálogo.');

  encabezado(art.sku, 'Ficha del insumo');
  var nueva = null;
  var opt = function (lista, sel) {
    return lista.map(function (v) {
      return '<option' + (String(sel).toUpperCase() === v ? ' selected' : '') + '>' + v + '</option>';
    }).join('');
  };

  pintar(
    '<div class="card">' +
    '<h3>' + esc(art.nombre) + '</h3>' +
    '<div class="lista">' +
    '<div class="item"><div class="l"><div>Código</div></div><span class="pill p-neutral">' + esc(art.sku) + '</span></div>' +
    (art.presentacion ? '<div class="item"><div class="l"><div>Presentación</div></div><span>' + esc(art.presentacion) + '</span></div>' : '') +
    '<div class="item"><div class="l"><div>Se descuenta en</div></div><span>' + esc(art.unidad_base || '—') + '</span></div>' +
    (String(art.controlado).toUpperCase() === 'SI'
      ? '<div class="item"><div class="l"><div>Controlado</div></div>' +
        '<span class="pill p-warn">Bajo llave y registro</span></div>' +
        '<div class="item"><div class="l"><div>mL por pieza</div></div>' +
        (art.volumen_pieza
          ? '<span class="mono">' + esc(art.volumen_pieza) + ' mL</span>'
          : '<span class="pill p-warn">falta capturarlo</span>') + '</div>'
      : '') +
    '</div>' +
    '<div class="espacio"></div>' +
    '<button class="b-ghost" id="bSusLotes">Ver sus lotes y caducidades</button>' +
    '</div>' +

    (art.alerta
      ? '<div class="aviso a-warn"><b>Revisa la caja de este producto.</b><br>' + esc(art.alerta) +
        '<br>Está capturado como <b>no controlado</b>.</div>'
      : '') +

    '<div class="card"><h3>Clasificación</h3>' +
    '<p class="mini">El grupo viene impreso en el empaque. Grupo I, II o III va como controlado; del IV para abajo, no.</p>' +
    '<div class="dos">' +
    '<div class="campo"><label>¿Controlado?</label><select id="eCtrl">' + opt(['NO','SI'], art.controlado) + '</select></div>' +
    '<div class="campo"><label>Nivel de conteo</label><select id="eNiv">' + opt(['N1','N2','N3'], art.nivel) + '</select></div>' +
    '</div>' +
    '<div class="dos">' +
    '<div class="campo"><label>¿Multidosis?</label><select id="eMulti">' + opt(['NO','SI'], art.es_multidosis) + '</select></div>' +
    '<div class="campo"><label>Clase ABC</label><select id="eClase">' + opt(['A','B','C'], art.clase_abc) + '</select></div>' +
    '</div>' +
    '<div class="campo"><label>¿Se cobra aparte?</label><select id="eFact">' +
      opt(['PAQUETE','SIEMPRE','NUNCA'], art.facturable) + '</select></div>' +
    /* Sólo para controlados: en una gasa "mL por pieza" no quiere decir nada.
       Se muestra y se esconde solo al cambiar la bandera de controlado. */
    '<div class="campo" id="eVolCampo"><label>mL por ampolleta o frasco</label>' +
      '<input id="eVol" type="number" min="0" step="0.1" inputmode="decimal" value="' +
      esc(art.volumen_pieza || '') + '" placeholder="Lo dice el empaque">' +
      '<p class="mini">De aquí sale la comprobación del registro de controlados: ' +
      'lo administrado más lo desperdiciado tiene que dar el volumen de lo que se abrió. ' +
      'Si se deja vacío, el registro guarda igual pero no comprueba.</p></div>' +
    '<p class="mini" id="eNota">N1 se cuenta pieza por pieza · N2 por lote · N3 por consumo. Un controlado que no es multidosis va en N1: el registro pide una línea por ampolleta.</p>' +
    '<button class="b-primary" id="eGuardar">Guardar clasificación</button>' +
    '</div>' +

    '<div class="card"><h3>Foto</h3>' +
    '<p class="mini" id="fNota">' + (art.tiene_foto ? 'Cargando la foto guardada…' : 'Este insumo todavía no tiene foto.') + '</p>' +
    '<img id="fImg" class="foto-prev oculto" alt="">' +
    '<div class="espacio"></div>' +
    '<label for="fFile">' + (art.tiene_foto ? 'Reemplazar la foto' : 'Tomar o elegir una foto') + '</label>' +
    '<input id="fFile" type="file" accept="image/*" capture="environment">' +
    '<div class="espacio"></div>' +
    '<button class="b-primary oculto" id="bSubir">Guardar esta foto</button>' +
    '</div>' +

    '<button class="b-ghost" id="bV">Volver</button>');

  $('bSusLotes').onclick = function () { pantallaLotes(art.sku); };

  if (art.tiene_foto) {
    traerFoto(art.sku).then(function (img) {
      $('fImg').src = img; $('fImg').classList.remove('oculto');
      $('fNota').textContent = 'Si tomas otra, reemplaza a esta.';
    }).catch(function (e) { $('fNota').textContent = e.message; });
  }

  $('fFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    comprimir(f, function (b64) {
      nueva = b64;
      $('fImg').src = b64; $('fImg').classList.remove('oculto');
      $('fNota').textContent = 'Foto nueva. Todavía no se guarda: dale al botón.';
      $('bSubir').classList.remove('oculto');
    });
  };

  $('bSubir').onclick = async function () {
    if (!nueva) return;
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      /* A propósito NO se encola: una foto pesa demasiado para el
         almacenamiento del teléfono y encolarla desplazaría recepciones
         pendientes, que sí son irrecuperables. */
      var r = await enviar({ accion: 'sku_foto_guardar', sku: art.sku, foto_base64: nueva }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar esta foto'; return alertar(r.error); }
      FOTOS[String(art.sku).toUpperCase()] = nueva;
      marcarConFoto(art.sku);
      this.classList.add('oculto');
      $('fNota').textContent = 'Foto guardada.';
      alertar('Foto guardada en ' + art.sku + '.');
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar esta foto';
      alertar('Sin señal: la foto necesita conexión para guardarse.');
    }
  };

  /* Al marcar controlado se propone el nivel que le toca, pero no se cambia
     solo: el nivel decide cómo se captura en el anaquel y esa es decisión
     de quien surte, no del sistema. */
  function proponerNivel() {
    var ctrl = $('eCtrl').value === 'SI', multi = $('eMulti').value === 'SI';
    var claseA = $('eClase').value === 'A';
    var deberia = (!multi && (ctrl || claseA)) ? 'N1' : (multi ? 'N2' : null);
    var nota = $('eNota');
    if (deberia && $('eNiv').value !== deberia) {
      nota.innerHTML = 'Por como quedó, a este insumo le tocaría <b>' + deberia + '</b>. ' +
        '<a href="#" id="ePonNiv">Ponerlo en ' + deberia + '</a>';
      $('ePonNiv').onclick = function (ev) {
        ev.preventDefault(); $('eNiv').value = deberia; proponerNivel();
      };
    } else {
      nota.textContent = 'N1 se cuenta pieza por pieza · N2 por lote · N3 por consumo.';
    }
  }
  function mostrarVolumen() {
    var campo = $('eVolCampo');
    if (campo) campo.hidden = $('eCtrl').value.toUpperCase() !== 'SI';
  }
  ['eCtrl','eMulti','eClase','eNiv'].forEach(function (id) {
    $(id).onchange = function () { proponerNivel(); mostrarVolumen(); };
  });
  proponerNivel();
  mostrarVolumen();

  $('eGuardar').onclick = async function () {
    var cambios = {
      controlado:    $('eCtrl').value,
      nivel_control: $('eNiv').value,
      es_multidosis: $('eMulti').value,
      clase_abc:     $('eClase').value,
      facturable:    $('eFact').value
    };
    /* Sólo se manda si el insumo es controlado: si no, el campo ni se ve y
       mandarlo vacío borraría un dato que alguien capturó antes. */
    if ($('eCtrl').value.toUpperCase() === 'SI') {
      cambios.volumen_pieza = $('eVol').value.trim();
    }
    this.disabled = true; this.textContent = 'Guardando…';
    try {
      var r = await enviar({ accion: 'sku_editar', sku: art.sku, cambios: cambios }, true);
      if (!r.ok) { this.disabled = false; this.textContent = 'Guardar clasificación'; return alertar(r.error); }
      /* El catálogo en memoria se actualiza sin volver a bajarlo completo:
         son 184 renglones y la pantalla ya tiene los valores buenos. */
      for (var k in cambios) if (cambios.hasOwnProperty(k)) {
        if (k === 'nivel_control') art.nivel = cambios[k]; else art[k] = cambios[k];
      }
      if (cambios.controlado === 'SI') art.alerta = '';
      this.disabled = false; this.textContent = 'Guardar clasificación';
      if (r.sin_cambios) return alertar('No había nada que cambiar.');
      alertar(r.cambios + ' dato(s) guardados en ' + art.sku + '.');
      pantallaSkuFicha(art.sku, volver);
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar clasificación';
      alertar('Sin señal: cambiar la clasificación necesita conexión.');
    }
  };

  $('bV').onclick = function () { (volver || pantallaCatalogo)(); };
}

/* =================================================================
   Arranque
   ================================================================= */
window.addEventListener('online', function () { pintarEstado(); vaciarCola(); });
window.addEventListener('offline', pintarEstado);

(async function inicio() {
  try { arrancar(); } catch (e) { pantallaFalloDuro(e); }
})();

function pantallaFalloDuro(e) {
  var d = document.getElementById('app');
  if (!d) return;
  d.innerHTML =
    '<div class="aviso a-err">La app no pudo arrancar.</div>' +
    '<div class="card"><p class="mini">' + esc(String((e && e.message) || e)) + '</p></div>' +
    '<button class="b-dark" onclick="reiniciarApp()">Reiniciar la app</button>' +
    '<button class="b-ghost" onclick="location.reload()">Volver a intentar</button>';
}

async function arrancar() {
  pintarEstado();
  if (!estado.sesion || !estado.sesion.sesion) return pantallaLogin();
  pantallaInicio();
  try { await cargarCat(); pantallaInicio(); } catch (e) {}
  vaciarCola();
}

/* Registro del service worker con actualización automática.
   Sin esto, un teléfono se quedaba con la versión vieja de la app hasta que
   alguien la borrara a mano: se subía un arreglo y no llegaba. Ahora la app
   busca versión nueva al abrir y cada vez que vuelves a ella, y se recarga
   sola una sola vez cuando la nueva toma el control. */
if ('serviceWorker' in navigator && navigator.serviceWorker) {
  var habiaControlador = !!navigator.serviceWorker.controller;
  var recargando = false;

  /* Tope duro: como mucho UNA recarga automatica por sesion de pestana.
     Sin este tope, si dos service workers se pelean el control la app se
     recarga sin parar y se ve como una pantalla en blanco que nunca carga. */
  var yaRecargo = false;
  try { yaRecargo = sessionStorage.getItem('msu_sw_recarga') === '1'; } catch (e) {}

  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!habiaControlador || recargando || yaRecargo) return;
    recargando = true;
    try { sessionStorage.setItem('msu_sw_recarga', '1'); } catch (e) {}
    location.reload();
  });

  navigator.serviceWorker.register('sw.js').then(function (reg) {
    var buscar = function () { try { reg.update(); } catch (e) {} };
    buscar();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') buscar();
    });
  }).catch(function () {});
}
</script>
