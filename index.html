/* El número del libro llega después, como el tablero: la portada tiene que
   responder desde el primer instante. Va en la baldosa y no en un tablero
   aparte porque es ahí donde se entra a atenderlo. */
async function cargarLibro() {
  var b = $('bLibro');
  if (!b) return;
  try {
    var r = await enviar({ accion: 'ministracion_pendientes' }, true);
    if (!r.ok || !$('bLibro')) return;
    var q = $('bLibro').querySelector('.q');
    if (!q) return;
    if (!r.total) { q.textContent = 'Al corriente'; return; }
    q.textContent = r.total + ' renglón(es) en ' + r.cajas + ' cirugía(s)';
    $('bLibro').classList.add('urge');
  } catch (e) { /* la portada se queda como está: no es información que valga una alarma falsa */ }
}

/* El tablero llega después de pintar la portada: los botones tienen que
   responder desde el primer instante aunque la red esté lenta. */
async function cargarTablero() {
  var caja = $('tablero');
  if (!caja) return;
  try {
    var t = await enviar({ accion: 'tablero' }, true);
    if (!t.ok || !$('tablero')) return;
    pintarTablero(t);
  } catch (e) {
    $('tablero').innerHTML = '<p class="mini centro">Sin conexión: no se pudo leer el estado del almacén.</p>';
  }
}

function pintarTablero(t) {
  var ue = t.ultima_entrada || {};

  /* Arriba sólo va lo que alguien puede atender HOY, y como mucho tres cosas.
     Ocho fichas de números antes del primer botón es el mismo error que los
     nueve párrafos de la portada anterior, nada más que en cifras: obliga a
     recorrer la pantalla entera para llegar a lo que se venía a hacer.

     "76 claves en cero" no entra aquí a propósito. En un almacén que apenas
     arranca eso es lo esperado, no una urgencia; pintarlo en rojo junto a un
     lote vencido enseña a ignorar el rojo. */
  var urgente = [];
  if (t.caducidad.vencidos) {
    urgente.push({ n: t.caducidad.vencidos, e: 'vencido(s) en el anaquel', c: 'd-crit', ir: 'caducar' });
  }
  if (t.dotaciones.no_listas) {
    urgente.push({ n: t.dotaciones.no_listas, e: 'de ' + t.dotaciones.total + ' dotaciones incompletas',
                   c: 'd-crit', ir: 'dotaciones' });
  }
  /* Las cajas abiertas son de quien las surte. A quien lleva un almacén que
     aplica a paciente le estaban saliendo las cajas de la otra sede: un
     número rojo que no puede atender y que además no es de su clínica. */
  if (t.cajas_abiertas.length && !soloAplicacion()) {
    urgente.push({ n: t.cajas_abiertas.length, e: 'caja(s) abierta(s)', c: 'd-warn', ir: 'cajas' });
  }
  if (t.caducidad.por_vencer && urgente.length < 3) {
    urgente.push({ n: t.caducidad.por_vencer, e: 'por vencer en ' + t.caducidad.horizonte + ' días',
                   c: 'd-warn', ir: 'caducar' });
  }
  urgente = urgente.slice(0, 3);

  var arriba = '';
  if (urgente.length) {
    arriba += '<div class="tira">' + urgente.map(function (a) {
      return '<button class="dato ' + a.c + '" data-ir="' + a.ir + '">' +
             '<span class="n">' + a.n + '</span><span class="e">' + esc(a.e) + '</span></button>';
    }).join('') + '</div>';
  } else {
    arriba += '<div class="aviso a-ok">Nada que atender: sin vencidos, sin cajas abiertas y las dotaciones completas.</div>';
  }

  /* Que hace días que no entra nada no es una falla del sistema, pero es lo
     primero que explica por qué media app está en rojo. */
  if (ue.dias !== null && ue.dias !== undefined && ue.dias >= 7) {
    arriba += '<div class="aviso a-warn">Hace <b>' + ue.dias + ' días</b> que no se captura una entrada. ' +
              'Si ha llegado material, no está en el sistema.</div>';
  } else if (!ue.fecha) {
    arriba += '<div class="aviso a-info">Todavía no se ha capturado ninguna entrada.</div>';
  }

  /* «307 claves en cero» es el catálogo entero del sistema. Para quien
     maneja diecinueve claves no es información: es un número grande que no
     significa nada y que esconde al de al lado. Se cuenta sobre su propio
     catálogo o no se enseña. */
  var cero = t.existencia.en_cero;
  var skusMios = (estado.cat && estado.cat.skus_alcance) || null;
  if (skusMios) cero = Math.max(0, skusMios.length - t.existencia.con_saldo);

  var abajo = '<div class="tira">' +
    '<button class="dato" data-ir="existencias"><span class="n">' + t.existencia.con_saldo +
      '</span><span class="e">claves con existencia</span></button>' +
    '<button class="dato" data-ir="cero"><span class="n">' + cero +
      '</span><span class="e">claves en cero</span></button>' +
    (soloAplicacion() ? '' :
      '<button class="dato" data-ir="armar"><span class="n">' + t.plantillas.surtibles + '/' +
      t.plantillas.total + '</span><span class="e">plantillas armables</span></button>') +
    '</div>';

  if ($('tablero')) $('tablero').innerHTML = arriba;
  if ($('tablero2')) $('tablero2').innerHTML = abajo;

  var irA = {
    caducar: function () { pantallaExistencias('', 'caducar'); },
    cero: function () { pantallaExistencias('', 'cero'); },
    existencias: function () { pantallaExistencias(''); },
    cajas: function () { pantallaCajas(); },
    dotaciones: function () { pantallaDotaciones(); },
    armar: function () { pantallaSurtido(); }
  };
  [].forEach.call(document.querySelectorAll('[data-ir]'), function (b) {
    b.onclick = function () { (irA[b.getAttribute('data-ir')] || function () {})(); };
  });
}

/* =================================================================
   Existencias
   =================================================================
   La pantalla anterior listaba 291 renglones de LOTE ordenados por nombre.
   "Agua estéril" salía tres veces y había que sumar de cabeza. Eso es el
   kardex, y el kardex es la verdad, pero no es la pregunta: la pregunta es
   "¿cuánta agua estéril tenemos?".

   Aquí se agrupa por producto y el lote queda como detalle, que es el orden
   en que alguien lo piensa. Y lo que está en una caja abierta o en una
   dotación sellada se cuenta aparte: existe, pero no se puede prometer.
   ================================================================= */

/* Leer la existencia obliga a recorrer el kardex entero y tarda segundos.
   Peor: si se entra aquí mientras el tablero de la portada todavía está
   cargando, las dos peticiones se forman una detrás de otra y la primera
   búsqueda del día se siente eterna.

   Por eso lo ya leído se queda en memoria por un rato: al volver, la pantalla
   aparece de inmediato con lo último que se supo —diciendo de cuándo es— y se
   refresca por detrás. Nunca se inventa un dato: si no hay nada en memoria,
   se espera, y mientras se espera se dice por qué tarda. */
var EXIST_FRESCO_MS = 120000;

async function pantallaExistencias(q, filtro) {
  encabezado('Existencias', 'Qué hay y dónde está');
  estado.existQ = String(q || '');
  estado.existF = filtro || 'todo';

  var fresco = estado.exist && estado.existAt && (Date.now() - estado.existAt) < EXIST_FRESCO_MS;
  if (estado.exist) {
    pintarExistencias();
    if (fresco) return;
  } else {
    pintar('<div class="card"><p class="sub">Leyendo el kardex…</p>' +
           '<p class="mini">La existencia no está guardada en ningún lado: se suma movimiento ' +
           'por movimiento cada vez que se pregunta. Por eso tarda unos segundos.</p></div>');
  }

  try {
    var r = await enviar({ accion: 'existencias' }, true);
    if (!r.ok) {
      if (estado.exist) return alertar(r.error);
      return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');
    }
    estado.exist = r.existencias;
    estado.existAt = Date.now();
    pintarExistencias();
  } catch (e) {
    if (estado.exist) return alertar('Sin conexión: esto es lo último que se supo.');
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}

function agruparExistencias() {
  var cat = (estado.cat && estado.cat.catalogo) || [];
  var porSku = {};
  cat.forEach(function (c) {
    if (!c.sku || String(c.activo).toUpperCase() === 'NO') return;
    porSku[String(c.sku).toUpperCase()] = {
      sku: c.sku, nombre: c.nombre || c.sku,
      anaquel: 0, caja: 0, dotacion: 0, lotes: [], peorDia: null
    };
  });
  (estado.exist || []).forEach(function (x) {
    var k = String(x.sku).toUpperCase();
    if (!porSku[k]) {
      porSku[k] = { sku: x.sku, nombre: x.nombre || x.sku,
                    anaquel: 0, caja: 0, dotacion: 0, lotes: [], peorDia: null, fuera: true };
    }
    var g = porSku[k], donde = dondeEsta(x);
    g[donde] += x.cantidad;
    var d = diasDeCad(x.caducidad);
    if (d !== null && donde === 'anaquel' && (g.peorDia === null || d < g.peorDia)) g.peorDia = d;
    g.lotes.push({ lote_id: x.lote_id, ubic: x.ubic_nombre || x.ubic_id,
                   cantidad: x.cantidad, caducidad: x.caducidad, dias: d, donde: donde });
  });
  return Object.keys(porSku).map(function (k) { return porSku[k]; });
}

function pintarExistencias() {
  var todos = agruparExistencias();
  var q = (estado.existQ || '').trim().toLowerCase();
  var f = estado.existF || 'todo';

  function sinAc(s) {
    return String(s || '').normalize ? String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
                                     : String(s || '').toLowerCase();
  }
  var qn = sinAc(q);

  var cuenta = {
    todo: todos.filter(function (g) { return g.anaquel > 0 || g.caja > 0 || g.dotacion > 0; }).length,
    cero: todos.filter(function (g) { return !g.fuera && g.anaquel <= 0; }).length,
    caducar: todos.filter(function (g) { return g.peorDia !== null && g.peorDia <= 90; }).length,
    caja: todos.filter(function (g) { return g.caja > 0; }).length,
    dotacion: todos.filter(function (g) { return g.dotacion > 0; }).length
  };

  var lista = todos.filter(function (g) {
    if (qn && sinAc(g.nombre).indexOf(qn) < 0 && sinAc(g.sku).indexOf(qn) < 0) return false;
    if (f === 'todo') return g.anaquel > 0 || g.caja > 0 || g.dotacion > 0;
    if (f === 'cero') return !g.fuera && g.anaquel <= 0;
    if (f === 'caducar') return g.peorDia !== null && g.peorDia <= 90;
    if (f === 'caja') return g.caja > 0;
    if (f === 'dotacion') return g.dotacion > 0;
    return true;
  });

  /* Lo urgente arriba: primero lo vencido, luego lo que está por vencerse,
     y dentro de cada grupo por nombre. Ordenar sólo por nombre esconde lo
     que hay que atender en la letra T. */
  lista.sort(function (a, b) {
    var pa = a.peorDia !== null && a.peorDia < 0 ? 0 : (a.peorDia !== null && a.peorDia <= 90 ? 1 : 2);
    var pb = b.peorDia !== null && b.peorDia < 0 ? 0 : (b.peorDia !== null && b.peorDia <= 90 ? 1 : 2);
    if (pa !== pb) return pa - pb;
    return String(a.nombre).localeCompare(String(b.nombre));
  });

  function chip(id, txt) {
    return '<button class="chip' + (f === id ? ' on' : '') + '" data-f="' + id + '">' +
           esc(txt) + '<span class="c">' + cuenta[id] + '</span></button>';
  }

  function prod(g, i) {
    var cero = g.anaquel <= 0;
    var marcas = [];
    if (g.peorDia !== null && g.peorDia < 0) marcas.push('<span class="pill p-crit">vencido</span>');
    else if (g.peorDia !== null && g.peorDia <= 90) marcas.push('<span class="pill p-warn">vence en ' + g.peorDia + 'd</span>');
    if (g.caja > 0) marcas.push('<span class="pill p-info">' + nFmt(g.caja) + ' en caja</span>');
    if (g.dotacion > 0) marcas.push('<span class="pill p-neutral">' + nFmt(g.dotacion) + ' comprometido</span>');

    var det = g.lotes.length
      ? g.lotes.slice().sort(function (a, b) { return (a.dias === null ? 1e9 : a.dias) - (b.dias === null ? 1e9 : b.dias); })
          .map(function (l) {
            var cls = l.dias !== null && l.dias < 0 ? ' vencido' : (l.dias !== null && l.dias <= 90 ? ' vence' : '');
            return '<div class="r' + cls + '"><span>' + esc(l.lote_id) + ' · ' + esc(l.ubic) +
                   (l.caducidad ? ' · cad ' + esc(l.caducidad) : ' · sin caducidad') +
                   (l.donde !== 'anaquel' ? ' · ' + (l.donde === 'caja' ? 'EN CAJA' : 'COMPROMETIDO') : '') +
                   '</span><b>' + nFmt(l.cantidad) + '</b></div>';
          }).join('')
      : '<div class="r"><span>Sin ningún lote capturado</span><b>0</b></div>';

    return '<div class="prod" id="pg' + i + '">' +
      '<button data-g="' + i + '"><span class="t"><span class="n">' + esc(g.nombre) + '</span>' +
      '<span class="c">' + esc(g.sku) + (marcas.length ? ' ' : '') + '</span></span>' +
      '<span class="cant' + (cero ? ' cero' : '') + '">' + nFmt(g.anaquel) + '</span></button>' +
      (marcas.length ? '<div style="padding:0 4px 8px">' + marcas.join(' ') + '</div>' : '') +
      '<div class="det">' + det + '</div></div>';
  }

  pintar(
    '<div class="buscador"><input id="qE" placeholder="Busca por nombre o clave…" ' +
    'autocomplete="off" value="' + esc(estado.existQ || '') + '"></div>' +
    '<div class="chips">' +
    chip('todo', 'Con existencia') + chip('cero', 'En cero') +
    chip('caducar', 'Por caducar') + chip('caja', 'En cajas') +
    chip('dotacion', 'Comprometido') + '</div>' +
    '<div class="card">' +
    '<p class="mini">La cifra es lo que hay <b>en el anaquel</b>. Toca un renglón para ver sus lotes.' +
      (estado.existAt && (Date.now() - estado.existAt) > 15000
        ? ' · Leído hace ' + Math.round((Date.now() - estado.existAt) / 60000) + ' min'
        : '') + '</p>' +
    (lista.length
      ? '<div>' + lista.map(prod).join('') + '</div>'
      : '<p class="sub centro">Nada que mostrar con ese filtro.</p>') +
    '</div>' +
    '<button class="b-ghost" id="bBajar">Bajar el almac\u00e9n</button>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  var inp = $('qE');
  inp.oninput = function () {
    estado.existQ = inp.value;
    var pos = inp.selectionStart;
    pintarExistencias();
    var n = $('qE'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
  };
  [].forEach.call(document.querySelectorAll('[data-f]'), function (b) {
    b.onclick = function () { estado.existF = b.getAttribute('data-f'); pintarExistencias(); };
  });
  [].forEach.call(document.querySelectorAll('[data-g]'), function (b) {
    b.onclick = function () { $('pg' + b.getAttribute('data-g')).classList.toggle('abierto'); };
  });
  $('bBajar').onclick = function () { bajarAlmacen(this); };
  $('bV').onclick = function () { pantallaInicio(); };
}

/* El almac\u00e9n de hoy, en un archivo.

   Un rengl\u00f3n por lote y por ubicaci\u00f3n, que es como de verdad vive el
   inventario: el mismo insumo puede estar en el anaquel, dentro de una caja
   y comprometido en una dotaci\u00f3n al mismo tiempo, y sumarlos en una sola
   cifra es justo lo que hace que un conteo f\u00edsico no cuadre nunca.

   Sale lo que el kardex devolvi\u00f3, no lo que el filtro deje a la vista.
   Quien pide "el almac\u00e9n" quiere el almac\u00e9n, no la b\u00fasqueda que tra\u00eda
   tecleada. */
function bajarAlmacen(btn) {
  var filas = estado.exist || [];
  if (!filas.length) return alertar('Todav\u00eda no hay existencias le\u00eddas.');

  var uni = {};
  (((estado.cat || {}).catalogo) || []).forEach(function (c) {
    uni[String(c.sku).toUpperCase()] = c.unidad_base || 'pieza';
  });

  var donde = { anaquel: 'En el anaquel', caja: 'Dentro de una caja',
                dotacion: 'Comprometido en una dotaci\u00f3n' };

  function q(v) {
    v = String(v === null || v === undefined ? '' : v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }

  var cab = ['Insumo', 'Clave', 'Unidad', 'Existencia', 'D\u00f3nde est\u00e1',
             'Ubicaci\u00f3n', 'Lote del sistema', 'Lote del fabricante',
             'Caducidad', 'D\u00edas para caducar'];

  var orden = filas.slice().sort(function (a, b) {
    var n = String(a.nombre || '').localeCompare(String(b.nombre || ''));
    return n ? n : String(a.lote_id).localeCompare(String(b.lote_id));
  });

  var lineas = [cab.map(q).join(',')];
  orden.forEach(function (x) {
    var d = diasDeCad(x.caducidad);
    lineas.push([
      x.nombre || x.sku, x.sku, uni[String(x.sku).toUpperCase()] || 'pieza',
      x.cantidad, donde[dondeEsta(x)] || '', x.ubic_nombre || x.ubic_id,
      x.lote_id, x.lote_proveedor || '', x.caducidad || '',
      d === null ? '' : d
    ].map(q).join(','));
  });

  /* El BOM va primero o Excel abre los acentos rotos, que es la primera
     queja de cualquier exportaci\u00f3n en espa\u00f1ol. */
  var blob = new Blob(['\ufeff' + lineas.join('\r\n')],
                      { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'almacen-' + hoyISO() + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();

  if (btn) {
    btn.textContent = lineas.length - 1 + ' rengl\u00f3n(es) bajados';
    setTimeout(function () {
      if (btn) btn.textContent = 'Bajar el almac\u00e9n';
    }, 4000);
  }
}

/* =================================================================
   Armar una caja contra su plantilla
   =================================================================
   Surtir a mano son 63 búsquedas para una rinoplastia: buscar, elegir lote,
   teclear cantidad, repetir. Nadie hace eso dos veces; a la tercera cirugía
   la caja se arma en papel y el sistema se queda vacío.

   Esto lo hace de un toque: lee la plantilla, toma los lotes por caducidad
   más próxima y surte. Primero en seco, siempre: ver qué va a salir y qué
   va a faltar ANTES de mover inventario de verdad, porque probar el surtido
   contra el inventario real mueve inventario real.
   ================================================================= */

function pantallaCajaArmar(pre) {
  var c = estado.cat || { almacenes: [] };
  /* La precarga viene de la agenda: folio del caso y la plantilla ya amarrada
     a su paquete. Se guarda en estado para que el repintado por carga de
     plantillas no la borre. */
  if (pre) estado.armarPre = pre;
  pre = estado.armarPre || {};
  encabezado('Armar caja', pre.paciente ? pre.paciente : 'Contra la plantilla del procedimiento');
  var plants = (estado.plantillasNombres || []);
  if (pre.procedimiento && plants.indexOf(pre.procedimiento) < 0) plants = plants.concat([pre.procedimiento]);

  pintar(
    '<div class="card">' +
    (pre.paciente
      ? '<div class="aviso a-info">Caso <b>' + esc(pre.paciente) + '</b> de la agenda. ' +
        'La caja queda amarrada a ese folio, no a un nombre.</div>'
      : '') +
    '<div class="campo"><label>' + (pre.paciente ? 'Folio del caso' : 'Paciente') + '</label>' +
      '<input id="aPac" placeholder="Nombre completo" value="' + esc(pre.paciente || '') + '"></div>' +
    '<div class="campo"><label>Expediente (opcional)</label>' +
      '<input id="aExp" value="' + esc(pre.paciente_id || '') + '"></div>' +
    '<div class="campo"><label>Procedimiento</label><select id="aPlant">' +
      '<option value="">— elige —</option>' +
      plants.map(function (n) {
        return '<option' + (n === pre.procedimiento ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('') +
    '</select></div>' +
    '<div class="campo"><label>De dónde se toma</label>' +
      c.almacenes.map(function (a) {
        return '<label class="check"><input type="checkbox" class="aAlm" value="' +
               esc(a.id) + '" checked>' + esc(a.nombre) + '</label>';
      }).join('') +
      '<p class="mini">Vienen todos marcados a propósito: aquí el material no está ' +
      'en un solo lugar. Toma lo que primero se vence, esté donde esté, y el primero ' +
      'de la lista es nada más por dónde empezar.</p></div>' +
    '<button class="b-dark" id="bVer">Ver qué saldría</button>' +
    '<p class="mini">Primero en seco: nada se mueve hasta que lo confirmes.</p>' +
    '</div>' +
    '<div id="aPrev"></div>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  if (!plants.length) {
    enviar({ accion: 'plantillas' }, true).then(function (r) {
      if (!r.ok) return;
      estado.plantillasNombres = (r.plantillas || [])
        .filter(function (p) { return !p.es_base; })
        .map(function (p) { return p.plantilla; });
      if ($('aPlant')) pantallaCajaArmar();
    }).catch(function () {});
  }

  $('bV').onclick = function () { estado.armarPre = null;
    if (pre.paciente) pantallaAgenda(); else pantallaCajas(); };
  $('bVer').onclick = async function () {
    var d = leerCajaArmar();
    if (!d) return;
    this.disabled = true; this.textContent = 'Calculando…';
    try {
      var r = await enviar({ accion: 'caja_armar', simular: true, caja: d }, true);
      pintarPrevioArmado(r, d);
    } catch (e) { alertar('Sin conexión.'); }
    var b = $('bVer'); if (b) { b.disabled = false; b.textContent = 'Ver qué saldría'; }
  };
}

function leerCajaArmar() {
  var pac = ($('aPac').value || '').trim();
  var plant = $('aPlant').value;
  var alms = [].map.call(document.querySelectorAll('.aAlm:checked'), function (x) { return x.value; });
  if (!pac) { alertar('Falta el paciente.'); return null; }
  if (!plant) { alertar('Falta el procedimiento.'); return null; }
  if (!alms.length) { alertar('Marca al menos un almacén.'); return null; }
  return { paciente: pac, paciente_id: ($('aExp').value || '').trim(),
           procedimiento: plant, almacen: alms[0], almacenes: alms };
}

function pintarPrevioArmado(r, d) {
  if (!r.ok) { $('aPrev').innerHTML = '<div class="aviso a-err">' + esc(r.error) + '</div>'; return; }

  var nomAlm = {};
  ((estado.cat && estado.cat.almacenes) || []).forEach(function (a) { nomAlm[a.id] = a.nombre; });
  var varios = (r.almacenes || []).length > 1;

  function fila(x, falta) {
    /* De dónde sale sólo se dice cuando hay más de un almacén: con uno solo
       sería repetir la misma palabra en cada renglón. */
    var de = (varios && x.de && x.de.length)
      ? '<div class="mini">' + x.de.map(function (u) {
          return nFmt(u.cantidad) + ' de ' + esc(nomAlm[u.ubic_id] || u.ubic_id); }).join(' · ') + '</div>'
      : '';
    return '<div class="item"><div class="l"><span>' + esc(x.sku || '—') + '</span>' +
      '<div>' + esc(x.item) + '</div>' + de + '</div>' +
      '<span class="pill ' + (falta ? 'p-crit' : 'p-ok') + '">' +
      (falta ? nFmt(x.surtido) + ' de ' + nFmt(x.pide) : nFmt(x.surtido)) + '</span></div>';
  }

  $('aPrev').innerHTML =
    (r.faltantes.length
      ? '<div class="aviso a-warn"><b>' + r.faltantes.length + ' renglón(es) no se pueden surtir completos.</b> ' +
        'La caja se puede armar de todos modos: lo que falte se consigue aparte y se mete con «Sacar material». ' +
        'Lo que la plantilla pedía queda congelado, así que la diferencia no se pierde.</div>'
      : '<div class="aviso a-ok">Se puede surtir completa: ' + r.surtido.length + ' renglones.</div>') +

    (r.faltantes.length
      ? '<div class="card"><h3>Falta (' + r.faltantes.length + ')</h3><div class="lista">' +
        r.faltantes.map(function (x) { return fila(x, true); }).join('') + '</div></div>'
      : '') +

    '<div class="card"><h3>Saldría del almacén (' + r.surtido.length + ')</h3>' +
    '<p class="mini">Por caducidad más próxima primero.</p>' +
    '<div class="lista">' + r.surtido.map(function (x) { return fila(x, false); }).join('') +
    '</div></div>' +

    (r.revisar && r.revisar.length
      ? '<div class="card"><h3>No es material de almacén (' + r.revisar.length + ')</h3>' +
        '<p class="mini">Renglones de la plantilla que son nota, no insumo. No salen de aquí.</p>' +
        '<div class="lista">' + r.revisar.map(function (x) {
          return '<div class="item"><div class="l"><div>' + esc(x.item) + '</div></div></div>';
        }).join('') + '</div></div>'
      : '') +

    '<button class="b-primary" id="bArmar">Armar la caja y sacar el material</button>';

  $('bArmar').onclick = async function () {
    this.disabled = true; this.textContent = 'Armando…';
    try {
      var res = await enviar({ accion: 'caja_armar', caja: d }, true);
      if (!res.ok) { alertar(res.error); this.disabled = false;
                     this.textContent = 'Armar la caja y sacar el material'; return; }
      estado.armarPre = null;
      alertar('Caja ' + res.caja_id + ' armada: ' + res.renglones_surtidos + ' renglones.');
      pantallaCajaDetalle(res.caja_id);
    } catch (e) {
      alertar('Sin conexión: no se armó nada.');
      this.disabled = false; this.textContent = 'Armar la caja y sacar el material';
    }
  };
}

/* =================================================================
   Agenda de quirófano
   =================================================================
   La cirugía ya está agendada antes de que nadie toque el almacén. Volver a
   teclear el procedimiento para armar la caja es capturar dos veces lo mismo,
   y es donde se cuela el error: la caja dice RINOPLASTIA, el caso dice
   "Rinoplastía Ultrasónica", y después nadie sabe qué material fue de cuál.

   La caja se identifica por folio de caso, no por nombre: es menos dato
   personal paseándose por el almacén para lograr exactamente lo mismo.
   ================================================================= */

async function pantallaAgenda() {
  encabezado('Agenda', 'Cirugías programadas');
  pintar('<div class="card"><p class="sub">Leyendo la agenda…</p></div>');
  try {
    var r = await enviar({ accion: 'agenda', dias: estado.agendaDias || 30,
                           atras: estado.agendaAtras || 3 }, true);
    if (!r.ok) {
      pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
             '<button class="b-ghost" id="bV">Volver</button>');
      return void ($('bV').onclick = function () { pantallaInicio(); });
    }
    estado.agendaPlantillas = r.plantillas || [];

    function caso(c, i) {
      var cuando = c.dias === 0 ? 'hoy' : (c.dias === 1 ? 'mañana'
                 : (c.dias < 0 ? 'hace ' + (-c.dias) + ' d' : 'en ' + c.dias + ' d'));
      var avisos = [];
      if (c.implantes) avisos.push('<span class="pill p-info">implante: ' + esc(c.implantes) + '</span>');
      if (c.aporta) avisos.push('<span class="pill p-neutral">los aporta ' + esc(c.aporta) + '</span>');

      var acc;
      if (c.caja_id) {
        acc = '<span class="pill p-ok">' + esc(c.caja_id) + ' · ' + esc(c.caja_estado) + '</span>';
      } else if (c.plantilla) {
        acc = '<button class="b-primary" data-armar="' + i + '">Armar con ' + esc(c.plantilla) + '</button>';
      } else {
        acc = '<div class="campo"><label>Con qué plantilla se arma</label>' +
          '<select data-pl="' + i + '"><option value="">— elige —</option>' +
          (estado.agendaPlantillas || []).map(function (n) {
            return '<option' + (n === c.sugerida ? ' selected' : '') + '>' + esc(n) + '</option>';
          }).join('') + '</select></div>' +
          (c.sugerida
            ? '<p class="mini">Se parece a <b>' + esc(c.sugerida) + '</b> (' + c.parecido + '%), ' +
              'pero eso es parecido de nombre, no prueba. Confírmalo y no se vuelve a preguntar ' +
              'para este paquete.</p>'
            : '<p class="mini">Ninguna plantilla se parece a este paquete. Elige cuál le toca.</p>') +
          '<button class="b-dark" data-fijar="' + i + '">Amarrar paquete a esa plantilla</button>';
      }

      return '<div class="linea">' +
        '<div class="cab"><div><div class="nm">' + esc(c.folio_caso) + ' · ' + esc(cuando) + '</div>' +
        '<div class="datos">' + esc(c.fecha) + ' · ' + esc(c.quirofano) + ' · ' + esc(c.estatus) + '<br>' +
        esc(c.procedimiento || c.paquete_id) + '</div></div></div>' +
        (avisos.length ? '<div style="margin:6px 0">' + avisos.join(' ') + '</div>' : '') +
        '<div class="dest">' + acc + '</div></div>';
    }

    pintar(
      (r.sin_plantilla
        ? '<div class="aviso a-warn"><b>' + r.sin_plantilla + '</b> caso(s) todavía no saben con qué plantilla se arman.</div>'
        : '') +
      (r.casos.length
        ? r.casos.map(caso).join('')
        : '<div class="card"><p class="sub centro">No hay cirugías programadas en los próximos ' +
          r.dias + ' días.</p></div>') +
      '<p class="mini">La agenda sólo se lee: esta app nunca escribe en AltaZorvix. ' +
      'La caja queda amarrada al folio del caso, no al nombre del paciente.</p>' +
      '<button class="b-ghost" id="bMas">' +
        (estado.agendaDias > 30 ? 'Ver sólo el próximo mes' : 'Ver más atrás y más adelante') +
      '</button>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    [].forEach.call(document.querySelectorAll('[data-fijar]'), function (b) {
      b.onclick = async function () {
        var i = +b.getAttribute('data-fijar');
        var sel = document.querySelector('[data-pl="' + i + '"]');
        if (!sel.value) return alertar('Elige una plantilla.');
        b.disabled = true;
        var res = await enviar({ accion: 'mapa_paquete',

/* =================================================================
   Bandeja de variación
   =================================================================
   Cerrar una caja calcula el consumo. Revisarla es que una persona mire la
   diferencia contra lo que la plantilla pedía y firme que la conoce. Sin
   esta pantalla el sistema sabía que se fueron ocho gasas de más y nadie
   se enteraba nunca.
   ================================================================= */

async function pantallaRevisiones(todas) {
  encabezado('Por revisar', 'Consumo contra plantilla');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'cajas_por_revisar', todas: todas ? 'SI' : '' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

    function caja(c) {
      var marcas = [];
      if (c.controlados) marcas.push('<span class="pill p-crit">' + c.controlados + ' controlado(s)</span>');
      if (c.hay_que_revisar) marcas.push('<span class="pill p-warn">' + c.hay_que_revisar + ' fuera de rango</span>');
      if (c.revisada) marcas.push('<span class="pill p-ok">revisada</span>');
      if (!marcas.length) marcas.push('<span class="pill p-ok">sin variación</span>');
      return '<button class="baldosa ancha" data-c="' + esc(c.caja_id) + '">' +
        esc(c.paciente || c.caja_id) + ' · ' + esc(c.procedimiento) +
        '<span class="q">' + marcas.join(' ') + ' · cerrada hace ' + c.dias + ' d</span></button>';
    }

    pintar(
      (r.pendientes
        ? '<div class="aviso a-warn"><b>' + r.pendientes + '</b> caja(s) cerradas sin que nadie haya revisado su consumo.</div>'
        : '<div class="aviso a-ok">Nada pendiente de revisar.</div>') +
      (r.cajas.length
        ? '<div class="rejilla">' + r.cajas.map(caja).join('') + '</div>'
        : '<div class="card"><p class="sub centro">No hay cajas cerradas.</p></div>') +
      '<p class="mini">Se marca un renglón cuando la diferencia pasa del ' +
        Math.round(r.umbral * 100) + '%, y <b>siempre</b> si es un controlado que no cuadra: ' +
        'ahí no hay variación tolerable que valga.</p>' +
      '<button class="b-ghost" id="bTodas">' + (todas ? 'Ver sólo pendientes' : 'Ver también las ya revisadas') + '</button>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    [].forEach.call(document.querySelectorAll('[data-c]'), function (b) {
      b.onclick = function () { pantallaVariacion(b.getAttribute('data-c')); };
    });
    $('bTodas').onclick = function () { pantallaRevisiones(!todas); };
    $('bV').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}

async function pantallaVariacion(cajaId) {
  encabezado('Variación', cajaId);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'caja_comparar', caja_id: cajaId }, true);
    if (!r.ok) {
      pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
             '<button class="b-ghost" id="bV">Volver</button>');
      return void ($('bV').onclick = function () { pantallaRevisiones(); });
    }
    encabezado('Variación', (r.paciente || cajaId) + ' · ' + (r.plantilla || ''));

    var dice = { MAS: 'se usó de más', MENOS: 'se usó de menos',
                 EXTRA: 'no estaba en la plantilla', IGUAL: 'cuadra' };
    var color = { MAS: 'p-crit', MENOS: 'p-warn', EXTRA: 'p-info', IGUAL: 'p-ok' };

    function fila(f) {
      return '<div class="item"><div class="l"><span>' + esc(f.sku) +
        (f.controlado ? ' · CONTROLADO' : '') + '</span><div>' + esc(f.item || f.nombre) + '</div>' +
        '<div class="mini">pedía ' + nFmt(f.esperado) + ' · consumió ' + nFmt(f.consumido) + '</div></div>' +
        '<span class="pill ' + color[f.estado] + '">' +
        (f.diferencia > 0 ? '+' : '') + nFmt(f.diferencia) + '</span></div>';
    }

    var fuera = r.filas.filter(function (f) { return f.estado !== 'IGUAL'; });
    var iguales = r.filas.length - fuera.length;

    pintar(
      (r.hay_que_revisar
        ? '<div class="aviso a-err"><b>' + r.hay_que_revisar + ' renglón(es)</b> piden explicación.</div>'
        : '<div class="aviso a-ok">Nada fuera de rango.</div>') +

      (r.marcados.length
        ? '<div class="card"><h3>Piden explicación (' + r.marcados.length + ')</h3>' +
          '<div class="lista">' + r.marcados.map(fila).join('') + '</div></div>'
        : '') +

      (fuera.length > r.marcados.length
        ? '<div class="card"><h3>Otras diferencias (' + (fuera.length - r.marcados.length) + ')</h3>' +
          '<p class="mini">Dentro del margen: no bloquean, pero ahí están.</p>' +
          '<div class="lista">' + fuera.filter(function (f) {
            return r.marcados.indexOf(f) < 0; }).map(fila).join('') + '</div></div>'
        : '') +

      '<p class="mini">' + iguales + ' renglón(es) cuadran exactamente. ' +
      'La columna de la derecha es consumido menos lo que la plantilla pedía ' +
      '<b>el día que se armó la caja</b>, no lo que la plantilla diga hoy.</p>' +

      '<div class="card"><h3>Revisión</h3>' +
      '<div class="campo"><label>Qué explica la diferencia</label>' +
      '<textarea id="vNota" rows="3" placeholder="Ej.: se abrieron dos paquetes de gasas por sangrado"></textarea></div>' +
      '<button class="b-primary" id="bFirmar">Dar por revisada</button>' +
      '<p class="mini">Queda tu nombre y la fecha. No corrige inventario: es la firma de que alguien lo vio.</p>' +
      '</div>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    $('bFirmar').onclick = async function () {
      var nota = ($('vNota').value || '').trim();
      if (!nota) return alertar('La revisión pide una nota.');
      this.disabled = true;
      var res = await enviar({ accion: 'caja_revisar', caja_id: cajaId, nota: nota }, true);
      if (!res.ok) {
        if (/ya la revisó/.test(res.error || '')) {
          if (confirm(res.error)) {
            var re = await enviar({ accion: 'caja_revisar', caja_id: cajaId, nota: nota, rehacer: 'SI' }, true);
            if (re.ok) return pantallaRevisiones();
            alertar(re.error);
          }
        } else alertar(res.error);
        this.disabled = false; return;
      }
      pantallaRevisiones();
    };
    $('bV').onclick = function () { pantallaRevisiones(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaRevisiones(); };
  }
}

/* =================================================================
   Anular una recepción
   =================================================================
   Si una compra se capturó mal, hoy no había manera de corregirla desde la
   app. El backend sabía hacerlo desde hace semanas y nadie podía llamarlo.

   Anular quita los lotes y sus movimientos de entrada, y sólo si NADA de
   esa recepción se ha movido todavía: una vez que algo salió al quirófano,
   la historia ya no se puede borrar y hay que corregir con un movimiento,
   no con una goma.
   ================================================================= */

async function pantallaAnularRecepcion() {
  encabezado('Anular recepción', 'Corregir una compra mal capturada');
  pintar(
    '<div class="aviso a-warn">Esto borra los lotes de esa recepción y sus entradas. ' +
    'Sólo funciona si nada de ella se ha movido: si ya salió material, la historia no se borra ' +
    'y hay que corregir con un movimiento.</div>' +
    '<div class="card">' +
    '<div class="campo"><label>Folio de la recepción</label>' +
    '<input id="rFolio" placeholder="REC-00023" autocomplete="off"></div>' +
    '<div class="campo"><label>Motivo</label>' +
    '<textarea id="rMot" rows="2" placeholder="Por qué se anula. Queda en la bitácora."></textarea></div>' +
    '<button class="b-dark" id="bAnular">Anular</button>' +
    '</div>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  $('bV').onclick = function () { pantallaInicio(); };
  $('bAnular').onclick = async function () {
    var folio = ($('rFolio').value || '').trim().toUpperCase();
    var motivo = ($('rMot').value || '').trim();
    if (!folio) return alertar('Falta el folio.');
    if (!motivo) return alertar('Falta el motivo: queda en la bitácora.');
    if (!confirm('¿Anular ' + folio + '? Esto no se puede deshacer desde la app.')) return;
    this.disabled = true; this.textContent = 'Anulando…';
    try {
      var r = await enviar({ accion: 'recepcion_anular', recepcion_id: folio, motivo: motivo }, true);
      if (!r.ok) {
        pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
          (r.movidos && r.movidos.length
            ? '<div class="card"><h3>Ya se movió</h3><div class="lista">' +
              r.movidos.map(function (m) {
                return '<div class="item"><div class="l"><span>' + esc(m.lote_id) +
                  '</span><div>' + esc(m.nombre || m.sku) + '</div></div></div>'; }).join('') +
              '</div></div>'
            : '') +
          '<button class="b-ghost" id="bV">Volver</button>');
        return void ($('bV').onclick = function () { pantallaAnularRecepcion(); });
      }
      pintar('<div class="aviso a-ok">Recepción ' + esc(folio) + ' anulada. ' +
        (r.lotes || 0) + ' lote(s) y ' + (r.movimientos || 0) + ' movimiento(s) quitados. ' +
        'El respaldo quedó en RECEPCIONES_ANULADAS.</div>' +
        '<button class="b-ghost" id="bV">Volver</button>');
      $('bV').onclick = function () { pantallaInicio(); };
    } catch (e) {
      alertar('Sin conexión: no se anuló nada.');
      this.disabled = false; this.textContent = 'Anular';
    }
  };
}

/* =================================================================
   Usuarios y ubicaciones
   ================================================================= */

/* Quien tiene alcance a un solo almacén no ve los mosaicos que son de toda
   la unidad. No es cosmética: un botón que siempre contesta "eso no es suyo"
   enseña a ignorar los avisos. */
/* El costo es información de margen: la ve quien dirige, no quien surte. */
function puedeVerCostos() {
  /* Regulatorio entró el 24 nov 2026: ve el costo de MATERIAL. No hay
     margen que esconder porque esta app no conoce ningún precio de venta. */
  var r = String(estado.sesion && estado.sesion.rol).toUpperCase();
  return r === 'DIRECTOR' || r === 'GERENCIA' || r === 'REGULATORIO';
}

/* Capturar precios no es lo mismo que ver el margen.
   Transcribir una factura es trabajo operativo y lo hace quien recibe el
   material; lo que cost\u00f3 cada cirug\u00eda es informaci\u00f3n de direcci\u00f3n. Por
   eso regulatorio entra a «Lotes por costear» y no a «Qu\u00e9 cost\u00f3 cada
   cirug\u00eda». El gateway aplica la misma regla, as\u00ed que esconder el mosaico
   no es el candado: es que el candado tambi\u00e9n se vea. */
function puedeCostear() {
  var r = String(estado.sesion && estado.sesion.rol).toUpperCase();
  return r === 'DIRECTOR' || r === 'GERENCIA' || r === 'REGULATORIO';
}

/* Pesos con separador de miles. Un costo sin formato se lee mal y se teclea
   peor cuando alguien lo copia a otro lado. */
function pesos(n) {
  if (n === null || n === undefined || n === '') return '—';
  var v = Number(n);
  if (isNaN(v)) return '—';
  return '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

/* La cobertura decide de qué color se lee el número: completo, a medias, o
   tan incompleto que no es un costo sino una pista. */
function pillCobertura(pct) {
  var clase = pct === 100 ? 'p-ok' : (pct >= 70 ? 'p-warn' : 'p-crit');
  return '<span class="pill ' + clase + '">' + pct + '% costeado</span>';
}

/* Registrar una ministración de controlados es de regulatorio. Quien no lo
   es ve lo que falta, pero no lo captura. */
function puedeControlados() {
  return !!(estado.cat && estado.cat.puede_controlados);
}

/* La clave de un almacén no le dice nada a nadie: se enseña su nombre. */
function nombreAlmacen(id) {
  var claves = String(id || '').split(/[,;]/).map(function (x) { return x.trim().toUpperCase(); });
  var lista = (estado.cat && estado.cat.almacenes) || [];
  return claves.filter(function (x) { return !!x; }).map(function (x) {
    for (var i = 0; i < lista.length; i++) {
      if (String(lista[i].id).toUpperCase() === x) return lista[i].nombre;
    }
    return x;
  }).join(' y ');
}

/* =================================================================
   Lotes por costear

   El precio casi siempre llega después de la mercancía. Esta pantalla es
   el "después": se ordena por cuántas cirugías está dejando sin costear
   cada lote, que es lo que de verdad estorba.
   ================================================================= */

/* =================================================================
   Captura de costo
   =================================================================
   El costo vive POR UNIDAD, y la unidad no siempre es la pieza: hay insumos
   que se llevan en mL, en par, en frasco. La pantalla vieja pedia "costo
   unitario" a secas y aceptaba lo que dijera la factura, que casi siempre
   viene por envase. Asi entraron once precios con el valor de la caja donde
   iba el de la pieza -la lidocaina 50 veces arriba, las jeringas 10- y no se
   vio hasta compararlos contra las facturas tres semanas despues.

   Tres cosas lo evitan, y las tres son de pantalla, no de quien captura:
   decir que unidad es, dejar capturar el precio del empaque y dividir aqui,
   y enseñar en vivo cuanto suma el lote completo. $68.82 por mL no se lee
   como error; "$22,022 este lote" si.
   ================================================================= */

function unidadDe(sku) {
  var u = '';
  (((estado.cat || {}).catalogo) || []).forEach(function (c) {
    if (String(c.sku).toUpperCase() === String(sku).toUpperCase()) u = c.unidad_base || '';
  });
  return u || 'pieza';
}

function plural(u) {
  u = String(u || 'pieza');
  if (u === 'mL' || u === 'par') return u;
  return u + 's';
}

/* El bloque de captura. 'k' es la llave con la que se arman los ids, para
   que la misma funcion sirva en la recepcion y en cada una de las 180
   tarjetas de la pantalla de costeo. */
function bloqueCosto(k, unidad, etiqueta) {
  return '<div class="campo"><label>' + esc(etiqueta) + '</label>' +
    '<div class="dos">' +
      '<input id="' + k + 'Monto" type="number" min="0" step="any" ' +
        'inputmode="decimal" placeholder="Lo que se pag\u00f3">' +
      '<select id="' + k + 'Modo">' +
        '<option value="U">por ' + esc(unidad) + '</option>' +
        '<option value="P">por empaque</option>' +
      '</select>' +
    '</div></div>' +
    '<div class="campo oculto" id="' + k + 'Caja">' +
      '<label>El empaque trae (' + esc(plural(unidad)) + ')</label>' +
      '<input id="' + k + 'Piezas" type="number" min="0" step="any" inputmode="decimal" ' +
        'placeholder="Como viene en la factura: C/100, C/5\u2026"></div>' +
    '<p class="mini" id="' + k + 'Eco"></p>';
}

/* Lo que de verdad se va a guardar: el costo por unidad. Devuelve '' si no
   se captur\u00f3 nada -vacio no es cero- y {error} si no cuadra. */
function leerCosto(k) {
  var crudo = ($(k + 'Monto').value || '').trim();
  if (crudo === '') return { valor: '' };
  var monto = parseFloat(crudo);
  if (isNaN(monto) || monto < 0) return { error: 'El costo no es un n\u00famero v\u00e1lido.' };
  if ($(k + 'Modo').value !== 'P') return { valor: monto };
  var pz = parseFloat(($(k + 'Piezas').value || '').trim());
  if (!pz || pz <= 0) {
    return { error: 'Capturaste el precio del empaque pero no cu\u00e1ntas unidades trae. ' +
                    'Viene en la factura, junto a la descripci\u00f3n: C/100, C/5, C/12.' };
  }
  /* Cuatro decimales porque una caja de 100 a $142.80 da 1.428 exacto y
     redondear a dos ya mueve el costo del lote completo. */
  return { valor: Math.round(monto / pz * 10000) / 10000 };
}

/* El eco. 'getCant' es una funcion porque en la recepcion la cantidad se
   esta tecleando al mismo tiempo. */
function cablearCosto(k, unidad, getCant) {
  function pinta() {
    var caja = $(k + 'Caja'), eco = $(k + 'Eco');
    if (!caja || !eco) return;
    if ($(k + 'Modo').value === 'P') caja.classList.remove('oculto');
    else caja.classList.add('oculto');

    var r = leerCosto(k);
    if (r.error) { eco.textContent = r.error; return; }
    if (r.valor === '') {
      eco.textContent = 'Si el proveedor todav\u00eda no manda precio, d\u00e9jalo vac\u00edo. ' +
                        'Vac\u00edo no es cero.';
      return;
    }
    var t = '$' + r.valor + ' por ' + unidad;
    var cant = getCant ? parseFloat(getCant()) : 0;
    if (cant > 0) {
      t += ' \u00b7 ' + cant + ' ' + plural(unidad) + ' = ' +
           pesos(Math.round(r.valor * cant * 100) / 100);
    }
    eco.textContent = t;
  }
  ['Monto', 'Modo', 'Piezas'].forEach(function (s) {
    var e = $(k + s);
    if (e) { e.oninput = pinta; e.onchange = pinta; }
  });
  pinta();
  return pinta;
}

/* =================================================================
   Traer los precios de la factura

   El precio no se teclea: se lee del CFDI. La pantalla propone a qué
   insumo corresponde cada concepto, muestra cuánto sale la pieza, y hasta
   que alguien lo mira y confirma se guarda algo. El dinero nunca viaja
   desde aquí hacia el servidor: lo único que se manda es la asignación
   —este concepto es de estos lotes— y el gateway vuelve a sacar las cifras
   del XML timbrado.
   ================================================================= */

/* El idToken de Google vive nada más en memoria y nada más una hora, que es
   lo que Google le da. No se guarda en localStorage: una credencial que
   sobrevive al cierre del navegador es una credencial que alguien más puede
   encontrar. */
var GTOKEN = { valor: null, exp: 0 };

/* Pesos con los decimales que de verdad se van a guardar. pesos() redondea a
   dos porque es lo que se lee en un total; un costo por pieza no: una caja de
   100 a $142.80 da 1.428 exacto y enseñar $1.43 esconde el 2% de diferencia
   que despues aparece en el costo del lote completo. */
function pesosFinos(n) {
  if (n === null || n === undefined || n === '') return '—';
  var v = Number(n);
  if (isNaN(v)) return '—';
  var t = (Math.round(v * 10000) / 10000).toFixed(4).replace(/0+$/, '').replace(/\.$/, '.00');
  var partes = t.split('.');
  if (partes[1] && partes[1].length < 2) partes[1] += '0';
  return '$' + partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + (partes[1] || '00');
}

function guardarIdToken(cred) {
  try {
    var p = JSON.parse(atob(String(cred).split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    GTOKEN = { valor: cred, exp: Number(p.exp) || 0 };
  } catch (e) {
    GTOKEN = { valor: cred, exp: Math.floor(Date.now() / 1000) + 1800 };
  }
}

function idTokenVigente() {
  if (!GTOKEN.valor) return null;
  if (GTOKEN.exp && GTOKEN.exp < Date.now() / 1000 + 90) return null;
  return GTOKEN.valor;
}

/**
 * Pide a Google una credencial nueva sin salir de la pantalla.
 *
 * Hace falta porque la sesión del almacén dura treinta días y la de Google
 * una hora: a media tarde el token con el que se entró ya no sirve para
 * hablarle a la app de facturas. Se intenta en silencio y, si Google no
 * contesta —hay navegadores donde el aviso automático no sale—, se deja el
 * botón a la vista.
 */
function pedirIdToken(idContenedor) {
  var ya = idTokenVigente();
  if (ya) return Promise.resolve(ya);

  return new Promise(function (ok, falla) {
    (async function () {
      try {
        var cfg = await enviar({ accion: 'config_publica' }, true);
        if (!cfg.ok || !cfg.google_activo) return falla(new Error('Falta configurar Google en el gateway.'));
        await cargarGIS();
        var resuelto = false;
        google.accounts.id.initialize({
          client_id: cfg.google_client_id,
          callback: function (resp) {
            if (resuelto) return;
            resuelto = true;
            guardarIdToken(resp.credential);
            ok(resp.credential);
          }
        });
        var caja = $(idContenedor);
        if (caja) {
          /* La pantalla decia «Buscando la factura...» mientras en realidad
             esperaba a que alguien apretara un boton. */
          var est = $('fEstado');
          if (est) est.textContent = 'Primero, tu cuenta de Google.';
          caja.innerHTML = '<p class="mini">Para leer la factura hace falta confirmar tu cuenta de ' +
            'Google otra vez: la sesión del almacén dura treinta días y la de Google una hora.</p>' +
            '<div id="gFact" class="g-caja"></div>';
          google.accounts.id.renderButton($('gFact'), {
            theme: 'outline', size: 'large', shape: 'pill', text: 'continue_with',
            locale: 'es', width: 260
          });
        }
        try { google.accounts.id.prompt(); } catch (e) {}
      } catch (err) {
        falla(err);
      }
    })();
  });
}

/* ---------------- la entrada: por recepción ---------------- */

/** Agrupa los lotes sin precio por la recepción con la que entraron. */
function agruparPorRecepcion(lotes) {
  var por = {}, orden = [];
  lotes.forEach(function (l) {
    var k = String(l.recepcion_id || '').trim().toUpperCase();
    if (!k) return;                       // sin recepción no hay factura que buscar
    if (!por[k]) {
      por[k] = { recepcion_id: l.recepcion_id, proveedor: l.proveedor || '',
                 fecha: l.fecha_recepcion || '', lotes: 0, piezas: 0,
                 cirugias: 0, skus: {} };
      orden.push(k);
    }
    por[k].lotes++;
    por[k].piezas = Math.round((por[k].piezas + Number(l.cantidad_inicial || 0)) * 1000) / 1000;
    por[k].cirugias += Number(l.cirugias || 0);
    por[k].skus[l.sku] = true;
    if (!por[k].proveedor && l.proveedor) por[k].proveedor = l.proveedor;
  });
  return orden.map(function (k) {
    var g = por[k];
    g.insumos = Object.keys(g.skus).length;
    return g;
  }).sort(function (a, b) {
    if (a.cirugias !== b.cirugias) return b.cirugias - a.cirugias;
    if (a.lotes !== b.lotes) return b.lotes - a.lotes;
    return String(b.fecha).localeCompare(String(a.fecha));
  });
}

var FACT = null;   // lo último que se leyó, para poder reasignar sin volver a pedirlo

async function leerFactura(recepcionId, fuente) {
  pintar('<div class="card"><p class="sub">Leyendo la factura…</p></div>');
  var pet = { accion: 'factura_leer', recepcion_id: recepcionId };
  if (fuente.xml) pet.xml = fuente.xml;
  else {
    pet.uuid = fuente.uuid;
    var t = idTokenVigente();
    if (!t) {
      try { t = await pedirIdToken(null); }
      catch (e) { return pintarFacturaManual(recepcionId, 'Se venció la sesión de Google.'); }
    }
    pet.id_token = t;
  }

  var r;
  try { r = await enviar(pet, true); }
  catch (err) { return pintarFacturaManual(recepcionId, 'No se pudo leer: ' + err.message); }
  if (!r.ok) return pintarFacturaManual(recepcionId, r.error);

  FACT = { recepcion_id: recepcionId, fuente: fuente, datos: r,
           asignado: {} };
  r.renglones.forEach(function (x) { FACT.asignado[x.concepto] = x.sku || ''; });
  pintarEcoFactura();
}

/** El renglón de un concepto: qué dice la factura, a qué insumo va, cuánto sale. */
function renglonConcepto(x, grupos) {
  var sku = FACT.asignado[x.concepto] || '';
  var g = null;
  grupos.forEach(function (y) { if (y.sku === sku) g = y; });
  var porPieza = (g && g.piezas > 0) ? Math.round(x.neto / g.piezas * 10000) / 10000 : null;

  var sello = x.aprendida
    ? '<span class="pill p-ok">como la vez pasada</span>'
    : (x.confianza === 'alta' ? '<span class="pill p-info">coincide</span>'
      : (x.confianza === 'media' ? '<span class="pill p-warn">revísalo</span>'
        : '<span class="pill p-crit">sin propuesta</span>'));

  var ppu = (g && x.cantidad > 0) ? Math.round(g.piezas / x.cantidad * 1000) / 1000 : null;

  return '<div class="card">' +
    '<p class="mini">' + sello + '</p>' +
    '<h3>' + esc(x.descripcion) + '</h3>' +
    '<p class="mini">' + x.cantidad + ' ' + esc(x.unidad || '') + ' × ' +
      pesos(x.valor_unitario) +
      (x.descuento ? ' − ' + pesos(x.descuento) + ' de descuento' : '') +
      ' = <b>' + pesos(x.neto) + '</b></p>' +
    (x.clave_proveedor ? '<p class="mini mono">clave del proveedor: ' + esc(x.clave_proveedor) + '</p>' : '') +
    '<div class="campo"><label>Es de este insumo</label>' +
      '<select class="fSku" data-c="' + x.concepto + '">' +
      '<option value="">— no es de esta entrada —</option>' +
      grupos.map(function (y) {
        return '<option value="' + esc(y.sku) + '"' + (y.sku === sku ? ' selected' : '') + '>' +
          esc(y.nombre) + ' · ' + y.piezas + ' pz</option>';
      }).join('') +
      '</select></div>' +
    (g
      /* El por pieza se enseña con sus decimales de verdad: 60,000 entre 252
         da 238.0952, y redondearlo a 238.10 en pantalla para luego guardar
         otra cosa es mentirle a quien esta revisando. No se vuelve a
         multiplicar por las piezas porque el total ya esta dos renglones
         arriba -el de la factura- y el producto de la cifra redondeada
         daria un centavo distinto, que se lee como un descuadre. */
      ? '<p class="mini"><b>' + pesosFinos(porPieza) + ' por ' + esc(g.unidad) + '</b>' +
        ' · ' + g.piezas + ' ' + esc(plural(g.unidad)) + ' recibidas' +
        (ppu !== null && ppu !== 1
          ? ' · cada ' + esc(x.unidad || 'unidad') + ' de la factura trae ' + ppu
          : '') +
        '</p>' +
        (ppu !== null && ppu % 1 !== 0
          ? '<p class="mini"><span class="pill p-warn">ojo</span> las piezas recibidas no ' +
            'son múltiplo de lo facturado: puede que este concepto no sea de este insumo, ' +
            'o que la recepción se haya capturado con otra cuenta.</p>'
          : '')
      : '<p class="mini">Sin insumo asignado, este concepto no pone precio a nada.</p>') +
    '</div>';
}

function pintarEcoFactura() {
  var r = FACT.datos, f = r.factura, grupos = r.grupos;

  /* El cuadre se recalcula aquí porque las asignaciones se mueven a mano: lo
     que importa no es lo que propuso el servidor, es lo que está en pantalla
     en este momento. */
  var asignado = 0, usados = {};
  r.renglones.forEach(function (x) {
    var s = FACT.asignado[x.concepto] || '';
    if (!s) return;
    asignado = Math.round((asignado + x.neto) * 1000) / 1000;
    usados[s] = (usados[s] || 0) + 1;
  });
  var dif = Math.round((f.neto - asignado) * 100) / 100;
  var repetidos = Object.keys(usados).filter(function (k) { return usados[k] > 1; });
  var faltan = grupos.filter(function (g) { return !usados[g.sku]; });

  encabezado('Precios de la factura', esc(r.recepcion.etiqueta || FACT.recepcion_id));
  pintar(
    '<div class="card"><h3>' + esc(f.emisor || f.rfc_emisor) + '</h3>' +
    '<p class="mini">' + esc(f.fecha) +
      (f.folio ? ' · folio ' + esc(String(f.serie || '') + f.folio) : '') +
      ' · ' + f.conceptos + ' concepto(s)</p>' +
    (f.uuid ? '<p class="mini mono">' + esc(f.uuid) + '</p>' : '') +
    (f.moneda && f.moneda !== 'MXN'
      ? '<p class="mini"><span class="pill p-warn">' + esc(f.moneda) + '</span> ' +
        'convertida a pesos al tipo de cambio de la factura (' + f.tipo_cambio + ').</p>'
      : '') +
    '<div class="item"><div class="l"><div>Subtotal menos descuentos</div></div>' +
      '<span class="mono">' + pesos(f.neto) + '</span></div>' +
    '<div class="item"><div class="l"><div>Asignado a esta entrada</div></div>' +
      '<span class="mono">' + pesos(asignado) + '</span></div>' +
    (Math.abs(dif) < 0.02
      ? '<p class="mini"><span class="pill p-ok">cuadra</span> Cada peso de la factura ' +
        'quedó repartido entre los insumos que entraron.</p>'
      : '<p class="mini"><span class="pill p-warn">quedan ' + pesos(Math.abs(dif)) +
        (dif > 0 ? ' sin asignar' : ' de más') + '</span> ' +
        (dif > 0
          ? 'Normal si la factura trae cosas que no entraron al almacén —flete, un ' +
            'servicio, material de otra entrada—. Si no es el caso, falta asignar un concepto.'
          : 'Hay más dinero asignado que lo que dice la factura: algún concepto está ' +
            'puesto en el insumo equivocado.') + '</p>') +
    '</div>' +

    (repetidos.length
      ? '<div class="aviso a-err">Hay dos conceptos apuntando al mismo insumo (' +
        esc(repetidos.join(', ')) + '). Así se guardaría dos veces el mismo precio y ' +
        'el último gana. Deja uno solo, o pégale el XML por partes.</div>'
      : '') +

    (faltan.length
      ? '<div class="aviso a-info">Sin concepto asignado: ' +
        esc(faltan.map(function (g) { return g.nombre; }).join(' · ')) +
        '. Esos lotes se quedan sin precio y se pueden capturar a mano.</div>'
      : '') +

    /* La misma factura puede cubrir dos entradas: llegaron dos cajas y se
       recibieron por separado. Si no se incluyen las dos, el importe del
       concepto se divide entre menos piezas y el costo sale inflado. No se
       juntan solas porque dos entradas del mismo proveedor el mismo día
       también pueden ser dos facturas distintas. */
    (r.hermanas && r.hermanas.length
      ? '<div class="card"><h3>¿La factura cubre otra entrada?</h3>' +
        '<p class="mini">Hay ' + r.hermanas.length + ' entrada(s) más de ' +
        esc(r.recepcion.proveedor) + ' de esos días, también sin precio. Si esta misma ' +
        'factura las cubre, inclúyelas: el importe tiene que repartirse entre las piezas ' +
        'de todas, no entre las de una.</p>' +
        r.hermanas.map(function (h) {
          return '<div class="fila-lote"><span class="t">' +
            '<span class="n">' + esc(h.recepcion_id) + '</span>' +
            '<span class="c">' + esc(h.fecha) + ' · ' + h.lotes + ' lote(s) · ' +
            h.piezas + ' pz</span></span>' +
            '<button class="b-ghost" data-herm="' + esc(h.recepcion_id) +
            '" style="width:auto;margin:0">Incluir</button></div>';
        }).join('') + '</div>'
      : '') +

    r.renglones.map(function (x) { return renglonConcepto(x, grupos); }).join('') +

    '<div class="card"><h3>Lo que se va a guardar</h3>' +
    '<p class="mini">Se escribe el costo por pieza en cada lote de la entrada, se le ' +
    'pone <b>FACTURA</b> como comprobante y se le anota el folio fiscal. Queda en la ' +
    'bitácora del lote con el folio de la factura, y el costo de cada cirugía que ya ' +
    'gastó de esos lotes se recalcula solo.</p>' +
    '<p class="mini"><input type="checkbox" id="fPisar" style="width:auto;margin-right:7px">' +
    '<span>Pisar los costos que ya estaban capturados</span></p>' +
    '<button class="b-dark" id="fGuardar"' + (repetidos.length ? ' disabled' : '') +
    '>Guardar los precios</button></div>' +
    '<button class="b-ghost" id="fV">Volver sin guardar</button>');

  Array.prototype.forEach.call(document.querySelectorAll('.fSku'), function (s) {
    s.onchange = function () {
      FACT.asignado[Number(this.getAttribute('data-c'))] = this.value;
      pintarEcoFactura();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-herm]'), function (b) {
    b.onclick = function () {
      /* Se vuelve a leer con las dos entradas: el reparto lo rehace el
         servidor con el mismo XML, no se parchan las cifras aquí. */
      leerFactura(FACT.recepcion_id + ',' + this.getAttribute('data-herm'), FACT.fuente);
    };
  });
  $('fGuardar').onclick = guardarFactura;
  $('fV').onclick = function () { pantallaPorCostear(); };
}

async function guardarFactura() {
  var r = FACT.datos, grupos = r.grupos;
  var asigs = [];
  r.renglones.forEach(function (x) {
    var sku = FACT.asignado[x.concepto] || '';
    if (!sku) return;
    grupos.forEach(function (g) {
      if (g.sku === sku) asigs.push({ concepto: x.concepto, lotes: g.lotes });
    });
  });
  if (!asigs.length) return alertar('No hay ningún concepto asignado a un insumo.');

  var pisar = $('fPisar').checked;
  if (!confirm('Se va a escribir el precio de ' + asigs.length + ' concepto(s) en los ' +
               'lotes de ' + FACT.recepcion_id + '. Queda en la bitácora. ¿Guardar?')) return;

  var b = $('fGuardar');
  b.disabled = true; b.textContent = 'Guardando…';

  var pet = { accion: 'factura_aplicar', recepcion_id: FACT.recepcion_id,
              asignaciones: asigs, sobrescribir: pisar ? 'SI' : '' };
  if (FACT.fuente.xml) pet.xml = FACT.fuente.xml;
  else {
    pet.uuid = r.factura.uuid;
    var t = idTokenVigente();
    if (!t) {
      try { t = await pedirIdToken(null); }
      catch (e) { b.disabled = false; b.textContent = 'Guardar los precios';
                  return alertar('Se venció la sesión de Google. Intenta otra vez.'); }
    }
    pet.id_token = t;
  }

  var res;
  try { res = await enviar(pet, true); }
  catch (err) {
    b.disabled = false; b.textContent = 'Guardar los precios';
    return alertar('No se guardó: ' + err.message);
  }
  if (!res.ok) {
    b.disabled = false; b.textContent = 'Guardar los precios';
    return alertar(res.error);
  }

  encabezado('Precios guardados', esc(res.recepcion_id));
  pintar(
    '<div class="aviso a-ok">' + res.lotes + ' lote(s) quedaron con precio. ' +
    pesos(res.importe_total) + ' de la factura de ' + esc(res.emisor) + '.</div>' +
    (res.saltados && res.saltados.length
      ? '<div class="aviso a-info">' + res.saltados.length + ' lote(s) ya tenían precio y ' +
        'se dejaron como estaban: ' + esc(res.saltados.join(', ')) + '</div>'
      : '') +
    '<div class="card"><h3>Lote por lote</h3>' +
    res.detalle.map(function (d) {
      return '<div class="fila-lote"><span class="t">' +
        '<span class="n">' + esc(d.nombre) + '</span>' +
        '<span class="c">' + esc(d.lote_id) + ' · ' + d.piezas + ' pz · ' +
        pesos(d.costo_unitario) + ' c/u = ' + pesos(d.importe) + '</span></span></div>';
    }).join('') + '</div>' +
    (res.equivalencias
      ? '<div class="card"><p class="mini">Se aprendieron ' + res.equivalencias +
        ' equivalencia(s): la próxima factura de este proveedor va a reconocer esos ' +
        'conceptos sola.</p></div>'
      : '') +
    '<button class="b-dark" onclick="pantallaPorCostear()">Volver a los lotes por costear</button>' +
    '<button class="b-ghost" onclick="pantallaInicio()">Inicio</button>');
}

/* La tarjeta de un lote por costear. Se usa dos veces: arriba los que ya
   detuvieron una cirugía, y plegados abajo los que siguen en el anaquel. */
function tarjetaLote(l) {
  return '<div class="card">' +
    '<h3>' + esc(l.nombre) + '</h3>' +
    '<p class="mini mono">' + esc(l.lote_id) + ' · ' + esc(l.sku) +
      ' · ' + l.cantidad_inicial + ' pz' +
      (l.proveedor ? ' · ' + esc(l.proveedor) : '') +
      (l.fecha_recepcion ? ' · ' + esc(l.fecha_recepcion) : '') + '</p>' +
    (l.cirugias
      ? '<p class="mini"><span class="pill p-crit">deja ' + l.cirugias +
        ' cirugía(s) sin costear</span></p>'
      : '') +
    bloqueCosto('k' + l.lote_id, unidadDe(l.sku),
                'Costo real por ' + unidadDe(l.sku)) +
    '<div class="campo"><label>Costo fiscal por ' + esc(unidadDe(l.sku)) +
      ' (si difiere)</label>' +
      '<input class="cFiscal" data-lote="' + esc(l.lote_id) + '" type="number" ' +
      'min="0" step="any" inputmode="decimal" placeholder="Igual al real"></div>' +
    '<button class="b-dark" data-guardar="' + esc(l.lote_id) + '">Guardar precio</button>' +
    '</div>';
}

async function pantallaPorCostear() {
  encabezado('Lotes por costear', 'Los que entraron sin precio');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'lotes_por_costear' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

    if (!r.total) {
      return pintar('<div class="aviso a-ok">Todos los lotes tienen precio.</div>' +
        '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');
    }

    /* Los lotes sin precio, agrupados por la entrada con la que llegaron:
       una factura cubre una entrada completa, no un lote. */
    var grupos = agruparPorRecepcion(r.lotes);

    pintar(
      '<div class="card"><h3>' + r.total + ' lote(s) sin precio</h3>' +
      '<p class="mini">' + (r.detienen_cirugias
        ? '<b>' + r.detienen_cirugias + '</b> de ellos ya salieron a una cirugía: ' +
          'ésos van primero, porque son los que están dejando una caja sin costear.'
        : 'Ninguno ha salido todavía a cirugía.') +
      ' El costo se toma de la factura: si ya llegó el CFDI, la app lo trae. ' +
      'Capturar a mano sigue estando abajo.</p></div>' +

      /* Primero el camino de la factura, que es el que no se teclea. */
      bloqueRecepciones(grupos) +

      /* Después, a mano: primero los que ya detuvieron una cirugía, porque
         ésos son los que están costando dinero hoy. El resto queda plegado
         para que la pantalla no abra con doscientas tarjetas. */
      (r.lotes.filter(function (l) { return l.cirugias > 0; }).length
        ? '<div class="card"><h3>Capturar a mano</h3><p class="mini">Si la factura ' +
          'todavía no llega, o el precio viene de una nota, aquí se teclea. ' +
          'Si el real y el fiscal son el mismo, basta con llenar el real.</p></div>'
        : '') +
      r.lotes.filter(function (l) { return l.cirugias > 0; }).map(tarjetaLote).join('') +
      (r.lotes.filter(function (l) { return !l.cirugias; }).length
        ? '<details class="mas"><summary>Los que todavía no salen a cirugía (' +
          r.lotes.filter(function (l) { return !l.cirugias; }).length + ')</summary><div>' +
          r.lotes.filter(function (l) { return !l.cirugias; }).map(tarjetaLote).join('') +
          '</div></details>'
        : '') +
      '<button class="b-ghost" id="bCsv">Bajar la lista</button>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    /* Cada tarjeta lleva su propio eco; la cantidad del lote ya es fija. */
    r.lotes.forEach(function (l) {
      cablearCosto('k' + l.lote_id, unidadDe(l.sku),
                   function () { return l.cantidad_inicial; });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-fact]'), function (b) {
      b.onclick = function () { pantallaFactura(this.getAttribute('data-fact')); };
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-guardar]'), function (b) {
      b.onclick = async function () {
        var lote = this.getAttribute('data-guardar');
        var leido = leerCosto('k' + lote);
        if (leido.error) return alertar(leido.error);
        var real = leido.valor === '' ? '' : String(leido.valor);
        var fiscal = document.querySelector('.cFiscal[data-lote="' + lote + '"]').value.trim();
        if (real === '') return alertar('Falta el costo real.');
        /* Si nadie dijo otra cosa, el fiscal es el real: así se evita que la
           mitad de los lotes queden con fiscal vacío y el reporte fiscal salga
           sistemáticamente más bajo que el real sin que se note. */
        var cambios = { costo_unitario: real, costo_fiscal: fiscal === '' ? real : fiscal };
        this.disabled = true; this.textContent = 'Guardando…';
        var res = await enviar({ accion: 'lote_editar', lote_id: lote,
          cambios: cambios, motivo: 'Precio de la factura' }, true);
        if (!res.ok) {
          alertar(res.error);
          this.disabled = false; this.textContent = 'Guardar precio';
          return;
        }
        this.textContent = 'Guardado';
      };
    });
    /* Para trabajarla contra las facturas fuera de la app: se baja, se llena
       en una hoja de cálculo y los precios se capturan de regreso aquí. */
    $('bCsv').onclick = function () {
      var cab = ['Insumo','Clave','Lote','Piezas','Existencia','Proveedor',
                 'Fecha de recepción','Comprobante','Cirugías que detiene',
                 'Costo real por pieza','Costo fiscal'];
      function celda(v) {
        var t = String(v === null || v === undefined ? '' : v);
        return /[",;\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
      }
      var lineas = [cab.join(',')].concat(r.lotes.map(function (l) {
        return [l.nombre, l.sku, l.lote_id, l.cantidad_inicial, l.existencia,
                l.proveedor, l.fecha_recepcion, l.comprobante, l.cirugias, '', '']
               .map(celda).join(',');
      }));
      /* El BOM es para que Excel en español no parta los acentos. */
      var blob = new Blob(['\ufeff' + lineas.join('\r\n')],
                          { type: 'text/csv;charset=utf-8;' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lotes-por-costear-' + hoyISO() + '.csv';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };
    $('bV').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div>' +
           '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');
  }
}

async function pantallaUsuarios() {
  encabezado('Usuarios', 'Quién entra y con qué rol');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'usuarios' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

    var roles = ['DIRECTOR','GERENCIA','ALMACEN','REGULATORIO','ANESTESIOLOGIA','ENFERMERIA','CONSULTA'];

    pintar(
      '<div class="card"><h3>' + r.usuarios.length + ' usuario(s)</h3><div class="lista">' +
      r.usuarios.map(function (u) {
        var baja = String(u.activo).toUpperCase() === 'NO';
        var alc = String(u.almacenes || '').trim();
        return '<div class="item"><div class="l"><span>' + esc(u.correo) + '</span>' +
          '<div>' + esc(u.nombre || u.usuario) +
          (alc ? ' · sólo ' + esc(nombreAlmacen(alc)) : '') + '</div></div>' +
          '<span class="pill ' + (baja ? 'p-neutral' : 'p-ok') + '">' +
          esc(baja ? 'baja' : u.rol) + '</span></div>';
      }).join('') + '</div></div>' +

      '<div class="card"><h3>Dar de alta</h3>' +
      '<div class="campo"><label>Correo de Google</label><input id="uCorreo" type="email" placeholder="nombre@gmail.com"></div>' +
      '<div class="campo"><label>Nombre</label><input id="uNombre"></div>' +
      '<div class="campo"><label>Rol</label><select id="uRol">' +
      roles.map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>' +
      '<div class="campo"><label>¿A qué almacén llega?</label>' +
      '<select id="uAlmacenes"><option value="">A todos</option>' +
      ((estado.cat && estado.cat.almacenes) || []).map(function (a) {
        return '<option value="' + esc(a.id) + '">Sólo ' + esc(a.nombre) + '</option>';
      }).join('') + '</select>' +
      '<p class="mini">Limitarlo a un almacén es para quien trabaja sólo ahí: no puede recibir, ' +
      'contar ni dar de baja en los otros, ni los ve en existencias. Las cajas quirúrgicas quedan ' +
      'fuera de esa línea, porque una caja se surte de los tres almacenes a la vez.</p></div>' +
      '<button class="b-dark" id="bAlta">Dar de alta</button>' +
      '<p class="mini">Entra con Google, sin contraseña. Si el correo ya existe, se avisa en vez de pisarlo: ' +
      'cambiarle el rol a alguien sin querer es como quitarle o darle permisos a ciegas.</p></div>' +

      '<button class="b-ghost" id="bUbic">Dar de alta una ubicación</button>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    $('bAlta').onclick = async function () {
      var correo = ($('uCorreo').value || '').trim().toLowerCase();
      var nombre = ($('uNombre').value || '').trim();
      if (!correo || correo.indexOf('@') < 0) return alertar('Falta un correo válido.');
      if (!nombre) return alertar('Falta el nombre.');
      this.disabled = true;
      var res = await enviar({ accion: 'usuario_alta',
        usuario_nuevo: { correo: correo, nombre: nombre, rol: $('uRol').value,
                         almacenes: $('uAlmacenes').value } }, true);
      if (!res.ok) { alertar(res.error); this.disabled = false; return; }
      pantallaUsuarios();
    };
    $('bUbic').onclick = function () { pantallaUbicacionNueva(); };
    $('bV').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}
