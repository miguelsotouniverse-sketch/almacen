<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0C0E0D">
<title>Almacén · MS Universe</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>
/* Red de seguridad, antes que cualquier otra cosa.
   Vive aparte y arriba para que sobreviva a un error del script grande.

   Dos reglas aprendidas a golpes:
   1. Solo se adueña de la pantalla si la app NUNCA logro pintar nada. Si la
      app ya esta funcionando, un error suelto no debe borrarle la pantalla al
      usuario: se avisa discreto abajo y ya.
   2. Reiniciar SIEMPRE recarga, aunque borrar el service worker se atore.
      Sin el reloj de abajo, en algunos telefonos "Reiniciar" no hacia nada. */
(function () {
  window.__appViva = false;

  function chico(txt) {
    var v = document.getElementById('msu_avisoErr');
    if (!v) {
      v = document.createElement('div');
      v.id = 'msu_avisoErr';
      v.style.cssText = 'position:fixed;left:10px;right:10px;bottom:10px;z-index:9999;' +
        'background:#A33F30;color:#fff;padding:11px 13px;border-radius:9px;' +
        'font:13px -apple-system,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)';
      (document.body || document.documentElement).appendChild(v);
    }
    v.innerHTML = '<span style="word-break:break-word">' +
      String(txt || '').replace(/[<>&]/g, ' ') + '</span>' +
      '<a href="?reiniciar=1" style="color:#fff;text-decoration:underline;margin-left:10px;' +
      'white-space:nowrap">Reiniciar</a>';
  }

  function grande(txt) {
    var d = document.getElementById('app') || document.body;
    if (!d || d.getAttribute('data-fallo')) return;
    d.setAttribute('data-fallo', '1');
    d.innerHTML =
      '<div style="padding:20px;font:16px -apple-system,system-ui,sans-serif;color:#0C0E0D">' +
      '<p style="font-weight:600;margin:0 0 8px">La app no pudo arrancar.</p>' +
      '<p style="color:#6E736F;font-size:14px;margin:0 0 18px;word-break:break-word">' +
      String(txt || '').replace(/[<>&]/g, ' ') + '</p>' +
      '<p style="margin:0 0 10px"><a href="?reiniciar=1" style="display:block;text-align:center;' +
      'background:#0C0E0D;color:#F4F2F1;padding:14px;border-radius:9px;text-decoration:none">' +
      'Reiniciar la app</a></p>' +
      '<p style="margin:0"><a href="?n=' + Date.now() + '" style="display:block;text-align:center;' +
      'border:1px solid #D8D2CC;color:#3D423F;padding:14px;border-radius:9px;text-decoration:none">' +
      'Volver a intentar</a></p></div>';
  }

  function reportar(txt) {
    if (window.__appViva) chico(txt); else grande(txt);
  }

  window.addEventListener('error', function (e) {
    reportar((e.message || 'Error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    reportar(String((e.reason && e.reason.message) || e.reason || 'Promesa rechazada'));
  });

  /* Borron y cuenta nueva: quita el service worker y los caches y recarga.
     NO toca la sesion: no hay que volver a entrar con Google. */
  window.reiniciarApp = function () {
    var yaFue = false;
    function irse() {
      if (yaFue) return;
      yaFue = true;
      location.replace(location.pathname + '?n=' + Date.now());
    }
    setTimeout(irse, 2500);   // pase lo que pase, recarga

    var pasos = [];
    try {
      if ('serviceWorker' in navigator && navigator.serviceWorker) {
        pasos.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }));
      }
      if (window.caches) {
        pasos.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
    } catch (err) { /* si algo de esto no existe, igual recargamos */ }
    Promise.all(pasos).catch(function () {}).then(irse);
  };

  if (/[?&]reiniciar=1/.test(location.search)) {
    document.addEventListener('DOMContentLoaded', function () {
      var d = document.getElementById('app');
      if (d) d.innerHTML = '<p style="padding:20px;font:16px -apple-system,system-ui,sans-serif;' +
        'color:#6E736F">Reiniciando la app…</p>';
    });
    window.reiniciarApp();
  }
})();
</script>
<style>
:root{
  --ground:#F4F2F1;--surface:#FFFFFF;--surface-2:#EDEAE7;
  --ink:#0C0E0D;--ink-2:#3D423F;--ink-3:#6E736F;
  --rule:#D8D2CC;--rule-soft:#E6E1DC;
  --accent:#A19487;--accent-deep:#6B5D51;
  --ok:#3F6F52;--warn:#B5842B;--crit:#A33F30;--info:#3C5F79;
  --tint-ok:rgba(63,111,82,.10);--tint-warn:rgba(181,132,43,.13);
  --tint-crit:rgba(163,63,48,.10);--tint-info:rgba(60,95,121,.10);
  --tint-accent:rgba(161,148,135,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--ground);color:var(--ink);
  font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:300;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

header{position:sticky;top:0;z-index:20;background:var(--ink);color:#F4F2F1;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header .fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
header .marca{display:flex;align-items:center;gap:13px;min-width:0}
header .ms{height:34px;width:auto;flex:none;opacity:.95}
header .t{font-weight:500;font-size:1.02rem;line-height:1.2}
header .s{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:#9AA09C;margin-top:2px}
.estado{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.05em;
  padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.1);white-space:nowrap}
.estado.pend{background:var(--tint-warn);color:#E0B369}
.estado.off{background:var(--tint-crit);color:#E4998A}

main{padding:16px 16px 40px;max-width:680px;margin:0 auto}
h2{font-size:1.15rem;font-weight:500;margin:0 0 12px}
p{margin:0 0 12px}
.sub{color:var(--ink-3);font-size:.9rem}
.mini{font-size:.82rem;color:var(--ink-3)}
.centro{text-align:center}
.oculto{display:none!important}
.espacio{height:10px}
.foto-prev{width:100%;max-height:260px;object-fit:contain;border-radius:8px;
  border:1px solid var(--rule);background:var(--surface-2);margin-top:8px}
.foto-mini{width:44px;height:44px;object-fit:cover;border-radius:6px;
  border:1px solid var(--rule);background:var(--surface-2);flex:0 0 auto}
.sin-foto{width:44px;height:44px;border-radius:6px;border:1px dashed var(--rule);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:.62rem;color:var(--ink-3);text-align:center;line-height:1.1}
.fila-sku{display:flex;align-items:center;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--rule);width:100%;background:none;border-left:0;
  border-right:0;border-top:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer}
.fila-sku:last-child{border-bottom:0}
.fila-lote{display:flex;align-items:center;gap:11px;padding:11px 0;
  border-bottom:1px solid var(--rule);width:100%;background:none;border-left:0;
  border-right:0;border-top:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer}
.fila-lote:last-of-type{border-bottom:0}
.fila-lote .t{flex:1;min-width:0;display:block}
.fila-lote .t .n{display:block;font-size:.88rem}
.fila-lote .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.05em;color:var(--ink-3);margin-top:3px}
.fila-sku .t{flex:1;min-width:0;display:block}
.fila-sku .t .n{display:block;font-size:.93rem;line-height:1.25}
.fila-sku .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;
  letter-spacing:.06em;color:var(--ink-3);margin-top:3px}
.g-caja{display:flex;justify-content:center;margin:16px 0 8px;min-height:44px}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:1rem;font-weight:500}

label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--rule);
  border-radius:8px;background:var(--surface);color:var(--ink);
  font-family:inherit;font-size:16px;font-weight:300}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);
  outline-offset:1px;border-color:var(--accent)}
.campo{margin-bottom:13px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}

button{font-family:inherit;font-size:1rem;font-weight:500;border:0;border-radius:9px;
  padding:14px;cursor:pointer;width:100%}
.b-primary{background:var(--accent);color:#15100C}
.b-dark{background:var(--ink);color:#F4F2F1}
.b-ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.b-fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button:disabled{opacity:.5}
button+button{margin-top:9px}
.b-fila button+button{margin-top:0}

.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  padding:3px 8px;border-radius:3px;letter-spacing:.05em}
.p-ok{background:var(--tint-ok);color:var(--ok)}
.p-warn{background:var(--tint-warn);color:var(--warn)}
.p-crit{background:var(--tint-crit);color:var(--crit)}
.p-info{background:var(--tint-info);color:var(--info)}
.p-neutral{background:var(--surface-2);color:var(--ink-3)}
.sub-t{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent-deep);margin:12px 0 2px;
  border-bottom:1px solid var(--rule-soft);padding-bottom:4px}
.sub-t:first-child{margin-top:0}
/* Los labels de los campos van en versalitas; éste es una frase y tiene que
   leerse como frase, no a gritos. */
label.check{display:flex;align-items:flex-start;gap:9px;font-size:.92rem;line-height:1.4;
  cursor:pointer;color:var(--ink);font-family:'Jost',-apple-system,sans-serif;
  text-transform:none;letter-spacing:normal;font-weight:400}
label.check input{width:19px;height:19px;margin:1px 0 0;flex:0 0 auto;accent-color:var(--ink)}
.mapeo{border-top:1px solid var(--rule-soft);padding:9px 0}
.mapeo:first-of-type{border-top:0}
.mapeo .cl{font-family:'IBM Plex Mono',monospace;font-size:.74rem;display:block;
  color:var(--ink);letter-spacing:.02em}
.mapeo .cl b{font-weight:500;color:var(--accent-deep)}
.mapeo .nm{display:block;font-size:.8rem;margin-top:2px}
.mapeo .po{display:block;font-size:.66rem;color:var(--ink-3);margin-top:1px}

.aviso{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
.a-ok{background:var(--tint-ok);color:var(--ok)}
.a-err{background:var(--tint-crit);color:var(--crit)}
.a-warn{background:var(--tint-warn);color:var(--warn)}
.a-info{background:var(--tint-accent);color:var(--accent-deep)}

.lista .item{display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.lista .item:last-child{border-bottom:0}
.lista .item .l{min-width:0}
.lista .item .l span{display:block;font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;color:var(--ink-3);letter-spacing:.06em}
.lista .item .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}

.linea{border:1px solid var(--rule);border-radius:9px;padding:12px 13px;margin-bottom:10px;
  background:var(--surface)}
.linea .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  margin-bottom:6px}
.linea .cab .nm{font-weight:500;font-size:.94rem;line-height:1.25}
.linea .datos{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--ink-3);
  line-height:1.6}
.linea .quitar{width:auto;padding:5px 10px;font-size:.72rem;background:transparent;
  border:1px solid var(--rule);color:var(--ink-3);border-radius:6px;flex:0 0 auto}

/* Un renglón de la lista que se puede abrir. El área de toque es todo el
   renglón, no un botoncito: esto se usa de pie y con guantes. */
.lista .item-abre{cursor:pointer;padding-left:4px;padding-right:4px;
  border-radius:7px;transition:background .12s}
.lista .item-abre:active{background:var(--surface-2)}
.lista .item-abre .l span::after{content:' ›';color:var(--ink-3)}

.linea .dest{margin-top:8px;font-size:.86rem;padding:9px 11px}

.folio-lote{background:var(--ink);color:#F4F2F1;border-radius:9px;padding:13px 15px;
  margin-bottom:9px}
.folio-lote .n{font-family:'IBM Plex Mono',monospace;font-size:1.15rem;font-weight:600}
.folio-lote .d{font-size:.8rem;color:#9AA09C;margin-top:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- portada: tablero ----------
   La portada anterior era nueve tarjetas con un párrafo cada una. Se leía
   como un manual. Un manual se lee una vez; una portada se abre veinte veces
   al día, de pie y con una mano. Lo que cambia la decisión de quien abre la
   app son números, no explicaciones. */
.buscador{display:flex;gap:9px;margin-bottom:14px}
.buscador input{flex:1}
.buscador button{width:auto;padding:12px 18px;flex:0 0 auto}

.tira{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:9px;
  margin-bottom:14px}
.dato{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:11px 12px;text-align:left;cursor:pointer;font-family:inherit;
  color:inherit;width:auto;display:block}
.dato:active{background:var(--surface-2)}
.dato .n{font-family:'IBM Plex Mono',monospace;font-size:1.5rem;line-height:1;
  font-weight:400;display:block}
.dato .e{display:block;font-size:.74rem;color:var(--ink-3);margin-top:5px;line-height:1.25}
.dato.d-ok .n{color:var(--ok)}
.dato.d-warn .n{color:var(--warn)}
.dato.d-crit .n{color:var(--crit)}
.dato.d-crit{border-color:rgba(163,63,48,.35);background:var(--tint-crit)}
.dato.d-warn{border-color:rgba(181,132,43,.35)}

/* Las acciones, sin párrafo. El nombre del botón tiene que bastar; si no
   basta, el nombre está mal, no le falta un párrafo. */
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.baldosa{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:14px 13px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;
  font-size:.95rem;font-weight:400;width:auto;display:block;line-height:1.3}
.baldosa:active{background:var(--surface-2)}
.baldosa .q{display:block;font-size:.76rem;color:var(--ink-3);margin-top:4px;font-weight:300}
.baldosa.ancha{grid-column:1 / -1}
.baldosa.fuerte{background:var(--ink);color:#F4F2F1;border-color:var(--ink)}
.baldosa.fuerte .q{color:#9AA09C}

details.mas{margin-bottom:14px}
details.mas>summary{cursor:pointer;list-style:none;font-family:'IBM Plex Mono',monospace;
  font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);
  padding:9px 0;border-bottom:1px solid var(--rule-soft)}
details.mas>summary::-webkit-details-marker{display:none}
details.mas>summary::after{content:' +';}
details.mas[open]>summary::after{content:' −';}
details.mas>div{padding-top:11px}

/* ---------- filtros en fichas ---------- */
.chips{display:flex;gap:7px;overflow-x:auto;margin-bottom:12px;padding-bottom:3px;
  -webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;width:auto;padding:7px 13px;border-radius:999px;font-size:.82rem;
  font-weight:400;background:var(--surface);border:1px solid var(--rule);color:var(--ink-2)}
.chip.on{background:var(--ink);color:#F4F2F1;border-color:var(--ink)}
.chip .c{font-family:'IBM Plex Mono',monospace;font-size:.7rem;opacity:.7;margin-left:5px}

/* ---------- existencias por producto ---------- */
.prod{border-bottom:1px solid var(--rule-soft)}
.prod:last-child{border-bottom:0}
.prod>button{display:flex;align-items:center;gap:11px;padding:12px 4px;width:100%;
  background:none;border:0;text-align:left;color:inherit;font-family:inherit;
  font-size:1rem;font-weight:300;cursor:pointer;border-radius:7px}
.prod>button:active{background:var(--surface-2)}
.prod .t{flex:1;min-width:0}
.prod .t .n{display:block;font-size:.93rem;line-height:1.25}
.prod .t .c{display:block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;
  letter-spacing:.06em;color:var(--ink-3);margin-top:3px}
.prod .cant{font-family:'IBM Plex Mono',monospace;font-size:1.05rem;flex:0 0 auto;
  text-align:right;min-width:52px}
.prod .cant.cero{color:var(--crit)}
.prod .det{padding:2px 4px 12px;display:none}
.prod.abierto .det{display:block}
.prod .det .r{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--ink-3);
  padding:5px 0 5px 12px;border-left:2px solid var(--rule)}
.prod .det .r b{font-weight:500;color:var(--ink-2)}
.prod .det .r.vence{color:var(--warn)}
.prod .det .r.vencido{color:var(--crit)}
</style>
</head>
<body>

<header>

<script>
/* =================================================================
   Almacén MS Universe — recepción de compras y existencias
   Zorvix arranca en cero: todo lo que exista entra por aquí.
   ================================================================= */

/* La URL del gateway no es secreto: sin una sesión válida no responde nada.
   Vivir aquí es lo que permite que la app abra directo en Google, sin
   pantalla de configuración en cada teléfono. */
var GATEWAY = 'https://script.google.com/macros/s/AKfycbz0VFVwemsK8M2_nqwp-0zMcGuhicVCn5xIwlG1hPAaEnvh7XUdxwvX5AhrhAje3sRggg/exec';

var COLA_KEY = 'msu_alm_cola';
var SES_KEY = 'msu_alm_sesion';
/* La caja que se va a imprimir se deja aquí y la lee hojas_caja.html. No
   viaja por la URL: una caja de treinta renglones no cabe en una. */
var HOJAS_KEY = 'msu_alm_hojas_caja';
var CAT_KEY = 'msu_alm_cat';

var estado = {
  sesion: leer(SES_KEY, null),
  cat: leer(CAT_KEY, null),
  cabecera: null,
  lineas: [],
  /* La huella de ESTA recepción. Se genera una sola vez, al abrir la
     cabecera, y se conserva en todos los reintentos: es lo que permite al
     backend reconocer que el segundo envío es el mismo que el primero y no
     una compra nueva. Generarla en cada clic de Guardar convertía cada
     reintento en una recepción distinta. */
  client_id: null
};

function leer(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function escribir(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function $(id) { return document.getElementById(id); }
function pintar(html) {
  $('app').innerHTML = html;
  /* La app logro pintar: de aqui en adelante un error suelto ya no le borra
     la pantalla al usuario, solo sale el aviso chico de abajo. */
  window.__appViva = true;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
function idCliente() {
  return 'c' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}
function encabezado(t, s) { $('hTitulo').textContent = t; $('hSub').textContent = s || 'MS Universe'; }

function alertar(msg) {
  var d = document.createElement('div');
  d.className = 'aviso a-info';
  d.textContent = msg;
  $('app').prepend(d);
  setTimeout(function () { d.remove(); }, 4000);
}

/* ---------- fotos de insumos ----------
   La foto contesta la única pregunta que el nombre no contesta: «¿esto es
   lo que tengo en la mano?». Quien recibe no siempre conoce el producto, y
   un nombre de catálogo mal leído se convierte en un lote mal capturado.

   Las fotos viven en el Drive privado del dueño del script y se sirven por
   el gateway, que ya validó la sesión. Por eso se piden de una en una y
   sólo cuando alguien las abre: el catálogo manda tiene_foto, no la liga.
   ------------------------------------------------------------------- */
function comprimir(file, cb) {
  var lector = new FileReader();
  lector.onload = function (ev) {
    var img = new Image();
    img.onload = function () {
      var max = 1280;
      var escala = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { alertar('Ese archivo no se pudo leer como imagen.'); };
    img.src = ev.target.result;
  };
  lector.onerror = function () { alertar('No se pudo leer el archivo.'); };
  lector.readAsDataURL(file);
}

/* Memoria de la sesión: abrir el mismo insumo dos veces no vuelve a bajar
   la foto. Se pierde al recargar, que es justo lo que se quiere. */
var FOTOS = {};

async function traerFoto(sku) {
  var k = String(sku).toUpperCase();
  if (FOTOS[k]) return FOTOS[k];
  var r = await enviar({ accion: 'sku_foto', sku: k }, true);
  if (r && r.ok && r.imagen) { FOTOS[k] = r.imagen; return r.imagen; }
  throw new Error((r && r.error) || 'No se pudo traer la foto.');
}

function marcarConFoto(sku) {
  var k = String(sku).toUpperCase();
  ((estado.cat && estado.cat.catalogo) || []).forEach(function (s) {
    if (String(s.sku).toUpperCase() === k) s.tiene_foto = true;
  });
}

/* ---------- cola offline ---------- */
function cola() { return leer(COLA_KEY, []); }
function encolar(payload) {
  var c = cola(); c.push(payload);
  try { localStorage.setItem(COLA_KEY, JSON.stringify(c)); pintarEstado(); return true; }
  catch (e) {
    alertar('El teléfono ya no puede guardar más pendientes. Busca señal antes de seguir.');
    return false;
  }
}
function quitarDeCola(id) {
  escribir(COLA_KEY, cola().filter(function (x) { return x.client_id !== id; }));
  pintarEstado();
}
async function vaciarCola() {
  var p = cola();
  if (!p.length || !navigator.onLine) return;
  for (var i = 0; i < p.length; i++) {
    try {
      var r = await enviar(p[i], true);
      if (r && r.ok) quitarDeCola(p[i].client_id); else break;
    } catch (e) { break; }
  }
}
function pintarEstado() {
  var e = $('hEstado'), pend = cola().length;
  if (!navigator.onLine) { e.textContent = '● sin señal'; e.className = 'estado off'; }
  else if (pend) { e.textContent = '● ' + pend + ' por enviar'; e.className = 'estado pend'; }
  else { e.textContent = '● en línea'; e.className = 'estado'; }
}

/* ---------- transporte ---------- */
async function enviar(payload, sinEncolar) {
  if (!payload.client_id) payload.client_id = idCliente();
  if (estado.sesion && estado.sesion.sesion) payload.sesion = estado.sesion.sesion;
  try {
    var res = await fetch(GATEWAY, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    var datos = await res.json();
    // Si la sesión murió, no tiene caso seguir: se limpia y se pide Google.
    if (datos && datos.ok === false && MOTIVOS_SESION[datos.error]) {
      cerrarSesion(MOTIVOS_SESION[datos.error]);
    }
    return datos;
  } catch (err) {
    if (!sinEncolar && payload.encolable) { encolar(payload); return { ok: true, encolado: true }; }
    throw err;
  }
}

/* =================================================================
   Sesión
   ================================================================= */

/** La sesión se acabó o la revocaron: limpiar y volver a la puerta. */
function cerrarSesion(msg) {
  estado.sesion = null;
  escribir(SES_KEY, null);
  pantallaLogin(msg);
}

var MOTIVOS_SESION = {
  SIN_SESION:      'Entra con tu cuenta de Google.',
  SESION_INVALIDA: 'Tu sesión ya no es válida. Vuelve a entrar.',
  SESION_EXPIRADA: 'Tu sesión caducó. Vuelve a entrar con Google.',
  SESION_REVOCADA: 'Tu acceso al almacén fue dado de baja. Habla con el director.'
};

/* ---------- Google Identity ---------- */
var GIS_LISTO = null;

function cargarGIS() {
  if (GIS_LISTO) return GIS_LISTO;
  GIS_LISTO = new Promise(function (ok, falla) {
    if (window.google && google.accounts && google.accounts.id) return ok();
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true; s.defer = true;
    s.onload = function () { ok(); };
    s.onerror = function () { GIS_LISTO = null; falla(new Error('No se pudo cargar Google')); };
    document.head.appendChild(s);
  });
  return GIS_LISTO;
}

async function entrarConGoogle(credencial) {
  var r = await enviar({ accion: 'login_google', idToken: credencial,
                         dispositivo: navigator.userAgent }, true);
  if (!r.ok) return pantallaLogin(r.error);
  // La identidad que firma cada movimiento es el correo verificado por Google,
  // no un nombre escrito a mano. La sesión la emite nuestro backend.
  estado.sesion = { sesion: r.sesion, usuario: r.correo || r.usuario,
                    nombre: r.nombre, rol: r.rol, via: r.via };
  escribir(SES_KEY, estado.sesion);
  await cargarCat();
  pantallaInicio();
}

function pantallaLogin(msg) {
  encabezado('Entrar', 'Almacén');
  pintar((msg ? '<div class="aviso a-err">' + esc(msg) + '</div>' : '') +
    '<div class="card">' +
    '<p class="sub">Entra con la cuenta de Google que tengas dada de alta en el almacén. ' +
    'Cada movimiento queda firmado con ese correo.</p>' +
    '<div id="gBtn" class="g-caja"></div>' +
    '<div id="gMsg" class="mini"></div></div>');
  prepararBotonGoogle();
}

async function prepararBotonGoogle() {
  var msg = $('gMsg');
  try {
    if (!window.isSecureContext) {
      msg.innerHTML = 'Esta página tiene que abrirse con <b>https://</b> para poder entrar con Google.';
      return;
    }
    var cfg = await enviar({ accion: 'config_publica' }, true);
    if (!cfg.ok || !cfg.google_activo) {
      msg.textContent = 'Falta configurar GOOGLE_CLIENT_ID en el gateway.';
      return;
    }
    await cargarGIS();
    google.accounts.id.initialize({
      client_id: cfg.google_client_id,
      callback: function (resp) {
        $('gMsg').textContent = 'Verificando…';
        entrarConGoogle(resp.credential).catch(function () {
          pantallaLogin('Sin conexión. Intenta de nuevo.');
        });
      }
    });
    google.accounts.id.renderButton($('gBtn'), {
      theme: 'outline', size: 'large', shape: 'pill',
      text: 'signin_with', locale: 'es', width: 260
    });
    msg.textContent = '';
  } catch (e) {
    msg.textContent = 'No se pudo contactar a Google. Revisa tu conexión.';
  }
}

async function cargarCat() {
  try {
    var r = await enviar({ accion: 'cat_insumos' }, true);
    if (r && r.ok) { estado.cat = r; escribir(CAT_KEY, r); }
  } catch (e) { estado.cat = leer(CAT_KEY, null); }
}

/* =================================================================
   Inicio
   ================================================================= */
/* =================================================================
   Portada
   =================================================================
   La portada vieja explicaba la app. Ésta la reporta.

   Regla de la tira de datos: un número sólo aparece si alguien puede hacer
   algo con él. "SKU en catálogo: 296" no cambia ninguna decisión y por eso
   ya no está. "3 vencidos en el anaquel" sí. Y si no hay nada que atender,
   la franja de pendientes no aparece: un tablero que siempre tiene algo en
   rojo deja de leerse a la semana.
   ================================================================= */

function nFmt(v) {
  var n = Number(v);
  if (!isFinite(n)) return String(v == null ? '' : v);
  return (Math.round(n * 1000) / 1000).toString();
}

function diasDeCad(f) {
  var t = String(f || '').slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(t)) return null;
  var hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  return Math.round((new Date(t + 'T12:00:00').getTime() - hoy.getTime()) / 86400000);
}

/** Un renglón de existencia que no está en el anaquel está comprometido. */
function dondeEsta(x) {
  var t = String(x.ubic_tipo || '').toUpperCase();
  if (t === 'CAJA' || esCaja(x.ubic_id)) return 'caja';
  if (t === 'DOTACION') return 'dotacion';
  return 'anaquel';
}

function pantallaInicio() {
  encabezado('Almacén', estado.sesion ? estado.sesion.nombre : '');
  var c = estado.cat || { catalogo: [], almacenes: [] };
  var esDir = String(estado.sesion && estado.sesion.rol).toUpperCase() === 'DIRECTOR';

  pintar(

/* El tablero llega después de pintar la portada: los botones tienen que
   responder desde el primer instante aunque la red esté lenta. */
async function cargarTablero() {
  var caja = $('tablero');
  if (!caja) return;
  try {
    var t = await enviar({ accion: 'tablero' }, true);
    if (!t.ok || !$('tablero')) return;
    pintarTablero(t);
  } catch (e) {
    $('tablero').innerHTML = '<p class="mini centro">Sin conexión: no se pudo leer el estado del almacén.</p>';
  }
}

function pintarTablero(t) {
  var ue = t.ultima_entrada || {};

  /* Arriba sólo va lo que alguien puede atender HOY, y como mucho tres cosas.
     Ocho fichas de números antes del primer botón es el mismo error que los
     nueve párrafos de la portada anterior, nada más que en cifras: obliga a
     recorrer la pantalla entera para llegar a lo que se venía a hacer.

     "76 claves en cero" no entra aquí a propósito. En un almacén que apenas
     arranca eso es lo esperado, no una urgencia; pintarlo en rojo junto a un
     lote vencido enseña a ignorar el rojo. */
  var urgente = [];
  if (t.caducidad.vencidos) {
    urgente.push({ n: t.caducidad.vencidos, e: 'vencido(s) en el anaquel', c: 'd-crit', ir: 'caducar' });
  }
  if (t.dotaciones.no_listas) {
    urgente.push({ n: t.dotaciones.no_listas, e: 'de ' + t.dotaciones.total + ' dotaciones incompletas',
                   c: 'd-crit', ir: 'dotaciones' });
  }
  if (t.cajas_abiertas.length) {
    urgente.push({ n: t.cajas_abiertas.length, e: 'caja(s) abierta(s)', c: 'd-warn', ir: 'cajas' });
  }
  if (t.caducidad.por_vencer && urgente.length < 3) {
    urgente.push({ n: t.caducidad.por_vencer, e: 'por vencer en ' + t.caducidad.horizonte + ' días',
                   c: 'd-warn', ir: 'caducar' });
  }
  urgente = urgente.slice(0, 3);

  var arriba = '';
  if (urgente.length) {
    arriba += '<div class="tira">' + urgente.map(function (a) {
      return '<button class="dato ' + a.c + '" data-ir="' + a.ir + '">' +
             '<span class="n">' + a.n + '</span><span class="e">' + esc(a.e) + '</span></button>';
    }).join('') + '</div>';
  } else {
    arriba += '<div class="aviso a-ok">Nada que atender: sin vencidos, sin cajas abiertas y las dotaciones completas.</div>';
  }

  /* Que hace días que no entra nada no es una falla del sistema, pero es lo
     primero que explica por qué media app está en rojo. */
  if (ue.dias !== null && ue.dias !== undefined && ue.dias >= 7) {
    arriba += '<div class="aviso a-warn">Hace <b>' + ue.dias + ' días</b> que no se captura una entrada. ' +
              'Si ha llegado material, no está en el sistema.</div>';
  } else if (!ue.fecha) {
    arriba += '<div class="aviso a-info">Todavía no se ha capturado ninguna entrada.</div>';
  }

  var abajo = '<div class="tira">' +
    '<button class="dato" data-ir="existencias"><span class="n">' + t.existencia.con_saldo +
      '</span><span class="e">claves con existencia</span></button>' +
    '<button class="dato" data-ir="cero"><span class="n">' + t.existencia.en_cero +
      '</span><span class="e">claves en cero</span></button>' +
    '<button class="dato" data-ir="armar"><span class="n">' + t.plantillas.surtibles + '/' +
      t.plantillas.total + '</span><span class="e">plantillas armables</span></button>' +
    '</div>';

  if ($('tablero')) $('tablero').innerHTML = arriba;
  if ($('tablero2')) $('tablero2').innerHTML = abajo;

  var irA = {
    caducar: function () { pantallaExistencias('', 'caducar'); },
    cero: function () { pantallaExistencias('', 'cero'); },
    existencias: function () { pantallaExistencias(''); },
    cajas: function () { pantallaCajas(); },
    dotaciones: function () { pantallaDotaciones(); },
    armar: function () { pantallaSurtido(); }
  };
  [].forEach.call(document.querySelectorAll('[data-ir]'), function (b) {
    b.onclick = function () { (irA[b.getAttribute('data-ir')] || function () {})(); };
  });
}

/* =================================================================
   Existencias
   =================================================================
   La pantalla anterior listaba 291 renglones de LOTE ordenados por nombre.
   "Agua estéril" salía tres veces y había que sumar de cabeza. Eso es el
   kardex, y el kardex es la verdad, pero no es la pregunta: la pregunta es
   "¿cuánta agua estéril tenemos?".

   Aquí se agrupa por producto y el lote queda como detalle, que es el orden
   en que alguien lo piensa. Y lo que está en una caja abierta o en una
   dotación sellada se cuenta aparte: existe, pero no se puede prometer.
   ================================================================= */

/* Leer la existencia obliga a recorrer el kardex entero y tarda segundos.
   Peor: si se entra aquí mientras el tablero de la portada todavía está
   cargando, las dos peticiones se forman una detrás de otra y la primera
   búsqueda del día se siente eterna.

   Por eso lo ya leído se queda en memoria por un rato: al volver, la pantalla
   aparece de inmediato con lo último que se supo —diciendo de cuándo es— y se
   refresca por detrás. Nunca se inventa un dato: si no hay nada en memoria,
   se espera, y mientras se espera se dice por qué tarda. */
var EXIST_FRESCO_MS = 120000;

async function pantallaExistencias(q, filtro) {
  encabezado('Existencias', 'Qué hay y dónde está');
  estado.existQ = String(q || '');
  estado.existF = filtro || 'todo';

  var fresco = estado.exist && estado.existAt && (Date.now() - estado.existAt) < EXIST_FRESCO_MS;
  if (estado.exist) {
    pintarExistencias();
    if (fresco) return;
  } else {
    pintar('<div class="card"><p class="sub">Leyendo el kardex…</p>' +
           '<p class="mini">La existencia no está guardada en ningún lado: se suma movimiento ' +
           'por movimiento cada vez que se pregunta. Por eso tarda unos segundos.</p></div>');
  }

  try {
    var r = await enviar({ accion: 'existencias' }, true);
    if (!r.ok) {
      if (estado.exist) return alertar(r.error);
      return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');
    }
    estado.exist = r.existencias;
    estado.existAt = Date.now();
    pintarExistencias();
  } catch (e) {
    if (estado.exist) return alertar('Sin conexión: esto es lo último que se supo.');
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}

function agruparExistencias() {
  var cat = (estado.cat && estado.cat.catalogo) || [];
  var porSku = {};
  cat.forEach(function (c) {
    if (!c.sku || String(c.activo).toUpperCase() === 'NO') return;
    porSku[String(c.sku).toUpperCase()] = {
      sku: c.sku, nombre: c.nombre || c.sku,
      anaquel: 0, caja: 0, dotacion: 0, lotes: [], peorDia: null
    };
  });
  (estado.exist || []).forEach(function (x) {
    var k = String(x.sku).toUpperCase();
    if (!porSku[k]) {
      porSku[k] = { sku: x.sku, nombre: x.nombre || x.sku,
                    anaquel: 0, caja: 0, dotacion: 0, lotes: [], peorDia: null, fuera: true };
    }
    var g = porSku[k], donde = dondeEsta(x);
    g[donde] += x.cantidad;
    var d = diasDeCad(x.caducidad);
    if (d !== null && donde === 'anaquel' && (g.peorDia === null || d < g.peorDia)) g.peorDia = d;
    g.lotes.push({ lote_id: x.lote_id, ubic: x.ubic_nombre || x.ubic_id,
                   cantidad: x.cantidad, caducidad: x.caducidad, dias: d, donde: donde });
  });
  return Object.keys(porSku).map(function (k) { return porSku[k]; });
}

function pintarExistencias() {
  var todos = agruparExistencias();
  var q = (estado.existQ || '').trim().toLowerCase();
  var f = estado.existF || 'todo';

  function sinAc(s) {
    return String(s || '').normalize ? String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
                                     : String(s || '').toLowerCase();
  }
  var qn = sinAc(q);

  var cuenta = {
    todo: todos.filter(function (g) { return g.anaquel > 0 || g.caja > 0 || g.dotacion > 0; }).length,
    cero: todos.filter(function (g) { return !g.fuera && g.anaquel <= 0; }).length,
    caducar: todos.filter(function (g) { return g.peorDia !== null && g.peorDia <= 90; }).length,
    caja: todos.filter(function (g) { return g.caja > 0; }).length,
    dotacion: todos.filter(function (g) { return g.dotacion > 0; }).length
  };

  var lista = todos.filter(function (g) {
    if (qn && sinAc(g.nombre).indexOf(qn) < 0 && sinAc(g.sku).indexOf(qn) < 0) return false;
    if (f === 'todo') return g.anaquel > 0 || g.caja > 0 || g.dotacion > 0;
    if (f === 'cero') return !g.fuera && g.anaquel <= 0;
    if (f === 'caducar') return g.peorDia !== null && g.peorDia <= 90;
    if (f === 'caja') return g.caja > 0;
    if (f === 'dotacion') return g.dotacion > 0;
    return true;
  });

  /* Lo urgente arriba: primero lo vencido, luego lo que está por vencerse,
     y dentro de cada grupo por nombre. Ordenar sólo por nombre esconde lo
     que hay que atender en la letra T. */
  lista.sort(function (a, b) {
    var pa = a.peorDia !== null && a.peorDia < 0 ? 0 : (a.peorDia !== null && a.peorDia <= 90 ? 1 : 2);
    var pb = b.peorDia !== null && b.peorDia < 0 ? 0 : (b.peorDia !== null && b.peorDia <= 90 ? 1 : 2);
    if (pa !== pb) return pa - pb;
    return String(a.nombre).localeCompare(String(b.nombre));
  });

  function chip(id, txt) {
    return '<button class="chip' + (f === id ? ' on' : '') + '" data-f="' + id + '">' +
           esc(txt) + '<span class="c">' + cuenta[id] + '</span></button>';
  }

  function prod(g, i) {
    var cero = g.anaquel <= 0;
    var marcas = [];
    if (g.peorDia !== null && g.peorDia < 0) marcas.push('<span class="pill p-crit">vencido</span>');
    else if (g.peorDia !== null && g.peorDia <= 90) marcas.push('<span class="pill p-warn">vence en ' + g.peorDia + 'd</span>');
    if (g.caja > 0) marcas.push('<span class="pill p-info">' + nFmt(g.caja) + ' en caja</span>');
    if (g.dotacion > 0) marcas.push('<span class="pill p-neutral">' + nFmt(g.dotacion) + ' comprometido</span>');

    var det = g.lotes.length
      ? g.lotes.slice().sort(function (a, b) { return (a.dias === null ? 1e9 : a.dias) - (b.dias === null ? 1e9 : b.dias); })
          .map(function (l) {
            var cls = l.dias !== null && l.dias < 0 ? ' vencido' : (l.dias !== null && l.dias <= 90 ? ' vence' : '');
            return '<div class="r' + cls + '"><span>' + esc(l.lote_id) + ' · ' + esc(l.ubic) +
                   (l.caducidad ? ' · cad ' + esc(l.caducidad) : ' · sin caducidad') +
                   (l.donde !== 'anaquel' ? ' · ' + (l.donde === 'caja' ? 'EN CAJA' : 'COMPROMETIDO') : '') +
                   '</span><b>' + nFmt(l.cantidad) + '</b></div>';
          }).join('')
      : '<div class="r"><span>Sin ningún lote capturado</span><b>0</b></div>';

    return '<div class="prod" id="pg' + i + '">' +
      '<button data-g="' + i + '"><span class="t"><span class="n">' + esc(g.nombre) + '</span>' +
      '<span class="c">' + esc(g.sku) + (marcas.length ? ' ' : '') + '</span></span>' +
      '<span class="cant' + (cero ? ' cero' : '') + '">' + nFmt(g.anaquel) + '</span></button>' +
      (marcas.length ? '<div style="padding:0 4px 8px">' + marcas.join(' ') + '</div>' : '') +
      '<div class="det">' + det + '</div></div>';
  }

  pintar(
    '<div class="buscador"><input id="qE" placeholder="Busca por nombre o clave…" ' +
    'autocomplete="off" value="' + esc(estado.existQ || '') + '"></div>' +
    '<div class="chips">' +
    chip('todo', 'Con existencia') + chip('cero', 'En cero') +
    chip('caducar', 'Por caducar') + chip('caja', 'En cajas') +
    chip('dotacion', 'Comprometido') + '</div>' +
    '<div class="card">' +
    '<p class="mini">La cifra es lo que hay <b>en el anaquel</b>. Toca un renglón para ver sus lotes.' +
      (estado.existAt && (Date.now() - estado.existAt) > 15000
        ? ' · Leído hace ' + Math.round((Date.now() - estado.existAt) / 60000) + ' min'
        : '') + '</p>' +
    (lista.length
      ? '<div>' + lista.map(prod).join('') + '</div>'
      : '<p class="sub centro">Nada que mostrar con ese filtro.</p>') +
    '</div>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  var inp = $('qE');
  inp.oninput = function () {
    estado.existQ = inp.value;
    var pos = inp.selectionStart;
    pintarExistencias();
    var n = $('qE'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
  };
  [].forEach.call(document.querySelectorAll('[data-f]'), function (b) {
    b.onclick = function () { estado.existF = b.getAttribute('data-f'); pintarExistencias(); };
  });
  [].forEach.call(document.querySelectorAll('[data-g]'), function (b) {
    b.onclick = function () { $('pg' + b.getAttribute('data-g')).classList.toggle('abierto'); };
  });
  $('bV').onclick = function () { pantallaInicio(); };
}

/* =================================================================
   Armar una caja contra su plantilla
   =================================================================
   Surtir a mano son 63 búsquedas para una rinoplastia: buscar, elegir lote,
   teclear cantidad, repetir. Nadie hace eso dos veces; a la tercera cirugía
   la caja se arma en papel y el sistema se queda vacío.

   Esto lo hace de un toque: lee la plantilla, toma los lotes por caducidad
   más próxima y surte. Primero en seco, siempre: ver qué va a salir y qué
   va a faltar ANTES de mover inventario de verdad, porque probar el surtido
   contra el inventario real mueve inventario real.
   ================================================================= */

function pantallaCajaArmar(pre) {
  var c = estado.cat || { almacenes: [] };
  /* La precarga viene de la agenda: folio del caso y la plantilla ya amarrada
     a su paquete. Se guarda en estado para que el repintado por carga de
     plantillas no la borre. */
  if (pre) estado.armarPre = pre;
  pre = estado.armarPre || {};
  encabezado('Armar caja', pre.paciente ? pre.paciente : 'Contra la plantilla del procedimiento');
  var plants = (estado.plantillasNombres || []);
  if (pre.procedimiento && plants.indexOf(pre.procedimiento) < 0) plants = plants.concat([pre.procedimiento]);

  pintar(
    '<div class="card">' +
    (pre.paciente
      ? '<div class="aviso a-info">Caso <b>' + esc(pre.paciente) + '</b> de la agenda. ' +
        'La caja queda amarrada a ese folio, no a un nombre.</div>'
      : '') +
    '<div class="campo"><label>' + (pre.paciente ? 'Folio del caso' : 'Paciente') + '</label>' +
      '<input id="aPac" placeholder="Nombre completo" value="' + esc(pre.paciente || '') + '"></div>' +
    '<div class="campo"><label>Expediente (opcional)</label>' +
      '<input id="aExp" value="' + esc(pre.paciente_id || '') + '"></div>' +
    '<div class="campo"><label>Procedimiento</label><select id="aPlant">' +
      '<option value="">— elige —</option>' +
      plants.map(function (n) {
        return '<option' + (n === pre.procedimiento ? ' selected' : '') + '>' + esc(n) + '</option>';
      }).join('') +
    '</select></div>' +
    '<div class="campo"><label>De qué almacenes se puede tomar</label>' +
      c.almacenes.map(function (a, i) {
        return '<label class="check"><input type="checkbox" class="aAlm" value="' + esc(a.id) + '"' +
               (i === 0 ? ' checked' : '') + '>' + esc(a.nombre) + '</label>';
      }).join('') +
      '<p class="mini">El primero marcado es el almacén de la caja. Marcar varios no reparte ' +
      'de más: toma lo que primero se vence, esté en el que esté.</p></div>' +
    '<button class="b-dark" id="bVer">Ver qué saldría</button>' +
    '<p class="mini">Primero en seco: nada se mueve hasta que lo confirmes.</p>' +
    '</div>' +
    '<div id="aPrev"></div>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  if (!plants.length) {
    enviar({ accion: 'plantillas' }, true).then(function (r) {
      if (!r.ok) return;
      estado.plantillasNombres = (r.plantillas || [])
        .filter(function (p) { return !p.es_base; })
        .map(function (p) { return p.plantilla; });
      if ($('aPlant')) pantallaCajaArmar();
    }).catch(function () {});
  }

  $('bV').onclick = function () { estado.armarPre = null;
    if (pre.paciente) pantallaAgenda(); else pantallaCajas(); };
  $('bVer').onclick = async function () {
    var d = leerCajaArmar();
    if (!d) return;
    this.disabled = true; this.textContent = 'Calculando…';
    try {
      var r = await enviar({ accion: 'caja_armar', simular: true, caja: d }, true);
      pintarPrevioArmado(r, d);
    } catch (e) { alertar('Sin conexión.'); }
    var b = $('bVer'); if (b) { b.disabled = false; b.textContent = 'Ver qué saldría'; }
  };
}

function leerCajaArmar() {
  var pac = ($('aPac').value || '').trim();
  var plant = $('aPlant').value;
  var alms = [].map.call(document.querySelectorAll('.aAlm:checked'), function (x) { return x.value; });
  if (!pac) { alertar('Falta el paciente.'); return null; }
  if (!plant) { alertar('Falta el procedimiento.'); return null; }
  if (!alms.length) { alertar('Marca al menos un almacén.'); return null; }
  return { paciente: pac, paciente_id: ($('aExp').value || '').trim(),
           procedimiento: plant, almacen: alms[0], almacenes: alms };
}

function pintarPrevioArmado(r, d) {
  if (!r.ok) { $('aPrev').innerHTML = '<div class="aviso a-err">' + esc(r.error) + '</div>'; return; }

  var nomAlm = {};
  ((estado.cat && estado.cat.almacenes) || []).forEach(function (a) { nomAlm[a.id] = a.nombre; });
  var varios = (r.almacenes || []).length > 1;

  function fila(x, falta) {
    /* De dónde sale sólo se dice cuando hay más de un almacén: con uno solo
       sería repetir la misma palabra en cada renglón. */
    var de = (varios && x.de && x.de.length)
      ? '<div class="mini">' + x.de.map(function (u) {
          return nFmt(u.cantidad) + ' de ' + esc(nomAlm[u.ubic_id] || u.ubic_id); }).join(' · ') + '</div>'
      : '';
    return '<div class="item"><div class="l"><span>' + esc(x.sku || '—') + '</span>' +
      '<div>' + esc(x.item) + '</div>' + de + '</div>' +
      '<span class="pill ' + (falta ? 'p-crit' : 'p-ok') + '">' +
      (falta ? nFmt(x.surtido) + ' de ' + nFmt(x.pide) : nFmt(x.surtido)) + '</span></div>';
  }

  $('aPrev').innerHTML =
    (r.faltantes.length
      ? '<div class="aviso a-warn"><b>' + r.faltantes.length + ' renglón(es) no se pueden surtir completos.</b> ' +
        'La caja se puede armar de todos modos: lo que falte se consigue aparte y se mete con «Sacar material». ' +
        'Lo que la plantilla pedía queda congelado, así que la diferencia no se pierde.</div>'
      : '<div class="aviso a-ok">Se puede surtir completa: ' + r.surtido.length + ' renglones.</div>') +

    (r.faltantes.length
      ? '<div class="card"><h3>Falta (' + r.faltantes.length + ')</h3><div class="lista">' +
        r.faltantes.map(function (x) { return fila(x, true); }).join('') + '</div></div>'
      : '') +

    '<div class="card"><h3>Saldría del almacén (' + r.surtido.length + ')</h3>' +
    '<p class="mini">Por caducidad más próxima primero.</p>' +
    '<div class="lista">' + r.surtido.map(function (x) { return fila(x, false); }).join('') +
    '</div></div>' +

    (r.revisar && r.revisar.length
      ? '<div class="card"><h3>No es material de almacén (' + r.revisar.length + ')</h3>' +
        '<p class="mini">Renglones de la plantilla que son nota, no insumo. No salen de aquí.</p>' +
        '<div class="lista">' + r.revisar.map(function (x) {
          return '<div class="item"><div class="l"><div>' + esc(x.item) + '</div></div></div>';
        }).join('') + '</div></div>'
      : '') +

    '<button class="b-primary" id="bArmar">Armar la caja y sacar el material</button>';

  $('bArmar').onclick = async function () {
    this.disabled = true; this.textContent = 'Armando…';
    try {
      var res = await enviar({ accion: 'caja_armar', caja: d }, true);
      if (!res.ok) { alertar(res.error); this.disabled = false;
                     this.textContent = 'Armar la caja y sacar el material'; return; }
      estado.armarPre = null;
      alertar('Caja ' + res.caja_id + ' armada: ' + res.renglones_surtidos + ' renglones.');
      pantallaCajaDetalle(res.caja_id);
    } catch (e) {
      alertar('Sin conexión: no se armó nada.');
      this.disabled = false; this.textContent = 'Armar la caja y sacar el material';
    }
  };
}

/* =================================================================
   Agenda de quirófano
   =================================================================
   La cirugía ya está agendada antes de que nadie toque el almacén. Volver a
   teclear el procedimiento para armar la caja es capturar dos veces lo mismo,
   y es donde se cuela el error: la caja dice RINOPLASTIA, el caso dice
   "Rinoplastía Ultrasónica", y después nadie sabe qué material fue de cuál.

   La caja se identifica por folio de caso, no por nombre: es menos dato
   personal paseándose por el almacén para lograr exactamente lo mismo.
   ================================================================= */

async function pantallaAgenda() {
  encabezado('Agenda', 'Cirugías programadas');
  pintar('<div class="card"><p class="sub">Leyendo la agenda…</p></div>');
  try {
    var r = await enviar({ accion: 'agenda', dias: estado.agendaDias || 30,
                           atras: estado.agendaAtras || 3 }, true);
    if (!r.ok) {
      pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
             '<button class="b-ghost" id="bV">Volver</button>');
      return void ($('bV').onclick = function () { pantallaInicio(); });
    }
    estado.agendaPlantillas = r.plantillas || [];

    function caso(c, i) {
      var cuando = c.dias === 0 ? 'hoy' : (c.dias === 1 ? 'mañana'
                 : (c.dias < 0 ? 'hace ' + (-c.dias) + ' d' : 'en ' + c.dias + ' d'));
      var avisos = [];
      if (c.implantes) avisos.push('<span class="pill p-info">implante: ' + esc(c.implantes) + '</span>');
      if (c.aporta) avisos.push('<span class="pill p-neutral">los aporta ' + esc(c.aporta) + '</span>');

      var acc;
      if (c.caja_id) {
        acc = '<span class="pill p-ok">' + esc(c.caja_id) + ' · ' + esc(c.caja_estado) + '</span>';
      } else if (c.plantilla) {
        acc = '<button class="b-primary" data-armar="' + i + '">Armar con ' + esc(c.plantilla) + '</button>';
      } else {
        acc = '<div class="campo"><label>Con qué plantilla se arma</label>' +
          '<select data-pl="' + i + '"><option value="">— elige —</option>' +
          (estado.agendaPlantillas || []).map(function (n) {
            return '<option' + (n === c.sugerida ? ' selected' : '') + '>' + esc(n) + '</option>';
          }).join('') + '</select></div>' +
          (c.sugerida
            ? '<p class="mini">Se parece a <b>' + esc(c.sugerida) + '</b> (' + c.parecido + '%), ' +
              'pero eso es parecido de nombre, no prueba. Confírmalo y no se vuelve a preguntar ' +
              'para este paquete.</p>'
            : '<p class="mini">Ninguna plantilla se parece a este paquete. Elige cuál le toca.</p>') +
          '<button class="b-dark" data-fijar="' + i + '">Amarrar paquete a esa plantilla</button>';
      }

      return '<div class="linea">' +
        '<div class="cab"><div><div class="nm">' + esc(c.folio_caso) + ' · ' + esc(cuando) + '</div>' +
        '<div class="datos">' + esc(c.fecha) + ' · ' + esc(c.quirofano) + ' · ' + esc(c.estatus) + '<br>' +
        esc(c.procedimiento || c.paquete_id) + '</div></div></div>' +
        (avisos.length ? '<div style="margin:6px 0">' + avisos.join(' ') + '</div>' : '') +
        '<div class="dest">' + acc + '</div></div>';
    }

    pintar(
      (r.sin_plantilla
        ? '<div class="aviso a-warn"><b>' + r.sin_plantilla + '</b> caso(s) todavía no saben con qué plantilla se arman.</div>'
        : '') +
      (r.casos.length
        ? r.casos.map(caso).join('')
        : '<div class="card"><p class="sub centro">No hay cirugías programadas en los próximos ' +
          r.dias + ' días.</p></div>') +
      '<p class="mini">La agenda sólo se lee: esta app nunca escribe en AltaZorvix. ' +
      'La caja queda amarrada al folio del caso, no al nombre del paciente.</p>' +
      '<button class="b-ghost" id="bMas">' +
        (estado.agendaDias > 30 ? 'Ver sólo el próximo mes' : 'Ver más atrás y más adelante') +
      '</button>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    [].forEach.call(document.querySelectorAll('[data-fijar]'), function (b) {
      b.onclick = async function () {
        var i = +b.getAttribute('data-fijar');
        var sel = document.querySelector('[data-pl="' + i + '"]');
        if (!sel.value) return alertar('Elige una plantilla.');
        b.disabled = true;
        var res = await enviar({ accion: 'mapa_paquete',
          paquete_id: r.casos[i].paquete_id, plantilla: sel.value }, true);
        if (!res.ok) { alertar(res.error); b.disabled = false; return; }
        pantallaAgenda();
      };
    });
    [].forEach.call(document.querySelectorAll('[data-armar]'), function (b) {
      b.onclick = function () {
        var c = r.casos[+b.getAttribute('data-armar')];
        pantallaCajaArmar({ paciente: c.folio_caso, paciente_id: c.folio_caso,
                            procedimiento: c.plantilla });
      };
    });
    $('bMas').onclick = function () {
      var ancho = (estado.agendaDias || 30) > 30;
      estado.agendaDias = ancho ? 30 : 180;
      estado.agendaAtras = ancho ? 3 : 120;
      pantallaAgenda();
    };
    $('bV').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}

/* =================================================================
   Bandeja de variación
   =================================================================
   Cerrar una caja calcula el consumo. Revisarla es que una persona mire la
   diferencia contra lo que la plantilla pedía y firme que la conoce. Sin
   esta pantalla el sistema sabía que se fueron ocho gasas de más y nadie
   se enteraba nunca.
   ================================================================= */

async function pantallaRevisiones(todas) {
  encabezado('Por revisar', 'Consumo contra plantilla');
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'cajas_por_revisar', todas: todas ? 'SI' : '' }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
      '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');

    function caja(c) {
      var marcas = [];
      if (c.controlados) marcas.push('<span class="pill p-crit">' + c.controlados + ' controlado(s)</span>');
      if (c.hay_que_revisar) marcas.push('<span class="pill p-warn">' + c.hay_que_revisar + ' fuera de rango</span>');
      if (c.revisada) marcas.push('<span class="pill p-ok">revisada</span>');
      if (!marcas.length) marcas.push('<span class="pill p-ok">sin variación</span>');
      return '<button class="baldosa ancha" data-c="' + esc(c.caja_id) + '">' +
        esc(c.paciente || c.caja_id) + ' · ' + esc(c.procedimiento) +
        '<span class="q">' + marcas.join(' ') + ' · cerrada hace ' + c.dias + ' d</span></button>';
    }

    pintar(
      (r.pendientes
        ? '<div class="aviso a-warn"><b>' + r.pendientes + '</b> caja(s) cerradas sin que nadie haya revisado su consumo.</div>'
        : '<div class="aviso a-ok">Nada pendiente de revisar.</div>') +
      (r.cajas.length
        ? '<div class="rejilla">' + r.cajas.map(caja).join('') + '</div>'
        : '<div class="card"><p class="sub centro">No hay cajas cerradas.</p></div>') +
      '<p class="mini">Se marca un renglón cuando la diferencia pasa del ' +
        Math.round(r.umbral * 100) + '%, y <b>siempre</b> si es un controlado que no cuadra: ' +
        'ahí no hay variación tolerable que valga.</p>' +
      '<button class="b-ghost" id="bTodas">' + (todas ? 'Ver sólo pendientes' : 'Ver también las ya revisadas') + '</button>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    [].forEach.call(document.querySelectorAll('[data-c]'), function (b) {
      b.onclick = function () { pantallaVariacion(b.getAttribute('data-c')); };
    });
    $('bTodas').onclick = function () { pantallaRevisiones(!todas); };
    $('bV').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}

async function pantallaVariacion(cajaId) {
  encabezado('Variación', cajaId);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'caja_comparar', caja_id: cajaId }, true);
    if (!r.ok) {
      pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
             '<button class="b-ghost" id="bV">Volver</button>');
      return void ($('bV').onclick = function () { pantallaRevisiones(); });
    }
    encabezado('Variación', (r.paciente || cajaId) + ' · ' + (r.plantilla || ''));

    var dice = { MAS: 'se usó de más', MENOS: 'se usó de menos',
                 EXTRA: 'no estaba en la plantilla', IGUAL: 'cuadra' };
    var color = { MAS: 'p-crit', MENOS: 'p-warn', EXTRA: 'p-info', IGUAL: 'p-ok' };

    function fila(f) {
      return '<div class="item"><div class="l"><span>' + esc(f.sku) +
        (f.controlado ? ' · CONTROLADO' : '') + '</span><div>' + esc(f.item || f.nombre) + '</div>' +
        '<div class="mini">pedía ' + nFmt(f.esperado) + ' · consumió ' + nFmt(f.consumido) + '</div></div>' +
        '<span class="pill ' + color[f.estado] + '">' +
        (f.diferencia > 0 ? '+' : '') + nFmt(f.diferencia) + '</span></div>';
    }

    var fuera = r.filas.filter(function (f) { return f.estado !== 'IGUAL'; });
    var iguales = r.filas.length - fuera.length;

    pintar(
      (r.hay_que_revisar
        ? '<div class="aviso a-err"><b>' + r.hay_que_revisar + ' renglón(es)</b> piden explicación.</div>'
        : '<div class="aviso a-ok">Nada fuera de rango.</div>') +

      (r.marcados.length
        ? '<div class="card"><h3>Piden explicación (' + r.marcados.length + ')</h3>' +
          '<div class="lista">' + r.marcados.map(fila).join('') + '</div></div>'
        : '') +

      (fuera.length > r.marcados.length
        ? '<div class="card"><h3>Otras diferencias (' + (fuera.length - r.marcados.length) + ')</h3>' +
          '<p class="mini">Dentro del margen: no bloquean, pero ahí están.</p>' +
          '<div class="lista">' + fuera.filter(function (f) {
            return r.marcados.indexOf(f) < 0; }).map(fila).join('') + '</div></div>'
        : '') +

      '<p class="mini">' + iguales + ' renglón(es) cuadran exactamente. ' +
      'La columna de la derecha es consumido menos lo que la plantilla pedía ' +
      '<b>el día que se armó la caja</b>, no lo que la plantilla diga hoy.</p>' +

      '<div class="card"><h3>Revisión</h3>' +
      '<div class="campo"><label>Qué explica la diferencia</label>' +
      '<textarea id="vNota" rows="3" placeholder="Ej.: se abrieron dos paquetes de gasas por sangrado"></textarea></div>' +
      '<button class="b-primary" id="bFirmar">Dar por revisada</button>' +
      '<p class="mini">Queda tu nombre y la fecha. No corrige inventario: es la firma de que alguien lo vio.</p>' +
      '</div>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    $('bFirmar').onclick = async function () {
      var nota = ($('vNota').value || '').trim();
      if (!nota) return alertar('La revisión pide una nota.');
      this.disabled = true;
      var res = await enviar({ accion: 'caja_revisar', caja_id: cajaId, nota: nota }, true);
      if (!res.ok) {
        if (/ya la revisó/.test(res.error || '')) {
          if (confirm(res.error)) {
            var re = await enviar({ accion: 'caja_revisar', caja_id: cajaId, nota: nota, rehacer: 'SI' }, true);
            if (re.ok) return pantallaRevisiones();
            alertar(re.error);
          }
        } else alertar(res.error);
        this.disabled = false; return;
      }
      pantallaRevisiones();
    };
    $('bV').onclick = function () { pantallaRevisiones(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaRevisiones(); };
  }
}

/* =================================================================
   Anular una recepción
   =================================================================
   Si una compra se capturó mal, hoy no había manera de corregirla desde la
   app. El backend sabía hacerlo desde hace semanas y nadie podía llamarlo.

   Anular quita los lotes y sus movimientos de entrada, y sólo si NADA de
   esa recepción se ha movido todavía: una vez que algo salió al quirófano,
   la historia ya no se puede borrar y hay que corregir con un movimiento,
   no con una goma.
   ================================================================= */

async function pantallaAnularRecepcion() {
  encabezado('Anular recepción', 'Corregir una compra mal capturada');
  pintar(
    '<div class="aviso a-warn">Esto borra los lotes de esa recepción y sus entradas. ' +
    'Sólo funciona si nada de ella se ha movido: si ya salió material, la historia no se borra ' +
    'y hay que corregir con un movimiento.</div>' +
    '<div class="card">' +
    '<div class="campo"><label>Folio de la recepción</label>' +
    '<input id="rFolio" placeholder="REC-00023" autocomplete="off"></div>' +
    '<div class="campo"><label>Motivo</label>' +
    '<textarea id="rMot" rows="2" placeholder="Por qué se anula. Queda en la bitácora."></textarea></div>' +
    '<button class="b-dark" id="bAnular">Anular</button>' +
    '</div>' +
    '<button class="b-ghost" id="bV">Volver</button>');

  $('bV').onclick = function () { pantallaInicio(); };
  $('bAnular').onclick = async function () {
    var folio = ($('rFolio').value || '').trim().toUpperCase();
    var motivo = ($('rMot').value || '').trim();
    if (!folio) return alertar('Falta el folio.');
    if (!motivo) return alertar('Falta el motivo: queda en la bitácora.');
    if (!confirm('¿Anular ' + folio + '? Esto no se puede deshacer desde la app.')) return;
    this.disabled = true; this.textContent = 'Anulando…';
    try {
      var r = await enviar({ accion: 'recepcion_anular', recepcion_id: folio, motivo: motivo }, true);
      if (!r.ok) {
        pintar('<div class="aviso a-err">' + esc(r.error) + '</div>' +
          (r.movidos && r.movidos.length
            ? '<div class="card"><h3>Ya se movió</h3><div class="lista">' +
              r.movidos.map(function (m) {
                return '<div class="item"><div class="l"><span>' + esc(m.lote_id) +
                  '</span><div>' + esc(m.nombre || m.sku) + '</div></div></div>'; }).join('') +
              '</div></div>'
            : '') +
          '<button class="b-ghost" id="bV">Volver</button>');
        return void ($('bV').onclick = function () { pantallaAnularRecepcion(); });
      }
      pintar('<div class="aviso a-ok">Recepción ' + esc(folio) + ' anulada. ' +
        (r.lotes || 0) + ' lote(s) y ' + (r.movimientos || 0) + ' movimiento(s) quitados. ' +
        'El respaldo quedó en RECEPCIONES_ANULADAS.</div>' +
        '<button class="b-ghost" id="bV">Volver</button>');
      $('bV').onclick = function () { pantallaInicio(); };
    } catch (e) {
      alertar('Sin conexión: no se anuló nada.');
      this.disabled = false; this.textContent = 'Anular';
    }
  };
}

/* =================================================================
   Editar una plantilla
   ================================================================= */

async function pantallaPlantillaEditar(nombre) {
  encabezado('Editar plantilla', nombre);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'plantillas', plantilla: nombre }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');
    var items = r.items || [];

    function reng(x, i) {
      var heredado = !!x.de_base;
      return '<div class="linea" data-i="' + i + '">' +
        '<div class="cab"><div><div class="nm">' + esc(x.item) + '</div>' +
        '<div class="datos">' + esc(x.sku || 'sin clave') +
        (heredado ? ' · viene de la base' : '') + '</div></div>' +
        '<button class="quitar" data-q="' + i + '">' + (heredado ? 'Quitar aquí' : 'Desactivar') + '</button></div>' +
        '<div class="campo"><label>Cantidad</label>' +
        '<input type="number" inputmode="decimal" step="any" min="0" data-cant="' + i + '" value="' + esc(x.cantidad) + '"></div>' +
        '</div>';
    }

    pintar(
      '<div class="card"><h3>' + items.length + ' renglón(es)</h3>' +
      '<p class="mini">Cambiar la cantidad de un renglón heredado lo convierte en propio de esta ' +
      'plantilla: la base no se toca. «Quitar aquí» saca un heredado sólo de esta plantilla.</p></div>' +
      '<div id="pLista">' + items.map(reng).join('') + '</div>' +
      '<div class="card"><h3>Agregar</h3>' +
      '<div class="campo"><label>Insumo</label><input id="nItem" placeholder="Nombre como lo dice la lista"></div>' +
      '<div class="dos">' +
      '<div class="campo"><label>Clave</label><input id="nSku" placeholder="MED-050"></div>' +
      '<div class="campo"><label>Cantidad</label><input id="nCant" type="number" step="any" min="0"></div>' +
      '</div><button class="b-dark" id="bAdd">Agregar renglón</button></div>' +
      '<button class="b-primary" id="bGuardar">Guardar cambios</button>' +
      '<button class="b-ghost" id="bV">Volver</button>');

    var cambios = {};
    [].forEach.call(document.querySelectorAll('[data-cant]'), function (inp) {
      inp.onchange = function () {
        var i = +inp.getAttribute('data-cant');
        cambios[i] = { plantilla: nombre, item: items[i].item, sku: items[i].sku,
                       categoria: items[i].categoria || '', cantidad: inp.value,
                       activo: 'SI', notas: items[i].notas || '',
                       tipo: items[i].tipo || '' };
      };
    });
    [].forEach.call(document.querySelectorAll('[data-q]'), function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-q');
        var x = items[i];
        cambios[i] = x.de_base
          ? { plantilla: nombre, item: x.item, sku: x.sku, cantidad: x.cantidad,
              activo: 'SI', tipo: 'QUITA', notas: 'Quitado de esta plantilla' }
          : { plantilla: nombre, item: x.item, sku: x.sku, cantidad: x.cantidad,
              activo: 'NO', notas: x.notas || '', tipo: x.tipo || '' };
        b.textContent = 'Marcado';
        b.disabled = true;
      };
    });

    var nuevos = [];
    $('bAdd').onclick = function () {
      var item = ($('nItem').value || '').trim();
      if (!item) return alertar('Falta el nombre del insumo.');
      nuevos.push({ plantilla: nombre, item: item, sku: ($('nSku').value || '').trim(),
                    cantidad: $('nCant').value || 1, activo: 'SI', categoria: '', notas: '' });
      $('nItem').value = ''; $('nSku').value = ''; $('nCant').value = '';
      alertar(nuevos.length + ' renglón(es) por agregar. Guarda para que queden.');
    };

    $('bGuardar').onclick = async function () {
      var filas = Object.keys(cambios).map(function (k) { return cambios[k]; }).concat(nuevos);
      if (!filas.length) return alertar('No cambiaste nada.');
      this.disabled = true; this.textContent = 'Guardando…';
      var res = await enviar({ accion: 'plantilla_guardar', filas: filas }, true);
      if (!res.ok) { alertar(res.error); this.disabled = false;
                     this.textContent = 'Guardar cambios'; return; }
      alertar('Guardado: ' + (res.agregadas || 0) + ' nuevos, ' + (res.actualizadas || 0) + ' cambiados.');
      pantallaPlantillaEditar(nombre);
    };
    $('bV').onclick = function () { pantallaPlantillas(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaPlantillas(); };
  }
}

        '<div class="cab"><div><div class="nm">' + esc(x.item) + '</div>' +

        '<div class="campo"><label>Cantidad</label>' +

    pintar(

      '<p class="mini">Un <b>insumo</b> se mide contra la existencia del almacén. Un <b>equipo</b> se mide ' +
      'contra el registro de activos: ahí la clave es el folio del aparato (ACT-00127), no una clave de catálogo.</p></div>' +

      '<div class="card"><h3>Agregar</h3>' +
      '<div class="campo"><label>Qué</label><input id="dItem" placeholder="Nombre"></div>' +
      '<div class="dos">' +
      '<div class="campo"><label>Clave o folio</label><input id="dSku" placeholder="MED-050 o ACT-00127"></div>' +

      '</select></div>' +
      '<button class="b-dark" id="bAdd">Agregar</button></div>' +

      inp.onchange = function () {
        var i = +inp.getAttribute('data-cant');
        cambios[i] = Object.assign({}, todos[i], { ubicacion: ubic, cantidad: inp.value, activo: 'SI' });
      };
    });
    [].forEach.call(document.querySelectorAll('[data-q]'), function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-q');
        cambios[i] = Object.assign({}, todos[i], { ubicacion: ubic, activo: 'NO' });
        b.textContent = 'Marcado'; b.disabled = true;
      };
    });
    $('bAdd').onclick = function () {
      var item = ($('dItem').value || '').trim();
      if (!item) return alertar('Falta el nombre.');
      nuevos.push({ ubicacion: ubic, item: item, sku: ($('dSku').value || '').trim(),
                    cantidad: $('dCant').value || 1, tipo: $('dTipo').value, activo: 'SI' });
      $('dItem').value = ''; $('dSku').value = ''; $('dCant').value = '1';
      alertar(nuevos.length + ' por agregar. Guarda para que queden.');
    };
    $('bGuardar').onclick = async function () {
      var filas = Object.keys(cambios).map(function (k) { return cambios[k]; }).concat(nuevos);
      if (!filas.length) return alertar('No cambiaste nada.');
      this.disabled = true; this.textContent = 'Guardando…';
      var res = await enviar({ accion: 'dotacion_guardar', filas: filas }, true);
      if (!res.ok) { alertar(res.error); this.disabled = false;
                     this.textContent = 'Guardar cambios'; return; }
      pantallaDotacion(ubic);
    };
    $('bV').onclick = function () { pantallaDotacion(ubic); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaDotacion(ubic); };
  }
}

      '<div class="campo"><label>Rol</label><select id="uRol">' +

      'cambiarle el rol a alguien sin querer es como quitarle o darle permisos a ciegas.</p></div>' +

      '<button class="b-ghost" id="bUbic">Dar de alta una ubicación</button>' +

      var res = await enviar({ accion: 'usuario_alta',

    pintar('<div class="aviso a-err">Sin conexión.</div><button class="b-ghost" id="bV">Volver</button>');
    $('bV').onclick = function () { pantallaInicio(); };
  }
}
