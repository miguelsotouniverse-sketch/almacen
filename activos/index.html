<style>
:root{
  --ground:#F4F2F1;--surface:#FFFFFF;--surface-2:#EDEAE7;
  --ink:#0C0E0D;--ink-2:#3D423F;--ink-3:#6E736F;
  --rule:#D8D2CC;--rule-soft:#E6E1DC;
  --accent:#A19487;--accent-deep:#6B5D51;
  --ok:#3F6F52;--warn:#B5842B;--crit:#A33F30;--info:#3C5F79;
  --tint-ok:rgba(63,111,82,.10);--tint-warn:rgba(181,132,43,.13);
  --tint-crit:rgba(163,63,48,.10);--tint-accent:rgba(161,148,135,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground);color:var(--ink);
  font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:300;font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

/* barra superior */
header{
  position:sticky;top:0;z-index:20;background:var(--ink);color:#F4F2F1;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
}
header .fila{display:flex;justify-content:space-between;align-items:center;gap:10px}
header .marca{display:flex;align-items:center;gap:13px;min-width:0}
header .ms{height:34px;width:auto;flex:none;opacity:.95}
header .t{font-weight:500;font-size:1.02rem;line-height:1.2}
header .s{font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;color:#9AA09C;margin-top:2px}
.estado{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.05em;
  padding:3px 8px;border-radius:3px;background:rgba(255,255,255,.1);white-space:nowrap}
.estado.pend{background:var(--tint-warn);color:#E0B369}
.estado.off{background:var(--tint-crit);color:#E4998A}

main{padding:16px 16px 40px;max-width:640px;margin:0 auto}
h2{font-size:1.15rem;font-weight:500;margin:0 0 12px}
p{margin:0 0 12px}
.sub{color:var(--ink-3);font-size:.9rem}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:16px;margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:1rem;font-weight:500}

label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 5px}
input,select,textarea{
  width:100%;padding:12px 13px;border:1px solid var(--rule);border-radius:8px;
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:16px;font-weight:300;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.campo{margin-bottom:13px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}

button{font-family:inherit;font-size:1rem;font-weight:500;border:0;border-radius:9px;
  padding:14px;cursor:pointer;width:100%}
.b-primary{background:var(--accent);color:#15100C}
.b-primary:active{filter:brightness(.94)}
.b-dark{background:var(--ink);color:#F4F2F1}
.b-ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2)}
.b-fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button:disabled{opacity:.5}
button+button{margin-top:9px}
.b-fila button+button{margin-top:0}

.folio{
  text-align:center;padding:18px;background:var(--ink);color:#F4F2F1;border-radius:10px;
  margin-bottom:14px;
}
.folio .lbl{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;
  text-transform:uppercase;color:#9AA09C;margin-bottom:5px}
.folio .n{font-family:'IBM Plex Mono',monospace;font-size:2rem;font-weight:600;letter-spacing:.02em}

.pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  padding:3px 8px;border-radius:3px;letter-spacing:.05em}
.p-ok{background:var(--tint-ok);color:var(--ok)}
.p-warn{background:var(--tint-warn);color:var(--warn)}
.p-crit{background:var(--tint-crit);color:var(--crit)}
.p-neutral{background:var(--surface-2);color:var(--ink-3)}

.aviso{padding:12px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
.a-ok{background:var(--tint-ok);color:var(--ok)}
.a-err{background:var(--tint-crit);color:var(--crit)}
.a-info{background:var(--tint-accent);color:var(--accent-deep)}

.lista .item{display:flex;justify-content:space-between;gap:10px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.lista .item:last-child{border-bottom:0}
.lista .item .l{min-width:0}
.lista .item .l span{display:block;font-family:'IBM Plex Mono',monospace;
  font-size:.6rem;color:var(--ink-3);letter-spacing:.06em}
.lista .item .l div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#video{width:100%;border-radius:10px;background:#000;display:block}
.foto-prev{width:100%;border-radius:8px;margin-top:9px;display:block}
.oculto{display:none!important}
.centro{text-align:center}
.mini{font-size:.82rem;color:var(--ink-3)}
.espacio{height:10px}
.g-caja{display:flex;justify-content:center;margin:16px 0 8px;min-height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* =================================================================
   Activos Fijos — MS Universe
   PWA de levantamiento e inventario. Sin dependencias externas
   obligatorias: el escáner usa BarcodeDetector si el navegador lo
   trae, y si no, se captura el folio a mano.
   ================================================================= */

/* Misma URL y mismo origen que el almacén: por eso la sesión de Google
   se comparte y aquí no hay que volver a entrar. */
var GATEWAY = 'https://script.google.com/macros/s/AKfycbz0VFVwemsK8M2_nqwp-0zMcGuhicVCn5xIwlG1hPAaEnvh7XUdxwvX5AhrhAje3sRggg/exec';

var COLA_KEY = 'msu_activos_cola';
var SES_KEY = 'msu_alm_sesion';   // la misma llave que el almacén

var estado = {
  sesion: leer(SES_KEY, null),     // {sesion, usuario, nombre, rol}
  catalogos: null,
  ubicActual: '',
  folio: '',
  pantalla: 'inicio',
  fotoBase64: null,
  stream: null
};

/* ---------- almacenamiento seguro ---------- */
function leer(k, def) {
  try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; }
  catch (e) { return def; }
}
function escribir(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}

/* ---------- cola offline ---------- */
function cola() { return leer(COLA_KEY, []); }

/* Guardar en la cola sin perder nada en silencio: si el teléfono se queda
   sin espacio (las fotos pesan), se suelta la foto y se avisa. */
function encolar(payload) {
  var c = cola();
  c.push(payload);
  try {
    localStorage.setItem(COLA_KEY, JSON.stringify(c));
    pintarEstado();
    return true;
  } catch (e) { /* cuota llena */ }

  if (payload.foto_base64) {
    payload.foto_base64 = null;
    payload.sin_foto = true;
    try {
      localStorage.setItem(COLA_KEY, JSON.stringify(c));
      pintarEstado();
      alertar('Sin espacio para la foto: el activo se guardó, la foto no. Tómala de nuevo cuando haya señal.');
      return true;
    } catch (e2) { /* sigue sin caber */ }
  }

  alertar('El teléfono ya no puede guardar más pendientes. Busca señal antes de seguir capturando.');
  pintarEstado();
  return false;
}
function quitarDeCola(clientId) {
  var c = cola().filter(function (x) { return x.client_id !== clientId; });
  escribir(COLA_KEY, c);
  pintarEstado();
}

async function vaciarCola() {
  var pendientes = cola();
  if (!pendientes.length || !navigator.onLine) return;
  for (var i = 0; i < pendientes.length; i++) {
    try {
      var r = await enviar(pendientes[i], true);
      if (r && r.ok) quitarDeCola(pendientes[i].client_id);
    } catch (e) { break; }
  }
}

/* ---------- transporte ---------- */
function idCliente() {
  return 'c' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
}

async function enviar(payload, sinEncolar) {
  if (!payload.client_id) payload.client_id = idCliente();
  if (estado.sesion && estado.sesion.sesion) payload.sesion = estado.sesion.sesion;

  try {
    var res = await fetch(GATEWAY, {
      method: 'POST',
      // text/plain evita el preflight CORS que Apps Script no responde
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    var json = await res.json();
    if (json && json.ok === false && MOTIVOS_SESION[json.error]) {
      cerrarSesion(MOTIVOS_SESION[json.error]);
    }
    return json;
  } catch (err) {
    if (!sinEncolar && payload.encolable) {
      encolar(payload);
      return { ok: true, encolado: true };
    }
    throw err;
  }
}

/* ---------- fotos ---------- */
/* La ficha trae foto_id; las fichas viejas sólo traen la liga. Cualquiera
   de las dos significa que sí hay foto guardada. */
function tieneFoto(a) {
  if (!a) return false;
  if (String(a.foto_id || '').trim()) return true;
  var u = String(a.foto_url || '').trim();
  return !!u && u !== 'ERROR_FOTO';
}

/* Las fotos viven en un Drive privado: ninguna liga directa carga en el
   teléfono de alguien más. Se piden por el gateway, que ya sabe quién eres. */
async function cargarFoto(folio, idImagen, idNota, textoFinal) {
  var img = $(idImagen), nota = $(idNota);
  if (!img) return;
  try {
    var r = await enviar({ accion: 'foto', folio: folio }, true);
    if (r && r.ok && r.imagen) {
      img.src = r.imagen;
      img.classList.remove('oculto');
      if (nota) {
        if (textoFinal) nota.textContent = textoFinal;
        else nota.remove();
      }
      return;
    }
    if (nota) nota.textContent = (r && r.error) || 'No se pudo cargar la foto.';
  } catch (e) {
    if (nota) nota.textContent = 'Sin señal: la foto aparece cuando haya conexión.';
  }
}

/* ---------- utilidades de UI ---------- */
function h(html) { return html; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function $(id) { return document.getElementById(id); }
function pintar(html) { $('app').innerHTML = html; }

function pintarEstado() {

  var pend = cola().length;
  if (!navigator.onLine) { e.textContent = '● sin señal'; e.className = 'estado off'; }

  else { e.textContent = '● en línea'; e.className = 'estado'; }
}

/* ---------- Google Identity ---------- */
var GIS_LISTO = null;

function cargarGIS() {
  if (GIS_LISTO) return GIS_LISTO;
  GIS_LISTO = new Promise(function (ok, falla) {
    if (window.google && google.accounts && google.accounts.id) return ok();
    var sc = document.createElement('script');
    sc.src = 'https://accounts.google.com/gsi/client';
    sc.async = true; sc.defer = true;
    sc.onload = function () { ok(); };
    sc.onerror = function () { GIS_LISTO = null; falla(new Error('No se pudo cargar Google')); };
    document.head.appendChild(sc);
  });
  return GIS_LISTO;
}

async function entrarConGoogle(credencial) {
  var r = await enviar({ accion: 'login_google', idToken: credencial,
                         dispositivo: navigator.userAgent }, true);
  if (!r.ok) return pantallaLogin(r.error);
  estado.sesion = { sesion: r.sesion, usuario: r.correo || r.usuario,
                    nombre: r.nombre, rol: r.rol, via: r.via };
  escribir(SES_KEY, estado.sesion);
  await cargarCatalogos();
  pantallaInicio();
}

function pantallaLogin(mensaje) {
  encabezado('Entrar', 'Activos fijos');
  pintar(
    (mensaje ? '<div class="aviso a-err">' + esc(mensaje) + '</div>' : '') +
    '<div class="card">' +
    '<p class="sub">Entra con la cuenta de Google que tengas dada de alta. ' +
    'Cada activo queda registrado con ese correo.</p>' +
    '<div id="gBtn" class="g-caja"></div>' +
    '<div id="gMsg" class="mini"></div>' +
    '</div>'
  );
  prepararBotonGoogle();
}

async function prepararBotonGoogle() {
  var msg = $('gMsg');
  try {
    if (!window.isSecureContext) {
      msg.innerHTML = 'Esta pagina tiene que abrirse con <b>https://</b> para entrar con Google.';
      return;
    }
    var cfg = await enviar({ accion: 'config_publica' }, true);
    if (!cfg.ok || !cfg.google_activo) {
      msg.textContent = 'Falta configurar GOOGLE_CLIENT_ID en el gateway.';
      return;
    }
    await cargarGIS();
    google.accounts.id.initialize({
      client_id: cfg.google_client_id,
      callback: function (resp) {
        $('gMsg').textContent = 'Verificando...';
        entrarConGoogle(resp.credential).catch(function () {
          pantallaLogin('Sin conexion. Intenta de nuevo.');
        });
      }
    });
    google.accounts.id.renderButton($('gBtn'), {
      theme: 'outline', size: 'large', shape: 'pill',
      text: 'signin_with', locale: 'es', width: 260
    });
    msg.textContent = '';
  } catch (e) {
    msg.textContent = 'No se pudo contactar a Google. Revisa tu conexion.';
  }
}

async function cargarCatalogos() {
  var r = await enviar({ accion: 'catalogos' }, true);
  if (r && r.ok) {
    estado.catalogos = r;
    escribir('msu_activos_cat', r);
  } else {
    estado.catalogos = leer('msu_activos_cat', null);
  }
}

  estado.fotoBase64 = null;
  var c = estado.catalogos || { categorias: [], estados: [], ubicaciones: [], usuarios: [], sugerencias: [], comprobantes: [] };
  var a = activo || {};

  var optCat = c.categorias.map(function (x) {
    return '<option' + (a.categoria === x ? ' selected' : '') + '>' + esc(x) + '</option>';
  }).join('');
  var optEst = c.estados.map(function (x) {
    return '<option' + (a.estado === x ? ' selected' : '') + '>' + esc(x) + '</option>';
  }).join('');
  var optUbic = c.ubicaciones.map(function (u) {
    var sel = (a.ubic_id || estado.ubicActual) === u.id ? ' selected' : '';
    return '<option value="' + esc(u.id) + '"' + sel + '>' + esc(u.nombre) + '</option>';
  }).join('');
  var sugerencias = (c.sugerencias || []).map(function (s) {
    return '<option value="' + esc(s) + '">';
  }).join('');
  var optComp = '<option value="">Por confirmar</option>' +
    (c.comprobantes || ['FACTURA', 'NOTA', 'PENDIENTE', 'SIN COMPROBANTE']).map(function (x) {
      return '<option' + (a.comprobante === x ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('');

  pintar(
    '<div class="folio"><div class="lbl">' + (modoLevantamiento ? 'Pega esta etiqueta' : 'Folio') + '</div>' +
    '<div class="n">' + esc(folio) + '</div></div>' +

    '<div class="card">' +
    '<div class="campo"><label>¿Qué es?</label>' +
    '<input id="fNombre" list="sug" placeholder="Sillón de tratamiento" value="' + esc(a.nombre || '') + '">' +
    '<datalist id="sug">' + sugerencias + '</datalist></div>' +

    '<div class="campo"><label>Categoría</label><select id="fCat">' + optCat + '</select></div>' +
    '<div class="campo"><label>Ubicación</label><select id="fUbic">' + optUbic + '</select></div>' +

    '<div class="dos">' +
    '<div class="campo"><label>Marca</label><input id="fMarca" value="' + esc(a.marca || '') + '"></div>' +
    '<div class="campo"><label>Modelo</label><input id="fModelo" value="' + esc(a.modelo || '') + '"></div>' +
    '</div>' +

    '<div class="campo"><label>Número de serie</label><input id="fSerie" value="' + esc(a.numero_serie || '') + '"></div>' +

    '<div class="dos">' +
    '<div class="campo"><label>Estado</label><select id="fEstado">' + optEst + '</select></div>' +
    '<div class="campo"><label>Responsable</label><input id="fResp" value="' + esc(a.responsable || '') + '"></div>' +
    '</div>' +

    '<div class="dos">' +
    '<div class="campo"><label>¿Es un conjunto?</label><select id="fConj">' +
    '<option value="NO"' + (a.es_conjunto === 'SI' ? '' : ' selected') + '>No, es una pieza</option>' +
    '<option value="SI"' + (a.es_conjunto === 'SI' ? ' selected' : '') + '>Sí, son varias iguales</option>' +
    '</select></div>' +

    '</div>' +

    '<div class="dos">' +
    '<div class="campo"><label>Comprobante</label><select id="fComp">' + optComp + '</select></div>' +
    '<div class="campo"><label>Folio fiscal</label><input id="fFolioFiscal" placeholder="UUID, si lo tienes" value="' + esc(a.folio_fiscal || '') + '"></div>' +
    '</div>' +
    '<p class="mini">Si no lo sabes ahora, déjalo en «Por confirmar» y se completa después desde el Sheet. El activo se registra igual.</p>' +

    '<div class="campo"><label>Foto</label>' +
    '<input id="fFoto" type="file" accept="image/*" capture="environment">' +
    '<img id="prev" class="foto-prev oculto" alt="">' +
    (tieneFoto(a) ? '<p class="mini" id="fotoNota">Cargando la foto guardada…</p>' : '') +
    '</div>' +

    '<div class="campo"><label>Notas</label><textarea id="fNotas" rows="2">' + esc(a.notas || '') + '</textarea></div>' +
    '</div>' +

    '<button class="b-primary" id="bGuardar">' + (modoLevantamiento ? 'Guardar y siguiente' : 'Guardar') + '</button>' +

    '<button class="b-ghost" id="bVolver">Volver al inicio</button>'
  );

  if (tieneFoto(a)) {
    cargarFoto(a.activo_id || folio, 'prev', 'fotoNota',
               'Ya tiene foto guardada. Si tomas otra, la reemplaza.');
  }

  $('fFoto').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    comprimir(f, function (b64) {
      estado.fotoBase64 = b64;
      var img = $('prev'); img.src = b64; img.classList.remove('oculto');
      var nota = $('fotoNota');
      if (nota) nota.textContent = 'Foto nueva: reemplaza a la anterior al guardar.';
    });
  };

  $('bVolver').onclick = function () { pantallaInicio(); };
  if ($('bSaltar')) $('bSaltar').onclick = function () {
    estado.folio = siguienteLocal(folio);
    pantallaFicha(null, estado.folio, true);
  };

  $('bGuardar').onclick = async function () {
    var nombre = $('fNombre').value.trim();
    if (!nombre) return alertar('Falta decir qué es.');
    this.disabled = true; this.textContent = 'Guardando…';

    var payload = {
      accion: 'guardar',
      encolable: true,
      client_id: idCliente(),
      foto_base64: estado.fotoBase64,
      activo: {
        activo_id: folio,
        nombre: nombre,
        categoria: $('fCat').value,
        marca: $('fMarca').value.trim(),
        modelo: $('fModelo').value.trim(),
        numero_serie: $('fSerie').value.trim(),
        ubic_id: $('fUbic').value,
        responsable: $('fResp').value.trim(),
        estado: $('fEstado').value,
        es_conjunto: $('fConj').value,
        cantidad_conjunto: $('fCant').value,
        comprobante: $('fComp').value,
        folio_fiscal: $('fFolioFiscal').value.trim(),
        notas: $('fNotas').value.trim()
      }
    };

    try {
      var r = await enviar(payload);
      if (r.ok === false) { this.disabled = false; this.textContent = 'Guardar'; return alertar(r.error); }
      if (r.siguiente && estado.catalogos) estado.catalogos.siguiente = r.siguiente;

      if (modoLevantamiento) {
        var sig = r.siguiente || siguienteLocal(folio);
        estado.folio = sig;
        pantallaFicha(null, sig, true);
        alertar(r.encolado ? 'Guardado en el teléfono. Se enviará al recuperar señal.' : 'Guardado.');
      } else {
        pantallaInicio();
        alertar('Guardado.');
      }
    } catch (e) {
      this.disabled = false; this.textContent = 'Guardar';
      alertar('No se pudo guardar. Revisa la señal.');
    }
  };
}

function siguienteLocal(folio) {
  var m = String(folio).match(/(\D*)(\d+)$/);
  if (!m) return folio;
  var n = String(parseInt(m[2], 10) + 1);
  while (n.length < m[2].length) n = '0' + n;
  return m[1] + n;
}

function comprimir(file, cb) {
  var lector = new FileReader();
  lector.onload = function (ev) {
    var img = new Image();
    img.onload = function () {
      var max = 1280;
      var escala = Math.min(1, max / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * escala);
      cv.height = Math.round(img.height * escala);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cb(cv.toDataURL('image/jpeg', 0.72));
    };
    img.src = ev.target.result;
  };
  lector.readAsDataURL(file);
}

/* ---------- escáner ---------- */
function pedirFolio() {
  var f = prompt('Folio del activo (ejemplo: ACT-00042)');
  if (f) abrirFolio(f.trim().toUpperCase());
}

async function abrirFolio(folio) {
  try {
    var r = await enviar({ accion: 'resolver', folio: folio }, true);
    if (!r.ok) return alertar(r.error);
    if (r.existe) pantallaActivo(r.activo);
    else pantallaFicha(null, folio, false);
  } catch (e) {
    alertar('Sin conexión: para consultar un activo necesitas señal.');
  }
}

/* Tres caminos, en orden de preferencia:
   1. BarcodeDetector nativo  → Chrome de Android, sin dependencias.
   2. jsQR.js del propio repo → iPhone/Safari y cualquier navegador viejo.
      Vive en el repositorio, no en un CDN: funciona sin internet.
   3. Teclear el folio        → siempre disponible.                        */
async function pantallaEscaner() {
  encabezado('Escanear', 'Apunta al código');
  pintar(
    '<div class="card"><video id="video" playsinline muted autoplay></video>' +
    '<canvas id="lienzo" class="oculto"></canvas>' +
    '<p class="mini centro" id="msgEscaner">Abriendo cámara…</p></div>' +
    '<button class="b-ghost" id="bTeclear">Teclear el folio</button>' +
    '<button class="b-ghost" id="bVolver">Volver</button>'
  );
  $('bTeclear').onclick = function () { detenerCamara(); pedirFolio(); };
  $('bVolver').onclick = function () { detenerCamara(); pantallaInicio(); };

  var hayNativo = ('BarcodeDetector' in window);
  var hayJsQR = (typeof window.jsQR === 'function');

  if (!hayNativo && !hayJsQR) {
    $('msgEscaner').textContent =
      'Este navegador no puede leer códigos y falta el archivo jsQR.js en el servidor. Usa "Teclear el folio".';
    return;
  }

  var v = $('video');
  try {
    estado.stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    v.srcObject = estado.stream;
    v.setAttribute('playsinline', 'true');   // iOS: sin esto abre a pantalla completa
    await v.play();
  } catch (e) {
    $('msgEscaner').textContent =
      'No se pudo abrir la cámara. Da permiso al sitio, o teclea el folio. ' +
      'En iPhone se necesita iOS 14.3 o posterior.';
    return;
  }

  $('msgEscaner').textContent = 'Buscando código…';

  var detector = hayNativo
    ? new window.BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39'] })
    : null;
  var lienzo = $('lienzo');
  var ctx = lienzo.getContext('2d', { willReadFrequently: true });
  var buscando = true;

  function encontrado(valor) {
    buscando = false;
    detenerCamara();
    if (navigator.vibrate) navigator.vibrate(60);
    abrirFolio(String(valor || '').trim().toUpperCase());
  }

  (async function bucle() {
    while (buscando && estado.stream) {
      try {
        if (detector) {
          var codigos = await detector.detect(v);
          if (codigos && codigos.length) return encontrado(codigos[0].rawValue);
        } else if (v.videoWidth) {
          // Se reduce el fotograma: decodificar en tamaño completo tumba a los teléfonos modestos
          var ancho = 480;
          var alto = Math.round(v.videoHeight * (ancho / v.videoWidth));
          lienzo.width = ancho; lienzo.height = alto;
          ctx.drawImage(v, 0, 0, ancho, alto);
          var img = ctx.getImageData(0, 0, ancho, alto);
          var r = window.jsQR(img.data, ancho, alto, { inversionAttempts: 'dontInvert' });
          if (r && r.data) return encontrado(r.data);
        }
      } catch (e) { /* fotograma ilegible: seguimos */ }
      await new Promise(function (res) { setTimeout(res, detector ? 220 : 120); });
    }
  })();
}

function detenerCamara() {
  if (estado.stream) {
    estado.stream.getTracks().forEach(function (t) { t.stop(); });
    estado.stream = null;
  }
}

      : '') +
    '<div class="lista" style="margin-top:10px">' +
    fila('Categoría', a.categoria) +

    fila('Estado', a.estado) +
    fila('Responsable', a.responsable) +
    fila('Marca / modelo', [a.marca, a.modelo].filter(Boolean).join(' · ')) +
    fila('Serie', a.numero_serie) +
    fila('Comprobante', a.comprobante) +
    '</div></div>' +

    '<button class="b-primary" id="bAqui">Está aquí — confirmar</button>' +
    '<button class="b-dark" id="bMover">Moverlo a este espacio</button>' +
    '<button class="b-ghost" id="bEditar">Editar ficha</button>' +
    '<button class="b-ghost" id="bVolver">Volver</button>'
  );

  if ($('fotoAct')) cargarFoto(a.activo_id, 'fotoAct', 'fotoNota');

  $('bVolver').onclick = function () { pantallaInicio(); };
  $('bEditar').onclick = function () { pantallaFicha(a, a.activo_id, false); };

  $('bAqui').onclick = async function () {
    this.disabled = true;
    try {
      await enviar({ accion: 'verificar', folio: a.activo_id, encolable: true });
      pantallaInicio(); alertar('Verificado.');
    } catch (e) { alertar('No se pudo registrar.'); }
  };

  $('bMover').onclick = async function () {
    if (!estado.ubicActual) return alertar('Primero elige en el inicio el espacio en el que estás.');
    this.disabled = true;
    try {
      await enviar({ accion: 'mover', folio: a.activo_id, ubic_destino: estado.ubicActual, encolable: true });
      pantallaInicio(); alertar('Reubicado.');
    } catch (e) { alertar('No se pudo mover.'); }
  };
}

function fila(k, v) {
  if (!v) return '';
  return '<div class="item"><div class="l"><span>' + esc(k) + '</span></div><div>' + esc(v) + '</div></div>';
}

/* ---------- lista por ubicación ---------- */
async function pantallaLista() {
  if (!estado.ubicActual) return alertar('Primero elige el espacio en el que estás.');
  encabezado('Inventario del espacio', estado.ubicActual);
  pintar('<div class="card"><p class="sub">Cargando…</p></div>');
  try {
    var r = await enviar({ accion: 'listar', ubic_id: estado.ubicActual }, true);
    if (!r.ok) return pintar('<div class="aviso a-err">' + esc(r.error) + '</div>');
    var filas = r.activos.map(function (a) {
      return '<div class="item"><div class="l"><span>' + esc(a.activo_id) + '</span>' +
        '<div>' + esc(a.nombre) + '</div></div>' +
        '<span class="pill p-neutral">' + esc(a.estado || '—') + '</span></div>';
    }).join('');
    pintar(
      '<div class="card"><h3>' + r.activos.length + ' activos registrados aquí</h3>' +
      '<div class="lista">' + (filas || '<p class="sub">Todavía no hay nada.</p>') + '</div></div>' +
      '<button class="b-ghost" id="bVolver">Volver</button>'
    );
    $('bVolver').onclick = function () { pantallaInicio(); };
  } catch (e) {
    pintar('<div class="aviso a-err">Sin conexión.</div>' +
           '<button class="b-ghost" onclick="pantallaInicio()">Volver</button>');
  }
}

/* =================================================================
   Arranque
   ================================================================= */
window.addEventListener('online', function () { pintarEstado(); vaciarCola(); });
window.addEventListener('offline', pintarEstado);

(async function inicio() {
  pintarEstado();
  if (!estado.sesion || !estado.sesion.sesion) return pantallaLogin();
  estado.catalogos = leer('msu_activos_cat', null);
  pantallaInicio();
  try { await cargarCatalogos(); pantallaInicio(); } catch (e) {}
  vaciarCola();
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
